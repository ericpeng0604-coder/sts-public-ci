name: STS1 ArmG Map Self-Improve v1

on:
  workflow_dispatch:
  push:
    branches:
      - gpt/sts1-self-improve-loop-20260925
    paths:
      - 'control/sts1-armg-map-loop-v1.request'

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sts1-armg-map-loop-v1
  cancel-in-progress: false

jobs:
  rebuild-v0-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      student_v0_gzip_b64: ${{ steps.pack.outputs.student_v0_gzip_b64 }}
      student_v0_payload_sha256: ${{ steps.pack.outputs.student_v0_payload_sha256 }}
    env:
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Normalize frozen source bytes
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD
          $sha = (Get-FileHash src/roguelike_ai/sts1_training/student_v0.py -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne "06e206b7f04e6e7b77ad1fc8c35ba1bcdca1c978596fbb176933323e3940aed3") {
            throw "Student v0 source SHA drift after LF normalization: $sha"
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install exact rebuild dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Rebuild exact frozen Student v0
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "sts1-v0"
          New-Item -ItemType Directory -Force $root | Out-Null
          python scripts/sts1/sts1_phase3_rebuild_student_v0.py --phase2-root . --output (Join-Path $root "student-v0.json")

      - name: Verify and pack v0
        id: pack
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "sts1-v0\student-v0.json"
          $env:MODEL_PATH = $path
          @'
          import json, os
          from pathlib import Path
          path = Path(os.environ["MODEL_PATH"])
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["student_model_sha256"] == "e15604b95247615a6d424f834e8b8a1e9fd680af4fe9e22a6754372027e89513"
          assert payload["feature_count"] == 3028
          assert len(payload["weights"]) == 3028
          print("PASS_EXACT_V0", payload["student_model_sha256"])
          '@ | python -

          $bytes = [System.IO.File]::ReadAllBytes($path)
          $sha = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
          $ms = New-Object System.IO.MemoryStream
          $gz = New-Object System.IO.Compression.GZipStream($ms, [System.IO.Compression.CompressionMode]::Compress)
          $gz.Write($bytes, 0, $bytes.Length)
          $gz.Close()
          $b64 = [Convert]::ToBase64String($ms.ToArray())
          "student_v0_payload_sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "student_v0_gzip_b64=$b64" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Delete Windows scratch
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "sts1-v0"
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }

  armg-map-round:
    needs: rebuild-v0-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
      SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'
      STUDENT_V0_GZIP_B64: ${{ needs.rebuild-v0-windows.outputs.student_v0_gzip_b64 }}
      EXPECTED_V0_PAYLOAD_SHA256: ${{ needs.rebuild-v0-windows.outputs.student_v0_payload_sha256 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Load ArmG map loop request
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          values = {}
          path = Path("control/sts1-armg-map-loop-v1.request")
          for raw in path.read_text(encoding="utf-8").splitlines():
              raw = raw.strip()
              if not raw or raw.startswith("#"):
                  continue
              key, value = raw.split("=", 1)
              values[key.strip()] = value.strip()

          mode = values.get("mode", "smoke")
          if mode not in {"smoke", "full"}:
              raise SystemExit("mode must be smoke or full")

          defaults = {
              "attempt": "1",
              "training_seeds": "8",
              "rng_seed": "20261002",
              "max_branch_points": "4",
              "epochs": "4",
              "learning_rate": "1e-4",
              "anchor_coef": "0.01",
              "temperature": "2.0",
              "max_replay_examples": "5000",
              "max_stagnation": "5",
          }
          defaults.update(values)
          env = {
              "ARMG_MODE": mode,
              "ARMG_ATTEMPT": str(int(defaults["attempt"])),
              "ARMG_TRAINING_SEEDS": str(int(defaults["training_seeds"])),
              "ARMG_RNG_SEED": str(int(defaults["rng_seed"])),
              "ARMG_MAX_BRANCH_POINTS": str(int(defaults["max_branch_points"])),
              "ARMG_EPOCHS": str(int(defaults["epochs"])),
              "ARMG_LEARNING_RATE": str(float(defaults["learning_rate"])),
              "ARMG_ANCHOR_COEF": str(float(defaults["anchor_coef"])),
              "ARMG_TEMPERATURE": str(float(defaults["temperature"])),
              "ARMG_MAX_REPLAY_EXAMPLES": str(int(defaults["max_replay_examples"])),
              "ARMG_MAX_STAGNATION": str(int(defaults["max_stagnation"])),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in env.items():
                  handle.write(f"{key}={value}\n")
          print("PASS_ARMG_CONTROL", env)
          PY

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install numpy torch==2.11.0

      - name: Decode exact v0
        run: |
          mkdir -p "$RUNNER_TEMP/sts1-armg"
          python - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          raw = gzip.decompress(base64.b64decode(os.environ["STUDENT_V0_GZIP_B64"]))
          actual = hashlib.sha256(raw).hexdigest()
          assert actual == os.environ["EXPECTED_V0_PAYLOAD_SHA256"]
          payload = json.loads(raw.decode("utf-8"))
          assert payload["student_model_sha256"] == "e15604b95247615a6d424f834e8b8a1e9fd680af4fe9e22a6754372027e89513"
          path = Path(os.environ["RUNNER_TEMP"]) / "sts1-armg" / "student-v0.json"
          path.write_bytes(raw)
          print("PASS_V0_DECODE", actual)
          PY

      - name: Restore latest Student learner if available
        run: |
          set -euo pipefail
          dst="$RUNNER_TEMP/sts1-student-state"
          mkdir -p "$dst"
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=sts1-self-improve-v2-state&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$artifact_id" ]; then
            echo "NO_STUDENT_LOOP_STATE_USE_GEN0"
            exit 0
          fi
          echo "RESTORE_STUDENT_ARTIFACT_ID=$artifact_id"
          curl --fail --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -o "$RUNNER_TEMP/student-state.zip"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
          unzip -q "$RUNNER_TEMP/student-state.zip" -d "$dst"
          test -f "$dst/learner.pt"

      - name: Restore latest ArmG map state if available
        run: |
          set -euo pipefail
          dst="$RUNNER_TEMP/sts1-armg-map-state"
          mkdir -p "$dst"
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=sts1-armg-map-v1-state&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$artifact_id" ]; then
            echo "NO_ARMG_MAP_STATE_START_FROM_UPSTREAM"
            exit 0
          fi
          echo "RESTORE_ARMG_ARTIFACT_ID=$artifact_id"
          curl --fail --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -o "$RUNNER_TEMP/armg-state.zip"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
          unzip -q "$RUNNER_TEMP/armg-state.zip" -d "$dst"
          test -f "$dst/current-map.pt"
          test -f "$dst/armg-map-state.json"

      - name: Hydrate pinned simulator and ArmG
        run: |
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          git -C external/sts_lightspeed/source apply --check "$PWD/patches/sts1/armg_gamecontext_clone.patch"
          git -C external/sts_lightspeed/source apply "$PWD/patches/sts1/armg_gamecontext_clone.patch"
          python scripts/sts1/build_probe.py

          root=".cache/sts1-armg"
          rm -rf "$root"
          mkdir -p "$root/sim/sts_lightspeed"
          ln -s "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -s "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -s "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
          ln -s "$PWD/external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt" "$root/armG_model_G128x128_15k.pt"

      - name: Verify exact GameContext clone API
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("external/sts_lightspeed/source/build-probe").resolve()))
          import slaythespire as sts
          gc = sts.GameContext(sts.CharacterClass.IRONCLAD, 123456, 0)
          clone = gc.clone()
          assert clone.seed == gc.seed
          assert clone.floor_num == gc.floor_num
          assert clone.cur_hp == gc.cur_hp
          assert clone.gold == gc.gold
          clone.gold += 7
          assert clone.gold != gc.gold
          print("PASS_GAMECONTEXT_CLONE", gc.seed, clone.seed)
          PY

      - name: Run ArmG map branch-rollout round
        run: |
          set -euo pipefail
          student_args=()
          if [ -f "$RUNNER_TEMP/sts1-student-state/learner.pt" ]; then
            student_args=(--student-v1 "$RUNNER_TEMP/sts1-student-state/learner.pt")
          fi

          if [ "$ARMG_MODE" = "smoke" ]; then
            training_seeds=1
            branch_points=1
            smoke_args=(--smoke-eval-count 2)
          else
            training_seeds="$ARMG_TRAINING_SEEDS"
            branch_points="$ARMG_MAX_BRANCH_POINTS"
            smoke_args=()
          fi

          python scripts/sts1/sts1_armg_map_round_v1.py             --baseline-v0 "$RUNNER_TEMP/sts1-armg/student-v0.json"             "${student_args[@]}"             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-armg             --armg-base-weight .cache/sts1-armg/armG_model_G128x128_15k.pt             --eval-seed-file fixtures/sts1/armg_map_eval_seeds_50.txt             --state-dir "$RUNNER_TEMP/sts1-armg-map-state"             --output-dir evidence/sts1/armg-map-v1             --training-seeds "$training_seeds"             --rng-seed "$ARMG_RNG_SEED"             --max-branch-points-per-game "$branch_points"             --temperature "$ARMG_TEMPERATURE"             --epochs "$ARMG_EPOCHS"             --learning-rate "$ARMG_LEARNING_RATE"             --anchor-coef "$ARMG_ANCHOR_COEF"             --max-replay-examples "$ARMG_MAX_REPLAY_EXAMPLES"             --max-stagnation "$ARMG_MAX_STAGNATION"             "${smoke_args[@]}"

      - name: Upload durable ArmG map state
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sts1-armg-map-v1-state
          path: |
            ${{ runner.temp }}/sts1-armg-map-state/current-map.pt
            ${{ runner.temp }}/sts1-armg-map-state/armg-map-state.json
            ${{ runner.temp }}/sts1-armg-map-state/map-replay.jsonl
          if-no-files-found: error
          retention-days: 90

      - name: Upload ArmG map reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sts1-armg-map-v1-reports-${{ github.run_id }}
          path: |
            evidence/sts1/armg-map-v1/**/round-report.json
            evidence/sts1/armg-map-v1/**/map-branch-dataset.jsonl
          if-no-files-found: warn
          retention-days: 90

      - name: GitHub-native round report and continuation
        if: always()
        env:
          LOOP_JOB_STATUS: ${{ job.status }}
          LOOP_REPORT_ISSUE: '15'
          LOOP_WORKFLOW_FILE: 'sts1-armg-map-self-improve-v1.yml'
          LOOP_CONTROL_PATH: 'control/sts1-armg-map-loop-v1.request'
        run: |
          set -uo pipefail
          handoff="$RUNNER_TEMP/sts1-github-handoff"
          rm -rf "$handoff"
          mkdir -p "$handoff"

          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [ "$LOOP_JOB_STATUS" != "success" ]; then
            body="## ArmG Map — Run failed

- Run：$run_url
- 結果：**FAILED**
- 下一輪：**未接續**
- 原因：workflow job 未成功完成；保留 artifacts/logs 供診斷。"
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$LOOP_REPORT_ISSUE/comments" -f body="$body"
            exit 0
          fi

          python scripts/sts1/sts1_github_native_loop.py \
            --kind armg \
            --report-root evidence/sts1/armg-map-v1 \
            --control "$LOOP_CONTROL_PATH" \
            --out-dir "$handoff" \
            --run-url "$run_url"

          next_status="下一輪：**已暫停**"
          continue_loop="$(python -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["continue"]).lower())' "$handoff/decision.json")"

          if [ "$continue_loop" = "true" ]; then
            current_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$LOOP_CONTROL_PATH?ref=$GITHUB_REF_NAME" --jq '.sha')"
            encoded="$(base64 -w0 "$handoff/next-control.request")"
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$LOOP_CONTROL_PATH" \
              -f message="control(sts1): GitHub-native continue armg loop" \
              -f content="$encoded" \
              -f sha="$current_sha" \
              -f branch="$GITHUB_REF_NAME" >/dev/null

            gh workflow run "$LOOP_WORKFLOW_FILE" --ref "$GITHUB_REF_NAME"
            next_status="下一輪：**已接續**（GitHub Actions 已 dispatch）"
          fi

          python - "$handoff/comments.json" "$handoff" <<'PY'
          import json, sys
          from pathlib import Path
          comments = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          out = Path(sys.argv[2])
          for i, body in enumerate(comments, 1):
              (out / f"comment-{i:03d}.md").write_text(body, encoding="utf-8")
          PY

          for file in "$handoff"/comment-*.md; do
            printf '\n\n%s\n' "$next_status" >> "$file"
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$LOOP_REPORT_ISSUE/comments" -f body="$(cat "$file")"
          done

      - name: Delete transient exact v0
        if: always()
        run: rm -rf "$RUNNER_TEMP/sts1-armg"
