name: STS1 ArmG PPO Loop v1.1
on:
  push:
    branches: [gpt/sts1-teacher-a0-50-20260926]
    paths: ['control/sts1-armg-ppo-v11.request']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  rollout:
    strategy: {fail-fast: false, matrix: {worker: [0,1,2,3,4,5,6,7]}}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env: {SIM_HEAD: "7476a81954020087da31d41d16fddf475746ec2d"}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.12'}
    - run: |
        pip install -e . numpy torch==2.11.0
        python scripts/sts1/hydrate_jialeiv_baseline_v0.py
        test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
        python scripts/sts1/build_probe.py
        root=.cache/sts1-armg; mkdir -p "$root/sim/sts_lightspeed"
        ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
        ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
        ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
        ln -sf "$PWD/external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt" "$root/armG_model_G128x128_15k.pt"
        set -a; source control/sts1-armg-ppo-v11.request; set +a
        python scripts/sts1/sts1_armg_ppo_rollout_v11.py --module-dir external/sts_lightspeed/source/build-probe --armg-root "$root" --weight "$root/armG_model_G128x128_15k.pt" --out "evidence/sts1/ppo-v11/worker-${{ matrix.worker }}" --formal-seed-file external/sts-rl-agent/source/eval/eval_seeds_50.txt --seed-start "$((rng_seed + ${{ matrix.worker }} * 100003))" --games "$games_per_worker" --temperature "$temperature" --checkpoint-id "$checkpoint_id" --worker "${{ matrix.worker }}"
    - uses: actions/upload-artifact@v4
      with: {name: "armg-ppo-v11-rollout-${{ github.run_id }}-${{ matrix.worker }}", path: "evidence/sts1/ppo-v11/worker-${{ matrix.worker }}/rollout.npz", retention-days: 30}
  train:
    needs: rollout
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.12'}
    - run: |
        pip install -e . numpy torch==2.11.0
        python scripts/sts1/hydrate_jialeiv_baseline_v0.py
        root=.cache/sts1-armg; mkdir -p "$root"
        ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
        ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
    - uses: actions/download-artifact@v4
      with: {pattern: "armg-ppo-v11-rollout-${{ github.run_id }}-*", path: evidence/sts1/ppo-v11-rollouts}
    - run: |
        set -a; source control/sts1-armg-ppo-v11.request; set +a
        python scripts/sts1/sts1_armg_ppo_train_v11.py --rollouts evidence/sts1/ppo-v11-rollouts --armg-root .cache/sts1-armg --base-weight external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt --output evidence/sts1/ppo-v11-candidate/armg_ppo_v11_candidate.pt --checkpoint-id "$checkpoint_id"
    - uses: actions/upload-artifact@v4
      with: {name: "armg-ppo-v11-candidate-${{ github.run_id }}", path: evidence/sts1/ppo-v11-candidate/, retention-days: 90}
