name: STS1 ArmG PPO Train Existing v1
on:
  workflow_dispatch:
  push:
    branches: [gpt/sts1-teacher-a0-50-20260926]
    paths: ['control/sts1-armg-ppo-train-existing.request']
permissions: {contents: read, actions: read}
jobs:
  train:
    runs-on: ubuntu-24.04
    env: {GH_TOKEN: "${{ github.token }}"}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.12'}
    - run: |
        pip install -e . numpy torch==2.11.0
        python scripts/sts1/hydrate_jialeiv_baseline_v0.py
        python scripts/sts1/build_probe.py
        mkdir -p evidence/sts1/ppo-rollouts
        for i in 0 1 2 3; do
          id=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/36256316141/artifacts --jq ".artifacts[]|select(.name==\"armg-ppo-rollout-36256316141-$i\")|.id")
          mkdir -p "evidence/sts1/ppo-rollouts/$i"
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip > "$RUNNER_TEMP/$i.zip"
          unzip -q "$RUNNER_TEMP/$i.zip" -d "evidence/sts1/ppo-rollouts/$i"
        done
        root=.cache/sts1-armg; mkdir -p "$root/sim/sts_lightspeed"
        ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
        ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
        ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
        export PYTHONPATH="$PWD/external/sts_lightspeed/source/build-probe:$PYTHONPATH"
        python - <<'PY'
import slaythespire
print("SMOKE_1_SIM_IMPORT_PASS")
import sys, os
root=".cache/sts1-armg"; os.environ["STS_BOT_DIR"]=root; sys.path.insert(0,root)
import armG_train
print("SMOKE_2_ARMG_IMPORT_PASS")
import torch
net=armG_train.Scorer((128,128)); net.load_state_dict(torch.load("external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt",weights_only=True,map_location="cpu"))
print("SMOKE_3_BASE_WEIGHT_PASS")
PY
        test "$(find evidence/sts1/ppo-rollouts -name rollout.npz | wc -l)" -eq 4
        echo "SMOKE_4_ROLLOUT_FILES_PASS"
        python scripts/sts1/sts1_armg_ppo_train.py --rollouts evidence/sts1/ppo-rollouts --armg-root "$root" --base-weight external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt --output evidence/sts1/ppo-candidate/armg_ppo_v1_candidate.pt --checkpoint-id armg-original-15k
    - uses: actions/upload-artifact@v4
      if: always()
      with: {name: "armg-ppo-candidate-existing-${{ github.run_id }}", path: evidence/sts1/ppo-candidate/, retention-days: 90}
