name: STS1 ArmG PPO v1.1 Fast Train Existing
on:
  push:
    branches: [gpt/sts1-teacher-a0-50-20260926]
    paths: ['control/sts1-armg-ppo-v11-fast.request']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env: {GH_TOKEN: "${{ github.token }}", SIM_HEAD: "7476a81954020087da31d41d16fddf475746ec2d"}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.12'}
    - name: Prepare
      run: |
        pip install -e . numpy torch==2.11.0
        python scripts/sts1/hydrate_jialeiv_baseline_v0.py
        python scripts/sts1/build_probe.py
        root=.cache/sts1-armg; mkdir -p "$root/sim/sts_lightspeed"
        ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
        ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
        ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
        echo "PYTHONPATH=$PWD/external/sts_lightspeed/source/build-probe:$PYTHONPATH" >> "$GITHUB_ENV"
    - name: Download preserved 400-game rollouts
      run: |
        mkdir -p evidence/sts1/ppo-v11-rollouts
        for i in 0 1 2 3 4 5 6 7; do
          id=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/36281610435/artifacts --jq ".artifacts[]|select(.name==\"armg-ppo-v11-rollout-36281610435-$i\")|.id")
          test -n "$id"; mkdir -p "evidence/sts1/ppo-v11-rollouts/$i"
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip > "$RUNNER_TEMP/$i.zip"
          unzip -q "$RUNNER_TEMP/$i.zip" -d "evidence/sts1/ppo-v11-rollouts/$i"
        done
        test "$(find evidence/sts1/ppo-v11-rollouts -name rollout.npz | wc -l)" -eq 8
    - name: Fast minibatch train
      run: |
        set -a; source control/sts1-armg-ppo-v11-fast.request; set +a
        python scripts/sts1/sts1_armg_ppo_train_v11_fast.py --rollouts evidence/sts1/ppo-v11-rollouts --armg-root .cache/sts1-armg --base-weight external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt --output evidence/sts1/ppo-v11-fast/armg_ppo_v11_candidate.pt --checkpoint-id "$checkpoint_id" --epochs 2 --batch-size 256 --threads 4
    - uses: actions/upload-artifact@v4
      if: always()
      with: {name: "armg-ppo-v11-fast-${{ github.run_id }}", path: evidence/sts1/ppo-v11-fast/, retention-days: 90}
