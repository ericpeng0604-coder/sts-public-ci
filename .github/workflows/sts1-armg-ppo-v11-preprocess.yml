name: STS1 PPO v1.1 Preprocess Existing
on:
  push:
    branches: [gpt/sts1-teacher-a0-50-20260926]
    paths: [control/sts1-armg-ppo-v11-preprocess.request]
  workflow_dispatch:
permissions: {actions: read, contents: read}
jobs:
  preprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install minimal dependencies
        run: pip install numpy
      - name: Download preserved 400-game rollouts
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          mkdir -p evidence/sts1/ppo-v11-rollouts
          for i in 0 1 2 3 4 5 6 7; do
            id=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/36281610435/artifacts --jq ".artifacts[]|select(.name==\"armg-ppo-v11-rollout-36281610435-$i\")|.id")
            test -n "$id"; mkdir -p "evidence/sts1/ppo-v11-rollouts/$i"
            gh api repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip > "$RUNNER_TEMP/$i.zip"
            unzip -q "$RUNNER_TEMP/$i.zip" -d "evidence/sts1/ppo-v11-rollouts/$i"
          done
          test "$(find evidence/sts1/ppo-v11-rollouts -name rollout.npz | wc -l)" -eq 8
      - name: Preprocess PPO tensors
        run: |
          set -a; source control/sts1-armg-ppo-v11-preprocess.request; set +a
          python scripts/sts1/sts1_armg_ppo_preprocess_v11_sharded.py --rollouts evidence/sts1/ppo-v11-rollouts --output-dir evidence/sts1/ppo-v11-preprocessed --checkpoint-id "$checkpoint_id"
      - uses: actions/upload-artifact@v4
        with:
          name: armg-ppo-v11-preprocessed-${{ github.run_id }}
          path: evidence/sts1/ppo-v11-preprocessed/
          retention-days: 30
