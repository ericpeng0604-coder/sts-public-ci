name: STS1 ArmG PPO v1.1 Train Existing
on:
  push:
    branches: [gpt/sts1-teacher-a0-50-20260926]
    paths: ['control/sts1-armg-ppo-v11-train-existing.request']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env: {GH_TOKEN: "${{ github.token }}", SIM_HEAD: "7476a81954020087da31d41d16fddf475746ec2d"}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.12'}
    - name: Hydrate simulator and ArmG
      run: |
        pip install -e . numpy torch==2.11.0
        python scripts/sts1/hydrate_jialeiv_baseline_v0.py
        test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
        python scripts/sts1/build_probe.py
        root=.cache/sts1-armg; mkdir -p "$root/sim/sts_lightspeed"
        ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
        ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
        ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
        echo "PYTHONPATH=$PWD/external/sts_lightspeed/source/build-probe:$PYTHONPATH" >> "$GITHUB_ENV"
        python -c 'import sys;sys.path.insert(0,"external/sts_lightspeed/source/build-probe");import slaythespire;print("V11_SIM_IMPORT_PASS")'
    - name: Download 8 preserved rollouts
      run: |
        mkdir -p evidence/sts1/ppo-v11-rollouts
        for i in 0 1 2 3 4 5 6 7; do
          id=$(gh api repos/$GITHUB_REPOSITORY/actions/runs/36281610435/artifacts --jq ".artifacts[]|select(.name==\"armg-ppo-v11-rollout-36281610435-$i\")|.id")
          test -n "$id"
          mkdir -p "evidence/sts1/ppo-v11-rollouts/$i"
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip > "$RUNNER_TEMP/$i.zip"
          unzip -q "$RUNNER_TEMP/$i.zip" -d "evidence/sts1/ppo-v11-rollouts/$i"
        done
        test "$(find evidence/sts1/ppo-v11-rollouts -name rollout.npz | wc -l)" -eq 8
        echo "V11_8_ROLLOUTS_PASS"
    - name: Train v1.1 candidate
      run: |
        set -a; source control/sts1-armg-ppo-v11-train-existing.request; set +a
        python scripts/sts1/sts1_armg_ppo_train_v11.py --rollouts evidence/sts1/ppo-v11-rollouts --armg-root .cache/sts1-armg --base-weight external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt --output evidence/sts1/ppo-v11-candidate/armg_ppo_v11_candidate.pt --checkpoint-id "$checkpoint_id"
        STS_BOT_DIR=.cache/sts1-armg python -c 'import sys,torch;sys.path.insert(0,".cache/sts1-armg");import armG_train as m;n=m.Scorer((128,128));n.load_state_dict(torch.load("evidence/sts1/ppo-v11-candidate/armg_ppo_v11_candidate.pt",weights_only=True,map_location="cpu"));print("V11_CANDIDATE_LOAD_PASS")'
    - uses: actions/upload-artifact@v4
      if: always()
      with: {name: "armg-ppo-v11-candidate-existing-${{ github.run_id }}", path: evidence/sts1/ppo-v11-candidate/, retention-days: 90}
