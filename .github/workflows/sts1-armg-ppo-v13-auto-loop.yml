name: STS1 ArmG PPO v1.3 Auto Loop

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sts1-armg-ppo-v13-auto-loop
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ github.token }}
  SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'
  STATE_ARTIFACT: sts1-armg-ppo-v13-loop-state

jobs:
  rollout:
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Load loop control
        run: |
          set -a
          source control/sts1-armg-ppo-v13-auto-loop.request
          set +a
          echo "PPO_GAMES_PER_WORKER=$games_per_worker" >> "$GITHUB_ENV"
          echo "PPO_RNG_SEED=$rng_seed" >> "$GITHUB_ENV"
          echo "PPO_TEMPERATURE=$temperature" >> "$GITHUB_ENV"

      - name: Install and hydrate
        run: |
          python -m pip install --upgrade pip
          pip install -e . numpy torch==2.11.0
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-armg
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"

      - name: Restore current offline Champion
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/ppo-v13-state"
          rm -rf "$state"
          mkdir -p "$state"

          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            echo "RESTORE_STATE_ARTIFACT=$artifact_id"
            curl --fail --location               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -o "$RUNNER_TEMP/ppo-v13-state.zip"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
            unzip -q "$RUNNER_TEMP/ppo-v13-state.zip" -d "$state/raw"
            champ="$(find "$state/raw" -name offline-champion.pt -print -quit)"
            meta="$(find "$state/raw" -name state.json -print -quit)"
            test -n "$champ"
            test -n "$meta"
            cp "$champ" "$state/offline-champion.pt"
            cp "$meta" "$state/state.json"
          else
            cp external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt "$state/offline-champion.pt"
            python - "$state/state.json" <<'PY'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "schema_version": "sts1-armg-ppo-v13-loop-state-v1",
              "round_index": 0,
              "generation": 0,
              "accepted_rounds": 0,
              "rejected_rounds": 0,
              "stagnation_count": 0,
              "production_champion_replaced": False,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          fi

          sha="$(sha256sum "$state/offline-champion.pt" | awk '{print $1}')"
          python - "$state/state.json" "$sha" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          state = json.loads(p.read_text(encoding="utf-8"))
          recorded = state.get("offline_champion_sha256")
          if recorded is not None and recorded != sys.argv[2]:
              raise SystemExit(f"offline Champion SHA drift: {recorded} != {sys.argv[2]}")
          print("STATE_PASS", json.dumps(state, sort_keys=True))
          PY
          echo "CURRENT_WEIGHT=$state/offline-champion.pt" >> "$GITHUB_ENV"
          echo "CHECKPOINT_ID=armg-ppo-v13-$sha" >> "$GITHUB_ENV"

      - name: Collect fresh rollout shard
        run: |
          worker=${{ matrix.worker }}
          seed_start="$((PPO_RNG_SEED + GITHUB_RUN_NUMBER * 1000003 + worker * 100003))"
          python scripts/sts1/sts1_armg_ppo_rollout_v11.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-armg             --weight "$CURRENT_WEIGHT"             --out "evidence/sts1/ppo-v13-auto/worker-$worker"             --formal-seed-file external/sts-rl-agent/source/eval/eval_seeds_50.txt             --seed-start "$seed_start"             --games "$PPO_GAMES_PER_WORKER"             --temperature "$PPO_TEMPERATURE"             --checkpoint-id "$CHECKPOINT_ID"             --worker "$worker"

      - uses: actions/upload-artifact@v4
        with:
          name: sts1-armg-ppo-v13-rollout-${{ github.run_id }}-${{ matrix.worker }}
          path: evidence/sts1/ppo-v13-auto/worker-${{ matrix.worker }}/rollout.npz
          if-no-files-found: error
          retention-days: 30

  train-and-gate:
    needs: rollout
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Load loop control
        run: |
          set -a
          source control/sts1-armg-ppo-v13-auto-loop.request
          set +a
          echo "PPO_EPOCHS=$epochs" >> "$GITHUB_ENV"
          echo "PPO_LR=$learning_rate" >> "$GITHUB_ENV"
          echo "PPO_CLIP=$clip" >> "$GITHUB_ENV"
          echo "PPO_TARGET_KL=$target_kl" >> "$GITHUB_ENV"
          echo "PPO_MCTS_SIMS=$mcts_sims" >> "$GITHUB_ENV"

      - name: Install and hydrate
        run: |
          python -m pip install --upgrade pip
          pip install -e . numpy torch==2.11.0
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-armg
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"

      - name: Restore current offline Champion
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/ppo-v13-state"
          rm -rf "$state"
          mkdir -p "$state"

          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            echo "RESTORE_STATE_ARTIFACT=$artifact_id"
            curl --fail --location               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -o "$RUNNER_TEMP/ppo-v13-state.zip"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
            unzip -q "$RUNNER_TEMP/ppo-v13-state.zip" -d "$state/raw"
            champ="$(find "$state/raw" -name offline-champion.pt -print -quit)"
            meta="$(find "$state/raw" -name state.json -print -quit)"
            test -n "$champ"
            test -n "$meta"
            cp "$champ" "$state/offline-champion.pt"
            cp "$meta" "$state/state.json"
          else
            cp external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt "$state/offline-champion.pt"
            python - "$state/state.json" <<'PY'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "schema_version": "sts1-armg-ppo-v13-loop-state-v1",
              "round_index": 0,
              "generation": 0,
              "accepted_rounds": 0,
              "rejected_rounds": 0,
              "stagnation_count": 0,
              "production_champion_replaced": False,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          fi

          sha="$(sha256sum "$state/offline-champion.pt" | awk '{print $1}')"
          python - "$state/state.json" "$sha" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path(sys.argv[1])
          state = json.loads(p.read_text(encoding="utf-8"))
          recorded = state.get("offline_champion_sha256")
          if recorded is not None and recorded != sys.argv[2]:
              raise SystemExit(f"offline Champion SHA drift: {recorded} != {sys.argv[2]}")
          print("STATE_PASS", json.dumps(state, sort_keys=True))
          PY
          echo "CURRENT_WEIGHT=$state/offline-champion.pt" >> "$GITHUB_ENV"
          echo "STATE_DIR=$state" >> "$GITHUB_ENV"
          echo "CHECKPOINT_ID=armg-ppo-v13-$sha" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: sts1-armg-ppo-v13-rollout-${{ github.run_id }}-*
          path: evidence/sts1/ppo-v13-rollouts

      - name: Preprocess fresh shards
        run: |
          python scripts/sts1/sts1_armg_ppo_preprocess_v11_sharded.py             --rollouts evidence/sts1/ppo-v13-rollouts             --output-dir evidence/sts1/ppo-v13-preprocessed             --checkpoint-id "$CHECKPOINT_ID"

      - name: Full preflight
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np

          files = sorted(Path("evidence/sts1/ppo-v13-preprocessed").glob("shard_*.npz"))
          assert len(files) == 8, len(files)
          total = 0
          candidates = 0
          seen_game_seeds = set()
          expected = os.environ["CHECKPOINT_ID"]
          required = {"obs", "desc", "offsets", "action", "reward", "old_logp", "done", "game_seed", "checkpoint_id"}

          for path in files:
              with np.load(path, allow_pickle=False) as data:
                  assert required <= set(data.files), (path, required - set(data.files))
                  n = len(data["obs"])
                  assert n > 0
                  assert data["obs"].ndim == 2 and data["obs"].shape[1] == 412
                  assert data["desc"].ndim == 2 and data["desc"].shape[1] == 368
                  assert len(data["offsets"]) == n + 1
                  assert int(data["offsets"][0]) == 0
                  assert int(data["offsets"][-1]) == len(data["desc"])
                  counts = np.diff(data["offsets"])
                  assert np.all(counts > 0)
                  assert np.all((data["action"] >= 0) & (data["action"] < counts))
                  assert np.isfinite(data["obs"]).all()
                  assert np.isfinite(data["desc"]).all()
                  assert np.isfinite(data["reward"]).all()
                  assert np.isfinite(data["old_logp"]).all()
                  assert set(map(str, data["checkpoint_id"])) == {expected}
                  seen_game_seeds.update(map(int, data["game_seed"]))
                  total += n
                  candidates += len(data["desc"])

          assert total > 0
          assert candidates >= total
          assert len(seen_game_seeds) > 0
          print("PPO_V13_LOOP_PREFLIGHT_PASS", json.dumps({
              "shards": len(files),
              "decisions": total,
              "candidates": candidates,
              "game_seeds": len(seen_game_seeds),
              "checkpoint_id": expected,
          }, sort_keys=True))
          PY

      - name: Train PPO v1.3 Candidate
        run: |
          python scripts/sts1/sts1_armg_ppo_train_v13_sharded.py             --shards evidence/sts1/ppo-v13-preprocessed             --armg-root .cache/sts1-armg             --base-weight "$CURRENT_WEIGHT"             --output evidence/sts1/ppo-v13-candidate/armg_ppo_v13_candidate.pt             --checkpoint-id "$CHECKPOINT_ID"             --epochs "$PPO_EPOCHS"             --lr "$PPO_LR"             --clip "$PPO_CLIP"             --target-kl "$PPO_TARGET_KL"             --threads 4

          CAND=evidence/sts1/ppo-v13-candidate/armg_ppo_v13_candidate.pt
          STS_BOT_DIR=.cache/sts1-armg CAND="$CAND" python - <<'PY'
          import os, sys, torch
          sys.path.insert(0, ".cache/sts1-armg")
          import armG_train as m
          net = m.Scorer((128, 128))
          net.load_state_dict(torch.load(os.environ["CAND"], weights_only=True, map_location="cpu"))
          print("PPO_V13_LOOP_CANDIDATE_LOAD_PASS")
          PY

      - name: Fixed 30 then 50 seed A/B Gate
        run: |
          python scripts/sts1/sts1_armg_ppo_v13_auto_gate.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-armg             --current-weight "$CURRENT_WEIGHT"             --candidate-weight evidence/sts1/ppo-v13-candidate/armg_ppo_v13_candidate.pt             --formal-seed-file external/sts-rl-agent/source/eval/eval_seeds_50.txt             --output-dir evidence/sts1/ppo-v13-gate             --mcts-sims "$PPO_MCTS_SIMS"

      - name: Update durable offline Champion state
        run: |
          python - "$STATE_DIR" evidence/sts1/ppo-v13-candidate/armg_ppo_v13_candidate.pt evidence/sts1/ppo-v13-gate/gate-summary.json "$GITHUB_RUN_ID" <<'PY'
          import hashlib, json, shutil, sys
          from pathlib import Path

          state_dir = Path(sys.argv[1])
          candidate = Path(sys.argv[2])
          gate_path = Path(sys.argv[3])
          run_id = int(sys.argv[4])
          state_path = state_dir / "state.json"
          champion_path = state_dir / "offline-champion.pt"

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          state = json.loads(state_path.read_text(encoding="utf-8"))
          gate = json.loads(gate_path.read_text(encoding="utf-8"))
          promoted = gate["decision"] == "PROMOTE_OFFLINE"

          state["round_index"] = int(state.get("round_index", 0)) + 1
          if promoted:
              shutil.copy2(candidate, champion_path)
              state["generation"] = int(state.get("generation", 0)) + 1
              state["accepted_rounds"] = int(state.get("accepted_rounds", 0)) + 1
              state["stagnation_count"] = 0
          else:
              state["rejected_rounds"] = int(state.get("rejected_rounds", 0)) + 1
              state["stagnation_count"] = int(state.get("stagnation_count", 0)) + 1

          state.update({
              "schema_version": "sts1-armg-ppo-v13-loop-state-v1",
              "offline_champion_sha256": sha256(champion_path),
              "last_candidate_sha256": sha256(candidate),
              "last_decision": gate["decision"],
              "last_gate_30": gate["gate_30"],
              "last_gate_50": gate["gate_50"],
              "last_run_id": run_id,
              "pending_real_game_validation": bool(state.get("pending_real_game_validation", False) or promoted),
              "production_champion_replaced": False,
          })
          state_path.write_text(json.dumps(state, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("PPO_V13_LOOP_STATE", json.dumps({
              "round_index": state["round_index"],
              "generation": state["generation"],
              "decision": state["last_decision"],
              "stagnation_count": state["stagnation_count"],
              "offline_champion_sha256": state["offline_champion_sha256"],
              "production_champion_replaced": False,
          }, sort_keys=True))
          PY

      - name: Upload durable loop state
        uses: actions/upload-artifact@v4
        with:
          name: sts1-armg-ppo-v13-loop-state
          path: |
            ${{ runner.temp }}/ppo-v13-state/state.json
            ${{ runner.temp }}/ppo-v13-state/offline-champion.pt
          if-no-files-found: error
          retention-days: 90

      - name: Upload training and gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sts1-armg-ppo-v13-loop-report-${{ github.run_id }}
          path: |
            evidence/sts1/ppo-v13-preprocessed/manifest.json
            evidence/sts1/ppo-v13-candidate/**
            evidence/sts1/ppo-v13-gate/**
          if-no-files-found: warn
          retention-days: 90

  supervisor:
    if: always()
    needs: [rollout, train-and-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Continue, adapt, retry, or pause
        env:
          ROLLOUT_RESULT: ${{ needs.rollout.result }}
          TRAIN_GATE_RESULT: ${{ needs.train-and-gate.result }}
        run: |
          set -euo pipefail
          set -a
          source control/sts1-armg-ppo-v13-auto-loop.request
          set +a

          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          ok=0
          if [ "$ROLLOUT_RESULT" = "success" ] && [ "$TRAIN_GATE_RESULT" = "success" ]; then
            ok=1
          fi

          next_attempt="$((attempt + 1))"
          next_retry=0
          should_continue=1
          reason="continue_after_gate"

          if [ "$ok" -eq 1 ]; then
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="sts1-armg-ppo-v13-loop-state") | .id' | head -n1)"
            test -n "$artifact_id"
            curl --fail --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -o "$RUNNER_TEMP/state.zip" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
            mkdir -p "$RUNNER_TEMP/state"
            unzip -q "$RUNNER_TEMP/state.zip" -d "$RUNNER_TEMP/state"
            state_file="$(find "$RUNNER_TEMP/state" -name state.json -print -quit)"
            test -n "$state_file"

            python scripts/sts1/sts1_armg_ppo_v13_adapt.py \
              --state "$state_file" \
              --control control/sts1-armg-ppo-v13-auto-loop.request \
              --output-control "$RUNNER_TEMP/next.request" \
              --report "$RUNNER_TEMP/adaptation.json"

            python - "$RUNNER_TEMP/next.request" "$next_attempt" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          attempt = sys.argv[2]
          rows = []
          seen = set()
          for raw in path.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line:
                  continue
              key, value = line.split("=", 1)
              if key == "attempt":
                  value = attempt
              elif key == "retry_count":
                  value = "0"
              rows.append((key, value))
              seen.add(key)
          if "attempt" not in seen:
              rows.append(("attempt", attempt))
          if "retry_count" not in seen:
              rows.append(("retry_count", "0"))
          path.write_text("".join(f"{k}={v}\n" for k, v in rows), encoding="utf-8")
          PY

            eval "$(python - "$state_file" "$RUNNER_TEMP/adaptation.json" <<'PY'
          import json, shlex, sys
          s=json.load(open(sys.argv[1], encoding="utf-8"))
          a=json.load(open(sys.argv[2], encoding="utf-8"))
          p=a["profile"]
          vals={
            "ROUND_INDEX": s.get("round_index", 0),
            "GENERATION": s.get("generation", 0),
            "DECISION": s.get("last_decision", "UNKNOWN"),
            "STAGNATION": s.get("stagnation_count", 0),
            "OFFLINE_SHA": s.get("offline_champion_sha256", "n/a"),
            "NEXT_PROFILE": p["name"],
            "NEXT_GAMES": p["games_per_worker"],
            "NEXT_TEMP": p["temperature"],
            "NEXT_EPOCHS": p["epochs"],
            "NEXT_LR": p["learning_rate"],
            "NEXT_CLIP": p["clip"],
            "NEXT_KL": p["target_kl"],
          }
          for k,v in vals.items():
              print(f"{k}={shlex.quote(str(v))}")
          PY
          )"
            reason="adaptive_stagnation_$NEXT_PROFILE"

            if [ "$max_rounds" -gt 0 ] && [ "$ROUND_INDEX" -ge "$max_rounds" ]; then
              should_continue=0
              reason="max_rounds_reached"
            fi

            next_status="自動接續"
            if [ "$should_continue" -ne 1 ]; then
              next_status="已暫停（$reason）"
            fi

            printf -v body '@ericpeng0604-coder\n\n## PPO v1.3 Auto Loop — Round %s\n\n- Run：%s\n- 結果：**%s**\n- Offline generation：%s\n- Stagnation：%s\n- Offline Champion SHA：`%s`\n- 正式 Champion：**未修改**（仍需真實遊戲 Gate）\n- 下一策略：**%s**\n- 下一輪資料：%s games/worker × 8\n- temperature：%s\n- epochs / lr / clip / target-KL：%s / %s / %s / %s\n- Gate：**固定不變**（30 seeds +4；50 seeds +5）\n- 下一輪：**%s**' "$ROUND_INDEX" "$run_url" "$DECISION" "$GENERATION" "$STAGNATION" "$OFFLINE_SHA" "$NEXT_PROFILE" "$NEXT_GAMES" "$NEXT_TEMP" "$NEXT_EPOCHS" "$NEXT_LR" "$NEXT_CLIP" "$NEXT_KL" "$next_status"
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$report_issue/comments" -f body="$body"
          else
            next_retry="$((retry_count + 1))"
            reason="auto_retry_after_failure"
            if [ "$next_retry" -gt "$max_retries" ]; then
              should_continue=0
              reason="retry_limit_reached"
            fi

            python - control/sts1-armg-ppo-v13-auto-loop.request "$RUNNER_TEMP/next.request" "$next_attempt" "$next_retry" "$reason" <<'PY'
          import sys
          from pathlib import Path
          src, dst = Path(sys.argv[1]), Path(sys.argv[2])
          attempt, retry, reason = sys.argv[3:6]
          values = {}
          order = []
          for raw in src.read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              key, value = line.split("=", 1)
              if key not in values:
                  order.append(key)
              values[key] = value
          values["attempt"] = attempt
          values["retry_count"] = retry
          values["reason"] = reason
          for key in ("attempt", "retry_count", "reason"):
              if key not in order:
                  order.append(key)
          dst.write_text("".join(f"{key}={values[key]}\n" for key in order), encoding="utf-8")
          PY

            printf -v body '@ericpeng0604-coder\n\n## PPO v1.3 Auto Loop — technical failure\n\n- Run：%s\n- Rollout：**%s**\n- Train/Gate：**%s**\n- Retry：%s/%s\n- 自適應：**不變招**（技術錯誤不算模型 stagnation）\n- 正式 Champion：**未修改**' "$run_url" "$ROLLOUT_RESULT" "$TRAIN_GATE_RESULT" "$next_retry" "$max_retries"
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$report_issue/comments" -f body="$body"
          fi

          if [ "$should_continue" -ne 1 ]; then
            echo "AUTO_LOOP_PAUSED reason=$reason"
            exit 0
          fi

          control_path="control/sts1-armg-ppo-v13-auto-loop.request"
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$control_path?ref=$GITHUB_REF_NAME" --jq '.sha')"
          encoded="$(base64 -w0 "$RUNNER_TEMP/next.request")"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$control_path" \
            -f message="control(sts1): continue PPO v1.3 auto loop [$reason]" \
            -f content="$encoded" \
            -f sha="$current_sha" \
            -f branch="$GITHUB_REF_NAME" >/dev/null

          gh workflow run sts1-armg-ppo-v13-auto-loop.yml --ref "$GITHUB_REF_NAME"
          echo "AUTO_LOOP_CONTINUED attempt=$next_attempt retry_count=$next_retry reason=$reason"
