name: STS1 PPO v1.3 Handoff Guard

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Handoff only after v1.4 verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flag="control/sts1-armg-ppo-v14-ready.flag"
          if [ ! -f "$flag" ] || [ "$(tr -d '\r\n' < "$flag")" != "READY" ]; then
            echo "PPO_V14_HANDOFF_BLOCKED verification_not_ready"
            exit 0
          fi
          gh workflow run sts1-armg-ppo-v14-auto-loop.yml --ref "$GITHUB_REF_NAME"
          echo "PPO_V14_HANDOFF_DISPATCHED"
