name: STS1 ArmG PPO v1.3 Margin Diagnostic
on:
  push:
    branches: [gpt/sts1-teacher-a0-50-20260926]
    paths: ['control/sts1-armg-ppo-v13-margin.request']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env: {GH_TOKEN: "${{ github.token }}", SIM_HEAD: "7476a81954020087da31d41d16fddf475746ec2d"}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.12'}
    - name: Preflight
      run: |
        pip install numpy torch==2.11.0
        python scripts/sts1/hydrate_jialeiv_baseline_v0.py
        test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
        python scripts/sts1/build_probe.py
        root=.cache/sts1-armg; mkdir -p "$root"
        ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
        ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
        echo "PYTHONPATH=$PWD/external/sts_lightspeed/source/build-probe:$PYTHONPATH" >> "$GITHUB_ENV"
        export PYTHONPATH="$PWD/external/sts_lightspeed/source/build-probe:$PYTHONPATH"
        python -c 'import slaythespire; print("V13_SIM_IMPORT_PASS")'
        STS_BOT_DIR=.cache/sts1-armg python -c 'import sys,torch;sys.path.insert(0,".cache/sts1-armg");import armG_train as m;n=m.Scorer((128,128));n.load_state_dict(torch.load("external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt",weights_only=True,map_location="cpu"));print("V13_ARMG_LOAD_PASS")'
    - name: Download preserved shards
      run: |
        mkdir -p evidence/sts1/ppo-v11-preprocessed
        gh api repos/$GITHUB_REPOSITORY/actions/artifacts/10927301893/zip > "$RUNNER_TEMP/shards.zip"
        unzip -q "$RUNNER_TEMP/shards.zip" -d evidence/sts1/ppo-v11-preprocessed
        test "$(find evidence/sts1/ppo-v11-preprocessed -name 'shard_*.npz' | wc -l)" -eq 8
    - name: Measure margins
      run: |
        python -c 'import slaythespire; print("V13_MARGIN_SIM_IMPORT_PASS")'
        STS_BOT_DIR=.cache/sts1-armg python -c 'import sys;sys.path.insert(0,".cache/sts1-armg");import armG_train;print("V13_MARGIN_ARMG_IMPORT_PASS")'
        python scripts/sts1/sts1_armg_margin_diag.py --shards evidence/sts1/ppo-v11-preprocessed --armg-root .cache/sts1-armg --weight external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt --output evidence/sts1/ppo-v13-margin/report.json
    - uses: actions/upload-artifact@v4
      if: always()
      with: {name: "sts1-ppo-v13-margin-${{ github.run_id }}", path: evidence/sts1/ppo-v13-margin/, retention-days: 90}
