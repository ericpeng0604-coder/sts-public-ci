name: STS1 PPO v1.3 Sharded Train
on:
  push:
    branches: [gpt/sts1-teacher-a0-50-20260926]
    paths: [control/sts1-armg-ppo-v13-sharded-train.request]
  workflow_dispatch:
permissions: {actions: read, contents: read}
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: sts1-ppo-v13-train
      cancel-in-progress: false
    env: {GH_TOKEN: "${{ github.token }}", SIM_HEAD: "7476a81954020087da31d41d16fddf475746ec2d"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prepare ArmG
        run: |
          pip install numpy torch==2.11.0
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-armg; mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
          echo "PYTHONPATH=$PWD/external/sts_lightspeed/source/build-probe:$PYTHONPATH" >> "$GITHUB_ENV"
          PYTHONPATH="$PWD/external/sts_lightspeed/source/build-probe:$PYTHONPATH" python -c 'import slaythespire; print("SHARDED_SIM_IMPORT_PASS")'
          PYTHONPATH="$PWD/external/sts_lightspeed/source/build-probe:$PYTHONPATH" STS_BOT_DIR=.cache/sts1-armg python -c 'import sys,torch;sys.path.insert(0,".cache/sts1-armg");import armG_train as m;n=m.Scorer((128,128));n.load_state_dict(torch.load("external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt",weights_only=True,map_location="cpu"));print("SHARDED_ARMG_LOAD_PASS")'
      - name: Download preprocessed shards
        run: |
          mkdir -p evidence/sts1/ppo-v11-preprocessed
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/10927301893/zip > "$RUNNER_TEMP/shards.zip"
          unzip -q "$RUNNER_TEMP/shards.zip" -d evidence/sts1/ppo-v11-preprocessed
          test "$(find evidence/sts1/ppo-v11-preprocessed -name 'shard_*.npz' | wc -l)" -eq 8
          python - <<'PY'
          import json,numpy as np
          from pathlib import Path
          fs=sorted(Path("evidence/sts1/ppo-v11-preprocessed").glob("shard_*.npz"))
          assert len(fs)==8
          total=0
          for f in fs:
              with np.load(f,allow_pickle=False) as d:
                  assert str(d["checkpoint_id"][0])=="armg-original-15k-v11-r1", (f,d["checkpoint_id"])
                  assert len(d["obs"])==len(d["action"])==len(d["reward"])==len(d["old_logp"])==len(d["done"])
                  assert len(d["offsets"])==len(d["obs"])+1
                  assert int(d["offsets"][-1])==len(d["desc"])
                  total += len(d["obs"])
          assert total==20533,total
          print("SHARDED_DATA_PREFLIGHT_PASS",json.dumps({"shards":len(fs),"decisions":total}))
          PY
      - name: Full preflight
        run: |
          set -a; source control/sts1-armg-ppo-v13-sharded-train.request; set +a
          test "$checkpoint_id" = "armg-original-15k-v11-r1"
          test "$source_preprocess_artifact" = "10927301893"
          test -s external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt
          test "$(find evidence/sts1/ppo-v11-preprocessed -name 'shard_*.npz' | wc -l)" -eq 8
          python - <<'PY'
          import numpy as np
          from pathlib import Path
          fs=sorted(Path("evidence/sts1/ppo-v11-preprocessed").glob("shard_*.npz"))
          total=cands=0
          required={"obs","desc","offsets","action","reward","old_logp","done","checkpoint_id"}
          for f in fs:
              with np.load(f,allow_pickle=False) as d:
                  assert required <= set(d.files),(f,required-set(d.files))
                  n=len(d["obs"]); assert n>0
                  assert d["obs"].shape[1]==412
                  assert d["desc"].shape[1]==368
                  assert len(d["offsets"])==n+1 and int(d["offsets"][0])==0 and int(d["offsets"][-1])==len(d["desc"])
                  assert np.all(np.diff(d["offsets"])>0)
                  assert np.all((d["action"]>=0)&(d["action"]<np.diff(d["offsets"])))
                  assert np.isfinite(d["obs"]).all() and np.isfinite(d["desc"]).all()
                  assert np.isfinite(d["reward"]).all() and np.isfinite(d["old_logp"]).all()
                  assert set(map(str,d["checkpoint_id"]))=={"armg-original-15k-v11-r1"}
                  total+=n;cands+=len(d["desc"])
          assert total==20533 and cands==79573,(total,cands)
          print("V13_FULL_PREFLIGHT_PASS",{"shards":len(fs),"decisions":total,"candidates":cands})
          PY
          python -c 'import slaythespire; print("V13_PREFLIGHT_SIM_PASS")'
          STS_BOT_DIR=.cache/sts1-armg python -c 'import sys,torch;sys.path.insert(0,".cache/sts1-armg");import armG_train as m;n=m.Scorer((128,128));n.load_state_dict(torch.load("external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt",weights_only=True,map_location="cpu"));print("V13_PREFLIGHT_WEIGHT_PASS")'
      - name: Full preflight
        run: |
          set -a; source control/sts1-armg-ppo-v13-sharded-train.request; set +a
          test "$checkpoint_id" = "armg-original-15k-v11-r1"
          test "$source_preprocess_artifact" = "10927301893"
          test -s external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt
          test "$(find evidence/sts1/ppo-v11-preprocessed -name 'shard_*.npz' | wc -l)" -eq 8
          python - <<'PY'
          import numpy as np
          from pathlib import Path
          fs=sorted(Path("evidence/sts1/ppo-v11-preprocessed").glob("shard_*.npz"))
          total=cands=0
          required={"obs","desc","offsets","action","reward","old_logp","done","checkpoint_id"}
          for f in fs:
              with np.load(f,allow_pickle=False) as d:
                  assert required <= set(d.files),(f,required-set(d.files))
                  n=len(d["obs"]); assert n>0
                  assert d["obs"].shape[1]==412
                  assert d["desc"].shape[1]==368
                  assert len(d["offsets"])==n+1 and int(d["offsets"][0])==0 and int(d["offsets"][-1])==len(d["desc"])
                  assert np.all(np.diff(d["offsets"])>0)
                  assert np.all((d["action"]>=0)&(d["action"]<np.diff(d["offsets"])))
                  assert np.isfinite(d["obs"]).all() and np.isfinite(d["desc"]).all()
                  assert np.isfinite(d["reward"]).all() and np.isfinite(d["old_logp"]).all()
                  assert set(map(str,d["checkpoint_id"]))=={"armg-original-15k-v11-r1"}
                  total+=n;cands+=len(d["desc"])
          assert total==20533 and cands==79573,(total,cands)
          print("V13_FULL_PREFLIGHT_PASS",{"shards":len(fs),"decisions":total,"candidates":cands})
          PY
          python -c 'import slaythespire; print("V13_PREFLIGHT_SIM_PASS")'
          STS_BOT_DIR=.cache/sts1-armg python -c 'import sys,torch;sys.path.insert(0,".cache/sts1-armg");import armG_train as m;n=m.Scorer((128,128));n.load_state_dict(torch.load("external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt",weights_only=True,map_location="cpu"));print("V13_PREFLIGHT_WEIGHT_PASS")'
      - name: Train candidate
        run: |
          set -a; source control/sts1-armg-ppo-v13-sharded-train.request; set +a
          python scripts/sts1/sts1_armg_ppo_train_v13_sharded.py --shards evidence/sts1/ppo-v11-preprocessed --armg-root .cache/sts1-armg --base-weight external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt --output evidence/sts1/ppo-v13-candidate/armg_ppo_v13_candidate.pt --checkpoint-id "$checkpoint_id" --epochs 4 --lr 3e-5 --clip 0.20 --target-kl 0.02 --threads 4
          STS_BOT_DIR=.cache/sts1-armg python -c 'import sys,torch;sys.path.insert(0,".cache/sts1-armg");import armG_train as m;n=m.Scorer((128,128));n.load_state_dict(torch.load("evidence/sts1/ppo-v13-candidate/armg_ppo_v13_candidate.pt",weights_only=True,map_location="cpu"));print("V13_CANDIDATE_LOAD_PASS")'
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "armg-ppo-v13-sharded-candidate-${{ github.run_id }}", path: evidence/sts1/ppo-v13-candidate/, retention-days: 90}
