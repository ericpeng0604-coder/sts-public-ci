name: STS1 ArmG PPO v1.4 Auto Loop

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sts1-armg-ppo-v14-auto-loop
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ github.token }}
  SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'
  STATE_ARTIFACT: sts1-armg-ppo-v14-loop-state
  LEGACY_STATE_ARTIFACT: sts1-armg-ppo-v13-loop-state

jobs:
  rollout:
    strategy:
      fail-fast: false
      matrix:
        worker: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Load v1.4 control
        run: |
          set -a
          source control/sts1-armg-ppo-v14-auto-loop.request
          set +a
          echo "PPO_GAMES_PER_WORKER=$games_per_worker" >> "$GITHUB_ENV"
          echo "PPO_RNG_SEED=$rng_seed" >> "$GITHUB_ENV"
          echo "PPO_TEMPERATURE=$temperature" >> "$GITHUB_ENV"
          echo "PPO_REWARD_MODE=$reward_mode" >> "$GITHUB_ENV"

      - name: Install and hydrate
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . numpy torch==2.11.0
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-armg
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"

      - name: Restore v1.4 state or migrate v1.3
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/ppo-v14-state"
          rm -rf "$state"; mkdir -p "$state"
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$artifact_id" ]; then
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$LEGACY_STATE_ARTIFACT&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          fi
          if [ -n "$artifact_id" ]; then
            curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/state.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
            unzip -q "$RUNNER_TEMP/state.zip" -d "$state/raw"
            cp "$(find "$state/raw" -name offline-champion.pt -print -quit)" "$state/offline-champion.pt"
            cp "$(find "$state/raw" -name state.json -print -quit)" "$state/state.json"
            crit="$(find "$state/raw" -name training-critic.pt -print -quit)"
            [ -z "$crit" ] || cp "$crit" "$state/training-critic.pt"
            pending="$(find "$state/raw" -name pending-real-game.pt -print -quit)"
            [ -z "$pending" ] || cp "$pending" "$state/pending-real-game.pt"
          else
            cp external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt "$state/offline-champion.pt"
            printf '%s\n' '{"schema_version":"sts1-armg-ppo-v14-loop-state-v1","round_index":0,"generation":0,"parent_generation":0,"stagnation_count":0,"production_champion_replaced":false}' > "$state/state.json"
          fi
          sha="$(sha256sum "$state/offline-champion.pt" | awk '{print $1}')"
          python - "$state/state.json" "$sha" <<'PY'
          import json, sys
          state=json.load(open(sys.argv[1], encoding="utf-8"))
          recorded=state.get("training_parent_sha256") or state.get("offline_champion_sha256")
          if recorded is not None and recorded != sys.argv[2]:
              raise SystemExit(f"training parent SHA drift: {recorded} != {sys.argv[2]}")
          print("PPO_V14_STATE_INTEGRITY_PASS", sys.argv[2])
          PY
          echo "CURRENT_WEIGHT=$state/offline-champion.pt" >> "$GITHUB_ENV"
          echo "CHECKPOINT_ID=armg-ppo-v14-$sha" >> "$GITHUB_ENV"

      - name: Collect fresh v1.4 rollout shard
        run: |
          worker=${{ matrix.worker }}
          seed_start="$((PPO_RNG_SEED + GITHUB_RUN_NUMBER * 1000003 + worker * 100003))"
          python scripts/sts1/sts1_armg_ppo_rollout_v14.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-armg             --weight "$CURRENT_WEIGHT"             --out "evidence/sts1/ppo-v14-auto/worker-$worker"             --formal-seed-file external/sts-rl-agent/source/eval/eval_seeds_50.txt             --final-seed-file control/sts1-v14-final-promotion-seeds-50.txt             --seed-start "$seed_start"             --games "$PPO_GAMES_PER_WORKER"             --temperature "$PPO_TEMPERATURE"             --reward-mode "$PPO_REWARD_MODE"             --checkpoint-id "$CHECKPOINT_ID"             --worker "$worker"             --parallel-games 2

      - uses: actions/upload-artifact@v4
        with:
          name: sts1-armg-ppo-v14-rollout-${{ github.run_id }}-${{ matrix.worker }}
          path: evidence/sts1/ppo-v14-auto/worker-${{ matrix.worker }}/rollout.npz
          if-no-files-found: error
          retention-days: 30

  train-and-gate:
    needs: rollout
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Load v1.4 control
        run: |
          set -a
          source control/sts1-armg-ppo-v14-auto-loop.request
          set +a
          echo "PPO_TEMPERATURE=$temperature" >> "$GITHUB_ENV"
          echo "PPO_EPOCHS=$epochs" >> "$GITHUB_ENV"
          echo "PPO_LR=$learning_rate" >> "$GITHUB_ENV"
          echo "PPO_CLIP=$clip" >> "$GITHUB_ENV"
          echo "PPO_TARGET_KL=$target_kl" >> "$GITHUB_ENV"
          echo "PPO_ENTROPY=$entropy" >> "$GITHUB_ENV"
          echo "PPO_ANCHOR=$anchor_coef" >> "$GITHUB_ENV"
          echo "PPO_MCTS_SIMS=$mcts_sims" >> "$GITHUB_ENV"

      - name: Install and hydrate
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . numpy torch==2.11.0
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-armg
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"

      - name: Restore v1.4 state or migrate v1.3
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/ppo-v14-state"
          rm -rf "$state"; mkdir -p "$state"
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$artifact_id" ]; then
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$LEGACY_STATE_ARTIFACT&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          fi
          if [ -n "$artifact_id" ]; then
            curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/state.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
            unzip -q "$RUNNER_TEMP/state.zip" -d "$state/raw"
            cp "$(find "$state/raw" -name offline-champion.pt -print -quit)" "$state/offline-champion.pt"
            cp "$(find "$state/raw" -name state.json -print -quit)" "$state/state.json"
            crit="$(find "$state/raw" -name training-critic.pt -print -quit)"
            [ -z "$crit" ] || cp "$crit" "$state/training-critic.pt"
            pending="$(find "$state/raw" -name pending-real-game.pt -print -quit)"
            [ -z "$pending" ] || cp "$pending" "$state/pending-real-game.pt"
            ppo_replay="$(find "$state/raw" -name ppo-replay.npz -print -quit)"
            [ -z "$ppo_replay" ] || cp "$ppo_replay" "$state/ppo-replay.npz"
            elite_replay="$(find "$state/raw" -name elite-replay.npz -print -quit)"
            [ -z "$elite_replay" ] || cp "$elite_replay" "$state/elite-replay.npz"
          else
            cp external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt "$state/offline-champion.pt"
            printf '%s\n' '{"schema_version":"sts1-armg-ppo-v14-loop-state-v1","round_index":0,"generation":0,"parent_generation":0,"stagnation_count":0,"production_champion_replaced":false}' > "$state/state.json"
          fi
          sha="$(sha256sum "$state/offline-champion.pt" | awk '{print $1}')"
          python - "$state/state.json" "$sha" <<'PY'
          import json, sys
          state=json.load(open(sys.argv[1], encoding="utf-8"))
          recorded=state.get("training_parent_sha256") or state.get("offline_champion_sha256")
          if recorded is not None and recorded != sys.argv[2]:
              raise SystemExit(f"training parent SHA drift: {recorded} != {sys.argv[2]}")
          print("PPO_V14_STATE_INTEGRITY_PASS", sys.argv[2])
          PY
          echo "CURRENT_WEIGHT=$state/offline-champion.pt" >> "$GITHUB_ENV"
          echo "STATE_DIR=$state" >> "$GITHUB_ENV"
          echo "CHECKPOINT_ID=armg-ppo-v14-$sha" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: sts1-armg-ppo-v14-rollout-${{ github.run_id }}-*
          path: evidence/sts1/ppo-v14-rollouts

      - name: Preprocess fresh shards
        run: |
          python scripts/sts1/sts1_armg_ppo_preprocess_v11_sharded.py             --rollouts evidence/sts1/ppo-v14-rollouts             --output-dir evidence/sts1/ppo-v14-preprocessed             --checkpoint-id "$CHECKPOINT_ID"

      - name: Build bounded replay buffers
        run: |
          round_index="$(python - "$STATE_DIR/state.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1],encoding="utf-8"))
          print(int(s.get("round_index",0))+1)
          PY
          )"
          python scripts/sts1/sts1_armg_ppo_v14_replay.py             --fresh-dir evidence/sts1/ppo-v14-preprocessed             --state-dir "$STATE_DIR"             --output-dir evidence/sts1/ppo-v14-replay             --checkpoint-id "$CHECKPOINT_ID"             --round-index "$round_index"             --max-ppo-games 1600             --replay-fraction 0.50             --max-elite-games 600             --elite-min-floor 45

      - name: Full preflight
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import numpy as np
          files=sorted(Path("evidence/sts1/ppo-v14-preprocessed").glob("shard_*.npz"))
          assert len(files)==8, len(files)
          expected=os.environ["CHECKPOINT_ID"]
          total=0
          for f in files:
              with np.load(f,allow_pickle=False) as d:
                  assert str(d["checkpoint_id"][0])==expected
                  assert d["obs"].shape[1]==412 and d["desc"].shape[1]==368
                  assert np.isfinite(d["obs"]).all() and np.isfinite(d["desc"]).all()
                  assert np.isfinite(d["reward"]).all() and np.isfinite(d["old_logp"]).all()
                  total += len(d["action"])
          assert total>0
          print("PPO_V14_PREFLIGHT_PASS", total)
          PY

      - name: Train PPO v1.4 Candidate
        run: |
          extra=()
          if [ -f "$STATE_DIR/training-critic.pt" ]; then
            extra+=(--base-critic "$STATE_DIR/training-critic.pt")
          fi
          python scripts/sts1/sts1_armg_ppo_train_v14_sharded.py             --shards evidence/sts1/ppo-v14-preprocessed             --replay-shards evidence/sts1/ppo-v14-replay             --elite-replay "$STATE_DIR/elite-replay.npz"             --armg-root .cache/sts1-armg             --base-weight "$CURRENT_WEIGHT"             --output evidence/sts1/ppo-v14-candidate/armg_ppo_v14_candidate.pt             --critic-output evidence/sts1/ppo-v14-candidate/training-critic.pt             --checkpoint-id "$CHECKPOINT_ID"             --epochs "$PPO_EPOCHS"             --lr "$PPO_LR"             --clip "$PPO_CLIP"             --target-kl "$PPO_TARGET_KL"             --entropy "$PPO_ENTROPY"             --anchor-coef "$PPO_ANCHOR"             --behavior-temperature "$PPO_TEMPERATURE"             --bc-coef 0.01             --bc-max-decisions 1024             --threads 4             "${extra[@]}"

      - name: Two-level Dev and Final Gate
        run: |
          python scripts/sts1/sts1_armg_ppo_v14_gate.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-armg             --parent-weight "$CURRENT_WEIGHT"             --baseline-weight external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt             --candidate-weight evidence/sts1/ppo-v14-candidate/armg_ppo_v14_candidate.pt             --dev-seed-file external/sts-rl-agent/source/eval/eval_seeds_50.txt             --final-seed-file control/sts1-v14-final-promotion-seeds-50.txt             --state "$STATE_DIR/state.json"             --output-dir evidence/sts1/ppo-v14-gate             --mcts-sims "$PPO_MCTS_SIMS"             --workers 4

      - name: Update durable v1.4 state
        run: |
          python scripts/sts1/sts1_armg_ppo_v14_state.py             --state-dir "$STATE_DIR"             --candidate evidence/sts1/ppo-v14-candidate/armg_ppo_v14_candidate.pt             --candidate-critic evidence/sts1/ppo-v14-candidate/training-critic.pt             --gate-summary evidence/sts1/ppo-v14-gate/gate-summary.json             --run-id "$GITHUB_RUN_ID"

      - name: Upload durable v1.4 state
        uses: actions/upload-artifact@v4
        with:
          name: sts1-armg-ppo-v14-loop-state
          path: |
            ${{ runner.temp }}/ppo-v14-state/state.json
            ${{ runner.temp }}/ppo-v14-state/offline-champion.pt
            ${{ runner.temp }}/ppo-v14-state/training-critic.pt
            ${{ runner.temp }}/ppo-v14-state/pending-real-game.pt
            ${{ runner.temp }}/ppo-v14-state/ppo-replay.npz
            ${{ runner.temp }}/ppo-v14-state/elite-replay.npz
          if-no-files-found: error
          retention-days: 90

      - name: Upload v1.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sts1-armg-ppo-v14-loop-report-${{ github.run_id }}
          path: |
            evidence/sts1/ppo-v14-preprocessed/manifest.json
            evidence/sts1/ppo-v14-replay/replay-manifest.json
            evidence/sts1/ppo-v14-candidate/**
            evidence/sts1/ppo-v14-gate/**
          if-no-files-found: warn
          retention-days: 90

  supervisor:
    if: always()
    needs: [rollout, train-and-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Continue v1.4, retry, or pause
        env:
          ROLLOUT_RESULT: ${{ needs.rollout.result }}
          TRAIN_GATE_RESULT: ${{ needs.train-and-gate.result }}
        run: |
          set -euo pipefail
          set -a
          source control/sts1-armg-ppo-v14-auto-loop.request
          set +a
          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          next_attempt="$((attempt + 1))"
          should_continue=1

          if [ "$ROLLOUT_RESULT" = "success" ] && [ "$TRAIN_GATE_RESULT" = "success" ]; then
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="sts1-armg-ppo-v14-loop-state") | .id' | head -n1)"
            curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/state.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
            mkdir -p "$RUNNER_TEMP/state"; unzip -q "$RUNNER_TEMP/state.zip" -d "$RUNNER_TEMP/state"
            state_file="$(find "$RUNNER_TEMP/state" -name state.json -print -quit)"
            python scripts/sts1/sts1_armg_ppo_v13_adapt.py               --state "$state_file"               --control control/sts1-armg-ppo-v14-auto-loop.request               --output-control "$RUNNER_TEMP/next.request"               --report "$RUNNER_TEMP/adaptation.json"
            python - "$RUNNER_TEMP/next.request" "$next_attempt" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); attempt=sys.argv[2]
          rows=[]
          for line in p.read_text().splitlines():
              if not line.strip(): continue
              k,v=line.split("=",1)
              if k=="attempt": v=attempt
              if k=="retry_count": v="0"
              rows.append((k,v))
          p.write_text("".join(f"{k}={v}\n" for k,v in rows))
          PY
            eval "$(python - "$state_file" <<'PY'
          import json,shlex,sys
          s=json.load(open(sys.argv[1]))
          vals={
            "ROUND":s.get("round_index",0),
            "PGEN":s.get("parent_generation",s.get("generation",0)),
            "DECISION":s.get("last_decision","UNKNOWN"),
            "READY":s.get("last_final_readiness","NOT_READY"),
            "STAG":s.get("stagnation_count",0),
          }
          for k,v in vals.items(): print(f"{k}={shlex.quote(str(v))}")
          PY
          )"
            if [ "$max_rounds" -gt 0 ] && [ "$ROUND" -ge "$max_rounds" ]; then should_continue=0; fi
            printf -v body '@ericpeng0604-coder\n\n## PPO v1.4 Auto Loop — Round %s\n\n- Run：%s\n- Training Parent：**%s**\n- Parent generation：%s\n- Final Gate：**%s**\n- Stagnation：%s\n- 正式 Champion：**未修改**（仍需真實遊戲 Gate）' "$ROUND" "$run_url" "$DECISION" "$PGEN" "$READY" "$STAG"
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$report_issue/comments" -f body="$body"
          else
            next_retry="$((retry_count + 1))"
            cp control/sts1-armg-ppo-v14-auto-loop.request "$RUNNER_TEMP/next.request"
            python - "$RUNNER_TEMP/next.request" "$next_attempt" "$next_retry" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); attempt,retry=sys.argv[2:4]; rows=[]
          for line in p.read_text().splitlines():
              if not line.strip(): continue
              k,v=line.split("=",1)
              if k=="attempt": v=attempt
              elif k=="retry_count": v=retry
              elif k=="reason": v="auto_retry_after_failure"
              rows.append((k,v))
          p.write_text("".join(f"{k}={v}\n" for k,v in rows))
          PY
            if [ "$next_retry" -gt "$max_retries" ]; then should_continue=0; fi
            printf -v body '@ericpeng0604-coder\n\n## PPO v1.4 Auto Loop — technical failure\n\n- Run：%s\n- Rollout：**%s**\n- Train/Gate：**%s**\n- Retry：%s/%s\n- 參數：**原樣重試，不把技術錯誤算成 stagnation**' "$run_url" "$ROLLOUT_RESULT" "$TRAIN_GATE_RESULT" "$next_retry" "$max_retries"
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$report_issue/comments" -f body="$body"
          fi

          [ "$should_continue" -eq 1 ] || exit 0
          path="control/sts1-armg-ppo-v14-auto-loop.request"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$GITHUB_REF_NAME" --jq '.sha')"
          encoded="$(base64 -w0 "$RUNNER_TEMP/next.request")"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message="control(sts1): continue PPO v1.4 auto loop" -f content="$encoded" -f sha="$sha" -f branch="$GITHUB_REF_NAME" >/dev/null
          gh workflow run sts1-armg-ppo-v14-auto-loop.yml --ref "$GITHUB_REF_NAME"
          echo "PPO_V14_AUTO_LOOP_CONTINUED"
