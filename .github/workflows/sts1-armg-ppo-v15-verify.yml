name: STS1 PPO v1.5 Population Curriculum Verify

on:
  workflow_dispatch:
  push:
    branches:
      - gpt/sts1-ppo-v15-population-curriculum-20260929
    paths:
      - scripts/sts1/sts1_armg_ppo_train_v14_sharded.py
      - scripts/sts1/sts1_armg_ppo_rollout_v14.py
      - scripts/sts1/sts1_armg_ppo_v14_replay.py
      - scripts/sts1/sts1_armg_ppo_preprocess_v11_sharded.py
      - scripts/sts1/sts1_armg_ppo_v14_gate.py
      - scripts/sts1/sts1_armg_ppo_v15_tournament.py
      - scripts/sts1/sts1_armg_ppo_v14_state.py
      - scripts/sts1/sts1_armg_ppo_v13_adapt.py
      - scripts/sts1/sts1_armg_ppo_v15_adapt.py
      - control/sts1-armg-ppo-v15-auto-loop.request
      - tests/test_sts1_armg_ppo_v14.py
      - tests/test_sts1_armg_ppo_v15.py
      - tests/test_sts1_armg_ppo_v14_replay.py
      - tests/test_sts1_armg_ppo_v13_adapt.py
      - control/sts1-v14-final-promotion-seeds-50.txt
      - .github/workflows/sts1-armg-ppo-v13-auto-loop.yml
      - .github/workflows/sts1-armg-ppo-v14-auto-loop.yml
      - .github/workflows/sts1-armg-ppo-v15-population-curriculum.yml
      - .github/workflows/sts1-armg-ppo-v15-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e . numpy torch==2.11.0 pytest

      - name: Compile and unit tests
        run: |
          python -m py_compile \
            scripts/sts1/sts1_armg_ppo_train_v14_sharded.py \
            scripts/sts1/sts1_armg_ppo_rollout_v14.py \
            scripts/sts1/sts1_armg_ppo_v14_replay.py \
            scripts/sts1/sts1_armg_ppo_preprocess_v11_sharded.py \
            scripts/sts1/sts1_armg_ppo_v14_gate.py \
            scripts/sts1/sts1_armg_ppo_v15_tournament.py \
            scripts/sts1/sts1_armg_ppo_v14_state.py \
            scripts/sts1/sts1_armg_ppo_v13_adapt.py \
            scripts/sts1/sts1_armg_ppo_v15_adapt.py
          pytest -q \
            tests/test_sts1_armg_ppo_v14.py \
            tests/test_sts1_armg_ppo_v15.py \
            tests/test_sts1_armg_ppo_v14_replay.py \
            tests/test_sts1_armg_ppo_v13_adapt.py

      - name: Verify v1.5 auto-loop controller
        run: |
          mkdir -p "$RUNNER_TEMP/v15-controller"
          printf '%s\n' '{"schema_version":"sts1-armg-ppo-v14-loop-state-v1","round_index":86,"parent_generation":3,"stagnation_count":4,"last_decision":"HOLD_PARENT","last_dev_gate":{"win_delta":-2,"mean_paired_floor_delta":0.43}}' > "$RUNNER_TEMP/v15-controller/state.json"
          python scripts/sts1/sts1_armg_ppo_v15_adapt.py \
            --state "$RUNNER_TEMP/v15-controller/state.json" \
            --control control/sts1-armg-ppo-v15-auto-loop.request \
            --output-control "$RUNNER_TEMP/v15-controller/next.request" \
            --report "$RUNNER_TEMP/v15-controller/adaptation.json"
          grep -q '^ppo_version=1.5$' "$RUNNER_TEMP/v15-controller/next.request"
          grep -q '^max_rounds=0$' "$RUNNER_TEMP/v15-controller/next.request"
          python - "$RUNNER_TEMP/v15-controller/adaptation.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r["schema_version"]=="sts1-armg-ppo-v15-adaptation-v1", r
          assert r["profile"]["name"]=="escape", r
          print("PPO_V15_AUTO_LOOP_CONTROLLER_PASS", r["profile"]["name"])
          PY

      - name: Hydrate pinned simulator
        run: |
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py

          root=.cache/v14-armg
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
          PYTHONPATH="$PWD/external/sts_lightspeed/source/build-probe" python -c 'import slaythespire; print("PPO_V14_RUNTIME_PASS")'

      - name: Verify Dev and Final seed separation
        run: |
          python - <<'PY'
          from pathlib import Path
          def read(p):
              return {
                  int(x.strip())
                  for x in Path(p).read_text().splitlines()
                  if x.strip() and not x.lstrip().startswith("#")
              }
          dev=read("external/sts-rl-agent/source/eval/eval_seeds_50.txt")
          final=read("control/sts1-v14-final-promotion-seeds-50.txt")
          assert len(dev)==50 and len(final)==50
          assert not (dev & final), sorted(dev & final)
          print("PPO_V14_SEED_BOUNDARY_PASS", len(dev), len(final))
          PY

      - name: Real v1.4 rollout and preprocess
        run: |
          python scripts/sts1/sts1_armg_ppo_rollout_v14.py \
            --module-dir external/sts_lightspeed/source/build-probe \
            --armg-root .cache/v14-armg \
            --weight external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt \
            --out "$RUNNER_TEMP/v14-rollout/worker-0" \
            --formal-seed-file external/sts-rl-agent/source/eval/eval_seeds_50.txt \
            --final-seed-file control/sts1-v14-final-promotion-seeds-50.txt \
            --seed-start 2026092814 \
            --games 4 \
            --temperature 1.12 \
            --reward-mode v14_dense \
            --checkpoint-id v14-ratio-smoke \
            --worker 0 \
            --parallel-games 2

          mkdir -p "$RUNNER_TEMP/v14-rollouts/worker-0"
          cp "$RUNNER_TEMP/v14-rollout/worker-0/rollout.npz" "$RUNNER_TEMP/v14-rollouts/worker-0/rollout.npz"
          python scripts/sts1/sts1_armg_ppo_preprocess_v11_sharded.py \
            --rollouts "$RUNNER_TEMP/v14-rollouts" \
            --output-dir "$RUNNER_TEMP/v14-shards" \
            --checkpoint-id v14-ratio-smoke

      - name: Build first replay generation
        run: |
          mkdir -p "$RUNNER_TEMP/v14-replay-state"
          python scripts/sts1/sts1_armg_ppo_v14_replay.py \
            --fresh-dir "$RUNNER_TEMP/v14-shards" \
            --state-dir "$RUNNER_TEMP/v14-replay-state" \
            --output-dir "$RUNNER_TEMP/v14-replay-round1" \
            --checkpoint-id v14-ratio-smoke \
            --round-index 1 \
            --max-ppo-games 20 \
            --replay-fraction 0.50 \
            --max-elite-games 20 \
            --elite-min-floor 0
          test -f "$RUNNER_TEMP/v14-replay-state/ppo-replay.npz"
          test -f "$RUNNER_TEMP/v14-replay-state/elite-replay.npz"

      - name: Collect second-temperature rollout
        run: |
          python scripts/sts1/sts1_armg_ppo_rollout_v14.py \
            --module-dir external/sts_lightspeed/source/build-probe \
            --armg-root .cache/v14-armg \
            --weight external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt \
            --out "$RUNNER_TEMP/v14-rollout2/worker-0" \
            --formal-seed-file external/sts-rl-agent/source/eval/eval_seeds_50.txt \
            --final-seed-file control/sts1-v14-final-promotion-seeds-50.txt \
            --seed-start 2026092914 \
            --games 4 \
            --temperature 0.98 \
            --reward-mode v14_dense \
            --checkpoint-id v14-ratio-smoke \
            --worker 0 \
            --parallel-games 2

          mkdir -p "$RUNNER_TEMP/v14-rollouts2/worker-0"
          cp "$RUNNER_TEMP/v14-rollout2/worker-0/rollout.npz" "$RUNNER_TEMP/v14-rollouts2/worker-0/rollout.npz"
          python scripts/sts1/sts1_armg_ppo_preprocess_v11_sharded.py \
            --rollouts "$RUNNER_TEMP/v14-rollouts2" \
            --output-dir "$RUNNER_TEMP/v14-shards2" \
            --checkpoint-id v14-ratio-smoke

          python scripts/sts1/sts1_armg_ppo_v14_replay.py \
            --fresh-dir "$RUNNER_TEMP/v14-shards2" \
            --state-dir "$RUNNER_TEMP/v14-replay-state" \
            --output-dir "$RUNNER_TEMP/v14-replay-round2" \
            --checkpoint-id v14-ratio-smoke \
            --round-index 2 \
            --max-ppo-games 20 \
            --replay-fraction 0.50 \
            --max-elite-games 20 \
            --elite-min-floor 0

      - name: Verify replay log-prob identity across temperature
        run: |
          python - <<'PY'
          import importlib, math, os, sys
          from pathlib import Path
          import numpy as np
          import torch

          root=Path(".cache/v14-armg")
          os.environ["STS_BOT_DIR"]=str(root)
          sys.path.insert(0,str(root))
          m=importlib.import_module("armG_train")
          m.card_idx=lambda n:m._vocab.get(n,m.VOCAB_CAP-1)
          actor=m.Scorer((128,128))
          actor.load_state_dict(torch.load(
              "external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt",
              weights_only=True,
              map_location="cpu",
          ))
          path=Path(os.environ["RUNNER_TEMP"])/"v14-replay-round2/replay_00.npz"
          with np.load(path,allow_pickle=False) as d:
              assert len(d["action"])>0
              temps=np.asarray(d["behavior_temperature"],np.float32)
              assert np.allclose(temps,1.12,atol=1e-6), set(map(float,temps))
              errors=[]
              for i in range(min(64,len(d["action"]))):
                  b,e=int(d["offsets"][i]),int(d["offsets"][i+1])
                  ds=torch.from_numpy(d["desc"][b:e].astype(np.float32))
                  o=torch.from_numpy(d["obs"][i].astype(np.float32)).repeat(len(ds),1)
                  logits=actor.net(torch.cat([o,ds],1)).squeeze(1)/float(temps[i])
                  lp=torch.log_softmax(logits,0)[int(d["action"][i])].item()
                  errors.append(abs(lp-float(d["old_logp"][i])))
              assert max(errors)<1e-4, max(errors)
          print("PPO_V14_REPLAY_RATIO_PASS",max(errors))
          PY

      - name: Real replay plus Elite BC train smoke
        run: |
          python scripts/sts1/sts1_armg_ppo_train_v14_sharded.py \
            --shards "$RUNNER_TEMP/v14-shards2" \
            --replay-shards "$RUNNER_TEMP/v14-replay-round2" \
            --elite-replay "$RUNNER_TEMP/v14-replay-state/elite-replay.npz" \
            --armg-root .cache/v14-armg \
            --base-weight external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt \
            --output "$RUNNER_TEMP/v14-replay-candidate.pt" \
            --critic-output "$RUNNER_TEMP/v14-replay-critic.pt" \
            --checkpoint-id v14-ratio-smoke \
            --epochs 1 \
            --lr 3e-5 \
            --clip 0.20 \
            --target-kl 0.02 \
            --behavior-temperature 0.98 \
            --entropy 0.001 \
            --anchor-coef 0.02 \
            --bc-coef 0.01 \
            --bc-max-decisions 128 \
            --curriculum-strength 0.70 \
            --threads 4

          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path(os.environ["RUNNER_TEMP"]+"/v14-replay-candidate.json").read_text())
          assert report["fresh_shards"]==1, report
          assert report["replay_shards"]==1, report
          assert report["fresh_decisions"]>0 and report["replay_decisions"]>0, report
          assert report["replay_decisions"]<=report["fresh_decisions"], report
          assert report["elite_bc_total_decisions"]>0, report
          assert report["curriculum_strength"]==0.70, report
          assert report["curriculum_focus"] in {"act1","act2","act3","none"}, report
          assert report["initial_ratio_abs_error"]<1e-4, report
          print(
              "PPO_V14_REPLAY_TRAIN_PASS",
              report["fresh_decisions"],
              report["replay_decisions"],
              report["elite_bc_total_decisions"],
          )
          PY

      - name: Verify temperature-correct PPO ratio
        run: |
          python scripts/sts1/sts1_armg_ppo_train_v14_sharded.py \
            --shards "$RUNNER_TEMP/v14-shards" \
            --armg-root .cache/v14-armg \
            --base-weight external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt \
            --output "$RUNNER_TEMP/v14-candidate.pt" \
            --critic-output "$RUNNER_TEMP/v14-critic.pt" \
            --checkpoint-id v14-ratio-smoke \
            --epochs 1 \
            --lr 3e-5 \
            --clip 0.20 \
            --target-kl 0.02 \
            --behavior-temperature 1.12 \
            --entropy 0.001 \
            --anchor-coef 0.02 \
            --threads 4

          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path(os.environ["RUNNER_TEMP"] + "/v14-candidate.json").read_text())
          assert report["schema"]=="sts1-armg-ppo-v14-sharded-train"
          assert report["critic_loaded"] is False
          assert report["fixed_rollout_targets"] is True
          assert abs(report["initial_ratio_mean"] - 1.0) < 1e-4, report
          assert report["initial_ratio_abs_error"] < 1e-4, report
          assert report["entropy_coef"] == 0.001
          assert report["behavior_temperature"] == 1.12
          assert report["best_critic_explained_variance"] >= report["initial_critic_explained_variance"] - 1e-9
          print(
              "PPO_V14_RATIO_PASS",
              report["initial_ratio_mean"],
              report["initial_ratio_abs_error"],
              report["best_critic_explained_variance"],
          )
          PY

      - name: Verify persistent Critic reload
        run: |
          python scripts/sts1/sts1_armg_ppo_train_v14_sharded.py \
            --shards "$RUNNER_TEMP/v14-shards" \
            --armg-root .cache/v14-armg \
            --base-weight external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt \
            --base-critic "$RUNNER_TEMP/v14-critic.pt" \
            --output "$RUNNER_TEMP/v14-candidate-reload.pt" \
            --critic-output "$RUNNER_TEMP/v14-critic-reload.pt" \
            --checkpoint-id v14-ratio-smoke \
            --epochs 1 \
            --lr 3e-5 \
            --clip 0.20 \
            --target-kl 0.02 \
            --behavior-temperature 1.12 \
            --entropy 0.001 \
            --anchor-coef 0.02 \
            --threads 4

          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path(os.environ["RUNNER_TEMP"] + "/v14-candidate-reload.json").read_text())
          assert report["critic_loaded"] is True, report
          assert report["fixed_rollout_targets"] is True, report
          assert report["best_critic_explained_variance"] >= report["initial_critic_explained_variance"] - 1e-9, report
          assert report["history"][0]["explained_variance"] == report["history"][0]["explained_variance"]
          print(
              "PPO_V14_CRITIC_RELOAD_PASS",
              report["initial_critic_explained_variance"],
              report["best_critic_explained_variance"],
          )
          PY

      - name: Verify poisoned Critic auto-reset
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import torch

          src=Path(os.environ["RUNNER_TEMP"]) / "v14-critic.pt"
          dst=Path(os.environ["RUNNER_TEMP"]) / "v14-critic-poisoned.pt"
          state=torch.load(src, weights_only=True, map_location="cpu")
          state["4.weight"].fill_(1000.0)
          state["4.bias"].zero_()
          torch.save(state, dst)
          print("PPO_V14_POISONED_CRITIC_CREATED")
          PY

          python scripts/sts1/sts1_armg_ppo_train_v14_sharded.py \
            --shards "$RUNNER_TEMP/v14-shards" \
            --armg-root .cache/v14-armg \
            --base-weight external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt \
            --base-critic "$RUNNER_TEMP/v14-critic-poisoned.pt" \
            --output "$RUNNER_TEMP/v14-candidate-reset.pt" \
            --critic-output "$RUNNER_TEMP/v14-critic-reset.pt" \
            --checkpoint-id v14-ratio-smoke \
            --epochs 1 \
            --lr 3e-5 \
            --clip 0.20 \
            --target-kl 0.02 \
            --behavior-temperature 1.12 \
            --entropy 0.001 \
            --anchor-coef 0.02 \
            --threads 4

          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path(os.environ["RUNNER_TEMP"] + "/v14-candidate-reset.json").read_text())
          assert report["critic_loaded"] is True, report
          assert report["critic_reset"] is True, report
          assert report["critic_health_explained_variance_before_reset"] < -0.10, report
          assert report["initial_critic_explained_variance"] >= -1e-6, report
          assert report["best_critic_explained_variance"] >= report["initial_critic_explained_variance"] - 1e-9, report
          print(
              "PPO_V14_CRITIC_RESET_PASS",
              report["critic_health_explained_variance_before_reset"],
              report["initial_critic_explained_variance"],
              report["best_critic_explained_variance"],
          )
          PY

      - name: Real 30-seed Dev Parent gate smoke
        run: |
          mkdir -p "$RUNNER_TEMP/v14-state"
          cp external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt "$RUNNER_TEMP/v14-state/offline-champion.pt"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ["RUNNER_TEMP"] + "/v14-state/state.json").write_text(
              json.dumps({
                  "schema_version":"sts1-armg-ppo-v14-loop-state-v1",
                  "round_index":0,
                  "generation":0,
                  "stagnation_count":0,
                  "production_champion_replaced":False,
              })+"\n"
          )
          PY

          python scripts/sts1/sts1_armg_ppo_v14_gate.py \
            --module-dir external/sts_lightspeed/source/build-probe \
            --armg-root .cache/v14-armg \
            --parent-weight external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt \
            --baseline-weight external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt \
            --candidate-weight external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt \
            --dev-seed-file external/sts-rl-agent/source/eval/eval_seeds_50.txt \
            --final-seed-file control/sts1-v14-final-promotion-seeds-50.txt \
            --state "$RUNNER_TEMP/v14-state/state.json" \
            --output-dir "$RUNNER_TEMP/v14-gate" \
            --mcts-sims 2000 \
            --workers 4

          python - <<'PY'
          import json, os
          from pathlib import Path
          gate=json.loads(Path(os.environ["RUNNER_TEMP"] + "/v14-gate/gate-summary.json").read_text())
          state=json.loads(Path(os.environ["RUNNER_TEMP"] + "/v14-state/state.json").read_text())
          assert gate["dev_gate"]["status"]=="HOLD", gate
          assert gate["dev_gate"]["win_delta"]==0, gate
          assert gate["final_gate_30"]["status"]=="SKIPPED", gate
          assert len(state["v14_eval_caches"]["dev_parent"]["runs"])==30
          print("PPO_V14_REAL_DEV_GATE_PASS")
          PY

      - name: Repository whitespace check
        run: git diff --check HEAD^ HEAD
 "$RUNNER_TEMP/v15-controller/next.request"
          grep -q '^max_rounds=0        run: |
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py

          root=.cache/v14-armg
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
          PYTHONPATH="$PWD/external/sts_lightspeed/source/build-probe" python -c 'import slaythespire; print("PPO_V14_RUNTIME_PASS")'

      - name: Verify Dev and Final seed separation
        run: |
          python - <<'PY'
          from pathlib import Path
          def read(p):
              return {
                  int(x.strip())
                  for x in Path(p).read_text().splitlines()
                  if x.strip() and not x.lstrip().startswith("#")
              }
          dev=read("external/sts-rl-agent/source/eval/eval_seeds_50.txt")
          final=read("control/sts1-v14-final-promotion-seeds-50.txt")
          assert len(dev)==50 and len(final)==50
          assert not (dev & final), sorted(dev & final)
          print("PPO_V14_SEED_BOUNDARY_PASS", len(dev), len(final))
          PY

      - name: Real v1.4 rollout and preprocess
        run: |
          python scripts/sts1/sts1_armg_ppo_rollout_v14.py \
            --module-dir external/sts_lightspeed/source/build-probe \
            --armg-root .cache/v14-armg \
            --weight external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt \
            --out "$RUNNER_TEMP/v14-rollout/worker-0" \
            --formal-seed-file external/sts-rl-agent/source/eval/eval_seeds_50.txt \
            --final-seed-file control/sts1-v14-final-promotion-seeds-50.txt \
            --seed-start 2026092814 \
            --games 4 \
            --temperature 1.12 \
            --reward-mode v14_dense \
            --checkpoint-id v14-ratio-smoke \
            --worker 0 \
            --parallel-games 2

          mkdir -p "$RUNNER_TEMP/v14-rollouts/worker-0"
          cp "$RUNNER_TEMP/v14-rollout/worker-0/rollout.npz" "$RUNNER_TEMP/v14-rollouts/worker-0/rollout.npz"
          python scripts/sts1/sts1_armg_ppo_preprocess_v11_sharded.py \
            --rollouts "$RUNNER_TEMP/v14-rollouts" \
            --output-dir "$RUNNER_TEMP/v14-shards" \
            --checkpoint-id v14-ratio-smoke

      - name: Build first replay generation
        run: |
          mkdir -p "$RUNNER_TEMP/v14-replay-state"
          python scripts/sts1/sts1_armg_ppo_v14_replay.py \
