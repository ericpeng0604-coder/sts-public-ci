name: STS1 ArmG Strategy-Only Auto Loop

on:
  push:
    branches:
      - gpt/sts1-armg-strategy-loop-20260928
    paths:
      - '.github/workflows/sts1-armg-strategy-loop.yml'
      - 'src/roguelike_ai/sts1_phase3/armg_strategy_evolve.py'
      - 'scripts/sts1/sts1_armg_strategy_loop.py'
      - 'tests/test_sts1_armg_strategy_evolve.py'
      - 'scripts/sts1/sts1_strategy_state_validate.py'
      - 'tests/test_sts1_strategy_state_validate.py'
      - 'control/sts1-armg-strategy-loop.start'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sts1-armg-strategy-only-auto-loop
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ github.token }}
  SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'
  STATE_ARTIFACT: 'sts1-armg-strategy-loop-state'

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' torch==2.11.0

      - name: Compile Strategy loop
        run: |
          python -m py_compile \
            src/roguelike_ai/sts1_phase3/armg_strategy_evolve.py \
            scripts/sts1/sts1_armg_strategy_loop.py \
            scripts/sts1/sts1_strategy_state_validate.py

      - name: Verify Strategy-only contracts
        run: |
          pytest -q \
            tests/test_sts1_armg_strategy_evolve.py \
            tests/test_sts1_strategy_state_validate.py \
            tests/test_sts1_champion_gate.py

  strategy-round:
    needs: contract-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      enabled: ${{ steps.control.outputs.enabled }}

    steps:
      - uses: actions/checkout@v4

      - name: Load Strategy control
        id: control
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source control/sts1-armg-strategy-loop.request
          set +a
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "STRATEGY_ENABLED=$enabled" >> "$GITHUB_ENV"
          echo "STRATEGY_ATTEMPT=$attempt" >> "$GITHUB_ENV"
          echo "STRATEGY_RETRY_COUNT=$retry_count" >> "$GITHUB_ENV"
          echo "STRATEGY_MAX_RETRIES=$max_retries" >> "$GITHUB_ENV"
          echo "STRATEGY_MAX_ROUNDS=$max_rounds" >> "$GITHUB_ENV"
          effective_training_seeds="$training_seeds"
          effective_eval_workers="$eval_workers"
          effective_branch_points="$max_branch_points_per_game"

          # Automatic load shedding only during retries. A successful round
          # resets retry_count to 0, so the next normal round returns to the
          # configured full workload automatically.
          if [ "$retry_count" -ge 1 ]; then
            effective_eval_workers="$(( eval_workers > 2 ? 2 : eval_workers ))"
            effective_branch_points="$(( max_branch_points_per_game > 4 ? 4 : max_branch_points_per_game ))"
          fi
          if [ "$retry_count" -ge 2 ]; then
            effective_training_seeds=1
            effective_eval_workers=1
            effective_branch_points="$(( max_branch_points_per_game > 2 ? 2 : max_branch_points_per_game ))"
          fi
          if [ "$retry_count" -ge 3 ]; then
            effective_branch_points=1
          fi

          echo "STRATEGY_TRAINING_SEEDS=$effective_training_seeds" >> "$GITHUB_ENV"
          echo "STRATEGY_MCTS_SIMS=$mcts_sims" >> "$GITHUB_ENV"
          echo "STRATEGY_EVAL_WORKERS=$effective_eval_workers" >> "$GITHUB_ENV"
          echo "STRATEGY_RNG_SEED=$rng_seed" >> "$GITHUB_ENV"
          echo "STRATEGY_MAX_BRANCH_POINTS=$effective_branch_points" >> "$GITHUB_ENV"
          echo "STRATEGY_CONFIGURED_TRAINING_SEEDS=$training_seeds" >> "$GITHUB_ENV"
          echo "STRATEGY_CONFIGURED_EVAL_WORKERS=$eval_workers" >> "$GITHUB_ENV"
          echo "STRATEGY_CONFIGURED_BRANCH_POINTS=$max_branch_points_per_game" >> "$GITHUB_ENV"
          echo "STRATEGY_EFFECTIVE_LOAD retry=$retry_count training_seeds=$effective_training_seeds eval_workers=$effective_eval_workers branch_points=$effective_branch_points"
          echo "STRATEGY_MAX_BRANCH_PER_KIND=$max_branch_points_per_kind_per_game" >> "$GITHUB_ENV"
          echo "STRATEGY_MAX_CHOICE_BRANCHES=$max_choice_branches" >> "$GITHUB_ENV"
          echo "STRATEGY_EPOCHS=$epochs" >> "$GITHUB_ENV"
          echo "STRATEGY_LR=$learning_rate" >> "$GITHUB_ENV"
          echo "STRATEGY_ANCHOR=$anchor_coef" >> "$GITHUB_ENV"
          echo "STRATEGY_MAX_REPLAY=$max_replay_examples" >> "$GITHUB_ENV"
          echo "STRATEGY_MAX_STAGNATION=$max_stagnation" >> "$GITHUB_ENV"
          echo "STRATEGY_REPORT_ISSUE=$report_issue" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        if: env.STRATEGY_ENABLED == '1'
        with:
          python-version: '3.12'

      - name: Install and hydrate pinned Strategy runtime
        if: env.STRATEGY_ENABLED == '1'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . numpy torch==2.11.0
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          git -C external/sts_lightspeed/source apply --check "$PWD/patches/sts1/armg_gamecontext_clone.patch"
          git -C external/sts_lightspeed/source apply "$PWD/patches/sts1/armg_gamecontext_clone.patch"
          python scripts/sts1/build_probe.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("external/sts_lightspeed/source/build-probe").resolve()))
          import slaythespire as sts
          gc = sts.GameContext(sts.CharacterClass.IRONCLAD, 123456, 0)
          clone = gc.clone()
          assert clone.seed == gc.seed
          assert clone.floor_num == gc.floor_num
          clone.gold += 7
          assert clone.gold != gc.gold
          print("PASS_STRATEGY_GAMECONTEXT_CLONE")
          PY
          root=".cache/sts1-armg-strategy"
          rm -rf "$root"
          mkdir -p "$root/sim/sts_lightspeed"
          ln -s "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -s "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -s "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
          ln -s "$PWD/external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt" "$root/armG_model_G128x128_15k.pt"

      - name: Restore newest valid Strategy state
        if: env.STRATEGY_ENABLED == '1'
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/strategy-state"
          rm -rf "$state"
          mkdir -p "$state"

          mapfile -t artifact_ids < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT&per_page=100" \
              --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[].id'
          )

          restored=0
          for artifact_id in "${artifact_ids[@]}"; do
            rm -rf "$RUNNER_TEMP/strategy-candidate"
            mkdir -p "$RUNNER_TEMP/strategy-candidate/raw"
            if ! curl --fail --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -o "$RUNNER_TEMP/strategy-candidate.zip" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"; then
              echo "STRATEGY_STATE_SKIP_DOWNLOAD artifact=$artifact_id"
              continue
            fi
            if ! unzip -q "$RUNNER_TEMP/strategy-candidate.zip" -d "$RUNNER_TEMP/strategy-candidate/raw"; then
              echo "STRATEGY_STATE_SKIP_UNZIP artifact=$artifact_id"
              continue
            fi

            found="$(find "$RUNNER_TEMP/strategy-candidate/raw" -name strategy-state.json -print -quit)"
            weight="$(find "$RUNNER_TEMP/strategy-candidate/raw" -name current-strategy.pt -print -quit)"
            replay="$(find "$RUNNER_TEMP/strategy-candidate/raw" -name strategy-replay.jsonl -print -quit)"
            if [ -z "$found" ] || [ -z "$weight" ]; then
              echo "STRATEGY_STATE_SKIP_MISSING_FILES artifact=$artifact_id"
              continue
            fi

            rm -f "$state/strategy-state.json" "$state/current-strategy.pt" "$state/strategy-replay.jsonl"
            cp "$found" "$state/strategy-state.json"
            cp "$weight" "$state/current-strategy.pt"
            [ -z "$replay" ] || cp "$replay" "$state/strategy-replay.jsonl"

            if python scripts/sts1/sts1_strategy_state_validate.py --state-dir "$state"; then
              echo "STRATEGY_STATE_RESTORED artifact=$artifact_id"
              restored=1
              break
            fi
            echo "STRATEGY_STATE_SKIP_INVALID artifact=$artifact_id"
          done

          if [ "$restored" -eq 0 ]; then
            rm -f "$state/strategy-state.json" "$state/current-strategy.pt" "$state/strategy-replay.jsonl"
            echo "NO_VALID_STRATEGY_STATE_START_FROM_UPSTREAM"
          fi
          echo "STRATEGY_STATE_DIR=$state" >> "$GITHUB_ENV"

      - name: Run one real Strategy-only round
        if: env.STRATEGY_ENABLED == '1'
        run: |
          set -euo pipefail
          python scripts/sts1/sts1_armg_strategy_loop.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-armg-strategy             --armg-base-weight .cache/sts1-armg-strategy/armG_model_G128x128_15k.pt             --dev-seed-file external/sts-rl-agent/source/eval/eval_seeds_50.txt             --state-dir "$STRATEGY_STATE_DIR"             --output-dir evidence/sts1/strategy-loop/runs             --rounds 1             --training-seeds "$STRATEGY_TRAINING_SEEDS"             --combat-mcts-sims "$STRATEGY_MCTS_SIMS"             --eval-workers "$STRATEGY_EVAL_WORKERS"             --rng-seed "$STRATEGY_RNG_SEED"             --max-branch-points-per-game "$STRATEGY_MAX_BRANCH_POINTS"             --max-branch-points-per-kind-per-game "$STRATEGY_MAX_BRANCH_PER_KIND"             --max-choice-branches "$STRATEGY_MAX_CHOICE_BRANCHES"             --epochs "$STRATEGY_EPOCHS"             --learning-rate "$STRATEGY_LR"             --anchor-coef "$STRATEGY_ANCHOR"             --max-replay-examples "$STRATEGY_MAX_REPLAY"             --max-stagnation "$STRATEGY_MAX_STAGNATION"

      - name: Verify Strategy-only invariants
        if: env.STRATEGY_ENABLED == '1'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/sts1/strategy-loop/runs/loop-summary.json")
          s=json.loads(p.read_text())
          assert s["result"] == "PASS_STRATEGY_LOOP_COMPLETE"
          assert s["combat_training_enabled"] is False
          assert s["production_champion_replaced"] is False
          assert s["combat_policy"] == f"mcts_{int(__import__('os').environ['STRATEGY_MCTS_SIMS'])}"
          assert Path(__import__('os').environ["STRATEGY_STATE_DIR"], "current-strategy.pt").is_file()
          assert Path(__import__('os').environ["STRATEGY_STATE_DIR"], "strategy-state.json").is_file()
          print("PASS_STRATEGY_ONLY_INVARIANTS", s["combat_policy"], s["generation"])
          PY
          python scripts/sts1/sts1_strategy_state_validate.py \
            --state-dir "$STRATEGY_STATE_DIR"

      - name: Upload durable Strategy state
        if: env.STRATEGY_ENABLED == '1' && success()
        uses: actions/upload-artifact@v4
        with:
          name: sts1-armg-strategy-loop-state
          path: |
            ${{ runner.temp }}/strategy-state/strategy-state.json
            ${{ runner.temp }}/strategy-state/current-strategy.pt
            ${{ runner.temp }}/strategy-state/strategy-replay.jsonl
          if-no-files-found: error
          retention-days: 90

      - name: Upload Strategy evidence
        if: env.STRATEGY_ENABLED == '1' && always()
        uses: actions/upload-artifact@v4
        with:
          name: sts1-armg-strategy-loop-report-${{ github.run_id }}
          path: evidence/sts1/strategy-loop/
          if-no-files-found: warn
          retention-days: 90

  supervisor:
    if: always() && needs.strategy-round.outputs.enabled == '1'
    needs: [contract-tests, strategy-round]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Continue, retry, or pause Strategy loop
        env:
          CONTRACT_RESULT: ${{ needs.contract-tests.result }}
          ROUND_RESULT: ${{ needs.strategy-round.result }}
        run: |
          set -euo pipefail
          set -a
          source control/sts1-armg-strategy-loop.request
          set +a

          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          next_attempt="$((attempt + 1))"
          continue_loop=0
          next_retry="$retry_count"
          summary_text=""

          if [ "$CONTRACT_RESULT" = "success" ] && [ "$ROUND_RESULT" = "success" ]; then
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="sts1-armg-strategy-loop-state") | .id' | head -n1)"
            report_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("sts1-armg-strategy-loop-report-")) | .id' | head -n1)"
            test -n "$artifact_id"
            test -n "$report_id"

            curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"               -o "$RUNNER_TEMP/state.zip"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
            mkdir -p "$RUNNER_TEMP/state"
            unzip -q "$RUNNER_TEMP/state.zip" -d "$RUNNER_TEMP/state"
            state_file="$(find "$RUNNER_TEMP/state" -name strategy-state.json -print -quit)"

            curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"               -o "$RUNNER_TEMP/report.zip"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$report_id/zip"
            mkdir -p "$RUNNER_TEMP/report"
            unzip -q "$RUNNER_TEMP/report.zip" -d "$RUNNER_TEMP/report"
            summary_file="$(find "$RUNNER_TEMP/report" -name loop-summary.json -print -quit)"
            round_report_file="$(find "$RUNNER_TEMP/report" -name round-report.json | sort | tail -n1)"
            test -n "$summary_file"
            test -n "$round_report_file"

            eval "$(python - "$state_file" "$summary_file" "$round_report_file" <<'PY'
          import json, shlex, sys
          state=json.load(open(sys.argv[1], encoding="utf-8"))
          summary=json.load(open(sys.argv[2], encoding="utf-8"))
          report=json.load(open(sys.argv[3], encoding="utf-8"))
          dataset=report.get("dataset") or {}
          kinds=dataset.get("examples_by_kind") or {}
          values={
              "ROUND": int(state.get("accepted_rounds",0))+int(state.get("rejected_rounds",0)),
              "GEN": state.get("generation",0),
              "ACCEPTED": state.get("accepted_rounds",0),
              "REJECTED": state.get("rejected_rounds",0),
              "STAG": state.get("stagnation_count",0),
              "PAUSED": str(bool(summary.get("paused_for_stagnation",False))).lower(),
              "SHA": state.get("current_strategy_sha256","unknown"),
              "COMBAT": summary.get("combat_policy","unknown"),
              "REPLAY": (summary.get("replay") or {}).get("examples",0),
              "DEV_GATE": (report.get("dev_gate") or {}).get("status","unknown"),
              "HIDDEN_GATE": (report.get("hidden_gate") or {}).get("status","unknown"),
              "FRESH_GATE": (report.get("fresh_gate") or {}).get("status","unknown"),
              "PROMOTION": (report.get("promotion") or {}).get("decision","unknown"),
              "EXAMPLES": dataset.get("example_count",0),
              "MISTAKES": dataset.get("mistake_examples",0),
              "KINDS": ",".join(f"{k}:{kinds[k]}" for k in sorted(kinds)) or "none",
          }
          for k,v in values.items():
              print(f"{k}={shlex.quote(str(v))}")
          PY
          )"

            next_retry=0
            if [ "$PAUSED" != "true" ]; then
              if [ "$max_rounds" -eq 0 ] || [ "$ROUND" -lt "$max_rounds" ]; then
                continue_loop=1
              fi
            fi

            printf -v body '@ericpeng0604-coder\n\n## Strategy-only Loop — Round %s\n\n- Run：%s\n- Combat：**%s（固定 pure MCTS）**\n- Gate：Dev **%s** → Hidden **%s** → Fresh **%s**\n- Promotion：**%s**\n- 本輪 Teacher examples：%s（mistakes：%s）\n- Decision kinds：%s\n- Strategy generation：%s\n- Accepted / Rejected：%s / %s\n- Stagnation：%s / %s\n- Replay examples：%s\n- Strategy SHA：`%s`\n- 正式 Champion：**未修改**\n- 下一輪：**%s**'               "$ROUND" "$run_url" "$COMBAT" "$DEV_GATE" "$HIDDEN_GATE" "$FRESH_GATE" "$PROMOTION" "$EXAMPLES" "$MISTAKES" "$KINDS" "$GEN" "$ACCEPTED" "$REJECTED" "$STAG" "$max_stagnation" "$REPLAY" "$SHA"               "$([ "$continue_loop" -eq 1 ] && echo CONTINUE || echo PAUSE)"
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$report_issue/comments" -f body="$body" >/dev/null
          else
            next_retry="$((retry_count + 1))"
            if [ "$next_retry" -le "$max_retries" ]; then
              continue_loop=1
            fi
            printf -v body '@ericpeng0604-coder\n\n## Strategy-only Loop — execution failure\n\n- Run：%s\n- Contract：%s\n- Strategy round：%s\n- Retry：%s / %s\n- 正式 Champion：**未修改**'               "$run_url" "$CONTRACT_RESULT" "$ROUND_RESULT" "$next_retry" "$max_retries"
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$report_issue/comments" -f body="$body" >/dev/null
          fi

          if [ "$continue_loop" -ne 1 ]; then
            echo "STRATEGY_LOOP_PAUSED"
            exit 0
          fi

          path="control/sts1-armg-strategy-loop.request"
          updated=0
          for control_try in 1 2 3 4 5; do
            meta="$RUNNER_TEMP/control-meta.json"
            gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$GITHUB_REF_NAME" > "$meta"
            sha="$(python - "$meta" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["sha"])
          PY
          )"
            python - "$meta" "$RUNNER_TEMP/next.request" "$next_attempt" "$next_retry" <<'PY'
          import base64, json, sys
          from pathlib import Path
          meta=json.load(open(sys.argv[1], encoding="utf-8"))
          raw=base64.b64decode(meta["content"]).decode("utf-8")
          attempt=sys.argv[3]
          retry=sys.argv[4]
          rows=[]
          seen=set()
          for line in raw.splitlines():
              if not line.strip():
                  continue
              k,v=line.split("=",1)
              if k=="attempt":
                  v=attempt
              elif k=="retry_count":
                  v=retry
              rows.append((k,v))
              seen.add(k)
          if "attempt" not in seen:
              rows.append(("attempt", attempt))
          if "retry_count" not in seen:
              rows.append(("retry_count", retry))
          Path(sys.argv[2]).write_text(
              "".join(f"{k}={v}\n" for k,v in rows),
              encoding="utf-8",
          )
          PY
            encoded="$(base64 -w0 "$RUNNER_TEMP/next.request")"
            if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message="control(sts1): continue Strategy-only loop" \
              -f content="$encoded" \
              -f sha="$sha" \
              -f branch="$GITHUB_REF_NAME" >/dev/null 2>"$RUNNER_TEMP/control-put.err"; then
              updated=1
              echo "STRATEGY_CONTROL_UPDATED try=$control_try"
              break
            fi
            echo "STRATEGY_CONTROL_CONFLICT try=$control_try"
            cat "$RUNNER_TEMP/control-put.err"
            sleep "$control_try"
          done

          if [ "$updated" -ne 1 ]; then
            echo "STRATEGY_CONTROL_UPDATE_FAILED_AFTER_RETRIES"
            exit 1
          fi

          dispatched=0
          for dispatch_try in 1 2 3; do
            if gh workflow run sts1-armg-strategy-loop.yml --ref "$GITHUB_REF_NAME"; then
              dispatched=1
              echo "STRATEGY_AUTO_LOOP_DISPATCHED try=$dispatch_try"
              break
            fi
            sleep "$dispatch_try"
          done
          if [ "$dispatched" -ne 1 ]; then
            echo "STRATEGY_NEXT_DISPATCH_FAILED"
            exit 1
          fi
          echo "STRATEGY_AUTO_LOOP_CONTINUED"
