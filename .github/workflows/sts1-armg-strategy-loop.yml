name: STS1 Strategy Parallel CPU v4 Auto Loop

on:
  push:
    branches:
      - gpt/sts1-strategy-parallel-cpu-v4-20260928
    paths:
      - '.github/workflows/sts1-armg-strategy-loop.yml'
      - 'src/roguelike_ai/sts1_phase3/armg_strategy_evolve.py'
      - 'scripts/sts1/sts1_armg_strategy_loop.py'
      - 'tests/test_sts1_armg_strategy_evolve.py'
      - 'tests/test_sts1_strategy_data_efficiency_v2.py'
      - 'tests/test_sts1_strategy_elite_mining_v3.py'
      - 'tests/test_sts1_strategy_parallel_cpu_v4.py'
      - 'scripts/sts1/sts1_strategy_state_validate.py'
      - 'tests/test_sts1_strategy_state_validate.py'
      - 'control/sts1-armg-strategy-loop.start'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sts1-strategy-parallel-cpu-v4-auto-loop
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  GH_TOKEN: ${{ github.token }}
  SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'
  STATE_ARTIFACT: 'sts1-armg-strategy-loop-state-v4'
  BOOTSTRAP_STATE_ARTIFACT: 'sts1-armg-strategy-loop-state-v3'
  BOOTSTRAP_ELITE_REPORT_ARTIFACT: 'sts1-armg-strategy-loop-report-36415222490'
  BOOTSTRAP_ELITE_EXPECTED_SHA: 'ea6d7bfa59f3bd4ac3c11dd2d4ebf236182a38acaed3fa720f0b81744cc0e4e5'
  BOOTSTRAP_ELITE_PARENT_SHA: 'fc4bb1e64ea3ee4aec2245445a01172afb35f872b7b9c90a2b6000430f4c67cb'
  BOOTSTRAP_ELITE_RUN: '36415222490'

jobs:
  contract-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' numpy torch==2.11.0

      - name: Compile Strategy loop
        run: |
          python -m py_compile \
            src/roguelike_ai/sts1_phase3/armg_strategy_evolve.py \
            scripts/sts1/sts1_armg_strategy_loop.py \
            scripts/sts1/sts1_strategy_state_validate.py

      - name: Verify Strategy-only contracts
        run: |
          pytest -q \
            tests/test_sts1_armg_strategy_evolve.py \
            tests/test_sts1_strategy_data_efficiency_v2.py \
            tests/test_sts1_strategy_elite_mining_v3.py \
            tests/test_sts1_strategy_parallel_cpu_v4.py \
            tests/test_sts1_strategy_state_validate.py \
            tests/test_sts1_champion_gate.py

  strategy-round:
    needs: contract-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      enabled: ${{ steps.control.outputs.enabled }}

    steps:
      - uses: actions/checkout@v4

      - name: Load Strategy control
        id: control
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source control/sts1-armg-strategy-loop.request
          set +a
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "STRATEGY_ENABLED=$enabled" >> "$GITHUB_ENV"
          echo "STRATEGY_ATTEMPT=$attempt" >> "$GITHUB_ENV"
          echo "STRATEGY_RETRY_COUNT=$retry_count" >> "$GITHUB_ENV"
          echo "STRATEGY_MAX_RETRIES=$max_retries" >> "$GITHUB_ENV"
          echo "STRATEGY_MAX_ROUNDS=$max_rounds" >> "$GITHUB_ENV"
          effective_training_seeds="$training_seeds"
          effective_eval_workers="$eval_workers"
          effective_branch_points="$max_branch_points_per_game"
          effective_teacher_budget="$teacher_label_budget"
          effective_elite_mining_seeds="$elite_mining_seeds"
          effective_collection_workers="$collection_workers"

          # Automatic load shedding only during retries. A successful round
          # resets retry_count to 0, so the next normal round returns to the
          # configured full workload automatically.
          if [ "$retry_count" -ge 1 ]; then
            effective_collection_workers=1
            effective_eval_workers="$(( eval_workers > 2 ? 2 : eval_workers ))"
            effective_branch_points="$(( max_branch_points_per_game > 18 ? 18 : max_branch_points_per_game ))"
            effective_teacher_budget="$(( teacher_label_budget > 16 ? 16 : teacher_label_budget ))"
            effective_elite_mining_seeds="$(( elite_mining_seeds > 1 ? 1 : elite_mining_seeds ))"
          fi
          if [ "$retry_count" -ge 2 ]; then
            effective_training_seeds=1
            effective_eval_workers=1
            effective_branch_points="$(( max_branch_points_per_game > 10 ? 10 : max_branch_points_per_game ))"
            effective_teacher_budget="$(( teacher_label_budget > 10 ? 10 : teacher_label_budget ))"
            effective_elite_mining_seeds=0
          fi
          if [ "$retry_count" -ge 3 ]; then
            effective_branch_points=6
            effective_teacher_budget=6
          fi

          echo "STRATEGY_TRAINING_SEEDS=$effective_training_seeds" >> "$GITHUB_ENV"
          echo "STRATEGY_MCTS_SIMS=$mcts_sims" >> "$GITHUB_ENV"
          echo "STRATEGY_EVAL_WORKERS=$effective_eval_workers" >> "$GITHUB_ENV"
          echo "STRATEGY_RNG_SEED=$rng_seed" >> "$GITHUB_ENV"
          echo "STRATEGY_MAX_BRANCH_POINTS=$effective_branch_points" >> "$GITHUB_ENV"
          echo "STRATEGY_TEACHER_LABEL_BUDGET=$effective_teacher_budget" >> "$GITHUB_ENV"
          echo "STRATEGY_MIN_LABELS_PER_KIND=$min_labels_per_kind" >> "$GITHUB_ENV"
          echo "STRATEGY_COLLECTION_WORKERS=$effective_collection_workers" >> "$GITHUB_ENV"
          echo "STRATEGY_PARALLEL_TEACHER_TIMEOUT=$parallel_teacher_timeout_seconds" >> "$GITHUB_ENV"
          echo "STRATEGY_PARALLEL_PARITY_PROBES=$parallel_parity_probes" >> "$GITHUB_ENV"
          echo "STRATEGY_ELITE_MINING_SEEDS=$effective_elite_mining_seeds" >> "$GITHUB_ENV"
          echo "STRATEGY_ELITE_EXAMPLES_PER_SEED=$elite_examples_per_seed" >> "$GITHUB_ENV"
          echo "STRATEGY_ELITE_MIN_QUALITY_MARGIN=$elite_min_quality_margin" >> "$GITHUB_ENV"
          echo "STRATEGY_ELITE_MAX_SIGN_P=$elite_max_sign_p" >> "$GITHUB_ENV"
          echo "STRATEGY_ELITE_MIN_WIN_DELTA=$elite_min_win_delta" >> "$GITHUB_ENV"
          echo "STRATEGY_ELITE_MIN_FLOOR_DELTA=$elite_min_floor_delta" >> "$GITHUB_ENV"
          echo "STRATEGY_ELITE_MAX_POOL=$elite_max_pool" >> "$GITHUB_ENV"
          echo "STRATEGY_CONFIGURED_TRAINING_SEEDS=$training_seeds" >> "$GITHUB_ENV"
          echo "STRATEGY_CONFIGURED_EVAL_WORKERS=$eval_workers" >> "$GITHUB_ENV"
          echo "STRATEGY_CONFIGURED_BRANCH_POINTS=$max_branch_points_per_game" >> "$GITHUB_ENV"
          echo "STRATEGY_EFFECTIVE_LOAD retry=$retry_count training_seeds=$effective_training_seeds eval_workers=$effective_eval_workers collection_workers=$effective_collection_workers branch_points=$effective_branch_points teacher_budget=$effective_teacher_budget elite_mining_seeds=$effective_elite_mining_seeds"
          echo "STRATEGY_MAX_BRANCH_PER_KIND=$max_branch_points_per_kind_per_game" >> "$GITHUB_ENV"
          echo "STRATEGY_MAX_CHOICE_BRANCHES=$max_choice_branches" >> "$GITHUB_ENV"
          echo "STRATEGY_EPOCHS=$epochs" >> "$GITHUB_ENV"
          echo "STRATEGY_LR=$learning_rate" >> "$GITHUB_ENV"
          echo "STRATEGY_ANCHOR=$anchor_coef" >> "$GITHUB_ENV"
          echo "STRATEGY_MAX_REPLAY=$max_replay_examples" >> "$GITHUB_ENV"
          echo "STRATEGY_MAX_STAGNATION=$max_stagnation" >> "$GITHUB_ENV"
          echo "STRATEGY_REPORT_ISSUE=$report_issue" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        if: env.STRATEGY_ENABLED == '1'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install and hydrate pinned Strategy runtime
        if: env.STRATEGY_ENABLED == '1'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . numpy torch==2.11.0
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          git -C external/sts_lightspeed/source apply --check "$PWD/patches/sts1/armg_gamecontext_clone.patch"
          git -C external/sts_lightspeed/source apply "$PWD/patches/sts1/armg_gamecontext_clone.patch"
          python scripts/sts1/build_probe.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("external/sts_lightspeed/source/build-probe").resolve()))
          import slaythespire as sts
          gc = sts.GameContext(sts.CharacterClass.IRONCLAD, 123456, 0)
          clone = gc.clone()
          assert clone.seed == gc.seed
          assert clone.floor_num == gc.floor_num
          clone.gold += 7
          assert clone.gold != gc.gold
          print("PASS_STRATEGY_GAMECONTEXT_CLONE")
          PY
          root=".cache/sts1-armg-strategy"
          rm -rf "$root"
          mkdir -p "$root/sim/sts_lightspeed"
          ln -s "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -s "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -s "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
          ln -s "$PWD/external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt" "$root/armG_model_G128x128_15k.pt"

      - name: Restore newest valid Strategy state
        if: env.STRATEGY_ENABLED == '1'
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/strategy-state"
          rm -rf "$state"
          mkdir -p "$state"

          mapfile -t artifact_ids < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$STATE_ARTIFACT&per_page=100" \
              --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[].id'
          )
          if [ "${#artifact_ids[@]}" -eq 0 ]; then
            echo "NO_V4_STATE_BOOTSTRAP_FROM_V3"
            mapfile -t artifact_ids < <(
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$BOOTSTRAP_STATE_ARTIFACT&per_page=100" \
                --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[].id'
            )
          fi

          restored=0
          for artifact_id in "${artifact_ids[@]}"; do
            rm -rf "$RUNNER_TEMP/strategy-candidate"
            mkdir -p "$RUNNER_TEMP/strategy-candidate/raw"
            if ! curl --fail --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -o "$RUNNER_TEMP/strategy-candidate.zip" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"; then
              echo "STRATEGY_STATE_SKIP_DOWNLOAD artifact=$artifact_id"
              continue
            fi
            if ! unzip -q "$RUNNER_TEMP/strategy-candidate.zip" -d "$RUNNER_TEMP/strategy-candidate/raw"; then
              echo "STRATEGY_STATE_SKIP_UNZIP artifact=$artifact_id"
              continue
            fi

            found="$(find "$RUNNER_TEMP/strategy-candidate/raw" -name strategy-state.json -print -quit)"
            weight="$(find "$RUNNER_TEMP/strategy-candidate/raw" -name current-strategy.pt -print -quit)"
            replay="$(find "$RUNNER_TEMP/strategy-candidate/raw" -name strategy-replay.jsonl -print -quit)"
            elite_pool="$(find "$RUNNER_TEMP/strategy-candidate/raw" -name elite-pool.json -print -quit)"
            elite_dir="$(find "$RUNNER_TEMP/strategy-candidate/raw" -type d -name elite-candidates -print -quit)"
            if [ -z "$found" ] || [ -z "$weight" ]; then
              echo "STRATEGY_STATE_SKIP_MISSING_FILES artifact=$artifact_id"
              continue
            fi

            rm -f "$state/strategy-state.json" "$state/current-strategy.pt" "$state/strategy-replay.jsonl" "$state/elite-pool.json"
            rm -rf "$state/elite-candidates"
            cp "$found" "$state/strategy-state.json"
            cp "$weight" "$state/current-strategy.pt"
            [ -z "$replay" ] || cp "$replay" "$state/strategy-replay.jsonl"
            [ -z "$elite_pool" ] || cp "$elite_pool" "$state/elite-pool.json"
            [ -z "$elite_dir" ] || cp -R "$elite_dir" "$state/elite-candidates"

            if python scripts/sts1/sts1_strategy_state_validate.py --state-dir "$state"; then
              echo "STRATEGY_STATE_RESTORED artifact=$artifact_id"
              restored=1
              break
            fi
            echo "STRATEGY_STATE_SKIP_INVALID artifact=$artifact_id"
          done

          if [ "$restored" -eq 0 ]; then
            rm -f "$state/strategy-state.json" "$state/current-strategy.pt" "$state/strategy-replay.jsonl" "$state/elite-pool.json"
            rm -rf "$state/elite-candidates"
            echo "NO_VALID_STRATEGY_STATE_START_FROM_UPSTREAM"
          else
            state_version="$(python - "$state/strategy-state.json" <<'PY'
          import json, sys
          print(int(json.load(open(sys.argv[1], encoding="utf-8")).get("data_efficiency_version", 1)))
          PY
          )"
            if [ "$state_version" -lt 3 ] && [ ! -f "$state/elite-pool.json" ]; then
              echo "BOOTSTRAP_HISTORICAL_ELITE run=$BOOTSTRAP_ELITE_RUN"
              elite_artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BOOTSTRAP_ELITE_RUN/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("sts1-armg-strategy-loop-report-")) | .id' | head -n1)"
              if [ -n "$elite_artifact_id" ]; then
                rm -rf "$RUNNER_TEMP/historical-elite"
                mkdir -p "$RUNNER_TEMP/historical-elite/raw"
                curl --fail --location                   -H "Authorization: Bearer $GH_TOKEN"                   -H "Accept: application/vnd.github+json"                   -o "$RUNNER_TEMP/historical-elite.zip"                   "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$elite_artifact_id/zip"
                unzip -q "$RUNNER_TEMP/historical-elite.zip" -d "$RUNNER_TEMP/historical-elite/raw"
                elite_report="$(find "$RUNNER_TEMP/historical-elite/raw" -name round-report.json -print -quit)"
                elite_weight="$(find "$RUNNER_TEMP/historical-elite/raw" -name candidate-strategy.pt -print -quit)"
                if [ -n "$elite_report" ] && [ -n "$elite_weight" ]; then
                  python - "$state" "$elite_report" "$elite_weight" <<'PY'
          import hashlib, json, shutil, sys
          from pathlib import Path
          state=Path(sys.argv[1]); report=json.load(open(sys.argv[2], encoding="utf-8")); src=Path(sys.argv[3])
          state_payload=json.load(open(state/"strategy-state.json", encoding="utf-8"))
          parent=str(report.get("current_strategy_sha_before",""))
          current=str(state_payload.get("current_strategy_sha256",""))
          fresh=report.get("fresh_gate") or {}
          paired=fresh.get("paired") or {}
          compatible=(parent == current and fresh.get("win_delta",0) >= 1 and paired.get("candidate_better",0) > paired.get("candidate_worse",0))
          if not compatible:
              print("HISTORICAL_ELITE_SKIPPED_INCOMPATIBLE", parent, current)
              raise SystemExit(0)
          sha=hashlib.sha256(src.read_bytes()).hexdigest()
          expected=str(report.get("candidate_strategy_sha256",""))
          if expected and sha != expected:
              raise RuntimeError("historical Elite candidate SHA mismatch")
          d=state/"elite-candidates"; d.mkdir(parents=True, exist_ok=True)
          rel=f"elite-candidates/elite-round-{int(report.get('round',0)):04d}-{sha[:12]}.pt"
          shutil.copy2(src, state/rel)
          metrics={
              "eligible": True,
              "reason": "historical_near_miss_elite",
              "win_delta": int(fresh.get("win_delta",0)),
              "floor_delta": fresh.get("floor_delta"),
              "candidate_better": int(paired.get("candidate_better",0)),
              "candidate_worse": int(paired.get("candidate_worse",0)),
              "one_sided_sign_p": paired.get("one_sided_sign_p"),
          }
          payload={
              "schema_version":"sts1-strategy-elite-pool-v1",
              "entries":[{
                  "round":int(report.get("round",0)),
                  "sha256":sha,
                  "weight_file":rel,
                  "parent_champion_sha256":parent,
                  "metrics":metrics,
              }],
          }
          (state/"elite-pool.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("HISTORICAL_ELITE_BOOTSTRAPPED", sha, metrics)
          PY
                fi
              fi
            fi
          fi
          echo "STRATEGY_STATE_DIR=$state" >> "$GITHUB_ENV"

      - name: Bootstrap verified historical Elite Candidate
        if: env.STRATEGY_ENABLED == '1'
        run: |
          set -euo pipefail
          state="$STRATEGY_STATE_DIR"

          # Only seed the pool once. Never overwrite a durable v3 Elite pool.
          if [ -f "$state/elite-pool.json" ] &&              [ "$(python - "$state/elite-pool.json" <<'PY'
          import json, sys
          p=json.load(open(sys.argv[1], encoding="utf-8"))
          print(len(p.get("entries", [])))
          PY
          )" -gt 0 ]; then
            echo "ELITE_BOOTSTRAP_SKIPPED pool_already_populated"
            exit 0
          fi

          current_sha="$(sha256sum "$state/current-strategy.pt" | awk '{print $1}')"
          if [ "$current_sha" != "$BOOTSTRAP_ELITE_PARENT_SHA" ]; then
            echo "ELITE_BOOTSTRAP_SKIPPED champion_changed current=$current_sha"
            exit 0
          fi

          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$BOOTSTRAP_ELITE_REPORT_ARTIFACT&per_page=20"             --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "$artifact_id"
          rm -rf "$RUNNER_TEMP/elite-bootstrap"
          mkdir -p "$RUNNER_TEMP/elite-bootstrap"
          curl --fail --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -o "$RUNNER_TEMP/elite-bootstrap.zip"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
          unzip -q "$RUNNER_TEMP/elite-bootstrap.zip" -d "$RUNNER_TEMP/elite-bootstrap"

          candidate="$(find "$RUNNER_TEMP/elite-bootstrap" -path '*/round-0007/candidate-strategy.pt' -print -quit)"
          report="$(find "$RUNNER_TEMP/elite-bootstrap" -path '*/round-0007/round-report.json' -print -quit)"
          test -n "$candidate"
          test -n "$report"

          candidate_sha="$(sha256sum "$candidate" | awk '{print $1}')"
          test "$candidate_sha" = "$BOOTSTRAP_ELITE_EXPECTED_SHA"

          mkdir -p "$state/elite-candidates"
          target_rel="elite-candidates/elite-round-0007-${candidate_sha:0:12}.pt"
          cp "$candidate" "$state/$target_rel"

          python - "$report" "$state/elite-pool.json" "$target_rel" "$candidate_sha" "$current_sha" <<'PY'
          import json, sys
          from pathlib import Path

          report=json.load(open(sys.argv[1], encoding="utf-8"))
          fresh=report["fresh_gate"]
          assert report["round"] == 7
          assert report["dev_gate"]["status"] == "PASS"
          assert report["hidden_gate"]["status"] == "PASS"
          assert fresh["status"] == "ROLLBACK"
          assert fresh["win_delta"] >= 1
          assert fresh["floor_delta"] >= -0.5
          assert fresh["paired"]["candidate_better"] > fresh["paired"]["candidate_worse"]
          assert fresh["paired"]["one_sided_sign_p"] <= 0.25
          assert set(fresh.get("reasons", [])) <= {"paired_superiority_not_strong_enough"}
          for side in ("current","candidate"):
              assert fresh[side]["complete_runs"] == 100
              assert all(v == 0 for v in fresh[side]["safety"].values())
              assert fresh[side]["pure_mcts_runs"] == 100

          metrics={
              "eligible": True,
              "reason": "near_miss_elite_historical_bootstrap",
              "win_delta": fresh["win_delta"],
              "floor_delta": fresh["floor_delta"],
              "candidate_better": fresh["paired"]["candidate_better"],
              "candidate_worse": fresh["paired"]["candidate_worse"],
              "one_sided_sign_p": fresh["paired"]["one_sided_sign_p"],
              "max_sign_p": 0.25,
              "min_win_delta": 1,
              "min_floor_delta": -0.5,
          }
          payload={
              "schema_version":"sts1-strategy-elite-pool-v1",
              "entries":[{
                  "round":7,
                  "sha256":sys.argv[4],
                  "weight_file":sys.argv[3],
                  "parent_champion_sha256":sys.argv[5],
                  "metrics":metrics,
              }],
          }
          Path(sys.argv[2]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("PASS_BOOTSTRAP_HISTORICAL_ELITE", json.dumps(metrics, sort_keys=True))
          PY

          python scripts/sts1/sts1_strategy_state_validate.py --state-dir "$state"

      - name: Run one real Strategy-only round
        if: env.STRATEGY_ENABLED == '1'
        run: |
          set -euo pipefail
          python scripts/sts1/sts1_armg_strategy_loop.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-armg-strategy             --armg-base-weight .cache/sts1-armg-strategy/armG_model_G128x128_15k.pt             --dev-seed-file external/sts-rl-agent/source/eval/eval_seeds_50.txt             --state-dir "$STRATEGY_STATE_DIR"             --output-dir evidence/sts1/strategy-loop/runs             --rounds 1             --training-seeds "$STRATEGY_TRAINING_SEEDS"             --combat-mcts-sims "$STRATEGY_MCTS_SIMS"             --eval-workers "$STRATEGY_EVAL_WORKERS"             --rng-seed "$STRATEGY_RNG_SEED"             --max-branch-points-per-game "$STRATEGY_MAX_BRANCH_POINTS"             --max-branch-points-per-kind-per-game "$STRATEGY_MAX_BRANCH_PER_KIND"             --max-choice-branches "$STRATEGY_MAX_CHOICE_BRANCHES"             --teacher-label-budget "$STRATEGY_TEACHER_LABEL_BUDGET"             --min-labels-per-kind "$STRATEGY_MIN_LABELS_PER_KIND"             --collection-workers "$STRATEGY_COLLECTION_WORKERS"             --parallel-teacher-timeout-seconds "$STRATEGY_PARALLEL_TEACHER_TIMEOUT"             --parallel-parity-probes "$STRATEGY_PARALLEL_PARITY_PROBES"             --epochs "$STRATEGY_EPOCHS"             --learning-rate "$STRATEGY_LR"             --anchor-coef "$STRATEGY_ANCHOR"             --max-replay-examples "$STRATEGY_MAX_REPLAY"             --max-stagnation "$STRATEGY_MAX_STAGNATION"             --elite-mining-seeds "$STRATEGY_ELITE_MINING_SEEDS"             --elite-examples-per-seed "$STRATEGY_ELITE_EXAMPLES_PER_SEED"             --elite-min-quality-margin "$STRATEGY_ELITE_MIN_QUALITY_MARGIN"             --elite-max-sign-p "$STRATEGY_ELITE_MAX_SIGN_P"             --elite-min-win-delta "$STRATEGY_ELITE_MIN_WIN_DELTA"             --elite-min-floor-delta "$STRATEGY_ELITE_MIN_FLOOR_DELTA"             --elite-max-pool "$STRATEGY_ELITE_MAX_POOL"

      - name: Verify Strategy-only invariants
        if: env.STRATEGY_ENABLED == '1'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/sts1/strategy-loop/runs/loop-summary.json")
          s=json.loads(p.read_text())
          assert s["result"] == "PASS_STRATEGY_LOOP_COMPLETE"
          assert s["combat_training_enabled"] is False
          assert s["production_champion_replaced"] is False
          assert s["data_efficiency_version"] == 5
          assert s["parallel_cpu_version"] == 1
          assert s["collection_workers"] == int(__import__("os").environ["STRATEGY_COLLECTION_WORKERS"])
          assert s["combat_policy"] == f"mcts_{int(__import__('os').environ['STRATEGY_MCTS_SIMS'])}"
          round_reports=sorted(Path("evidence/sts1/strategy-loop/runs").glob("round-*/round-report.json"))
          assert round_reports, "Strategy v4 must emit at least one round report"
          latest=json.loads(round_reports[-1].read_text())
          pool=latest.get("candidate_pool") or []
          assert len(pool) == 3, pool
          assert sum(bool(row.get("selected")) for row in pool) == 1, pool
          selected=next(row for row in pool if row.get("selected"))
          assert float(selected["step_scale"]) in {0.25, 0.5, 1.0}
          assert selected["recipe"] in {"balanced", "confident", "strict"}
          training=latest.get("training") or {}
          assert training.get("selected_recipe") == selected["recipe"]
          assert float(training.get("parent_distill_coef", 0.0)) > 0.0
          assert 0.0 <= float(training.get("mean_teacher_mix", -1.0)) <= 1.0
          assert selected["candidate_strategy_sha256"] == latest["candidate_strategy_sha256"]
          replay=latest.get("replay") or {}
          assert 0.0 < float(replay.get("shop_max_fraction", 0.0)) <= 0.25
          assert float(replay.get("mean_confidence_weight", 0.0)) > 0.0
          assert Path(__import__('os').environ["STRATEGY_STATE_DIR"], "current-strategy.pt").is_file()
          assert Path(__import__('os').environ["STRATEGY_STATE_DIR"], "strategy-state.json").is_file()
          print("PASS_STRATEGY_ONLY_INVARIANTS", s["combat_policy"], s["generation"])
          PY
          python scripts/sts1/sts1_strategy_state_validate.py \
            --state-dir "$STRATEGY_STATE_DIR"

      - name: Upload durable Strategy state
        if: env.STRATEGY_ENABLED == '1' && success()
        uses: actions/upload-artifact@v4
        with:
          name: sts1-armg-strategy-loop-state-v4
          path: |
            ${{ runner.temp }}/strategy-state/strategy-state.json
            ${{ runner.temp }}/strategy-state/current-strategy.pt
            ${{ runner.temp }}/strategy-state/strategy-replay.jsonl
            ${{ runner.temp }}/strategy-state/elite-pool.json
            ${{ runner.temp }}/strategy-state/elite-candidates/
          if-no-files-found: error
          retention-days: 90

      - name: Upload Strategy evidence
        if: env.STRATEGY_ENABLED == '1' && always()
        uses: actions/upload-artifact@v4
        with:
          name: sts1-armg-strategy-loop-report-${{ github.run_id }}
          path: evidence/sts1/strategy-loop/
          if-no-files-found: warn
          retention-days: 90

  supervisor:
    if: always() && needs.strategy-round.outputs.enabled == '1'
    needs: [contract-tests, strategy-round]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Continue, retry, or pause Strategy loop
        env:
          CONTRACT_RESULT: ${{ needs.contract-tests.result }}
          ROUND_RESULT: ${{ needs.strategy-round.result }}
        run: |
          set -euo pipefail
          set -a
          source control/sts1-armg-strategy-loop.request
          set +a

          run_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          next_attempt="$((attempt + 1))"
          continue_loop=0
          next_retry="$retry_count"
          next_collection_workers="$collection_workers"
          summary_text=""

          if [ "$CONTRACT_RESULT" = "success" ] && [ "$ROUND_RESULT" = "success" ]; then
            artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="sts1-armg-strategy-loop-state-v4") | .id' | head -n1)"
            report_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name | startswith("sts1-armg-strategy-loop-report-")) | .id' | head -n1)"
            test -n "$artifact_id"
            test -n "$report_id"

            curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"               -o "$RUNNER_TEMP/state.zip"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
            mkdir -p "$RUNNER_TEMP/state"
            unzip -q "$RUNNER_TEMP/state.zip" -d "$RUNNER_TEMP/state"
            state_file="$(find "$RUNNER_TEMP/state" -name strategy-state.json -print -quit)"

            curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"               -o "$RUNNER_TEMP/report.zip"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$report_id/zip"
            mkdir -p "$RUNNER_TEMP/report"
            unzip -q "$RUNNER_TEMP/report.zip" -d "$RUNNER_TEMP/report"
            summary_file="$(find "$RUNNER_TEMP/report" -name loop-summary.json -print -quit)"
            round_report_file="$(find "$RUNNER_TEMP/report" -name round-report.json | sort | tail -n1)"
            test -n "$summary_file"
            test -n "$round_report_file"

            eval "$(python - "$state_file" "$summary_file" "$round_report_file" <<'PY'
          import json, shlex, sys
          state=json.load(open(sys.argv[1], encoding="utf-8"))
          summary=json.load(open(sys.argv[2], encoding="utf-8"))
          report=json.load(open(sys.argv[3], encoding="utf-8"))
          dataset=report.get("dataset") or {}
          kinds=dataset.get("examples_by_kind") or {}
          values={
              "ROUND": int(state.get("accepted_rounds",0))+int(state.get("rejected_rounds",0)),
              "GEN": state.get("generation",0),
              "ACCEPTED": state.get("accepted_rounds",0),
              "REJECTED": state.get("rejected_rounds",0),
              "STAG": state.get("stagnation_count",0),
              "PAUSED": str(bool(summary.get("paused_for_stagnation",False))).lower(),
              "SHA": state.get("current_strategy_sha256","unknown"),
              "COMBAT": summary.get("combat_policy","unknown"),
              "REPLAY": (summary.get("replay") or {}).get("examples",0),
              "DEV_GATE": (report.get("dev_gate") or {}).get("status","unknown"),
              "HIDDEN_GATE": (report.get("hidden_gate") or {}).get("status","unknown"),
              "FRESH_GATE": (report.get("fresh_gate") or {}).get("status","unknown"),
              "PROMOTION": (report.get("promotion") or {}).get("decision","unknown"),
              "POOL": dataset.get("candidate_pool_count",0),
              "EXAMPLES": dataset.get("example_count",0),
              "MISTAKES": dataset.get("mistake_examples",0),
              "HIGH_UNCERTAINTY": dataset.get("high_uncertainty_examples",0),
              "BUCKETS": dataset.get("unique_state_buckets",0),
              "KINDS": ",".join(f"{k}:{kinds[k]}" for k in sorted(kinds)) or "none",
              "ELITE_ELIGIBLE": str(bool((report.get("elite_decision") or {}).get("eligible",False))).lower(),
              "ELITE_POOL": (report.get("elite_pool") or {}).get("entries",0),
              "ELITE_MINED": (report.get("elite_mining") or {}).get("verified_examples",0),
              "COLLECTION_WORKERS": ((report.get("dataset") or {}).get("parallel_teacher") or {}).get("effective_workers",1),
              "COLLECTION_MODE": ((report.get("dataset") or {}).get("parallel_teacher") or {}).get("mode","unknown"),
              "COLLECTION_SECONDS": round(float(((report.get("dataset") or {}).get("parallel_teacher") or {}).get("elapsed_seconds",0.0)),1),
              "PARALLEL_SECONDS": round(float(((report.get("dataset") or {}).get("parallel_teacher") or {}).get("parallel_elapsed_seconds",0.0) or 0.0),1),
              "PARITY_SECONDS": round(float(((report.get("dataset") or {}).get("parallel_teacher") or {}).get("parity_elapsed_seconds",0.0) or 0.0),1),
              "PARALLELISM": round(float(((report.get("dataset") or {}).get("parallel_teacher") or {}).get("observed_parallelism",1.0) or 1.0),2),
              "CPU_CORES": round(float(((report.get("dataset") or {}).get("parallel_teacher") or {}).get("observed_cpu_cores",1.0) or 1.0),2),
              "PROBE_SPEEDUP": round(float(((report.get("dataset") or {}).get("parallel_teacher") or {}).get("parity_probe_speedup",0.0) or 0.0),2),
              "COLLECTION_FALLBACK": str(((report.get("dataset") or {}).get("parallel_teacher") or {}).get("fallback_reason") or "none"),
              "COLLECTION_PARALLELISM": round(float(((report.get("dataset") or {}).get("parallel_teacher") or {}).get("observed_parallelism",1.0)),2),
              "COLLECTION_PARITY": ((report.get("dataset") or {}).get("parallel_teacher") or {}).get("parity_status","unknown"),
              "SELECTED_STEP": (report.get("training") or {}).get("selected_step_scale","unknown"),
              "SELECTED_RECIPE": (report.get("training") or {}).get("selected_recipe","unknown"),
              "MEAN_TEACHER_MIX": round(float((report.get("training") or {}).get("mean_teacher_mix",0.0) or 0.0),3),
              "SHOP_DROPPED": (report.get("replay") or {}).get("dropped_shop_examples",0),
              "SHOP_MAX_FRACTION": (report.get("replay") or {}).get("shop_max_fraction","unknown"),
              "MEAN_CONFIDENCE": round(float((report.get("replay") or {}).get("mean_confidence_weight",0.0) or 0.0),3),
          }
          for k,v in values.items():
              print(f"{k}={shlex.quote(str(v))}")
          PY
          )"

            next_retry=0
            if [ "$COLLECTION_FALLBACK" != "none" ] && [ "$collection_workers" -gt 3 ]; then
              next_collection_workers=3
              echo "STRATEGY_COLLECTION_AUTO_DOWNSHIFT from=$collection_workers to=3 fallback=$COLLECTION_FALLBACK"
            fi
            if [ "$PAUSED" != "true" ]; then
              if [ "$max_rounds" -eq 0 ] || [ "$ROUND" -lt "$max_rounds" ]; then
                continue_loop=1
              fi
            fi

            printf -v body '@ericpeng0604-coder\n\n## Strategy-only Loop — Round %s\n\n- Run：%s\n- Combat：**%s（固定 pure MCTS）**\n- Gate：Dev **%s** → Hidden **%s** → Fresh **%s**\n- Promotion：**%s**\n- 候選池：%s → Teacher labels：%s（mistakes：%s，高不確定：%s）\n- Unique state buckets：%s\n- Decision kinds：%s\n- Elite eligible：%s｜Elite pool：%s｜本輪驗證回灌：%s\n- Teacher CPU：%s workers｜%s｜%ss｜parallelism=%sx｜parity=%s｜fallback=%s\n- Strategy generation：%s\n- Accepted / Rejected：%s / %s\n- Stagnation：%s / %s\n- Replay examples：%s\n- v5 Candidate：**%s / step %s**｜Teacher mix：%s｜Shop dropped：%s｜Shop cap：%s｜Mean confidence：%s\n- Strategy SHA：`%s`\n- 正式 Champion：**未修改**\n- 下一輪：**%s**'               "$ROUND" "$run_url" "$COMBAT" "$DEV_GATE" "$HIDDEN_GATE" "$FRESH_GATE" "$PROMOTION" "$POOL" "$EXAMPLES" "$MISTAKES" "$HIGH_UNCERTAINTY" "$BUCKETS" "$KINDS" "$ELITE_ELIGIBLE" "$ELITE_POOL" "$ELITE_MINED" "$COLLECTION_WORKERS" "$COLLECTION_MODE" "$COLLECTION_SECONDS" "$COLLECTION_PARALLELISM" "$COLLECTION_PARITY" "$COLLECTION_FALLBACK" "$GEN" "$ACCEPTED" "$REJECTED" "$STAG" "$max_stagnation" "$REPLAY" "$SELECTED_RECIPE" "$SELECTED_STEP" "$MEAN_TEACHER_MIX" "$SHOP_DROPPED" "$SHOP_MAX_FRACTION" "$MEAN_CONFIDENCE" "$SHA"               "$([ "$continue_loop" -eq 1 ] && echo CONTINUE || echo PAUSE)"
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$report_issue/comments" -f body="$body" >/dev/null
          else
            next_retry="$((retry_count + 1))"
            if [ "$next_retry" -le "$max_retries" ]; then
              continue_loop=1
            fi
            printf -v body '@ericpeng0604-coder\n\n## Strategy-only Loop — execution failure\n\n- Run：%s\n- Contract：%s\n- Strategy round：%s\n- Retry：%s / %s\n- 正式 Champion：**未修改**'               "$run_url" "$CONTRACT_RESULT" "$ROUND_RESULT" "$next_retry" "$max_retries"
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$report_issue/comments" -f body="$body" >/dev/null
          fi

          if [ "$continue_loop" -ne 1 ]; then
            echo "STRATEGY_LOOP_PAUSED"
            exit 0
          fi

          path="control/sts1-armg-strategy-loop.request"
          updated=0
          for control_try in 1 2 3 4 5; do
            meta="$RUNNER_TEMP/control-meta.json"
            gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$GITHUB_REF_NAME" > "$meta"
            sha="$(python - "$meta" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["sha"])
          PY
          )"
            python - "$meta" "$RUNNER_TEMP/current.request" "$RUNNER_TEMP/next.request" "$next_attempt" "$next_retry" "$next_collection_workers" <<'PY'
          import base64, json, sys
          from pathlib import Path
          meta=json.load(open(sys.argv[1], encoding="utf-8"))
          raw=base64.b64decode(meta["content"]).decode("utf-8")
          Path(sys.argv[2]).write_text(raw, encoding="utf-8")
          attempt=sys.argv[4]
          retry=sys.argv[5]
          collection_workers=sys.argv[6]
          rows=[]
          seen=set()
          for line in raw.splitlines():
              if not line.strip():
                  continue
              k,v=line.split("=",1)
              if k=="attempt":
                  v=attempt
              elif k=="retry_count":
                  v=retry
              elif k=="collection_workers":
                  v=collection_workers
              rows.append((k,v))
              seen.add(k)
          if "attempt" not in seen:
              rows.append(("attempt", attempt))
          if "retry_count" not in seen:
              rows.append(("retry_count", retry))
          if "collection_workers" not in seen:
              rows.append(("collection_workers", collection_workers))
          Path(sys.argv[3]).write_text(
              "".join(f"{k}={v}\n" for k,v in rows),
              encoding="utf-8",
          )
          PY
            if cmp -s "$RUNNER_TEMP/current.request" "$RUNNER_TEMP/next.request"; then
              updated=1
              echo "STRATEGY_CONTROL_ALREADY_CURRENT try=$control_try"
              break
            fi
            encoded="$(base64 -w0 "$RUNNER_TEMP/next.request")"
            if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message="control(sts1): continue Strategy-only loop" \
              -f content="$encoded" \
              -f sha="$sha" \
              -f branch="$GITHUB_REF_NAME" >/dev/null 2>"$RUNNER_TEMP/control-put.err"; then
              updated=1
              echo "STRATEGY_CONTROL_UPDATED try=$control_try"
              break
            fi
            echo "STRATEGY_CONTROL_CONFLICT try=$control_try"
            cat "$RUNNER_TEMP/control-put.err"
            sleep "$control_try"
          done

          if [ "$updated" -ne 1 ]; then
            echo "STRATEGY_CONTROL_UPDATE_FAILED_AFTER_RETRIES"
            exit 1
          fi

          dispatched=0
          for dispatch_try in 1 2 3; do
            if gh workflow run sts1-armg-strategy-loop.yml --ref "$GITHUB_REF_NAME"; then
              dispatched=1
              echo "STRATEGY_AUTO_LOOP_DISPATCHED try=$dispatch_try"
              break
            fi
            sleep "$dispatch_try"
          done
          if [ "$dispatched" -ne 1 ]; then
            echo "STRATEGY_NEXT_DISPATCH_FAILED"
            exit 1
          fi
          echo "STRATEGY_AUTO_LOOP_CONTINUED"
