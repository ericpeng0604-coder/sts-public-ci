name: STS1 ArmG v3 Paired AB
on:
  push:
    branches: [gpt/sts1-teacher-a0-50-20260926]
    paths: ['control/sts1-armg-v3-ab.request']
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env: {GH_TOKEN: "${{ github.token }}", SIM_HEAD: "7476a81954020087da31d41d16fddf475746ec2d"}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.12'}
    - name: Install and hydrate
      run: |
        pip install -e . numpy torch==2.11.0
        python scripts/sts1/hydrate_jialeiv_baseline_v0.py
        test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
        python scripts/sts1/build_probe.py
        root=.cache/sts1-armg; mkdir -p "$root/sim/sts_lightspeed"
        ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
        ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
        ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
        ln -sf "$PWD/external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt" "$root/armG_model_G128x128_15k.pt"
    - name: Download v3
      run: |
        curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o "$RUNNER_TEMP/v3.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/10907910016/zip"
        mkdir "$RUNNER_TEMP/v3"; unzip -q "$RUNNER_TEMP/v3.zip" -d "$RUNNER_TEMP/v3"
        V3=$(find "$RUNNER_TEMP/v3" -name armg_model_v3_candidate.pt -print -quit); test -n "$V3"; echo "V3_WEIGHT=$V3" >> "$GITHUB_ENV"
    - name: Run 50 fresh paired seeds
      run: |
        set -a; source control/sts1-armg-v3-ab.request; set +a
        python scripts/sts1/sts1_armg_v3_ab.py --module-dir external/sts_lightspeed/source/build-probe --armg-root .cache/sts1-armg --v1-weight .cache/sts1-armg/armG_model_G128x128_15k.pt --v3-weight "$V3_WEIGHT" --formal-seed-file external/sts-rl-agent/source/eval/eval_seeds_50.txt --output-dir evidence/sts1/armg-v3-ab --seed-count "$seed_count" --rng-seed "$rng_seed" --mcts-sims 2000
    - uses: actions/upload-artifact@v4
      if: always()
      with: {name: "sts1-armg-v3-ab-${{ github.run_id }}", path: "evidence/sts1/armg-v3-ab/", retention-days: 90}
