name: STS1 ArmG v3 End To End
on:
  push:
    branches: [gpt/sts1-teacher-a0-50-20260926]
    paths: ['control/sts1-armg-v3.request']
  workflow_dispatch:
permissions: {contents: read, actions: write}
jobs:
  v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env: {GH_TOKEN: "${{ github.token }}", SIM_HEAD: "7476a81954020087da31d41d16fddf475746ec2d"}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.12'}
    - name: Install and hydrate
      run: |
        pip install -e . numpy torch==2.11.0
        python scripts/sts1/hydrate_jialeiv_baseline_v0.py
        test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
        python scripts/sts1/build_probe.py
        root=.cache/sts1-armg; mkdir -p "$root/sim/sts_lightspeed"
        ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
        ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
        ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
        ln -sf "$PWD/external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt" "$root/armG_model_G128x128_15k.pt"
    - name: Recover recent exact-v3 mining evidence
      run: |
        mkdir -p "$RUNNER_TEMP/z" evidence/sts1/v3-data
        gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --paginate --jq '.artifacts[]|select(.expired==false)|select(.name|startswith("sts1-teacher-winner-mining-"))|.id' | head -80 > "$RUNNER_TEMP/ids"
        i=0; while read id; do curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o "$RUNNER_TEMP/z/$i.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" || true; i=$((i+1)); done < "$RUNNER_TEMP/ids"
        for z in "$RUNNER_TEMP/z/"*.zip; do unzip -oq "$z" -d evidence/sts1/v3-data || true; done
        n=$(grep -RIl '"type": "armg_noncombat_decision_v3"\|"type":"armg_noncombat_decision_v3"' evidence/sts1/v3-data | wc -l); echo "exact_v3_files=$n"; test "$n" -ge 20
    - name: Train weighted v3
      run: |
        python scripts/sts1/sts1_armg_v3_contrastive_train.py --evidence evidence/sts1/v3-data --armg-root .cache/sts1-armg --base-weight .cache/sts1-armg/armG_model_G128x128_15k.pt --output evidence/sts1/armg-v3/armg_model_v3_candidate.pt --win-weight 2.0 --near-win-weight 0.5 --near-win-floor 45
    - name: Validate load
      run: |
        python - <<'PY'
        import sys,torch
        sys.path[:0]=["external/sts_lightspeed/source/build-probe",".cache/sts1-armg"]
        import armG_train as m
        n=m.Scorer((128,128));n.load_state_dict(torch.load("evidence/sts1/armg-v3/armg_model_v3_candidate.pt",weights_only=True));print("v3_load=PASS")
        PY
    - uses: actions/upload-artifact@v4
      with: {name: "sts1-armg-v3-${{ github.run_id }}", path: "evidence/sts1/armg-v3/", retention-days: 90}
    - name: Start same-50 paired exam
      run: gh workflow run sts1-armg-v3-ab.yml --ref gpt/sts1-teacher-a0-50-20260926
