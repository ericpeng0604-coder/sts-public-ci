name: STS1 Build Rescue v2.3 Regression Preservation

on:
  push:
    branches:
      - gpt/sts1-build-rescue-v22-antiforget-20260930
    paths:
      - control/sts1-build-rescue-v23-preservation.trigger
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  V21_DATASET_RUN_ID: '36699995040'
  V21_DATASET_ARTIFACT: 'v21-verified-36699995040'
  V23_TRACE_RUN_ID: '36722951474'
  V23_TRACE_ARTIFACT: 'sts1-v23-regression-trace-36722951474'
  G7_STATE_ARTIFACT_ID: '11079234863'
  G7_WEIGHT_SHA256: '8313c99d9b0ab0c0d206fdd2f744fed11f4104d440dcb465cf7c78a517f9ccd0'
  SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'

concurrency:
  group: sts1-build-rescue-v23-preservation
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate v2.3 trainer contracts
        run: |
          set -euo pipefail
          python -m pip install -q numpy
          python -m py_compile             scripts/sts1/sts1_build_rescue_bc_v23.py             scripts/sts1/sts1_build_rescue_gate_v21.py
          python - <<'PY'
          from pathlib import Path
          p=Path("scripts/sts1/sts1_build_rescue_bc_v23.py").read_text()
          required=[
              "PRESERVATION_SCHEMA",
              "_load_preservation",
              "_eval_preservation",
              "preservation-replay",
              "preservation-coef",
              "preservation_top1",
              "V23_REGRESSION_PRESERVATION_PASS",
          ]
          missing=[x for x in required if x not in p]
          if missing:
              raise SystemExit(f"missing v2.3 preservation contract: {missing}")
          print("V23_PRESERVATION_CONTRACT_PASS")
          PY

  experiment:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download frozen v2.1 Rescue dataset
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V21_DATASET_ARTIFACT }}
          path: evidence/sts1/v21-verified
          github-token: ${{ github.token }}
          run-id: ${{ env.V21_DATASET_RUN_ID }}

      - name: Download frozen v2.3 regression anchors
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V23_TRACE_ARTIFACT }}
          path: evidence/sts1/v23-trace
          github-token: ${{ github.token }}
          run-id: ${{ env.V23_TRACE_RUN_ID }}

      - name: Install, hydrate, and build pinned simulator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . numpy
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-v23
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"

      - name: Download and verify frozen G7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -o "$RUNNER_TEMP/g7.zip"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$G7_STATE_ARTIFACT_ID/zip"
          mkdir -p "$RUNNER_TEMP/g7"
          unzip -q "$RUNNER_TEMP/g7.zip" -d "$RUNNER_TEMP/g7"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          elite="$(find "$RUNNER_TEMP/g7" -name elite-replay.npz -print -quit)"
          test -n "$parent"
          test -n "$elite"
          test "$(sha256sum "$parent" | awk '{print $1}')" = "$G7_WEIGHT_SHA256"

      - name: Validate immutable training evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          d=json.loads(Path("evidence/sts1/v21-verified/summary.json").read_text())
          complete=int(d.get("complete_build_limited_seeds",d.get("complete_seeds",0)))
          rescue=int(d.get("verified_teacher_examples",0))
          if complete!=40 or rescue!=18:
              raise SystemExit(f"Rescue contract mismatch complete={complete} rescue={rescue}")

          rows=[
              json.loads(x)
              for x in Path("evidence/sts1/v23-trace/preservation.jsonl").read_text().splitlines()
              if x.strip()
          ]
          if len(rows)!=2:
              raise SystemExit(f"expected exactly 2 preservation anchors, got {len(rows)}")
          if {int(x["seed"]) for x in rows}!={74327186,148131968}:
              raise SystemExit("preservation seed set mismatch")
          if any(x.get("schema_version")!="sts1-build-preservation-v1" for x in rows):
              raise SystemExit("preservation schema mismatch")
          print("V23_EVIDENCE_PASS",{"rescue":rescue,"preservation":len(rows)})
          PY

      - name: Train regression-preserving Candidate
        run: |
          set -euo pipefail
          mkdir -p evidence/sts1/v23-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          elite="$(find "$RUNNER_TEMP/g7" -name elite-replay.npz -print -quit)"
          python scripts/sts1/sts1_build_rescue_bc_v23.py             --armg-root .cache/sts1-v23             --module-dir external/sts_lightspeed/source/build-probe             --base-weight "$parent"             --elite-replay "$elite"             --rescue-replay evidence/sts1/v21-verified/verified-build-rescue.jsonl             --preservation-replay evidence/sts1/v23-trace/preservation.jsonl             --output evidence/sts1/v23-candidate/candidate.pt             --report evidence/sts1/v23-candidate/train-report.json             --epochs 6 --lr 3e-6             --elite-train-max 8192 --retention-eval-max 2048             --rescue-repeats 4             --winner-coef 0.80 --distill-coef 1.20 --rescue-coef 0.60             --preservation-coef 0.30             --param-anchor-coef 1e-5             --min-parent-agreement 0.995 --max-parent-kl 0.002 --max-winner-drop 0.01             --threads 4

      - name: Build evaluation seed files
        run: |
          set -euo pipefail
          cp control/sts1-v22-parent-only-seeds-2.txt evidence/sts1/v23-candidate/regression2-seeds.txt
          grep -v '^#' control/sts1-v15-dev-seeds-50.txt | sed '/^$/d' | head -30 > evidence/sts1/v23-candidate/dev30-seeds.txt
          cp control/sts1-v14-final-promotion-seeds-50.txt evidence/sts1/v23-candidate/hidden50-seeds.txt
          python - <<'PY'
          import json,random
          from pathlib import Path
          def read_seeds(path):
              return [int(x) for x in Path(path).read_text().splitlines() if x.strip() and not x.lstrip().startswith("#")]
          protected=set(read_seeds("control/sts1-v15-dev-seeds-50.txt"))
          protected.update(read_seeds("control/sts1-v14-final-promotion-seeds-50.txt"))
          protected.update(read_seeds("control/sts1-v16-benchmark-seeds-500.txt"))
          d=json.loads(Path("evidence/sts1/v21-verified/summary.json").read_text())
          protected.update(int(r["seed"]) for r in d["rows"])
          rng=random.Random(2026093023)
          fresh=[]
          while len(fresh)<100:
              x=rng.randrange(1,2_000_000_000)
              if x not in protected and x not in fresh:
                  fresh.append(x)
          Path("evidence/sts1/v23-candidate/fresh100-seeds.txt").write_text("\n".join(map(str,fresh))+"\n")
          assert len(fresh)==100 and not(set(fresh)&protected)
          PY
          test "$(wc -l < evidence/sts1/v23-candidate/regression2-seeds.txt)" -eq 2
          test "$(wc -l < evidence/sts1/v23-candidate/dev30-seeds.txt)" -eq 30

      - name: Regression2 exact repair Gate
        id: regression2
        run: |
          set -euo pipefail
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v23             --parent-weight "$parent"             --candidate-weight evidence/sts1/v23-candidate/candidate.pt             --seed-file evidence/sts1/v23-candidate/regression2-seeds.txt             --output evidence/sts1/v23-candidate/regression2.json             --mcts-sims 2000 --workers 2 --min-win-delta 0 --max-pvalue 1.0 --label v23-regression2
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v23-candidate/regression2.json"))
          exact=(x["parent_wins"]==2 and x["candidate_wins"]==2)
          print("passed="+str(exact).lower())
          print("parent="+str(x["parent_wins"]))
          print("candidate="+str(x["candidate_wins"]))
          PY
          python - <<'PY'
          import json
          x=json.load(open("evidence/sts1/v23-candidate/regression2.json"))
          if not (x["parent_wins"]==2 and x["candidate_wins"]==2):
              raise SystemExit("v2.3 failed to restore both parent-only wins")
          print("V23_REGRESSION2_PASS")
          PY

      - name: Dev30 fixed-seed win Gate
        id: dev
        if: steps.regression2.outputs.passed == 'true'
        run: |
          set -euo pipefail
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v23             --parent-weight "$parent"             --candidate-weight evidence/sts1/v23-candidate/candidate.pt             --seed-file evidence/sts1/v23-candidate/dev30-seeds.txt             --output evidence/sts1/v23-candidate/dev30.json             --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 1.0 --label v23-dev30
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v23-candidate/dev30.json"))
          print("passed="+str(x["pass"]).lower())
          print("parent="+str(x["parent_wins"]))
          print("candidate="+str(x["candidate_wins"]))
          print("candidate_only="+str(x["candidate_only_wins"]))
          print("parent_only="+str(x["parent_only_wins"]))
          PY

      - name: Hidden50 fixed-seed Gate
        id: hidden
        if: steps.dev.outputs.passed == 'true'
        run: |
          set -euo pipefail
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v23             --parent-weight "$parent"             --candidate-weight evidence/sts1/v23-candidate/candidate.pt             --seed-file evidence/sts1/v23-candidate/hidden50-seeds.txt             --output evidence/sts1/v23-candidate/hidden50.json             --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 1.0 --label v23-hidden50
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v23-candidate/hidden50.json"))
          print("passed="+str(x["pass"]).lower())
          print("parent="+str(x["parent_wins"]))
          print("candidate="+str(x["candidate_wins"]))
          PY

      - name: Fresh100 formal win Gate
        id: fresh
        if: steps.hidden.outputs.passed == 'true'
        run: |
          set -euo pipefail
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v23             --parent-weight "$parent"             --candidate-weight evidence/sts1/v23-candidate/candidate.pt             --seed-file evidence/sts1/v23-candidate/fresh100-seeds.txt             --output evidence/sts1/v23-candidate/fresh100.json             --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 0.10 --label v23-fresh100
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v23-candidate/fresh100.json"))
          print("passed="+str(x["pass"]).lower())
          print("parent="+str(x["parent_wins"]))
          print("candidate="+str(x["candidate_wins"]))
          print("pvalue="+str(x["paired_sign_pvalue_one_sided"]))
          PY

      - name: Heldout500 formal win Gate
        id: heldout
        if: steps.fresh.outputs.passed == 'true'
        run: |
          set -euo pipefail
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v23             --parent-weight "$parent"             --candidate-weight evidence/sts1/v23-candidate/candidate.pt             --seed-file control/sts1-v16-benchmark-seeds-500.txt             --output evidence/sts1/v23-candidate/heldout500.json             --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 0.10 --label v23-heldout500
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v23-candidate/heldout500.json"))
          print("passed="+str(x["pass"]).lower())
          print("parent="+str(x["parent_wins"]))
          print("candidate="+str(x["candidate_wins"]))
          print("pvalue="+str(x["paired_sign_pvalue_one_sided"]))
          PY

      - name: Write final v2.3 summary
        if: always()
        env:
          REG_PASS: ${{ steps.regression2.outputs.passed }}
          REG_PARENT: ${{ steps.regression2.outputs.parent }}
          REG_CAND: ${{ steps.regression2.outputs.candidate }}
          DEV_PASS: ${{ steps.dev.outputs.passed }}
          DEV_PARENT: ${{ steps.dev.outputs.parent }}
          DEV_CAND: ${{ steps.dev.outputs.candidate }}
          DEV_CONLY: ${{ steps.dev.outputs.candidate_only }}
          DEV_PONLY: ${{ steps.dev.outputs.parent_only }}
          HID_PASS: ${{ steps.hidden.outputs.passed }}
          HID_PARENT: ${{ steps.hidden.outputs.parent }}
          HID_CAND: ${{ steps.hidden.outputs.candidate }}
          FRESH_PASS: ${{ steps.fresh.outputs.passed }}
          FRESH_PARENT: ${{ steps.fresh.outputs.parent }}
          FRESH_CAND: ${{ steps.fresh.outputs.candidate }}
          FRESH_P: ${{ steps.fresh.outputs.pvalue }}
          H500_PASS: ${{ steps.heldout.outputs.passed }}
          H500_PARENT: ${{ steps.heldout.outputs.parent }}
          H500_CAND: ${{ steps.heldout.outputs.candidate }}
          H500_P: ${{ steps.heldout.outputs.pvalue }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path("evidence/sts1/v23-candidate")
          out.mkdir(parents=True,exist_ok=True)
          train={}
          p=out/"train-report.json"
          if p.exists():
              train=json.loads(p.read_text())
          summary={
              "schema_version":"sts1-build-rescue-v23-summary",
              "parent":"G7",
              "preservation_examples":train.get("preservation_examples"),
              "preservation_after":train.get("after",{}).get("preservation"),
              "selected_alpha":train.get("selected_alpha"),
              "regression2":{"pass":os.environ.get("REG_PASS")=="true","parent_wins":os.environ.get("REG_PARENT"),"candidate_wins":os.environ.get("REG_CAND")},
              "dev30":{"pass":os.environ.get("DEV_PASS")=="true","parent_wins":os.environ.get("DEV_PARENT"),"candidate_wins":os.environ.get("DEV_CAND"),"candidate_only_wins":os.environ.get("DEV_CONLY"),"parent_only_wins":os.environ.get("DEV_PONLY")},
              "hidden50":{"pass":os.environ.get("HID_PASS")=="true","parent_wins":os.environ.get("HID_PARENT"),"candidate_wins":os.environ.get("HID_CAND")},
              "fresh100":{"pass":os.environ.get("FRESH_PASS")=="true","parent_wins":os.environ.get("FRESH_PARENT"),"candidate_wins":os.environ.get("FRESH_CAND"),"pvalue":os.environ.get("FRESH_P")},
              "heldout500":{"pass":os.environ.get("H500_PASS")=="true","parent_wins":os.environ.get("H500_PARENT"),"candidate_wins":os.environ.get("H500_CAND"),"pvalue":os.environ.get("H500_P")},
          }
          summary["readiness"]="READY_FOR_REAL_GAME_GATE" if summary["heldout500"]["pass"] else "HOLD_PARENT"
          (out/"summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("V23_FINAL",json.dumps(summary,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sts1-v23-preservation-${{ github.run_id }}
          path: evidence/sts1/v23-candidate/
          if-no-files-found: warn
          retention-days: 90

      - name: Report v2.3 status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/body.txt"
          import json
          from pathlib import Path
          p=Path("evidence/sts1/v23-candidate/summary.json")
          print("@ericpeng0604-coder")
          print()
          print("## Build Rescue v2.3 Regression Preservation")
          if not p.exists():
              print("- Run failed before final summary. G7 remains unchanged.")
          else:
              x=json.loads(p.read_text())
              a=x.get("preservation_after") or {}
              print(f"- Preservation examples: **{x.get('preservation_examples')}**")
              print(f"- Preservation top1: **{a.get('top1')}**")
              print(f"- Regression2: Parent **{x['regression2'].get('parent_wins')}/2** / Candidate **{x['regression2'].get('candidate_wins')}/2** / PASS={x['regression2'].get('pass')}")
              print(f"- Dev30: Parent **{x['dev30'].get('parent_wins')}/30** / Candidate **{x['dev30'].get('candidate_wins')}/30** / PASS={x['dev30'].get('pass')}")
              print(f"- Hidden50: Parent **{x['hidden50'].get('parent_wins')}** / Candidate **{x['hidden50'].get('candidate_wins')}** / PASS={x['hidden50'].get('pass')}")
              print(f"- Fresh100: Parent **{x['fresh100'].get('parent_wins')}** / Candidate **{x['fresh100'].get('candidate_wins')}** / p={x['fresh100'].get('pvalue')} / PASS={x['fresh100'].get('pass')}")
              print(f"- Heldout500: Parent **{x['heldout500'].get('parent_wins')}** / Candidate **{x['heldout500'].get('candidate_wins')}** / p={x['heldout500'].get('pvalue')} / PASS={x['heldout500'].get('pass')}")
              print(f"- Final readiness: **{x.get('readiness')}**")
          print("- 正式 Champion 不會自動替換；未通過就保留 G7。")
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/15/comments" -f body="$(cat "$RUNNER_TEMP/body.txt")"
