name: STS1 Build Rescue v2.4 Partial3 Validation

on:
  push:
    branches:
      - gpt/sts1-build-rescue-v22-antiforget-20260930
    paths:
      - control/sts1-build-rescue-v24-partial3.trigger

permissions:
  contents: read
  actions: read
  issues: write

env:
  V21_DATASET_RUN_ID: '36699995040'
  V21_DATASET_ARTIFACT: 'v21-verified-36699995040'
  V23_TRACE_RUN_ID: '36722951474'
  V23_TRACE_ARTIFACT: 'sts1-v23-regression-trace-36722951474'
  PARTIAL_MINING_RUN_ID: '36730088394'
  PARTIAL_MINING_ARTIFACT: 'sts1-v24-new-win-mining-36730088394'
  G7_STATE_ARTIFACT_ID: '11079234863'
  G7_WEIGHT_SHA256: '8313c99d9b0ab0c0d206fdd2f744fed11f4104d440dcb465cf7c78a517f9ccd0'
  SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'

concurrency:
  group: sts1-build-rescue-v24-partial3
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static trainer contract
        run: |
          set -euo pipefail
          python -m py_compile             scripts/sts1/sts1_build_rescue_bc_v24.py             scripts/sts1/sts1_build_rescue_gate_v21.py

      - name: Download frozen old Rescue pool
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V21_DATASET_ARTIFACT }}
          path: evidence/sts1/v21-verified
          github-token: ${{ github.token }}
          run-id: ${{ env.V21_DATASET_RUN_ID }}

      - name: Download frozen regression preservation anchors
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V23_TRACE_ARTIFACT }}
          path: evidence/sts1/v23-trace
          github-token: ${{ github.token }}
          run-id: ${{ env.V23_TRACE_RUN_ID }}

      - name: Download verified partial New-Win pool
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PARTIAL_MINING_ARTIFACT }}
          path: evidence/sts1/v24-aggregate
          github-token: ${{ github.token }}
          run-id: ${{ env.PARTIAL_MINING_RUN_ID }}

      - name: Validate partial mining provenance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("evidence/sts1/v24-aggregate/summary.json").read_text())
          rows=[json.loads(s) for s in Path("evidence/sts1/v24-aggregate/new-win-teacher.jsonl").read_text().splitlines() if s.strip()]
          if x["completed_seeds"]!=5 or x["rescued_seeds"]!=3 or x["teacher_examples"]!=3:
              raise SystemExit(f"unexpected partial mining summary: {x['completed_seeds']}, {x['rescued_seeds']}, {x['teacher_examples']}")
          if x["full_win_seeds"]!=3 or x["native_failure_events"]!=0:
              raise SystemExit("partial pool must contain three full-win rescues and zero native failures")
          if len(rows)!=3 or len({int(r["seed"]) for r in rows})!=3:
              raise SystemExit("partial New-Win pool must contain 3 examples from 3 seeds")
          print("V24_PARTIAL3_PROVENANCE_PASS",sorted(int(r["seed"]) for r in rows))
          PY

      - name: Install, hydrate, and build pinned simulator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . numpy
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-v24-partial3
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"

      - name: Download and verify frozen G7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -o "$RUNNER_TEMP/g7.zip"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$G7_STATE_ARTIFACT_ID/zip"
          mkdir -p "$RUNNER_TEMP/g7"
          unzip -q "$RUNNER_TEMP/g7.zip" -d "$RUNNER_TEMP/g7"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          elite="$(find "$RUNNER_TEMP/g7" -name elite-replay.npz -print -quit)"
          test -n "$parent"
          test -n "$elite"
          test "$(sha256sum "$parent" | awk '{print $1}')" = "$G7_WEIGHT_SHA256"

      - name: Train Partial3 New-Win Candidate
        run: |
          set -euo pipefail
          mkdir -p evidence/sts1/v24-partial3
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          elite="$(find "$RUNNER_TEMP/g7" -name elite-replay.npz -print -quit)"
          python scripts/sts1/sts1_build_rescue_bc_v24.py             --armg-root .cache/sts1-v24-partial3             --module-dir external/sts_lightspeed/source/build-probe             --base-weight "$parent"             --elite-replay "$elite"             --rescue-replay evidence/sts1/v21-verified/verified-build-rescue.jsonl             --new-win-replay evidence/sts1/v24-aggregate/new-win-teacher.jsonl             --preservation-replay evidence/sts1/v23-trace/preservation.jsonl             --output evidence/sts1/v24-partial3/candidate.pt             --report evidence/sts1/v24-partial3/train-report.json             --epochs 6 --lr 3e-6             --elite-train-max 8192 --retention-eval-max 2048             --rescue-repeats 2 --new-win-repeats 8             --winner-coef 0.80 --distill-coef 1.20             --rescue-coef 0.25 --new-win-coef 1.00             --preservation-coef 0.30 --preservation-margin 0.001             --param-anchor-coef 1e-5             --min-parent-agreement 0.995 --max-parent-kl 0.002 --max-winner-drop 0.01             --threads 4

      - name: Build evaluation seed files
        run: |
          set -euo pipefail
          cp control/sts1-v22-parent-only-seeds-2.txt evidence/sts1/v24-partial3/regression2-seeds.txt
          grep -v '^#' control/sts1-v15-dev-seeds-50.txt | sed '/^$/d' | head -30 > evidence/sts1/v24-partial3/dev30-seeds.txt
          cp control/sts1-v14-final-promotion-seeds-50.txt evidence/sts1/v24-partial3/hidden50-seeds.txt
          python - <<'PY'
          import json,random
          from pathlib import Path
          def seeds(path):
              return [int(x) for x in Path(path).read_text().splitlines() if x.strip() and not x.lstrip().startswith("#")]
          protected=set(seeds("control/sts1-v15-dev-seeds-50.txt"))
          protected.update(seeds("control/sts1-v14-final-promotion-seeds-50.txt"))
          protected.update(seeds("control/sts1-v16-benchmark-seeds-500.txt"))
          old=json.loads(Path("evidence/sts1/v21-verified/summary.json").read_text())
          protected.update(int(r["seed"]) for r in old["rows"])
          mined=json.loads(Path("evidence/sts1/v24-aggregate/summary.json").read_text())
          protected.update(int(r["seed"]) for r in mined["rows"])
          rng=random.Random(20260930243)
          fresh=[]
          while len(fresh)<100:
              x=rng.randrange(1,2_000_000_000)
              if x not in protected and x not in fresh:
                  fresh.append(x)
          Path("evidence/sts1/v24-partial3/fresh100-seeds.txt").write_text("\n".join(map(str,fresh))+"\n")
          PY

      - name: Regression2 preservation Gate
        id: regression2
        run: |
          set -euo pipefail
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v24-partial3             --parent-weight "$parent"             --candidate-weight evidence/sts1/v24-partial3/candidate.pt             --seed-file evidence/sts1/v24-partial3/regression2-seeds.txt             --output evidence/sts1/v24-partial3/regression2.json             --mcts-sims 2000 --workers 2 --min-win-delta 0 --max-pvalue 1.0 --label v24-partial3-regression2
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v24-partial3/regression2.json"))
          passed=(x["parent_wins"]==2 and x["candidate_wins"]==2)
          print("passed="+str(passed).lower())
          PY

      - name: Dev30 New-Win Gate
        id: dev
        if: steps.regression2.outputs.passed == 'true'
        run: |
          set -euo pipefail
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v24-partial3             --parent-weight "$parent"             --candidate-weight evidence/sts1/v24-partial3/candidate.pt             --seed-file evidence/sts1/v24-partial3/dev30-seeds.txt             --output evidence/sts1/v24-partial3/dev30.json             --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 1.0 --label v24-partial3-dev30
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v24-partial3/dev30.json"))
          passed=(x["parent_wins"]==6 and x["candidate_wins"]>=7 and x["candidate_only_wins"]>=1 and x["parent_only_wins"]==0)
          print("passed="+str(passed).lower())
          print("parent="+str(x["parent_wins"]))
          print("candidate="+str(x["candidate_wins"]))
          print("candidate_only="+str(x["candidate_only_wins"]))
          print("parent_only="+str(x["parent_only_wins"]))
          PY

      - name: Hidden50 Gate
        id: hidden
        if: steps.dev.outputs.passed == 'true'
        run: |
          set -euo pipefail
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v24-partial3             --parent-weight "$parent"             --candidate-weight evidence/sts1/v24-partial3/candidate.pt             --seed-file evidence/sts1/v24-partial3/hidden50-seeds.txt             --output evidence/sts1/v24-partial3/hidden50.json             --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 1.0 --label v24-partial3-hidden50
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v24-partial3/hidden50.json"))
          print("passed="+str(x["pass"]).lower())
          PY

      - name: Fresh100 formal Gate
        id: fresh
        if: steps.hidden.outputs.passed == 'true'
        run: |
          set -euo pipefail
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v24-partial3             --parent-weight "$parent"             --candidate-weight evidence/sts1/v24-partial3/candidate.pt             --seed-file evidence/sts1/v24-partial3/fresh100-seeds.txt             --output evidence/sts1/v24-partial3/fresh100.json             --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 0.10 --label v24-partial3-fresh100
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v24-partial3/fresh100.json"))
          print("passed="+str(x["pass"]).lower())
          PY

      - name: Heldout500 formal Gate
        id: heldout
        if: steps.fresh.outputs.passed == 'true'
        run: |
          set -euo pipefail
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v24-partial3             --parent-weight "$parent"             --candidate-weight evidence/sts1/v24-partial3/candidate.pt             --seed-file control/sts1-v16-benchmark-seeds-500.txt             --output evidence/sts1/v24-partial3/heldout500.json             --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 0.10 --label v24-partial3-heldout500

      - name: Write Partial3 summary
        if: always()
        env:
          REG_PASS: ${{ steps.regression2.outputs.passed }}
          DEV_PASS: ${{ steps.dev.outputs.passed }}
          DEV_PARENT: ${{ steps.dev.outputs.parent }}
          DEV_CAND: ${{ steps.dev.outputs.candidate }}
          DEV_CONLY: ${{ steps.dev.outputs.candidate_only }}
          DEV_PONLY: ${{ steps.dev.outputs.parent_only }}
          HID_PASS: ${{ steps.hidden.outputs.passed }}
          FRESH_PASS: ${{ steps.fresh.outputs.passed }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path("evidence/sts1/v24-partial3")
          train={}
          if (out/"train-report.json").exists():
              train=json.loads((out/"train-report.json").read_text())
          summary={
              "schema_version":"sts1-build-rescue-v24-partial3-summary",
              "source_mining_run":36730088394,
              "new_win_teacher_examples":train.get("new_win_teacher_examples"),
              "new_win_teacher_seeds":train.get("new_win_teacher_seeds"),
              "new_win_before":train.get("before",{}).get("new_win"),
              "new_win_after":train.get("after",{}).get("new_win"),
              "regression2_pass":os.environ.get("REG_PASS")=="true",
              "dev30":{
                  "pass":os.environ.get("DEV_PASS")=="true",
                  "parent":os.environ.get("DEV_PARENT"),
                  "candidate":os.environ.get("DEV_CAND"),
                  "candidate_only":os.environ.get("DEV_CONLY"),
                  "parent_only":os.environ.get("DEV_PONLY"),
              },
              "hidden50_pass":os.environ.get("HID_PASS")=="true",
              "fresh100_pass":os.environ.get("FRESH_PASS")=="true",
          }
          summary["heldout500_exists"]=(out/"heldout500.json").exists()
          (out/"summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("V24_PARTIAL3_FINAL",json.dumps(summary,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sts1-v24-partial3-${{ github.run_id }}
          path: evidence/sts1/v24-partial3/
          if-no-files-found: warn
          retention-days: 90

      - name: Report Partial3 status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/body.txt"
          import json
          from pathlib import Path
          p=Path("evidence/sts1/v24-partial3/summary.json")
          print("@ericpeng0604-coder")
          print()
          print("## Build Rescue v2.4 Partial3 Validation")
          if not p.exists():
              print("- Partial3 validation failed before summary. G7 remains unchanged.")
          else:
              x=json.loads(p.read_text())
              d=x["dev30"]
              print(f"- New-Win Teacher: **{x.get('new_win_teacher_examples')} examples / {x.get('new_win_teacher_seeds')} seeds**")
              print(f"- Regression2 PASS: **{x.get('regression2_pass')}**")
              print(f"- Dev30: Parent **{d.get('parent')}/30** / Candidate **{d.get('candidate')}/30**")
              print(f"- Candidate-only / Parent-only: **{d.get('candidate_only')} / {d.get('parent_only')}**")
              print(f"- Dev30 New-Win Gate: **{d.get('pass')}**")
              print(f"- Hidden50 PASS: **{x.get('hidden50_pass')}**")
              print(f"- Fresh100 PASS: **{x.get('fresh100_pass')}**")
              print(f"- Heldout500 executed: **{x.get('heldout500_exists')}**")
          print("- 這是獨立研究 Candidate；正式 G7 不會被自動替換。")
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/15/comments" -f body="$(cat "$RUNNER_TEMP/body.txt")"
