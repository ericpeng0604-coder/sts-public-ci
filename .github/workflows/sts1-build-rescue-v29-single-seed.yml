name: STS1 Build Rescue v2.9 Single Seed Surgical

on:
  push:
    branches:
      - gpt/sts1-build-rescue-v22-antiforget-20260930
    paths:
      - control/sts1-build-rescue-v29-single-seed.trigger
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  SOURCE_RUN_ID: '36731071450'
  V21_DATASET_RUN_ID: '36699995040'
  V21_DATASET_ARTIFACT: 'v21-verified-36699995040'
  V23_TRACE_RUN_ID: '36722951474'
  V23_TRACE_ARTIFACT: 'sts1-v23-regression-trace-36722951474'
  G7_ARTIFACT_ID: '11079234863'
  G7_WEIGHT_SHA256: '8313c99d9b0ab0c0d206fdd2f744fed11f4104d440dcb465cf7c78a517f9ccd0'
  SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'

concurrency:
  group: sts1-build-rescue-v29-single-seed
  cancel-in-progress: true

jobs:
  candidate:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [469494371, 523373928, 620908546]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate v2.9 trainer
        run: |
          set -euo pipefail
          python -m py_compile scripts/sts1/sts1_build_rescue_bc_v29.py
          python - <<'PY'
          from pathlib import Path
          p=Path("scripts/sts1/sts1_build_rescue_bc_v29.py").read_text()
          required=[
              "single_seed_full_network_pairwise_only",
              "_new_win_pairwise_margin_loss",
              "V29_SINGLE_SEED_EARLY_STOP",
              "V29_SINGLE_SEED_TRAIN_PASS",
              "exactly one New-Win Teacher",
          ]
          missing=[x for x in required if x not in p]
          if missing:
              raise SystemExit(f"missing contract: {missing}")
          print("V29_CONTRACT_PASS")
          PY

      - name: Download source mining
        uses: actions/download-artifact@v4
        with:
          pattern: v24-mine-*
          path: evidence/sts1/v29-source
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Freeze one full-win Teacher
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          mkdir -p evidence/sts1/v29-single
          python - <<'PY'
          import json,os
          from pathlib import Path
          seed=int(os.environ["SEED"])
          p=Path(f"evidence/sts1/v29-source/result-{seed}.json")
          r=json.loads(p.read_text())
          if r.get("status")!="NEW_FULL_WIN_ONE_STEP":
              raise SystemExit(f"seed {seed} is not one-step full-win: {r.get('status')}")
          rows=list(r.get("teachers") or [])
          if len(rows)!=1:
              raise SystemExit(f"expected 1 Teacher, got {len(rows)}")
          row=rows[0]
          if int(row["seed"])!=seed:
              raise SystemExit("Teacher seed mismatch")
          Path("evidence/sts1/v29-single/new-win-teacher.jsonl").write_text(json.dumps(row,sort_keys=True)+"\n")
          Path("evidence/sts1/v29-single/target-seed.txt").write_text(str(seed)+"\n")
          print("V29_SINGLE_TEACHER_PASS",seed,row.get("floor"),row.get("kind"))
          PY

      - name: Download old Rescue pool
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V21_DATASET_ARTIFACT }}
          path: evidence/sts1/v21-verified
          github-token: ${{ github.token }}
          run-id: ${{ env.V21_DATASET_RUN_ID }}

      - name: Download regression anchors
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V23_TRACE_ARTIFACT }}
          path: evidence/sts1/v23-trace
          github-token: ${{ github.token }}
          run-id: ${{ env.V23_TRACE_RUN_ID }}

      - name: Install and build pinned simulator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . numpy
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-v29-${{ matrix.seed }}
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"

      - name: Download G7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -o "$RUNNER_TEMP/g7.zip"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$G7_ARTIFACT_ID/zip"
          mkdir -p "$RUNNER_TEMP/g7"
          unzip -q "$RUNNER_TEMP/g7.zip" -d "$RUNNER_TEMP/g7"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          elite="$(find "$RUNNER_TEMP/g7" -name elite-replay.npz -print -quit)"
          test -n "$parent" && test -n "$elite"
          test "$(sha256sum "$parent" | awk '{print $1}')" = "$G7_WEIGHT_SHA256"

      - name: Train single-seed Candidate
        run: |
          set -euo pipefail
          mkdir -p evidence/sts1/v29-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          elite="$(find "$RUNNER_TEMP/g7" -name elite-replay.npz -print -quit)"
          python scripts/sts1/sts1_build_rescue_bc_v29.py             --armg-root .cache/sts1-v29-${{ matrix.seed }}             --module-dir external/sts_lightspeed/source/build-probe             --base-weight "$parent"             --elite-replay "$elite"             --rescue-replay evidence/sts1/v21-verified/verified-build-rescue.jsonl             --new-win-replay evidence/sts1/v29-single/new-win-teacher.jsonl             --preservation-replay evidence/sts1/v23-trace/preservation.jsonl             --output evidence/sts1/v29-candidate/candidate.pt             --report evidence/sts1/v29-candidate/train-report.json             --epochs 60 --lr 5e-7             --elite-train-max 8192 --retention-eval-max 2048             --rescue-repeats 1 --new-win-repeats 8             --winner-coef 1.50 --distill-coef 3.00             --rescue-coef 0.01 --new-win-coef 0.01             --new-win-margin 0.01 --new-win-margin-coef 0.25             --preservation-coef 2.00 --preservation-margin 0.001             --param-anchor-coef 1e-4             --min-parent-agreement 0.995 --max-parent-kl 0.002 --max-winner-drop 0.01             --min-fully-learned-seeds 1 --threads 4

      - name: Build gate seeds
        run: |
          cp control/sts1-v22-parent-only-seeds-2.txt evidence/sts1/v29-candidate/regression2-seeds.txt
          grep -v '^#' control/sts1-v15-dev-seeds-50.txt | sed '/^$/d' | head -30 > evidence/sts1/v29-candidate/dev30-seeds.txt

      - name: Target New-Win Gate
        id: target
        run: |
          set -euo pipefail
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v29-${{ matrix.seed }}             --parent-weight "$parent"             --candidate-weight evidence/sts1/v29-candidate/candidate.pt             --seed-file evidence/sts1/v29-single/target-seed.txt             --output evidence/sts1/v29-candidate/target.json             --mcts-sims 2000 --workers 1 --min-win-delta 1 --max-pvalue 1.0 --label v29-target-${{ matrix.seed }}
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v29-candidate/target.json"))
          passed=(x["parent_wins"]==0 and x["candidate_wins"]==1 and x["candidate_only_wins"]==1)
          print("passed="+str(passed).lower())
          PY

      - name: Regression2 Gate
        id: reg
        if: steps.target.outputs.passed == 'true'
        run: |
          set -euo pipefail
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v29-${{ matrix.seed }}             --parent-weight "$parent"             --candidate-weight evidence/sts1/v29-candidate/candidate.pt             --seed-file evidence/sts1/v29-candidate/regression2-seeds.txt             --output evidence/sts1/v29-candidate/regression2.json             --mcts-sims 2000 --workers 2 --min-win-delta 0 --max-pvalue 1.0 --label v29-reg2-${{ matrix.seed }}
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v29-candidate/regression2.json"))
          passed=(x["parent_wins"]==2 and x["candidate_wins"]==2 and x["parent_only_wins"]==0)
          print("passed="+str(passed).lower())
          PY

      - name: Dev30 Gate
        id: dev
        if: steps.reg.outputs.passed == 'true'
        run: |
          set -euo pipefail
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v29-${{ matrix.seed }}             --parent-weight "$parent"             --candidate-weight evidence/sts1/v29-candidate/candidate.pt             --seed-file evidence/sts1/v29-candidate/dev30-seeds.txt             --output evidence/sts1/v29-candidate/dev30.json             --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 1.0 --label v29-dev30-${{ matrix.seed }}
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v29-candidate/dev30.json"))
          passed=(x["parent_wins"]==6 and x["candidate_wins"]>=7 and x["candidate_only_wins"]>=1 and x["parent_only_wins"]==0)
          print("passed="+str(passed).lower())
          print("parent="+str(x["parent_wins"]))
          print("candidate="+str(x["candidate_wins"]))
          print("candidate_only="+str(x["candidate_only_wins"]))
          print("parent_only="+str(x["parent_only_wins"]))
          PY

      - name: Write summary
        if: always()
        env:
          SEED: ${{ matrix.seed }}
          TARGET: ${{ steps.target.outputs.passed }}
          REG: ${{ steps.reg.outputs.passed }}
          DEV: ${{ steps.dev.outputs.passed }}
          DEV_PARENT: ${{ steps.dev.outputs.parent }}
          DEV_CAND: ${{ steps.dev.outputs.candidate }}
          DEV_CONLY: ${{ steps.dev.outputs.candidate_only }}
          DEV_PONLY: ${{ steps.dev.outputs.parent_only }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path("evidence/sts1/v29-candidate"); out.mkdir(parents=True,exist_ok=True)
          train={}
          if (out/"train-report.json").exists():
              train=json.loads((out/"train-report.json").read_text())
          summary={
              "schema_version":"sts1-v29-summary",
              "teacher_seed":int(os.environ["SEED"]),
              "training":{
                  "before_new_win":train.get("before",{}).get("new_win"),
                  "after_new_win":train.get("after",{}).get("new_win"),
                  "selected_alpha":train.get("selected_alpha"),
                  "retention_after":train.get("after",{}).get("retention"),
                  "preservation_after":train.get("after",{}).get("preservation"),
              },
              "target_pass":os.environ.get("TARGET")=="true",
              "regression2_pass":os.environ.get("REG")=="true",
              "dev30":{
                  "pass":os.environ.get("DEV")=="true",
                  "parent":os.environ.get("DEV_PARENT"),
                  "candidate":os.environ.get("DEV_CAND"),
                  "candidate_only":os.environ.get("DEV_CONLY"),
                  "parent_only":os.environ.get("DEV_PONLY"),
              },
          }
          (out/"summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("V29_FINAL",json.dumps(summary,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sts1-v29-${{ matrix.seed }}-${{ github.run_id }}
          path:
            evidence/sts1/v29-single/
            evidence/sts1/v29-candidate/
          if-no-files-found: warn
          retention-days: 90
