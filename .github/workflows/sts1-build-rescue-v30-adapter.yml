name: STS1 Build Rescue v3.0 Residual Adapter

on:
  push:
    branches:
      - gpt/sts1-build-rescue-v22-antiforget-20260930
    paths:
      - control/sts1-build-rescue-v30-adapter.trigger
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  SOURCE_RUN_ID: '36731071450'
  V23_TRACE_RUN_ID: '36722951474'
  V23_TRACE_ARTIFACT: 'sts1-v23-regression-trace-36722951474'
  G7_ARTIFACT_ID: '11079234863'
  G7_WEIGHT_SHA256: '8313c99d9b0ab0c0d206fdd2f744fed11f4104d440dcb465cf7c78a517f9ccd0'
  SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'

concurrency:
  group: sts1-build-rescue-v30-adapter
  cancel-in-progress: true

jobs:
  v30:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate v3.0 adapter contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/sts1/sts1_build_rescue_adapter_v30.py scripts/sts1/sts1_build_rescue_gate_v21.py src/roguelike_ai/sts1_phase3/simulator.py
          python - <<'PY'
          from pathlib import Path
          trainer=Path("scripts/sts1/sts1_build_rescue_adapter_v30.py").read_text()
          sim=Path("src/roguelike_ai/sts1_phase3/simulator.py").read_text()
          required_trainer=[
              "sts1-armg-residual-adapter-v1","V30_ADAPTER_EPOCH","V30_ADAPTER_TRAIN_PASS",
              "fully_learned_seeds","parent_high_conf_top1_agreement",".adapter.pt",
          ]
          required_sim=[
              'Path(str(weight_path) + ".adapter.pt")',"self.adapter","self.adapter_kinds",
              "scores = scores + self.adapter(x).squeeze(1)",
          ]
          mt=[x for x in required_trainer if x not in trainer]
          ms=[x for x in required_sim if x not in sim]
          if mt or ms:
              raise SystemExit(f"v3.0 contract missing trainer={mt} simulator={ms}")
          print("V30_CONTRACT_PASS")
          PY

      - name: Download verified New-Win mining artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: v24-mine-*
          path: evidence/sts1/v30-raw
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Freeze seven full-win Teachers
        run: |
          set -euo pipefail
          mkdir -p evidence/sts1/v30-data
          python - <<'PY'
          import json
          from pathlib import Path
          wanted={341684210,469494371,523373928,572162032,620908546}
          rows=[]
          status={}
          for p in Path("evidence/sts1/v30-raw").glob("result-*.json"):
              r=json.loads(p.read_text())
              seed=int(r["seed"])
              if seed not in wanted:
                  continue
              status[seed]=r.get("status")
              if r.get("status") not in {"NEW_FULL_WIN_ONE_STEP","NEW_FULL_WIN_TWO_STEP"}:
                  raise SystemExit(f"seed {seed} no longer verified full-win: {r.get('status')}")
              rows.extend(list(r.get("teachers") or []))
          seeds={int(r["seed"]) for r in rows}
          if seeds!=wanted:
              raise SystemExit(f"v3.0 teacher seed set mismatch: {sorted(seeds)}")
          if len(rows)!=7:
              raise SystemExit(f"v3.0 requires exactly 7 verified Teacher decisions; got {len(rows)}")
          for r in rows:
              if r.get("type")!="v24_new_win_full_victory":
                  raise SystemExit("v3.0 contains non-full-victory Teacher")
              if r.get("confidence_weight")!=1.0 or r.get("teacher_consensus_fraction")!=1.0:
                  raise SystemExit("v3.0 Teacher confidence contract failed")
          rows.sort(key=lambda r:(int(r["seed"]),int(r["floor"]),int(r.get("intervention_step",1))))
          Path("evidence/sts1/v30-data/new-win-teachers.jsonl").write_text(
              "".join(json.dumps(r,sort_keys=True)+"\n" for r in rows)
          )
          Path("evidence/sts1/v30-data/training-seeds.txt").write_text(
              "\n".join(map(str,sorted(wanted)))+"\n"
          )
          Path("evidence/sts1/v30-data/dataset-summary.json").write_text(
              json.dumps({
                  "schema_version":"sts1-v30-new-win-dataset",
                  "teacher_examples":len(rows),
                  "teacher_seeds":sorted(wanted),
                  "status":status,
                  "decision_kinds":sorted({str(r["kind"]) for r in rows}),
              },indent=2,sort_keys=True)+"\n"
          )
          print("V30_DATASET_PASS",json.dumps({
              "teachers":len(rows),"seeds":len(wanted),
              "kinds":sorted({str(r["kind"]) for r in rows}),
          },sort_keys=True))
          PY

      - name: Download frozen regression anchors
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V23_TRACE_ARTIFACT }}
          path: evidence/sts1/v23-trace
          github-token: ${{ github.token }}
          run-id: ${{ env.V23_TRACE_RUN_ID }}

      - name: Install, hydrate, and build pinned simulator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . numpy
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-v30
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"

      - name: Download and verify frozen G7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/g7.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$G7_ARTIFACT_ID/zip"
          mkdir -p "$RUNNER_TEMP/g7"
          unzip -q "$RUNNER_TEMP/g7.zip" -d "$RUNNER_TEMP/g7"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          elite="$(find "$RUNNER_TEMP/g7" -name elite-replay.npz -print -quit)"
          test -n "$parent"
          test -n "$elite"
          test "$(sha256sum "$parent" | awk '{print $1}')" = "$G7_WEIGHT_SHA256"

      - name: Train frozen-G7 residual adapter
        run: |
          set -euo pipefail
          out=evidence/sts1/v30-candidate
          mkdir -p "$out"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          elite="$(find "$RUNNER_TEMP/g7" -name elite-replay.npz -print -quit)"
          python scripts/sts1/sts1_build_rescue_adapter_v30.py             --armg-root .cache/sts1-v30             --base-weight "$parent"             --elite-replay "$elite"             --new-win-replay evidence/sts1/v30-data/new-win-teachers.jsonl             --preservation-replay evidence/sts1/v23-trace/preservation.jsonl             --output "$out/candidate.pt"             --report "$out/train-report.json"             --hidden-dim 32 --epochs 160 --lr 0.001             --elite-train-max 8192 --retention-eval-max 2048             --teacher-margin 0.05 --teacher-coef 4.0             --distill-coef 6.0 --zero-residual-coef 0.50             --preservation-coef 3.0 --preservation-margin 0.001             --weight-decay 0.00001 --min-fully-learned-seeds 1             --min-parent-agreement 0.995 --max-parent-kl 0.002 --max-winner-drop 0.01             --threads 4
          test -s "$out/candidate.pt"
          test -s "$out/candidate.pt.adapter.pt"

      - name: Build evaluation seeds
        run: |
          set -euo pipefail
          out=evidence/sts1/v30-candidate
          cp evidence/sts1/v30-data/training-seeds.txt "$out/training-recall5.txt"
          cp control/sts1-v22-parent-only-seeds-2.txt "$out/regression2-seeds.txt"
          grep -v '^#' control/sts1-v15-dev-seeds-50.txt | sed '/^$/d' | head -30 > "$out/dev30-contaminated.txt"
          cp control/sts1-v14-final-promotion-seeds-50.txt "$out/hidden50-seeds.txt"
          python - <<'PY'
          import random
          from pathlib import Path
          def read(path):
              return [int(x) for x in Path(path).read_text().splitlines() if x.strip() and not x.lstrip().startswith("#")]
          protected=set(read("control/sts1-v15-dev-seeds-50.txt"))
          protected.update(read("control/sts1-v14-final-promotion-seeds-50.txt"))
          protected.update(read("control/sts1-v16-benchmark-seeds-500.txt"))
          protected.update(read("evidence/sts1/v30-data/training-seeds.txt"))
          rng=random.Random(2026100130)
          fresh=[]
          while len(fresh)<100:
              x=rng.randrange(1,2_000_000_000)
              if x not in protected and x not in fresh:
                  fresh.append(x)
          Path("evidence/sts1/v30-candidate/fresh100-seeds.txt").write_text("\n".join(map(str,fresh))+"\n")
          assert len(fresh)==100 and not(set(fresh)&protected)
          PY

      - name: Training Recall5 diagnostic
        id: recall
        run: |
          set -euo pipefail
          out=evidence/sts1/v30-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe --armg-root .cache/sts1-v30             --parent-weight "$parent" --candidate-weight "$out/candidate.pt"             --seed-file "$out/training-recall5.txt" --output "$out/training-recall5.json"             --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 1.0 --label v30-training-recall5
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v30-candidate/training-recall5.json"))
          passed=(x["candidate_only_wins"]>=1 and x["parent_only_wins"]==0 and x["candidate_wins"]>x["parent_wins"])
          print("passed="+str(passed).lower())
          print("parent="+str(x["parent_wins"]))
          print("candidate="+str(x["candidate_wins"]))
          print("candidate_only="+str(x["candidate_only_wins"]))
          print("parent_only="+str(x["parent_only_wins"]))
          PY

      - name: Regression2 preservation Gate
        id: reg
        if: steps.recall.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v30-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe --armg-root .cache/sts1-v30             --parent-weight "$parent" --candidate-weight "$out/candidate.pt"             --seed-file "$out/regression2-seeds.txt" --output "$out/regression2.json"             --mcts-sims 2000 --workers 2 --min-win-delta 0 --max-pvalue 1.0 --label v30-regression2
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v30-candidate/regression2.json"))
          passed=(x["parent_wins"]==2 and x["candidate_wins"]==2 and x["parent_only_wins"]==0)
          print("passed="+str(passed).lower())
          print("parent="+str(x["parent_wins"]))
          print("candidate="+str(x["candidate_wins"]))
          PY

      - name: Dev30 contaminated diagnostic
        id: dev
        if: steps.reg.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v30-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe --armg-root .cache/sts1-v30             --parent-weight "$parent" --candidate-weight "$out/candidate.pt"             --seed-file "$out/dev30-contaminated.txt" --output "$out/dev30-contaminated.json"             --mcts-sims 2000 --workers 4 --min-win-delta 0 --max-pvalue 1.0 --label v30-dev30-contaminated
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v30-candidate/dev30-contaminated.json"))
          print("parent="+str(x["parent_wins"]))
          print("candidate="+str(x["candidate_wins"]))
          print("candidate_only="+str(x["candidate_only_wins"]))
          print("parent_only="+str(x["parent_only_wins"]))
          PY

      - name: Hidden50 unseen Gate
        id: hidden
        if: steps.reg.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v30-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe --armg-root .cache/sts1-v30             --parent-weight "$parent" --candidate-weight "$out/candidate.pt"             --seed-file "$out/hidden50-seeds.txt" --output "$out/hidden50.json"             --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 1.0 --label v30-hidden50
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v30-candidate/hidden50.json"))
          passed=(x["candidate_wins"]>x["parent_wins"] and x["candidate_only_wins"]>x["parent_only_wins"])
          print("passed="+str(passed).lower())
          print("parent="+str(x["parent_wins"]))
          print("candidate="+str(x["candidate_wins"]))
          print("candidate_only="+str(x["candidate_only_wins"]))
          print("parent_only="+str(x["parent_only_wins"]))
          PY

      - name: Fresh100 formal Gate
        id: fresh
        if: steps.hidden.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v30-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe --armg-root .cache/sts1-v30             --parent-weight "$parent" --candidate-weight "$out/candidate.pt"             --seed-file "$out/fresh100-seeds.txt" --output "$out/fresh100.json"             --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 0.10 --label v30-fresh100
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v30-candidate/fresh100.json"))
          print("passed="+str(x["pass"]).lower())
          print("parent="+str(x["parent_wins"]))
          print("candidate="+str(x["candidate_wins"]))
          print("pvalue="+str(x["paired_sign_pvalue_one_sided"]))
          PY

      - name: Heldout500 formal Gate
        id: h500
        if: steps.fresh.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v30-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe --armg-root .cache/sts1-v30             --parent-weight "$parent" --candidate-weight "$out/candidate.pt"             --seed-file control/sts1-v16-benchmark-seeds-500.txt --output "$out/heldout500.json"             --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 0.10 --label v30-heldout500

      - name: Write v3.0 summary
        if: always()
        env:
          RECALL: ${{ steps.recall.outputs.passed }}
          RECALL_PARENT: ${{ steps.recall.outputs.parent }}
          RECALL_CAND: ${{ steps.recall.outputs.candidate }}
          RECALL_CONLY: ${{ steps.recall.outputs.candidate_only }}
          RECALL_PONLY: ${{ steps.recall.outputs.parent_only }}
          REG: ${{ steps.reg.outputs.passed }}
          DEV_PARENT: ${{ steps.dev.outputs.parent }}
          DEV_CAND: ${{ steps.dev.outputs.candidate }}
          DEV_CONLY: ${{ steps.dev.outputs.candidate_only }}
          DEV_PONLY: ${{ steps.dev.outputs.parent_only }}
          HID: ${{ steps.hidden.outputs.passed }}
          HID_PARENT: ${{ steps.hidden.outputs.parent }}
          HID_CAND: ${{ steps.hidden.outputs.candidate }}
          HID_CONLY: ${{ steps.hidden.outputs.candidate_only }}
          HID_PONLY: ${{ steps.hidden.outputs.parent_only }}
          FRESH: ${{ steps.fresh.outputs.passed }}
          FRESH_PARENT: ${{ steps.fresh.outputs.parent }}
          FRESH_CAND: ${{ steps.fresh.outputs.candidate }}
          FRESH_P: ${{ steps.fresh.outputs.pvalue }}
          H500: ${{ steps.h500.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path("evidence/sts1/v30-candidate")
          out.mkdir(parents=True,exist_ok=True)
          train={}
          if (out/"train-report.json").exists():
              train=json.loads((out/"train-report.json").read_text())
          summary={
              "schema_version":"sts1-build-rescue-v30-summary",
              "parent":"G7",
              "training":train.get("after",{}),
              "selected_epoch":train.get("selected_epoch"),
              "training_recall5":{
                  "pass":os.environ.get("RECALL")=="true","parent":os.environ.get("RECALL_PARENT"),
                  "candidate":os.environ.get("RECALL_CAND"),"candidate_only":os.environ.get("RECALL_CONLY"),
                  "parent_only":os.environ.get("RECALL_PONLY"),
              },
              "regression2_pass":os.environ.get("REG")=="true",
              "dev30_contaminated":{
                  "parent":os.environ.get("DEV_PARENT"),"candidate":os.environ.get("DEV_CAND"),
                  "candidate_only":os.environ.get("DEV_CONLY"),"parent_only":os.environ.get("DEV_PONLY"),
                  "promotion_evidence":False,
              },
              "hidden50":{
                  "pass":os.environ.get("HID")=="true","parent":os.environ.get("HID_PARENT"),
                  "candidate":os.environ.get("HID_CAND"),"candidate_only":os.environ.get("HID_CONLY"),
                  "parent_only":os.environ.get("HID_PONLY"),
              },
              "fresh100":{
                  "pass":os.environ.get("FRESH")=="true","parent":os.environ.get("FRESH_PARENT"),
                  "candidate":os.environ.get("FRESH_CAND"),"pvalue":os.environ.get("FRESH_P"),
              },
              "heldout500_outcome":os.environ.get("H500"),
          }
          summary["readiness"]="READY_FOR_REAL_GAME_GATE" if summary["heldout500_outcome"]=="success" else "HOLD_PARENT"
          (out/"summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("V30_FINAL",json.dumps(summary,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sts1-v30-adapter-${{ github.run_id }}
          path: evidence/sts1/v30-candidate/
          if-no-files-found: warn
          retention-days: 90

      - name: Report v3.0 status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/body.txt"
          import json
          from pathlib import Path
          print("@ericpeng0604-coder")
          print()
          print("## Build Rescue v3.0 Residual Adapter")
          p=Path("evidence/sts1/v30-candidate/summary.json")
          if not p.exists():
              print("- Pipeline failed before final summary. G7 remains unchanged.")
          else:
              x=json.loads(p.read_text())
              r=x["training_recall5"]
              print(f"- Training Recall5: Parent **{r.get('parent')}/5** / Candidate **{r.get('candidate')}/5** / Candidate-only={r.get('candidate_only')} / Parent-only={r.get('parent_only')} / PASS={r.get('pass')}")
              print(f"- Regression2 PASS: **{x['regression2_pass']}**")
              d=x["dev30_contaminated"]
              print(f"- Dev30 (TRAIN-CONTAMINATED; not promotion evidence): Parent **{d.get('parent')}/30** / Candidate **{d.get('candidate')}/30**")
              h=x["hidden50"]
              print(f"- Hidden50 unseen: Parent **{h.get('parent')}/50** / Candidate **{h.get('candidate')}/50** / Candidate-only={h.get('candidate_only')} / Parent-only={h.get('parent_only')} / PASS={h.get('pass')}")
              f=x["fresh100"]
              print(f"- Fresh100: Parent **{f.get('parent')}/100** / Candidate **{f.get('candidate')}/100** / p={f.get('pvalue')} / PASS={f.get('pass')}")
              print(f"- Heldout500 outcome: **{x.get('heldout500_outcome')}**")
              print(f"- Final readiness: **{x.get('readiness')}**")
          print("- G7 remains unchanged unless unseen formal gates pass.")
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/15/comments" -f body="$(cat "$RUNNER_TEMP/body.txt")"
