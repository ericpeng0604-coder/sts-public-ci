name: STS1 Build Rescue v3.2 Regression-Safe Repair

on:
  push:
    branches:
      - gpt/sts1-build-rescue-v22-antiforget-20260930
    paths:
      - control/sts1-build-rescue-v32-regression-safe.trigger
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  V31_RUN_ID: '36804227660'
  V31_CANDIDATE_ARTIFACT: 'sts1-v31-candidate-36804227660'
  V31_TEACHERS_ARTIFACT: 'sts1-v31-teachers-36804227660'
  V23_TRACE_RUN_ID: '36722951474'
  V23_TRACE_ARTIFACT: 'sts1-v23-regression-trace-36722951474'
  G7_ARTIFACT_ID: '11079234863'
  G7_WEIGHT_SHA256: '8313c99d9b0ab0c0d206fdd2f744fed11f4104d440dcb465cf7c78a517f9ccd0'
  SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'

concurrency:
  group: sts1-build-rescue-v32-regression-safe
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static v3.2 regression-safe contract
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/sts1/sts1_build_rescue_adapter_v32.py \
            scripts/sts1/sts1_build_rescue_regression_trace.py \
            scripts/sts1/sts1_build_rescue_gate_v21.py
          grep -q -- '--init-adapter-sidecar' scripts/sts1/sts1_build_rescue_adapter_v32.py
          grep -q -- '--min-preservation-margin' scripts/sts1/sts1_build_rescue_adapter_v32.py
          echo V32_REGRESSION_SAFE_CONTRACT_PASS

      - name: Download v3.1 candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V31_CANDIDATE_ARTIFACT }}
          path: evidence/sts1/v31-source
          github-token: ${{ github.token }}
          run-id: ${{ env.V31_RUN_ID }}

      - name: Download v3.1 New-Win teachers
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V31_TEACHERS_ARTIFACT }}
          path: evidence/sts1/v31-teachers
          github-token: ${{ github.token }}
          run-id: ${{ env.V31_RUN_ID }}

      - name: Download frozen v2.3 preservation anchors
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V23_TRACE_ARTIFACT }}
          path: evidence/sts1/v23-trace
          github-token: ${{ github.token }}
          run-id: ${{ env.V23_TRACE_RUN_ID }}

      - name: Install, hydrate, and build pinned simulator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . numpy
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-v32-repair
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"

      - name: Download and verify frozen G7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o "$RUNNER_TEMP/g7.zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$G7_ARTIFACT_ID/zip"
          mkdir -p "$RUNNER_TEMP/g7"
          unzip -q "$RUNNER_TEMP/g7.zip" -d "$RUNNER_TEMP/g7"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          elite="$(find "$RUNNER_TEMP/g7" -name elite-replay.npz -print -quit)"
          test -n "$parent"
          test -n "$elite"
          test "$(sha256sum "$parent" | awk '{print $1}')" = "$G7_WEIGHT_SHA256"

      - name: Trace v3.1 lost G7 win
        run: |
          set -euo pipefail
          out=evidence/sts1/v32-repair
          mkdir -p "$out"
          printf '%s\n' 148131968 > "$out/lost-regression-seed.txt"
          cp control/sts1-v22-parent-only-seeds-2.txt "$out/regression2-seeds.txt"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_regression_trace.py \
            --module-dir external/sts_lightspeed/source/build-probe \
            --armg-root .cache/sts1-v32-repair \
            --parent-weight "$parent" \
            --candidate-weight evidence/sts1/v31-source/candidate.pt \
            --seed-file "$out/lost-regression-seed.txt" \
            --heldout-seeds-file "$out/regression2-seeds.txt" \
            --output "$out/v31-regression-trace.json" \
            --preservation-output "$out/v31-repair-anchor.jsonl"
          test "$(wc -l < "$out/v31-repair-anchor.jsonl")" -eq 1

      - name: Build combined preservation memory
        run: |
          set -euo pipefail
          out=evidence/sts1/v32-repair
          cat evidence/sts1/v23-trace/preservation.jsonl "$out/v31-repair-anchor.jsonl" > "$out/preservation-combined.jsonl"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/sts1/v32-repair/preservation-combined.jsonl")
          rows=[json.loads(x) for x in p.read_text().splitlines() if x.strip()]
          assert len(rows)>=3
          assert any(int(x["seed"])==148131968 for x in rows)
          print("V32_COMBINED_PRESERVATION_PASS",len(rows))
          PY

      - name: Warm-repair v3.1 adapter
        run: |
          set -euo pipefail
          out=evidence/sts1/v32-repair
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          elite="$(find "$RUNNER_TEMP/g7" -name elite-replay.npz -print -quit)"
          python scripts/sts1/sts1_build_rescue_adapter_v32.py \
            --armg-root .cache/sts1-v32-repair \
            --base-weight "$parent" \
            --elite-replay "$elite" \
            --new-win-replay evidence/sts1/v31-teachers/new-win-teachers.jsonl \
            --preservation-replay "$out/preservation-combined.jsonl" \
            --init-adapter-sidecar evidence/sts1/v31-source/candidate.pt.adapter.pt \
            --output "$out/candidate.pt" \
            --report "$out/train-report.json" \
            --hidden-dim 48 --epochs 120 --lr 0.00025 \
            --elite-train-max 8192 --retention-eval-max 2048 \
            --teacher-margin 0.05 --teacher-coef 4.0 --distill-coef 8.0 \
            --zero-residual-coef 0.75 --preservation-coef 12.0 \
            --preservation-margin 0.04 --min-preservation-margin 0.03 \
            --weight-decay 0.00001 --min-fully-learned-seeds 10 \
            --min-parent-agreement 0.995 --max-parent-kl 0.002 \
            --max-winner-drop 0.01 --threads 4
          test -s "$out/candidate.pt"
          test -s "$out/candidate.pt.adapter.pt"

      - name: Build evaluation seed files
        run: |
          set -euo pipefail
          out=evidence/sts1/v32-repair
          cp evidence/sts1/v31-teachers/teacher-seeds.txt "$out/training-recall.txt"
          cp control/sts1-v14-final-promotion-seeds-50.txt "$out/hidden50-seeds.txt"
          python - <<'PY'
          import random
          from pathlib import Path
          def read(path):
              return [int(x) for x in Path(path).read_text().splitlines() if x.strip() and not x.lstrip().startswith("#")]
          protected=set(read("control/sts1-v31-train-seeds-80.txt"))
          protected.update(read("control/sts1-v15-dev-seeds-50.txt"))
          protected.update(read("control/sts1-v14-final-promotion-seeds-50.txt"))
          protected.update(read("control/sts1-v16-benchmark-seeds-500.txt"))
          rng=random.Random(2026100132)
          fresh=[]
          while len(fresh)<100:
              x=rng.randrange(1,2_000_000_000)
              if x not in protected and x not in fresh:
                  fresh.append(x)
          Path("evidence/sts1/v32-repair/fresh100-seeds.txt").write_text("\n".join(map(str,fresh))+"\n")
          PY

      - name: New-Win Recall 4/12 Gate
        id: recall
        run: |
          set -euo pipefail
          out=evidence/sts1/v32-repair
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py \
            --module-dir external/sts_lightspeed/source/build-probe \
            --armg-root .cache/sts1-v32-repair \
            --parent-weight "$parent" --candidate-weight "$out/candidate.pt" \
            --seed-file "$out/training-recall.txt" --output "$out/training-recall.json" \
            --mcts-sims 2000 --workers 4 --min-win-delta 4 --max-pvalue 1.0 \
            --label v32-new-win-recall
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v32-repair/training-recall.json"))
          passed=(x["candidate_wins"]>=4 and x["candidate_only_wins"]>=4 and x["parent_only_wins"]==0)
          print("passed="+str(passed).lower())
          print("candidate="+str(x["candidate_wins"]))
          print("candidate_only="+str(x["candidate_only_wins"]))
          print("parent_only="+str(x["parent_only_wins"]))
          PY

      - name: Regression2 must be 2/2
        id: reg
        if: steps.recall.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v32-repair
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py \
            --module-dir external/sts_lightspeed/source/build-probe \
            --armg-root .cache/sts1-v32-repair \
            --parent-weight "$parent" --candidate-weight "$out/candidate.pt" \
            --seed-file "$out/regression2-seeds.txt" --output "$out/regression2.json" \
            --mcts-sims 2000 --workers 2 --min-win-delta 0 --max-pvalue 1.0 \
            --label v32-regression2
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v32-repair/regression2.json"))
          passed=(x["parent_wins"]==2 and x["candidate_wins"]==2 and x["parent_only_wins"]==0)
          print("passed="+str(passed).lower())
          print("candidate="+str(x["candidate_wins"]))
          print("parent_only="+str(x["parent_only_wins"]))
          PY

      - name: Hidden50 unseen Gate
        id: hidden
        if: steps.reg.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v32-repair
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py \
            --module-dir external/sts_lightspeed/source/build-probe \
            --armg-root .cache/sts1-v32-repair \
            --parent-weight "$parent" --candidate-weight "$out/candidate.pt" \
            --seed-file "$out/hidden50-seeds.txt" --output "$out/hidden50.json" \
            --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 1.0 \
            --label v32-hidden50
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v32-repair/hidden50.json"))
          passed=(x["candidate_wins"]>x["parent_wins"] and x["candidate_only_wins"]>x["parent_only_wins"])
          print("passed="+str(passed).lower())
          print("parent="+str(x["parent_wins"]))
          print("candidate="+str(x["candidate_wins"]))
          print("candidate_only="+str(x["candidate_only_wins"]))
          print("parent_only="+str(x["parent_only_wins"]))
          PY

      - name: Fresh100 formal Gate
        id: fresh
        if: steps.hidden.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v32-repair
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py \
            --module-dir external/sts_lightspeed/source/build-probe \
            --armg-root .cache/sts1-v32-repair \
            --parent-weight "$parent" --candidate-weight "$out/candidate.pt" \
            --seed-file "$out/fresh100-seeds.txt" --output "$out/fresh100.json" \
            --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 0.10 \
            --label v32-fresh100
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v32-repair/fresh100.json"))
          print("passed="+str(x["pass"]).lower())
          print("parent="+str(x["parent_wins"]))
          print("candidate="+str(x["candidate_wins"]))
          print("pvalue="+str(x["paired_sign_pvalue_one_sided"]))
          PY

      - name: Heldout500 formal Gate
        id: h500
        if: steps.fresh.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v32-repair
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py \
            --module-dir external/sts_lightspeed/source/build-probe \
            --armg-root .cache/sts1-v32-repair \
            --parent-weight "$parent" --candidate-weight "$out/candidate.pt" \
            --seed-file control/sts1-v16-benchmark-seeds-500.txt \
            --output "$out/heldout500.json" \
            --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 0.10 \
            --label v32-heldout500

      - name: Write v3.2 summary
        if: always()
        env:
          RECALL: ${{ steps.recall.outputs.passed }}
          REG: ${{ steps.reg.outputs.passed }}
          HID: ${{ steps.hidden.outputs.passed }}
          FRESH: ${{ steps.fresh.outputs.passed }}
          H500: ${{ steps.h500.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path("evidence/sts1/v32-repair"); out.mkdir(parents=True,exist_ok=True)
          def read(name):
              p=out/name
              return json.loads(p.read_text()) if p.exists() else None
          summary={
            "schema_version":"sts1-v32-regression-safe-summary",
            "parent":"G7","source_v31_run":36804227660,
            "training_recall":read("training-recall.json"),
            "regression2":read("regression2.json"),
            "hidden50":read("hidden50.json"),
            "fresh100":read("fresh100.json"),
            "heldout500":read("heldout500.json"),
            "training_recall_pass":os.environ.get("RECALL")=="true",
            "regression2_pass":os.environ.get("REG")=="true",
            "hidden50_pass":os.environ.get("HID")=="true",
            "fresh100_pass":os.environ.get("FRESH")=="true",
            "heldout500_outcome":os.environ.get("H500"),
          }
          summary["readiness"]="READY_FOR_REAL_GAME_GATE" if summary["heldout500_outcome"]=="success" else "HOLD_PARENT"
          (out/"summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("V32_FINAL",json.dumps(summary,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sts1-v32-regression-safe-${{ github.run_id }}
          path: evidence/sts1/v32-repair/
          if-no-files-found: warn
          retention-days: 90

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RECALL: ${{ steps.recall.outputs.passed }}
          RECALL_WINS: ${{ steps.recall.outputs.candidate }}
          REG: ${{ steps.reg.outputs.passed }}
          REG_WINS: ${{ steps.reg.outputs.candidate }}
          HID: ${{ steps.hidden.outputs.passed }}
          FRESH: ${{ steps.fresh.outputs.passed }}
          H500: ${{ steps.h500.outcome }}
        run: |
          body="@ericpeng0604-coder

          ## Build Rescue v3.2 Regression-Safe Repair
          - Source: v3.1 Run #36804227660
          - Warm-started from the v3.1 residual adapter.
          - Lost G7 win seed: **148131968**
          - New-Win Recall: **${RECALL_WINS:-n/a}/12** (target >=4/12): ${RECALL:-false}
          - Regression2: **${REG_WINS:-n/a}/2** (target 2/2): ${REG:-false}
          - Hidden50: ${HID:-not-run}
          - Fresh100: ${FRESH:-not-run}
          - Heldout500: ${H500:-not-run}
          - G7 Champion is unchanged."
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/15/comments" -f body="$body"
