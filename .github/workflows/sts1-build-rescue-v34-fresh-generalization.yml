name: STS1 Build Rescue v3.4 Fresh Generalization

on:
  push:
    branches:
      - gpt/sts1-build-rescue-v22-antiforget-20260930
    paths:
      - control/sts1-build-rescue-v34-fresh-generalization.trigger
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  G7_ARTIFACT_ID: '11079234863'
  G7_WEIGHT_SHA256: '8313c99d9b0ab0c0d206fdd2f744fed11f4104d440dcb465cf7c78a517f9ccd0'
  V23_TRACE_RUN_ID: '36722951474'
  V23_TRACE_ARTIFACT: 'sts1-v23-regression-trace-36722951474'
  SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'

concurrency:
  group: sts1-build-rescue-v34-fresh-generalization
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      recovery_run_id: ${{ steps.recovery.outputs.run_id }}
      train_only: ${{ steps.recovery.outputs.train_only }}
      trace_only: ${{ steps.recovery.outputs.trace_only }}
      trace_candidate_run: ${{ steps.recovery.outputs.trace_candidate_run }}
      regression_trace_run: ${{ steps.recovery.outputs.regression_trace_run }}
      recovery_teacher_count: ${{ steps.matrix.outputs.recovery_teacher_count }}
      recovery_teacher_seed_count: ${{ steps.matrix.outputs.recovery_teacher_seed_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect explicit v3.4 artifact recovery
        id: recovery
        run: |
          marker=control/sts1-build-rescue-v34-fresh-generalization.trigger
          run_id=""
          trace_candidate_run=""
          regression_trace_run=""
          train_only=false
          trace_only=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -f "$marker" ]; then
            run_id="$(sed -n 's/^resume_from_run=//p' "$marker" | tail -n 1)"
            mode="$(sed -n 's/^recovery_mode=//p' "$marker" | tail -n 1)"
            if [ "$mode" = "train_only" ]; then
              train_only=true
              regression_trace_run="$(sed -n 's/^regression_trace_run=//p' "$marker" | tail -n 1)"
            fi
            if [ "$mode" = "trace_only" ]; then
              train_only=true
              trace_only=true
              trace_candidate_run="$(sed -n 's/^trace_candidate_run=//p' "$marker" | tail -n 1)"
            fi
          fi
          if ! [[ "$run_id" =~ ^[0-9]+$ ]]; then run_id=""; train_only=false; trace_only=false; trace_candidate_run=""; fi
          if [ "$trace_only" = true ] && ! [[ "$trace_candidate_run" =~ ^[0-9]+$ ]]; then
            echo "trace_only requires a numeric trace_candidate_run"
            exit 1
          fi
          if [ -n "$regression_trace_run" ] && ! [[ "$regression_trace_run" =~ ^[0-9]+$ ]]; then
            echo "regression_trace_run must be numeric"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "train_only=$train_only" >> "$GITHUB_OUTPUT"
          echo "trace_only=$trace_only" >> "$GITHUB_OUTPUT"
          echo "trace_candidate_run=$trace_candidate_run" >> "$GITHUB_OUTPUT"
          echo "regression_trace_run=$regression_trace_run" >> "$GITHUB_OUTPUT"
          echo "V34_RECOVERY_RUN_ID=$run_id TRAIN_ONLY=$train_only TRACE_ONLY=$trace_only CANDIDATE_RUN=$trace_candidate_run REGRESSION_TRACE_RUN=$regression_trace_run"
      - name: Validate v3.4 isolated training contracts
        run: |
          set -euo pipefail
          python -m py_compile scripts/sts1/sts1_build_rescue_screen_v31.py scripts/sts1/sts1_build_rescue_new_win_miner_v24.py scripts/sts1/sts1_build_rescue_adapter_v34.py
          python -m py_compile scripts/sts1/sts1_build_rescue_v34_seed_ledger.py scripts/sts1/sts1_build_rescue_v34_aggregate.py scripts/sts1/sts1_build_rescue_regression_trace.py
          python scripts/sts1/sts1_build_rescue_v34_seed_ledger.py --output-dir evidence/sts1/v34-screen
          test "$(wc -l < evidence/sts1/v34-screen/train160.txt)" -eq 160
          test "$(wc -l < evidence/sts1/v34-screen/gate50.txt)" -eq 50
          test "$(wc -l < evidence/sts1/v34-screen/fresh100.txt)" -eq 100
          test "$(wc -l < evidence/sts1/v34-screen/fresh500.txt)" -eq 500
          python - <<'PY'
          from pathlib import Path
          s=Path("scripts/sts1/sts1_build_rescue_screen_v31.py").read_text()
          m=Path("scripts/sts1/sts1_build_rescue_new_win_miner_v24.py").read_text()
          a=Path("scripts/sts1/sts1_build_rescue_adapter_v34.py").read_text()
          required=[
              ("screen",s,["V31_SCREEN_PASS","priority-output","priority-count"]),
              ("miner",m,["V24_NEW_WIN_MINER_RESULT","boss_sims=50000","NEW_FULL_WIN","StaleForcedAction","seed_timeout_seconds","completed_variants"]),
              ("adapter",a,["V30_ADAPTER_TRAIN_PASS",".adapter.pt","fully_learned_seeds"]),
          ]
          missing={name:[x for x in req if x not in body] for name,body,req in required}
          missing={k:v for k,v in missing.items() if v}
          if missing:
              raise SystemExit(f"v3.1 contract missing: {missing}")
          print("V34_CONTRACT_PASS")
          PY
      - name: Install, hydrate, and build pinned simulator
        if: steps.recovery.outputs.run_id == ''
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . numpy
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-v34
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
      - name: Download and verify frozen G7
        if: steps.recovery.outputs.run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/g7.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$G7_ARTIFACT_ID/zip"
          mkdir -p "$RUNNER_TEMP/g7"
          unzip -q "$RUNNER_TEMP/g7.zip" -d "$RUNNER_TEMP/g7"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          test -n "$parent"
          test "$(sha256sum "$parent" | awk '{print $1}')" = "$G7_WEIGHT_SHA256"
      - name: Screen disjoint 160-seed training pool
        if: steps.recovery.outputs.run_id == ''
        run: |
          set -euo pipefail
          mkdir -p evidence/sts1/v34-screen
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_screen_v31.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v34             --weight "$parent"             --seed-file evidence/sts1/v34-screen/train160.txt             --output evidence/sts1/v34-screen/screen.json             --priority-output evidence/sts1/v34-screen/priority40.txt             --priority-count 40 --workers 4
      - name: Restore frozen screen artifact for recovery
        if: steps.recovery.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: sts1-v34-screen-${{ steps.recovery.outputs.run_id }}
          path: evidence/sts1/v34-screen/
          github-token: ${{ github.token }}
          run-id: ${{ steps.recovery.outputs.run_id }}
      - name: Restore completed Rescue artifacts for recovery
        if: steps.recovery.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: v34-mine-*
          path: evidence/sts1/v34-recovered/
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ steps.recovery.outputs.run_id }}
      - name: Build mining matrix
        id: matrix
        env:
          RECOVERY_RUN_ID: ${{ steps.recovery.outputs.run_id }}
          TRAIN_ONLY: ${{ steps.recovery.outputs.train_only }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,os
          from pathlib import Path
          seeds=[int(x) for x in Path("evidence/sts1/v34-screen/priority40.txt").read_text().split()]
          if len(seeds)!=40 or len(set(seeds))!=40:
              raise SystemExit("priority40 contract failed")
          pending=seeds
          if os.environ.get("RECOVERY_RUN_ID"):
              import subprocess,sys
              root=Path("evidence/sts1/v34-recovered")
              validation=Path("evidence/sts1/v34-recovery-validation")
              log_path=validation/"recovery-aggregate.log"
              validation.mkdir(parents=True,exist_ok=True)
              command=[
                  sys.executable,"scripts/sts1/sts1_build_rescue_v34_aggregate.py",
                  "--results-dir",str(root),"--screen-dir","evidence/sts1/v34-screen",
                  "--output-dir",str(validation),
              ]
              with log_path.open("w") as log:
                  completed=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT)
              if completed.returncode:
                  raise SystemExit(f"strict recovery Aggregate failed; see {log_path}")
              failures=json.loads((validation/"failed-seeds.json").read_text())
              invalid={int(row["seed"]) for row in failures if int(row["seed"])>=0}
              unexpected=invalid-set(seeds)
              if unexpected or any(int(row["seed"])<0 for row in failures):
                  raise SystemExit(f"recovered artifacts contain unexpected or unassigned results: {failures}")
              train_only=os.environ.get("TRAIN_ONLY")=="true"
              pending=[0] if train_only else [seed for seed in seeds if seed in invalid]
              if not train_only:
                  for seed in pending:
                      (root/f"result-{seed}.json").unlink(missing_ok=True)
                      (root/f"teacher-{seed}.jsonl").unlink(missing_ok=True)
              recovery_summary=json.loads((validation/"summary.json").read_text())
              teacher_count=int(recovery_summary["teacher_examples"])
              teacher_seed_count=int(recovery_summary["teacher_seeds"])
              if train_only:
                  canonical=Path("evidence/sts1/v34-data")
                  canonical.mkdir(parents=True,exist_ok=True)
                  for name in ("summary.json","new-win-teachers.jsonl","teacher-seeds.txt","failed-seeds.json"):
                      src=validation/name
                      if src.is_file():
                          (canonical/name).write_bytes(src.read_bytes())
              print("V34_RECOVERY",json.dumps({
                  "source_run":os.environ["RECOVERY_RUN_ID"],
                  "validated_results":len(seeds)-len(invalid),"pending":pending,
                  "train_only":train_only,
                  "teacher_count":teacher_count,
                  "teacher_seed_count":teacher_seed_count,
              },sort_keys=True),file=sys.stderr)
              print("recovery_teacher_count="+str(teacher_count))
              print("recovery_teacher_seed_count="+str(teacher_seed_count))
          else:
              print("recovery_teacher_count=0")
              print("recovery_teacher_seed_count=0")
          print("matrix="+json.dumps(pending,separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sts1-v34-screen-${{ github.run_id }}
          path: evidence/sts1/v34-screen/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: steps.recovery.outputs.run_id != ''
        with:
          name: v34-mine-recovered-${{ github.run_id }}
          path: evidence/sts1/v34-recovered/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: steps.recovery.outputs.train_only == 'true'
        with:
          name: sts1-v34-teachers-${{ github.run_id }}
          path: evidence/sts1/v34-data/
          if-no-files-found: error
          retention-days: 90
  mine:
    needs: screen
    if: ${{ needs.screen.outputs.train_only != 'true' && needs.screen.outputs.trace_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: ${{ fromJSON(needs.screen.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and hydrate pinned runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . numpy
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-v34
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
      - name: Download frozen G7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/g7.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$G7_ARTIFACT_ID/zip"
          mkdir -p "$RUNNER_TEMP/g7"
          unzip -q "$RUNNER_TEMP/g7.zip" -d "$RUNNER_TEMP/g7"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          test -n "$parent"
          test "$(sha256sum "$parent" | awk '{print $1}')" = "$G7_WEIGHT_SHA256"
      - uses: actions/download-artifact@v4
        with:
          name: sts1-v34-screen-${{ github.run_id }}
          path: evidence/sts1/v34-screen/
      - name: Restore seed checkpoint for recovery
        if: needs.screen.outputs.recovery_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: v34-mine-recovered-${{ github.run_id }}
          path: evidence/sts1/v34-prior/
      - name: Copy prior checkpoint when available
        if: needs.screen.outputs.recovery_run_id != ''
        env:
          SEED: ${{ matrix.seed }}
        run: |
          mkdir -p evidence/sts1/v34-mine
          source="evidence/sts1/v34-prior/checkpoint-$SEED.json"
          if [ -s "$source" ]; then
            cp "$source" "evidence/sts1/v34-mine/checkpoint-$SEED.json"
            echo "V34_CHECKPOINT_RESTORED seed=$SEED"
          fi
      - name: Mine isolated priority Seed
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -uo pipefail
          mkdir -p evidence/sts1/v34-mine
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          result="evidence/sts1/v34-mine/result-$SEED.json"
          teacher="evidence/sts1/v34-mine/teacher-$SEED.jsonl"
          checkpoint="evidence/sts1/v34-mine/checkpoint-$SEED.json"
          for pass in 1 2; do
            if python scripts/sts1/sts1_build_rescue_new_win_miner_v24.py \
              --module-dir external/sts_lightspeed/source/build-probe \
              --armg-root .cache/sts1-v34 \
              --weight "$parent" \
              --heldout-seeds-file evidence/sts1/v34-screen/train160.txt \
              --seed "$SEED" --output "$result" --teacher-output "$teacher" \
              --checkpoint "$checkpoint" --seed-timeout-seconds 2400 \
              --max-states 20 --max-alternatives 2 \
              --max-two-step-states 8 --max-second-states 4 --max-second-alternatives 2 \
              --timeout-seconds 120 --retries 1; then
              rc=0
            else
              rc=$?
            fi
            if [ "$rc" -ne 0 ] || [ ! -s "$result" ]; then
              python - "$SEED" "$rc" "$result" "$teacher" <<'PY'
          import json,sys
          from pathlib import Path
          seed,rc=int(sys.argv[1]),int(sys.argv[2])
          Path(sys.argv[3]).write_text(json.dumps({
              "seed":seed,"status":"SEED_SEARCH_FAILURE","teachers":[],
              "failures":[{"kind":"python_exception","exit_code":rc,"message":"miner exited without a validated result"}],
          },indent=2,sort_keys=True)+"\n")
          Path(sys.argv[4]).write_text("")
          PY
              break
            fi
            status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$result")"
            if [ "$status" != "SEED_SEARCH_INCOMPLETE" ]; then break; fi
            echo "V34_SEED_CHECKPOINT_RESUME seed=$SEED pass=$pass"
          done
          test -s "$result"
          test -f "$teacher"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v34-mine-${{ matrix.seed }}
          path: evidence/sts1/v34-mine/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [screen, mine]
    if: always() && needs.screen.result == 'success' && needs.screen.outputs.trace_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      teacher_count: ${{ steps.agg.outputs.teacher_count }}
      teacher_seed_count: ${{ steps.agg.outputs.teacher_seed_count }}
      failed_seed_count: ${{ steps.agg.outputs.failed_seed_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: v34-mine-*
          path: evidence/sts1/v34-all
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sts1-v34-screen-${{ github.run_id }}
          path: evidence/sts1/v34-screen/
      - name: Aggregate strictly verified isolated Teachers
        id: agg
        run: |
          set -euo pipefail
          mkdir -p evidence/sts1/v34-data
          python scripts/sts1/sts1_build_rescue_v34_aggregate.py \
            --results-dir evidence/sts1/v34-all \
            --screen-dir evidence/sts1/v34-screen \
            --output-dir evidence/sts1/v34-data | tee "$RUNNER_TEMP/agg.out"
          grep '^teacher_count=' "$RUNNER_TEMP/agg.out" >> "$GITHUB_OUTPUT"
          grep '^teacher_seed_count=' "$RUNNER_TEMP/agg.out" >> "$GITHUB_OUTPUT"
          grep '^failed_seed_count=' "$RUNNER_TEMP/agg.out" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: sts1-v34-teachers-${{ github.run_id }}
          path: evidence/sts1/v34-data/
          if-no-files-found: error
          retention-days: 90

  trace-regression:
    needs: screen
    if: ${{ always() && needs.screen.result == 'success' && needs.screen.outputs.trace_only == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download failed Candidate artifact for read-only trace
        uses: actions/download-artifact@v4
        with:
          name: sts1-v34-candidate-${{ needs.screen.outputs.trace_candidate_run }}
          path: evidence/sts1/v34-source/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.screen.outputs.trace_candidate_run }}
      - name: Install and build pinned simulator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . numpy
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-v34
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
      - name: Download and verify frozen G7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/g7.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$G7_ARTIFACT_ID/zip"
          mkdir -p "$RUNNER_TEMP/g7"
          unzip -q "$RUNNER_TEMP/g7.zip" -d "$RUNNER_TEMP/g7"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          test -s "$parent"
          test "$(sha256sum "$parent" | awk '{print $1}')" = "$G7_WEIGHT_SHA256"
      - name: Trace the first changed decision on failed regression Seeds
        run: |
          set -euo pipefail
          out=evidence/sts1/v34-source
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/sts1/v34-source/regression2.json')
          x=json.loads(p.read_text())
          seeds=[int(r['seed']) for r in x['rows'] if str(r['parent']['outcome']).lower()=='victory' and str(r['candidate']['outcome']).lower()!='victory']
          if not seeds: raise SystemExit('no parent-only regression Seed to diagnose')
          Path('evidence/sts1/v34-source/regression2-lost-seeds.txt').write_text(''.join(f'{s}\n' for s in seeds))
          print('V34_TRACE_TARGET_SEEDS',seeds)
          PY
          python scripts/sts1/sts1_build_rescue_regression_trace.py --module-dir external/sts_lightspeed/source/build-probe --armg-root .cache/sts1-v34 --parent-weight "$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)" --candidate-weight "$out/candidate.pt" --seed-file "$out/regression2-lost-seeds.txt" --heldout-seeds-file "$out/regression2-seeds.txt" --output "$out/regression2-trace.json" --preservation-output "$out/regression2-anchors.jsonl"
      - name: Report trace and upload evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/v34-trace-comment.txt"
          import json
          from pathlib import Path
          root=Path('evidence/sts1/v34-source')
          report=json.loads((root/'regression2-trace.json').read_text())
          print('@ericpeng0604-coder')
          print('\n## STS1 v3.4 Regression Trace')
          for row in report['rows']:
              d=row.get('first_divergence') or {}
              print(f"- Seed {row['seed']}: G7 {row['parent_outcome']}, Candidate {row['candidate_outcome']}; first difference Act {d.get('act_parent','?')} floor {d.get('floor_parent','?')} {d.get('kind_parent','unknown')}; G7={d.get('parent_choice')}, Candidate={d.get('candidate_choice')}; anchor={row.get('preservation_anchor_created',False)}")
          print('- Trace is diagnostic only; no formal fresh Gate Seed was added to Teacher training.')
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/15/comments" -F "body=@$RUNNER_TEMP/v34-trace-comment.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: sts1-v34-regression-trace-${{ github.run_id }}
          path: evidence/sts1/v34-source/
          if-no-files-found: error
          retention-days: 90

  train:
    needs: [aggregate, screen]
    if: ${{ always() && needs.screen.result == 'success' && ((needs.aggregate.result == 'success' && fromJSON(needs.aggregate.outputs.teacher_seed_count) >= 6) || (needs.screen.outputs.train_only == 'true' && fromJSON(needs.screen.outputs.recovery_teacher_seed_count) >= 6)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: sts1-v34-teachers-${{ github.run_id }}
          path: evidence/sts1/v34-data
      - uses: actions/download-artifact@v4
        with:
          name: sts1-v34-screen-${{ github.run_id }}
          path: evidence/sts1/v34-screen/
      - uses: actions/download-artifact@v4
        with:
          name: sts1-v31-teachers-36804227660
          path: evidence/sts1/v31-frozen/
          github-token: ${{ github.token }}
          run-id: '36804227660'
      - uses: actions/download-artifact@v4
        with:
          name: sts1-v322-active-repair-36823568672
          path: evidence/sts1/v322-frozen/
          github-token: ${{ github.token }}
          run-id: '36823568672'
      - name: Download frozen regression anchors
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V23_TRACE_ARTIFACT }}
          path: evidence/sts1/v23-trace
          github-token: ${{ github.token }}
          run-id: ${{ env.V23_TRACE_RUN_ID }}
      - name: Download verified regression trace anchor
        if: needs.screen.outputs.regression_trace_run != ''
        uses: actions/download-artifact@v4
        with:
          name: sts1-v34-regression-trace-${{ needs.screen.outputs.regression_trace_run }}
          path: evidence/sts1/v34-trace/
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.screen.outputs.regression_trace_run }}
      - name: Install, hydrate, and build pinned simulator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . numpy
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-v34
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
      - name: Download and verify frozen G7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/g7.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$G7_ARTIFACT_ID/zip"
          mkdir -p "$RUNNER_TEMP/g7"
          unzip -q "$RUNNER_TEMP/g7.zip" -d "$RUNNER_TEMP/g7"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          elite="$(find "$RUNNER_TEMP/g7" -name elite-replay.npz -print -quit)"
          test -n "$parent"; test -n "$elite"
          test "$(sha256sum "$parent" | awk '{print $1}')" = "$G7_WEIGHT_SHA256"
      - name: Merge independent old and verified fresh Full-Win Teachers
        run: |
          set -euo pipefail
          mkdir -p evidence/sts1/v34-candidate
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("evidence/sts1")
          def readrows(path):
              return [json.loads(x) for x in path.read_text().splitlines() if x.strip()]
          def seedset(name):
              return {int(v) for v in (root/"v34-screen"/name).read_text().split()}
          old=readrows(root/"v31-frozen/new-win-teachers.jsonl")
          fresh=readrows(root/"v34-data/new-win-teachers.jsonl")
          train=seedset("train160.txt")
          forbidden=seedset("gate50.txt")|seedset("fresh100.txt")|seedset("fresh500.txt")
          old_ids={int(x["seed"]) for x in old}
          new_ids={int(x["seed"]) for x in fresh}
          if len(new_ids)<6 or not new_ids.issubset(train):
              raise RuntimeError("insufficient full-win Teachers from new training Seeds")
          if (new_ids|old_ids)&forbidden or new_ids&old_ids:
              raise RuntimeError("teacher data leakage/reuse")
          uniq={}
          for row in old+fresh:
              key=json.dumps(row,sort_keys=True,separators=(",",":"))
              uniq[key]=row
          out=root/"v34-candidate"
          out.joinpath("combined-teachers.jsonl").write_text("".join(json.dumps(x,sort_keys=True)+"\n" for x in uniq.values()))
          out.joinpath("old12.txt").write_text((root/"v31-frozen/teacher-seeds.txt").read_text())
          out.joinpath("new-teachers.txt").write_text((root/"v34-data/teacher-seeds.txt").read_text())
          summary={"fresh_teacher_seeds":len(new_ids),"fresh_teacher_examples":len(fresh),
                   "old_teacher_examples":len(old),"combined_teacher_examples":len(uniq),
                   "fresh_teacher_kinds":sorted({str(x["kind"]) for x in fresh}),
                   "seed_leakage_count":0}
          out.joinpath("provenance.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("V34_TEACHER_PROVENANCE_PASS",json.dumps(summary,sort_keys=True))
          PY

      - name: Add regression-only action preservation anchor
        if: needs.screen.outputs.regression_trace_run != ''
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/sts1')
          trace=root/'v34-trace'/'regression2-trace.json'
          anchor_file=root/'v34-trace'/'regression2-anchors.jsonl'
          if not trace.is_file() or not anchor_file.is_file(): raise SystemExit('regression trace artifact is incomplete')
          report=json.loads(trace.read_text())
          anchors=[json.loads(x) for x in anchor_file.read_text().splitlines() if x.strip()]
          expected={int(x) for x in Path('control/sts1-v22-parent-only-seeds-2.txt').read_text().splitlines() if x.strip() and not x.lstrip().startswith('#')}
          def seeds(name): return {int(x) for x in (root/'v34-screen'/name).read_text().split()}
          formal=seeds('gate50.txt')|seeds('fresh100.txt')|seeds('fresh500.txt')
          anchor_ids={int(x['seed']) for x in anchors}
          if len(anchors)!=1 or len(report.get('rows',[]))!=1: raise SystemExit(f'expected one diagnostic anchor, got anchors={len(anchors)} rows={len(report.get("rows",[]))}')
          if not anchor_ids.issubset(expected): raise SystemExit(f'anchor Seed outside frozen Regression2 set: {sorted(anchor_ids-expected)}')
          if anchor_ids & formal: raise SystemExit(f'regression anchor leaks into formal Fresh Gates: {sorted(anchor_ids & formal)}')
          if any(not (x.get('first_divergence') or {}).get('candidate_identity_match', False) for x in report['rows']): raise SystemExit('trace contains structural action drift; refusing preservation training')
          p=root/'v322-frozen'/'preservation-active.jsonl'
          rows=[json.loads(line) for line in p.read_text().splitlines() if line.strip()]
          seen={json.dumps(x,sort_keys=True,separators=(',',':')) for x in rows}
          added=0
          for row in anchors:
              key=json.dumps(row,sort_keys=True,separators=(',',':'))
              if key not in seen: rows.append(row); seen.add(key); added+=1
          p.write_text(''.join(json.dumps(x,sort_keys=True)+'\n' for x in rows))
          prov=root/'v34-candidate'/'provenance.json'
          data=json.loads(prov.read_text())
          data['regression_trace_run']='36961350902'
          data['regression_preservation_anchor_seeds']=sorted(anchor_ids)
          data['regression_anchor_formal_gate_overlap']=len(anchor_ids & formal)
          data['regression_anchor_count_added']=added
          prov.write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          print('V34_REGRESSION_ANCHOR_PASS',json.dumps({'source_run':'36961350902','seeds':sorted(anchor_ids),'formal_gate_overlap':len(anchor_ids&formal),'anchors_added':added,'preservation_rows':len(rows)},sort_keys=True))
          PY
      - name: Warm-train from v3.2.2 on combined Full-Win Teachers
        run: |
          set -euo pipefail
          out=evidence/sts1/v34-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          elite="$(find "$RUNNER_TEMP/g7" -name elite-replay.npz -print -quit)"
          echo "V34_TRAIN_PREREQ_BEGIN"
          ls -la evidence/sts1/v322-frozen
          for required in \
            evidence/sts1/v322-frozen/final.pt \
            evidence/sts1/v322-frozen/final.pt.adapter.pt \
            evidence/sts1/v322-frozen/preservation-active.jsonl \
            "$parent" "$elite" "$out/combined-teachers.jsonl"; do
            if [ ! -s "$required" ]; then
              echo "V34_TRAIN_PREREQ_MISSING=$required"
              exit 1
            fi
            stat -c 'V34_TRAIN_PREREQ_OK %n %s bytes' "$required"
          done
          g7_sha="$(sha256sum "$parent" | awk '{print $1}')"
          echo "V34_G7_PARENT_SHA=$g7_sha"
          if [ "$g7_sha" != "$G7_WEIGHT_SHA256" ]; then
            echo "V34_G7_PARENT_HASH_MISMATCH"
            exit 1
          fi
          v322_sha="$(sha256sum evidence/sts1/v322-frozen/final.pt | awk '{print $1}')"
          echo "V34_V322_FINAL_SHA=$v322_sha"
          echo "V34_V322_FINAL_SOURCE_RUN=36823568672 (archive digest verified by actions/download-artifact)"
          set +e
          PYTHONFAULTHANDLER=1 python -u scripts/sts1/sts1_build_rescue_adapter_v34.py \
            --armg-root .cache/sts1-v34 --base-weight "$parent" \
            --elite-replay "$elite" --new-win-replay "$out/combined-teachers.jsonl" \
            --preservation-replay evidence/sts1/v322-frozen/preservation-active.jsonl \
            --init-adapter-sidecar evidence/sts1/v322-frozen/final.pt.adapter.pt \
            --output "$out/candidate.pt" --report "$out/train-report.json" \
            --hidden-dim 48 --epochs 6 --lr 0.00010 \
            --elite-train-max 8192 --retention-eval-max 2048 \
            --teacher-margin 0.05 --teacher-coef 4.0 --distill-coef 12.0 \
            --zero-residual-coef 0.75 --preservation-coef 18.0 \
            --preservation-margin 0.03 --min-preservation-margin 0.01 \
            --weight-decay 0.00001 --min-fully-learned-seeds 10 \
            --min-parent-agreement 0.995 --max-parent-kl 0.002 \
            --max-winner-drop 0.01 --threads 4 > "$RUNNER_TEMP/v34-train.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/v34-train.log"
          echo "V34_TRAIN_EXIT=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "V34_TRAIN_FAILED; see preceding unbuffered traceback/diagnostics"
            exit "$rc"
          fi
          for required in "$out/candidate.pt" "$out/candidate.pt.adapter.pt" "$out/train-report.json"; do
            if [ ! -s "$required" ]; then
              echo "V34_TRAIN_OUTPUT_MISSING=$required"
              exit 1
            fi
          done

      - name: Freeze evaluation seeds from independent v3.4 ledger
        run: |
          set -euo pipefail
          out=evidence/sts1/v34-candidate
          cp "$out/new-teachers.txt" "$out/training-recall.txt"
          cp "$out/old12.txt" "$out/old-recall.txt"
          cp control/sts1-v22-parent-only-seeds-2.txt "$out/regression2-seeds.txt"
          cp evidence/sts1/v34-screen/gate50.txt "$out/hidden50-seeds.txt"
          python - <<'PY'
          from pathlib import Path
          seeds=Path("evidence/sts1/v34-screen/gate50.txt").read_text().split()
          Path("evidence/sts1/v34-candidate/gate30-seeds.txt").write_text("\n".join(seeds[:30])+"\n")
          rows=Path("evidence/sts1/v34-candidate/gate30-seeds.txt").read_text().splitlines()
          assert len(rows)==30 and all(x.isdigit() for x in rows)
          print("V34_GATE30_SEEDS_PASS",len(rows))
          PY
          cp evidence/sts1/v34-screen/fresh100.txt "$out/fresh100-seeds.txt"
          cp evidence/sts1/v34-screen/fresh500.txt "$out/fresh500-seeds.txt"
      - name: Training recall diagnostic
        id: recall
        run: |
          set -euo pipefail
          out=evidence/sts1/v34-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe --armg-root .cache/sts1-v34             --parent-weight "$parent" --candidate-weight "$out/candidate.pt"             --seed-file "$out/training-recall.txt" --output "$out/training-recall.json"             --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 1.0 --label v34-new-training-recall
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v34-candidate/training-recall.json"))
          passed=(x["candidate_only_wins"]>=1 and x["candidate_wins"]>x["parent_wins"])
          print("passed="+str(passed).lower())
          print("parent="+str(x["parent_wins"])); print("candidate="+str(x["candidate_wins"]))
          PY
      - name: Old12 recall diagnostic only
        id: old
        run: |
          set -euo pipefail
          out=evidence/sts1/v34-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py \
            --module-dir external/sts_lightspeed/source/build-probe \
            --armg-root .cache/sts1-v34 \
            --parent-weight "$parent" --candidate-weight "$out/candidate.pt" \
            --seed-file "$out/old-recall.txt" --output "$out/old-recall.json" \
            --mcts-sims 2000 --workers 4 --min-win-delta 4 --max-pvalue 1.0 \
            --label v34-old12
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v34-candidate/old-recall.json"))
          net=x["candidate_only_wins"]-x["parent_only_wins"]
          print("passed="+str(net>0).lower())
          print("parent="+str(x["parent_wins"])); print("candidate="+str(x["candidate_wins"]))
          print("candidate_only="+str(x["candidate_only_wins"])); print("parent_only="+str(x["parent_only_wins"]))
          print("net_new_wins="+str(net))
          PY
      - name: Regression2 diagnostic only
        id: reg
        run: |
          set -euo pipefail
          out=evidence/sts1/v34-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe --armg-root .cache/sts1-v34             --parent-weight "$parent" --candidate-weight "$out/candidate.pt"             --seed-file "$out/regression2-seeds.txt" --output "$out/regression2.json"             --mcts-sims 2000 --workers 2 --min-win-delta 0 --max-pvalue 1.0 --label v34-regression2
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v34-candidate/regression2.json"))
          net=x["candidate_only_wins"]-x["parent_only_wins"]
          print("passed="+str(net>0).lower())
          print("parent="+str(x["parent_wins"])); print("candidate="+str(x["candidate_wins"]))
          print("candidate_only="+str(x["candidate_only_wins"])); print("parent_only="+str(x["parent_only_wins"]))
          print("net_new_wins="+str(net))
          PY
      - name: Paired 30-seed MCTS-2000 precheck
        id: gate30
        if: steps.recall.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v34-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py \
            --module-dir external/sts_lightspeed/source/build-probe \
            --armg-root .cache/sts1-v34 --parent-weight "$parent" \
            --candidate-weight "$out/candidate.pt" --seed-file "$out/gate30-seeds.txt" \
            --output "$out/gate30.json" --mcts-sims 2000 --workers 4 \
            --min-win-delta 1 --max-pvalue 1.0 --label v34-gate30
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v34-candidate/gate30.json"))
          net=x["candidate_only_wins"]-x["parent_only_wins"]
          passed=(net>0 and x["candidate_wins"]>x["parent_wins"])
          print("passed="+str(passed).lower())
          print("parent="+str(x["parent_wins"])); print("candidate="+str(x["candidate_wins"]))
          print("candidate_only="+str(x["candidate_only_wins"])); print("parent_only="+str(x["parent_only_wins"]))
          print("net_new_wins="+str(net))
          PY
      - name: Hidden50 unseen Gate
        id: hidden
        if: steps.gate30.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v34-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe --armg-root .cache/sts1-v34             --parent-weight "$parent" --candidate-weight "$out/candidate.pt"             --seed-file "$out/hidden50-seeds.txt" --output "$out/hidden50.json"             --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 1.0 --label v34-gate50
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v34-candidate/hidden50.json"))
          net=x["candidate_only_wins"]-x["parent_only_wins"]
          passed=(net>0 and x["candidate_wins"]>x["parent_wins"])
          print("passed="+str(passed).lower())
          print("parent="+str(x["parent_wins"])); print("candidate="+str(x["candidate_wins"]))
          print("candidate_only="+str(x["candidate_only_wins"])); print("parent_only="+str(x["parent_only_wins"]))
          print("net_new_wins="+str(net))
          PY
      - name: Fresh100 formal Gate
        id: fresh
        if: steps.hidden.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v34-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe --armg-root .cache/sts1-v34             --parent-weight "$parent" --candidate-weight "$out/candidate.pt"             --seed-file "$out/fresh100-seeds.txt" --output "$out/fresh100.json"             --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 0.10 --label v34-fresh100
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v34-candidate/fresh100.json"))
          net=x["candidate_only_wins"]-x["parent_only_wins"]
          passed=(net>0 and x["candidate_wins"]>x["parent_wins"] and x["paired_sign_pvalue_one_sided"]<=0.10)
          print("passed="+str(passed).lower())
          print("parent="+str(x["parent_wins"])); print("candidate="+str(x["candidate_wins"]))
          print("candidate_only="+str(x["candidate_only_wins"])); print("parent_only="+str(x["parent_only_wins"]))
          print("net_new_wins="+str(net))
          print("pvalue="+str(x["paired_sign_pvalue_one_sided"]))
          PY
      - name: Heldout500 formal Gate
        id: h500
        if: steps.fresh.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v34-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe --armg-root .cache/sts1-v34             --parent-weight "$parent" --candidate-weight "$out/candidate.pt"             --seed-file evidence/sts1/v34-screen/fresh500.txt --output "$out/heldout500.json"             --mcts-sims 2000 --workers 4 --min-win-delta 1 --max-pvalue 0.10 --label v34-fresh500
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v34-candidate/heldout500.json"))
          net=x["candidate_only_wins"]-x["parent_only_wins"]
          passed=(net>0 and x["candidate_wins"]>x["parent_wins"] and x["paired_sign_pvalue_one_sided"]<=0.10)
          print("passed="+str(passed).lower())
          print("parent="+str(x["parent_wins"])); print("candidate="+str(x["candidate_wins"]))
          print("candidate_only="+str(x["candidate_only_wins"])); print("parent_only="+str(x["parent_only_wins"]))
          print("net_new_wins="+str(net))
          print("pvalue="+str(x["paired_sign_pvalue_one_sided"]))
          PY
      - name: Write v3.4 generalization summary
        if: always()
        env:
          RECALL: ${{ steps.recall.outputs.passed }}
          OLD: ${{ steps.old.outputs.passed }}
          OLD_PARENT: ${{ steps.old.outputs.parent }}
          OLD_CAND: ${{ steps.old.outputs.candidate }}
          OLD_CONLY: ${{ steps.old.outputs.candidate_only }}
          OLD_PONLY: ${{ steps.old.outputs.parent_only }}
          OLD_NET: ${{ steps.old.outputs.net_new_wins }}
          REG: ${{ steps.reg.outputs.passed }}
          REG_PARENT: ${{ steps.reg.outputs.parent }}
          REG_CAND: ${{ steps.reg.outputs.candidate }}
          REG_CONLY: ${{ steps.reg.outputs.candidate_only }}
          REG_PONLY: ${{ steps.reg.outputs.parent_only }}
          REG_NET: ${{ steps.reg.outputs.net_new_wins }}
          G30: ${{ steps.gate30.outputs.passed }}
          G30_PARENT: ${{ steps.gate30.outputs.parent }}
          G30_CAND: ${{ steps.gate30.outputs.candidate }}
          G30_CONLY: ${{ steps.gate30.outputs.candidate_only }}
          G30_PONLY: ${{ steps.gate30.outputs.parent_only }}
          G30_NET: ${{ steps.gate30.outputs.net_new_wins }}
          HID: ${{ steps.hidden.outputs.passed }}
          HID_PARENT: ${{ steps.hidden.outputs.parent }}
          HID_CAND: ${{ steps.hidden.outputs.candidate }}
          HID_CONLY: ${{ steps.hidden.outputs.candidate_only }}
          HID_PONLY: ${{ steps.hidden.outputs.parent_only }}
          HID_NET: ${{ steps.hidden.outputs.net_new_wins }}
          FRESH: ${{ steps.fresh.outputs.passed }}
          FRESH_PARENT: ${{ steps.fresh.outputs.parent }}
          FRESH_CAND: ${{ steps.fresh.outputs.candidate }}
          FRESH_CONLY: ${{ steps.fresh.outputs.candidate_only }}
          FRESH_PONLY: ${{ steps.fresh.outputs.parent_only }}
          FRESH_NET: ${{ steps.fresh.outputs.net_new_wins }}
          FRESH_P: ${{ steps.fresh.outputs.pvalue }}
          H500: ${{ steps.h500.outputs.passed }}
          H500_PARENT: ${{ steps.h500.outputs.parent }}
          H500_CAND: ${{ steps.h500.outputs.candidate }}
          H500_CONLY: ${{ steps.h500.outputs.candidate_only }}
          H500_PONLY: ${{ steps.h500.outputs.parent_only }}
          H500_NET: ${{ steps.h500.outputs.net_new_wins }}
          H500_P: ${{ steps.h500.outputs.pvalue }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path("evidence/sts1/v34-candidate")
          out.mkdir(parents=True,exist_ok=True)
          data=json.loads(Path("evidence/sts1/v34-data/summary.json").read_text())
          train=json.loads((out/"train-report.json").read_text()) if (out/"train-report.json").exists() else {}
          summary={
              "schema_version":"sts1-v34-fresh-generalization-summary","parent":"G7","dataset":data,
              "training_after":train.get("after",{}),"selected_epoch":train.get("selected_epoch"),
              "training_recall_pass":os.environ.get("RECALL")=="true",
              "old12_diagnostic":{"net_positive":os.environ.get("OLD")=="true","parent":os.environ.get("OLD_PARENT"),"candidate":os.environ.get("OLD_CAND"),"candidate_only":os.environ.get("OLD_CONLY"),"parent_only":os.environ.get("OLD_PONLY"),"net_new_wins":os.environ.get("OLD_NET"),"blocks_promotion":False},
              "regression2_diagnostic":{"net_positive":os.environ.get("REG")=="true","parent":os.environ.get("REG_PARENT"),"candidate":os.environ.get("REG_CAND"),"candidate_only":os.environ.get("REG_CONLY"),"parent_only":os.environ.get("REG_PONLY"),"net_new_wins":os.environ.get("REG_NET"),"blocks_promotion":False},
              "gate30":{"pass":os.environ.get("G30")=="true","parent":os.environ.get("G30_PARENT"),"candidate":os.environ.get("G30_CAND"),"candidate_only":os.environ.get("G30_CONLY"),"parent_only":os.environ.get("G30_PONLY"),"net_new_wins":os.environ.get("G30_NET")},
              "hidden50":{"pass":os.environ.get("HID")=="true","parent":os.environ.get("HID_PARENT"),"candidate":os.environ.get("HID_CAND"),"candidate_only":os.environ.get("HID_CONLY"),"parent_only":os.environ.get("HID_PONLY"),"net_new_wins":os.environ.get("HID_NET")},
              "fresh100":{"pass":os.environ.get("FRESH")=="true","parent":os.environ.get("FRESH_PARENT"),"candidate":os.environ.get("FRESH_CAND"),"candidate_only":os.environ.get("FRESH_CONLY"),"parent_only":os.environ.get("FRESH_PONLY"),"net_new_wins":os.environ.get("FRESH_NET"),"pvalue":os.environ.get("FRESH_P")},
              "heldout500":{"pass":os.environ.get("H500")=="true","parent":os.environ.get("H500_PARENT"),"candidate":os.environ.get("H500_CAND"),"candidate_only":os.environ.get("H500_CONLY"),"parent_only":os.environ.get("H500_PONLY"),"net_new_wins":os.environ.get("H500_NET"),"pvalue":os.environ.get("H500_P")},
          }
          all_ok=(os.environ.get("G30")=="true" and os.environ.get("HID")=="true"
                  and os.environ.get("FRESH")=="true" and os.environ.get("H500")=="true")
          summary["fresh500_pass"]=summary["heldout500"]["pass"]
          summary["all_gates_pass"]=bool(all_ok)
          summary["readiness"]="READY_FOR_REAL_GAME_GATE" if all_ok else "HOLD_PARENT"
          (out/"summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print("V34_FINAL",json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sts1-v34-candidate-${{ github.run_id }}
          path: evidence/sts1/v34-candidate/
          if-no-files-found: warn
          retention-days: 90

      - name: Post GitHub result for phone notifications
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/v34-report.txt"
          import json
          from pathlib import Path
          out=Path("evidence/sts1/v34-candidate")
          summary=out/"summary.json"
          x=json.loads(summary.read_text()) if summary.exists() else {}
          print("@ericpeng0604-coder\n\n## STS1 v3.4 Fresh Generalization")
          for title,name in [
              ("Old12 New-Win","old-recall.json"),
              ("Paired Gate30","gate30.json"),
              ("G7 Regression2","regression2.json"),
              ("Fresh Training Recall","training-recall.json"),
              ("Independent Gate50","hidden50.json"),
              ("Independent Fresh100","fresh100.json"),
              ("Independent Fresh500","heldout500.json"),
          ]:
              p=out/name
              if not p.exists():
                  print(f"- {title}: not run")
              else:
                  a=json.loads(p.read_text())
                  print(f"- {title}: G7 {a['parent_wins']} / Candidate {a['candidate_wins']} over {a['seeds']} seeds")
          print("- Failed or missing Rescue seeds: "+str(x.get("dataset",{}).get("failed_or_missing_seed_count","unknown")))
          print("- Readiness: "+x.get("readiness","FAILED_BEFORE_SUMMARY"))
          print("- Champion G7 unchanged. Heldout seeds were never used for training.")
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/15/comments" -F "body=@$RUNNER_TEMP/v34-report.txt"

  bottleneck:
    needs: [aggregate, screen]
    if: ${{ always() && ((needs.aggregate.result == 'success' && fromJSON(needs.aggregate.outputs.teacher_seed_count) < 6) || (needs.screen.outputs.train_only == 'true' && fromJSON(needs.screen.outputs.recovery_teacher_seed_count) < 6)) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Report data bottleneck
        env:
          GH_TOKEN: ${{ github.token }}
          TEACHERS: ${{ needs.aggregate.outputs.teacher_count }}
          SEEDS: ${{ needs.aggregate.outputs.teacher_seed_count }}
          FAILED: ${{ needs.aggregate.outputs.failed_seed_count }}
        run: |
          body="@ericpeng0604-coder

          ## Build Rescue v3.4 Partial-Safe Generalization
          - Verified Teacher examples: **$TEACHERS**
          - Teacher seeds: **$SEEDS**
          - Failed or missing Rescue seeds: **$FAILED**
          - Need at least 6 independent rescued seeds before adapter training.
          - Status: **DATA_BOTTLENECK / HOLD_PARENT**
          - G7 remains unchanged."
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/15/comments" -f body="$body"
