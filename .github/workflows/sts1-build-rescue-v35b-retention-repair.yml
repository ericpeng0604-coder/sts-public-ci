name: STS1 v3.5 Phase-B Retention Repair

on:
  push:
    branches:
      - gpt/sts1-build-rescue-v22-antiforget-20260930
    paths:
      - control/sts1-v35b-retention-repair.trigger
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  SOURCE_RUN_ID: '37393165126'
  SCREEN_ARTIFACT: 'sts1-v35b-screen-37393165126'
  DATASET_ARTIFACT: 'sts1-v35b-dataset-37393165126'
  V34_RUN_ID: '37318408007'
  V34_CANDIDATE_ARTIFACT: 'sts1-v34-candidate-37318408007'
  V34_MINING_ARTIFACT: 'v34-mine-recovered-37318408007'
  V34_TRACE_RUN_ID: '36962596407'
  V34_TRACE_ARTIFACT: 'sts1-v34-regression-trace-36962596407'
  V322_RUN_ID: '36823568672'
  V322_ARTIFACT: 'sts1-v322-active-repair-36823568672'
  G7_ARTIFACT_ID: '11079234863'
  G7_WEIGHT_SHA256: '8313c99d9b0ab0c0d206fdd2f744fed11f4104d440dcb465cf7c78a517f9ccd0'
  SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'

concurrency:
  group: sts1-v35b-retention-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate repair contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/sts1/sts1_build_rescue_adapter_v35.py src/roguelike_ai/sts1_phase3/simulator.py
          python - <<'PY'
          from pathlib import Path
          p=Path("scripts/sts1/sts1_build_rescue_adapter_v35.py").read_text()
          for token in ["V35_ADAPTER_TRAIN_PASS","negative_pass","retention_pass","min-parent-agreement","max-parent-kl"]:
              if token not in p: raise SystemExit(f"missing trainer contract: {token}")
          print("V35B_RETENTION_REPAIR_CONTRACT_PASS")
          PY

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SCREEN_ARTIFACT }}
          path: evidence/sts1/v35b-screen
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.DATASET_ARTIFACT }}
          path: evidence/sts1/v35b-data
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Validate frozen Phase-B dataset
        run: |
          set -euo pipefail
          test -s evidence/sts1/v35b-data/new-win-teachers.jsonl
          test -s evidence/sts1/v35b-data/negative-examples.jsonl
          test -s evidence/sts1/v35b-data/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("evidence/sts1/v35b-data/summary.json").read_text())
          assert s["teacher_seeds"]==29, s
          assert s["teacher_examples"]==32, s
          assert s["negative_examples"]==317, s
          assert s["negative_validation_errors"]==0, s
          assert s["positive_negative_state_overlap"]==0, s
          print("V35B_DATASET_REUSE_PASS",{"teacher_seeds":29,"teachers":32,"negatives":317})
          PY

      - name: Download frozen source artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V34_CANDIDATE_ARTIFACT }}
          path: evidence/sts1/v34-source
          github-token: ${{ github.token }}
          run-id: ${{ env.V34_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.V34_MINING_ARTIFACT }}
          path: evidence/sts1/v34-mining
          github-token: ${{ github.token }}
          run-id: ${{ env.V34_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.V322_ARTIFACT }}
          path: evidence/sts1/v322-source
          github-token: ${{ github.token }}
          run-id: ${{ env.V322_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.V34_TRACE_ARTIFACT }}
          path: evidence/sts1/v34-trace
          github-token: ${{ github.token }}
          run-id: ${{ env.V34_TRACE_RUN_ID }}

      - name: Merge old and Phase-B training evidence
        run: |
          set -euo pipefail
          mkdir -p evidence/sts1/v35b-repair
          python scripts/sts1/sts1_build_rescue_v35_recover_negatives.py             --results-dir evidence/sts1/v34-mining             --positive-teachers evidence/sts1/v34-source/combined-teachers.jsonl             --output evidence/sts1/v35b-repair/old-negatives.jsonl --max-per-seed 8
          python - <<'PY'
          import json
          from pathlib import Path
          def load(p): return [json.loads(x) for x in Path(p).read_text().splitlines() if x.strip()]
          def state(r): return json.dumps({"kind":r["kind"],"obs":r["obs"],"descs":r["descs"]},sort_keys=True,separators=(",",":"))
          positives={}
          for r in load("evidence/sts1/v34-source/combined-teachers.jsonl")+load("evidence/sts1/v35b-data/new-win-teachers.jsonl"):
              positives[(state(r),int(r["teacher_best_index"]))]=r
          prow=list(positives.values()); pstate={state(r) for r in prow}
          negatives={}
          for r in load("evidence/sts1/v35b-repair/old-negatives.jsonl")+load("evidence/sts1/v35b-data/negative-examples.jsonl"):
              if state(r) in pstate: continue
              negatives[(state(r),int(r["current_armg_index"]),int(r["rejected_index"]))]=r
          nrow=list(negatives.values())
          preservation={}
          for p in ["evidence/sts1/v322-source/preservation-active.jsonl","evidence/sts1/v34-trace/regression2-anchors.jsonl"]:
              for r in load(p):
                  preservation[(state(r),int(r["parent_selected_index"]))]=r
          Path("evidence/sts1/v35b-repair/combined-teachers.jsonl").write_text("".join(json.dumps(r,sort_keys=True)+"\n" for r in prow))
          Path("evidence/sts1/v35b-repair/combined-negatives.jsonl").write_text("".join(json.dumps(r,sort_keys=True)+"\n" for r in nrow))
          Path("evidence/sts1/v35b-repair/preservation.jsonl").write_text("".join(json.dumps(r,sort_keys=True)+"\n" for r in preservation.values()))
          assert len(prow)==62 and len({int(r["seed"]) for r in prow})==56
          assert len(nrow)==325
          assert len(preservation)==6
          print("V35B_REPAIR_MERGE_PASS",{"positives":62,"positive_seeds":56,"negatives":325,"preservation":6})
          PY

      - name: Install, hydrate, and build pinned simulator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . numpy
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-v35br
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"

      - name: Download and verify frozen G7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             -o "$RUNNER_TEMP/g7.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$G7_ARTIFACT_ID/zip"
          mkdir -p "$RUNNER_TEMP/g7"; unzip -q "$RUNNER_TEMP/g7.zip" -d "$RUNNER_TEMP/g7"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          test -n "$parent"
          test "$(sha256sum "$parent" | awk '{print $1}')" = "$G7_WEIGHT_SHA256"

      - name: Retrain with minimally widened retention guard
        run: |
          set -euo pipefail
          out=evidence/sts1/v35b-repair-candidate; mkdir -p "$out"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          elite="$(find "$RUNNER_TEMP/g7" -name elite-replay.npz -print -quit)"
          python -u scripts/sts1/sts1_build_rescue_adapter_v35.py             --armg-root .cache/sts1-v35br --base-weight "$parent" --elite-replay "$elite"             --new-win-replay evidence/sts1/v35b-repair/combined-teachers.jsonl             --negative-replay evidence/sts1/v35b-repair/combined-negatives.jsonl             --preservation-replay evidence/sts1/v35b-repair/preservation.jsonl             --init-adapter-sidecar evidence/sts1/v34-source/candidate.pt.adapter.pt             --output "$out/candidate.pt" --report "$out/train-report.json"             --hidden-dim 48 --epochs 6 --lr 0.00003             --elite-train-max 8192 --retention-eval-max 2048             --teacher-margin 0.05 --teacher-coef 4.0             --negative-margin 0.02 --negative-coef 4.0             --distill-coef 18.0 --zero-residual-coef 1.0             --preservation-coef 24.0 --preservation-margin 0.03             --min-preservation-margin 0.01 --weight-decay 0.00001             --min-fully-learned-seeds 12             --min-parent-agreement 0.995 --max-parent-kl 0.003             --max-winner-drop 0.01 --gate-ratio 0.80 --threads 4
          test -s "$out/candidate.pt.adapter.pt"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("evidence/sts1/v35b-repair-candidate/train-report.json").read_text())
          assert r["selected_epoch"]>=1, r
          assert r["after"]["new_win"]["fully_learned_seeds"]>=12, r
          assert r["after"]["negative"]["rejected_top1_rate"]<=0.025, r
          assert r["after"]["preservation"]["top1"]==1.0, r
          assert r["after"]["retention"]["parent_kl"]<=0.003, r
          print("V35B_REPAIR_TRAIN_VALIDATED",{
              "epoch":r["selected_epoch"],
              "learned":r["after"]["new_win"]["fully_learned_seeds"],
              "kl":r["after"]["retention"]["parent_kl"],
          })
          PY

      - name: Freeze disjoint repair evaluation Seeds
        run: |
          out=evidence/sts1/v35b-repair-candidate
          head -30 evidence/sts1/v35b-screen/phaseb_gate50.txt > "$out/gate30.txt"
          cp evidence/sts1/v35b-screen/phaseb_gate50.txt "$out/gate50.txt"
          cp evidence/sts1/v35b-screen/phaseb_fresh100.txt "$out/fresh100.txt"
          cp evidence/sts1/v35b-screen/phaseb_fresh500.txt "$out/fresh500.txt"
          cp control/sts1-v22-parent-only-seeds-2.txt "$out/regression2.txt"

      - name: Regression2 diagnostic
        run: |
          set -euo pipefail
          out=evidence/sts1/v35b-repair-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v35br --parent-weight "$parent" --candidate-weight "$out/candidate.pt"             --seed-file "$out/regression2.txt" --output "$out/regression2.json" --mcts-sims 2000 --workers 2             --min-win-delta 0 --max-pvalue 1.0 --label v35br-regression2

      - name: Gate30 unseen Net-Win
        id: g30
        run: |
          set -euo pipefail
          out=evidence/sts1/v35b-repair-candidate; parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v35br --parent-weight "$parent" --candidate-weight "$out/candidate.pt"             --seed-file "$out/gate30.txt" --output "$out/gate30.json" --mcts-sims 2000 --workers 4             --min-win-delta 1 --max-pvalue 1.0 --label v35br-gate30
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v35b-repair-candidate/gate30.json")); net=x["candidate_only_wins"]-x["parent_only_wins"]
          d={"passed":str(net>0 and x["candidate_wins"]>x["parent_wins"]).lower(),"net":net,"parent":x["parent_wins"],"candidate":x["candidate_wins"],"candidate_only":x["candidate_only_wins"],"parent_only":x["parent_only_wins"]}
          [print(f"{k}={v}") for k,v in d.items()]
          PY

      - name: Gate50 unseen Net-Win
        id: g50
        if: steps.g30.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v35b-repair-candidate; parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v35br --parent-weight "$parent" --candidate-weight "$out/candidate.pt"             --seed-file "$out/gate50.txt" --output "$out/gate50.json" --mcts-sims 2000 --workers 4             --min-win-delta 1 --max-pvalue 1.0 --label v35br-gate50
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v35b-repair-candidate/gate50.json")); net=x["candidate_only_wins"]-x["parent_only_wins"]
          d={"passed":str(net>0 and x["candidate_wins"]>x["parent_wins"]).lower(),"net":net,"parent":x["parent_wins"],"candidate":x["candidate_wins"],"candidate_only":x["candidate_only_wins"],"parent_only":x["parent_only_wins"]}
          [print(f"{k}={v}") for k,v in d.items()]
          PY

      - name: Fresh100 formal Net-Win
        id: f100
        if: steps.g50.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v35b-repair-candidate; parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v35br --parent-weight "$parent" --candidate-weight "$out/candidate.pt"             --seed-file "$out/fresh100.txt" --output "$out/fresh100.json" --mcts-sims 2000 --workers 4             --min-win-delta 1 --max-pvalue 0.10 --label v35br-fresh100
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v35b-repair-candidate/fresh100.json")); net=x["candidate_only_wins"]-x["parent_only_wins"]; p=x["paired_sign_pvalue_one_sided"]
          d={"passed":str(net>0 and x["candidate_wins"]>x["parent_wins"] and p<=0.10).lower(),"net":net,"parent":x["parent_wins"],"candidate":x["candidate_wins"],"candidate_only":x["candidate_only_wins"],"parent_only":x["parent_only_wins"],"pvalue":p}
          [print(f"{k}={v}") for k,v in d.items()]
          PY

      - name: Fresh500 formal Net-Win
        id: f500
        if: steps.f100.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v35b-repair-candidate; parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v35br --parent-weight "$parent" --candidate-weight "$out/candidate.pt"             --seed-file "$out/fresh500.txt" --output "$out/fresh500.json" --mcts-sims 2000 --workers 4             --min-win-delta 1 --max-pvalue 0.10 --label v35br-fresh500
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v35b-repair-candidate/fresh500.json")); net=x["candidate_only_wins"]-x["parent_only_wins"]; p=x["paired_sign_pvalue_one_sided"]
          d={"passed":str(net>0 and x["candidate_wins"]>x["parent_wins"] and p<=0.10).lower(),"net":net,"parent":x["parent_wins"],"candidate":x["candidate_wins"],"candidate_only":x["candidate_only_wins"],"parent_only":x["parent_only_wins"],"pvalue":p}
          [print(f"{k}={v}") for k,v in d.items()]
          PY

      - name: Write repair summary
        if: always()
        env:
          G30: ${{ steps.g30.outputs.passed }}
          G30_PARENT: ${{ steps.g30.outputs.parent }}
          G30_CAND: ${{ steps.g30.outputs.candidate }}
          G30_CONLY: ${{ steps.g30.outputs.candidate_only }}
          G30_PONLY: ${{ steps.g30.outputs.parent_only }}
          G30_NET: ${{ steps.g30.outputs.net }}
          G50: ${{ steps.g50.outputs.passed }}
          G50_PARENT: ${{ steps.g50.outputs.parent }}
          G50_CAND: ${{ steps.g50.outputs.candidate }}
          G50_CONLY: ${{ steps.g50.outputs.candidate_only }}
          G50_PONLY: ${{ steps.g50.outputs.parent_only }}
          G50_NET: ${{ steps.g50.outputs.net }}
          F100: ${{ steps.f100.outputs.passed }}
          F100_PARENT: ${{ steps.f100.outputs.parent }}
          F100_CAND: ${{ steps.f100.outputs.candidate }}
          F100_CONLY: ${{ steps.f100.outputs.candidate_only }}
          F100_PONLY: ${{ steps.f100.outputs.parent_only }}
          F100_NET: ${{ steps.f100.outputs.net }}
          F100_P: ${{ steps.f100.outputs.pvalue }}
          F500: ${{ steps.f500.outputs.passed }}
          F500_PARENT: ${{ steps.f500.outputs.parent }}
          F500_CAND: ${{ steps.f500.outputs.candidate }}
          F500_CONLY: ${{ steps.f500.outputs.candidate_only }}
          F500_PONLY: ${{ steps.f500.outputs.parent_only }}
          F500_NET: ${{ steps.f500.outputs.net }}
          F500_P: ${{ steps.f500.outputs.pvalue }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path("evidence/sts1/v35b-repair-candidate"); out.mkdir(parents=True,exist_ok=True)
          def row(p,stat=False):
              d={"pass":os.getenv(p)=="true","parent":os.getenv(p+"_PARENT"),"candidate":os.getenv(p+"_CAND"),"candidate_only":os.getenv(p+"_CONLY"),"parent_only":os.getenv(p+"_PONLY"),"net_new_wins":os.getenv(p+"_NET")}
              if stat:d["pvalue"]=os.getenv(p+"_P")
              return d
          s={"schema_version":"sts1-v35b-retention-repair","parent":"G7","gate30":row("G30"),"gate50":row("G50"),"fresh100":row("F100",True),"fresh500":row("F500",True)}
          s["readiness"]="READY_FOR_REAL_GAME_GATE" if s["fresh500"]["pass"] else "HOLD_PARENT"
          if (out/"train-report.json").exists(): s["training"]=json.loads((out/"train-report.json").read_text())
          (out/"summary.json").write_text(json.dumps(s,indent=2,sort_keys=True)+"\n")
          print("V35BR_FINAL",json.dumps(s,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sts1-v35b-retention-repair-${{ github.run_id }}
          path: evidence/sts1/v35b-repair-candidate/
          if-no-files-found: warn
          retention-days: 90

      - name: Report repair result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/body.txt"
          import json
          from pathlib import Path
          print("@ericpeng0604-coder")
          print()
          print("## STS1 v3.5 Phase-B Retention Repair")
          p=Path("evidence/sts1/v35b-repair-candidate/summary.json")
          if not p.exists():
              print("- Repair failed before summary. G7 unchanged.")
          else:
              x=json.loads(p.read_text())
              for name in ["gate30","gate50","fresh100","fresh500"]:
                  r=x[name]
                  print(f"- {name}: G7 {r.get('parent')} / Candidate {r.get('candidate')} / Candidate-only={r.get('candidate_only')} / Parent-only={r.get('parent_only')} / Net={r.get('net_new_wins')} / PASS={r.get('pass')}")
              print(f"- Readiness: {x.get('readiness')}")
          print("- G7 remains Champion unless Fresh500 and later real-game validation pass.")
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/15/comments" -f body="$(cat "$RUNNER_TEMP/body.txt")"
