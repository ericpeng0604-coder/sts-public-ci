name: STS1 v3.5 Phase-B Train Recovery

on:
  push:
    branches:
      - gpt/sts1-build-rescue-v22-antiforget-20260930
    paths:
      - control/sts1-build-rescue-v35b-train-recovery.trigger
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  SOURCE_RUN_ID: '37393165126'
  SCREEN_ARTIFACT: 'sts1-v35b-screen-37393165126'
  DATASET_ARTIFACT: 'sts1-v35b-dataset-37393165126'
  V34_RUN_ID: '37318408007'
  V34_CANDIDATE_ARTIFACT: 'sts1-v34-candidate-37318408007'
  V34_MINING_ARTIFACT: 'v34-mine-recovered-37318408007'
  V34_TRACE_RUN_ID: '36962596407'
  V34_TRACE_ARTIFACT: 'sts1-v34-regression-trace-36962596407'
  V322_RUN_ID: '36823568672'
  V322_ARTIFACT: 'sts1-v322-active-repair-36823568672'
  G7_ARTIFACT_ID: '11079234863'
  G7_WEIGHT_SHA256: '8313c99d9b0ab0c0d206fdd2f744fed11f4104d440dcb465cf7c78a517f9ccd0'
  SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'

concurrency:
  group: sts1-v35b-train-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate recovery contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/sts1/sts1_build_rescue_adapter_v35.py src/roguelike_ai/sts1_phase3/simulator.py
          python - <<'PY'
          from pathlib import Path
          tr=Path("scripts/sts1/sts1_build_rescue_adapter_v35.py").read_text()
          sim=Path("src/roguelike_ai/sts1_phase3/simulator.py").read_text()
          required=[
              "--max-kl-increase","allowed_parent_kl","retention_policy",
              "sts1-armg-residual-adapter-v2",
          ]
          missing=[x for x in required if x not in tr]
          if "int(neg.numel()) == 0" not in sim:
              missing.append("empty-negative-loader-fix")
          if missing:
              raise SystemExit(f"v35b recovery contract missing: {missing}")
          print("V35B_RECOVERY_CONTRACT_PASS")
          PY

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SCREEN_ARTIFACT }}
          path: evidence/sts1/v35b-screen
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.DATASET_ARTIFACT }}
          path: evidence/sts1/v35b-data
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Download frozen v3.4 Candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V34_CANDIDATE_ARTIFACT }}
          path: evidence/sts1/v34-source
          github-token: ${{ github.token }}
          run-id: ${{ env.V34_RUN_ID }}
      - name: Download frozen v3.4 mining checkpoints
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V34_MINING_ARTIFACT }}
          path: evidence/sts1/v34-mining
          github-token: ${{ github.token }}
          run-id: ${{ env.V34_RUN_ID }}
      - name: Download v3.2.2 preservation source
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V322_ARTIFACT }}
          path: evidence/sts1/v322-source
          github-token: ${{ github.token }}
          run-id: ${{ env.V322_RUN_ID }}
      - name: Download verified v3.4 regression trace
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V34_TRACE_ARTIFACT }}
          path: evidence/sts1/v34-trace
          github-token: ${{ github.token }}
          run-id: ${{ env.V34_TRACE_RUN_ID }}

      - name: Validate recovered dataset
        run: |
          set -euo pipefail
          for f in             evidence/sts1/v35b-screen/seed-ledger.json             evidence/sts1/v35b-screen/phaseb_gate50.txt             evidence/sts1/v35b-screen/phaseb_fresh100.txt             evidence/sts1/v35b-screen/phaseb_fresh500.txt             evidence/sts1/v35b-data/summary.json             evidence/sts1/v35b-data/new-win-teachers.jsonl             evidence/sts1/v35b-data/negative-examples.jsonl             evidence/sts1/v34-source/candidate.pt.adapter.pt             evidence/sts1/v34-source/combined-teachers.jsonl             evidence/sts1/v322-source/preservation-active.jsonl             evidence/sts1/v34-trace/regression2-anchors.jsonl; do
            test -s "$f"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("evidence/sts1/v35b-data/summary.json").read_text())
          assert s["teacher_seeds"]==29, s
          assert s["teacher_examples"]==32, s
          assert s["negative_examples"]==317, s
          assert s["negative_validation_errors"]==0, s
          assert s["training_eval_overlap"]==0, s
          print("V35B_RECOVERED_DATA_PASS",{
              "teacher_seeds":s["teacher_seeds"],
              "teacher_examples":s["teacher_examples"],
              "negative_examples":s["negative_examples"],
          })
          PY

      - name: Merge old and new training evidence
        run: |
          set -euo pipefail
          mkdir -p evidence/sts1/v35b-train
          python scripts/sts1/sts1_build_rescue_v35_recover_negatives.py             --results-dir evidence/sts1/v34-mining             --positive-teachers evidence/sts1/v34-source/combined-teachers.jsonl             --output evidence/sts1/v35b-train/old-negatives.jsonl             --max-per-seed 8
          python - <<'PY'
          import json
          from pathlib import Path
          def load(path):
              return [json.loads(x) for x in Path(path).read_text().splitlines() if x.strip()]
          def state(r):
              return json.dumps({"kind":r["kind"],"obs":r["obs"],"descs":r["descs"]},sort_keys=True,separators=(",",":"))
          oldp=load("evidence/sts1/v34-source/combined-teachers.jsonl")
          newp=load("evidence/sts1/v35b-data/new-win-teachers.jsonl")
          positives={}
          for r in oldp+newp:
              positives[(state(r),int(r["teacher_best_index"]))]=r
          prow=list(positives.values()); pstate={state(r) for r in prow}
          oldn=load("evidence/sts1/v35b-train/old-negatives.jsonl")
          newn=load("evidence/sts1/v35b-data/negative-examples.jsonl")
          negatives={}
          for r in oldn+newn:
              if state(r) in pstate: continue
              negatives[(state(r),int(r["current_armg_index"]),int(r["rejected_index"]))]=r
          nrow=list(negatives.values())
          pres=[]
          for p in ["evidence/sts1/v322-source/preservation-active.jsonl","evidence/sts1/v34-trace/regression2-anchors.jsonl"]:
              pres.extend(load(p))
          uniq={}
          for r in pres:
              uniq[(state(r),int(r["parent_selected_index"]))]=r
          Path("evidence/sts1/v35b-train/combined-teachers.jsonl").write_text("".join(json.dumps(r,sort_keys=True)+"\n" for r in prow))
          Path("evidence/sts1/v35b-train/combined-negatives.jsonl").write_text("".join(json.dumps(r,sort_keys=True)+"\n" for r in nrow))
          Path("evidence/sts1/v35b-train/preservation.jsonl").write_text("".join(json.dumps(r,sort_keys=True)+"\n" for r in uniq.values()))
          print("V35B_RECOVERY_MERGE_PASS",{
              "positives":len(prow),"positive_seeds":len({int(r["seed"]) for r in prow}),
              "negatives":len(nrow),"negative_seeds":len({int(r["seed"]) for r in nrow}),
              "preservation":len(uniq),
          })
          assert len(prow)==62
          assert len({int(r["seed"]) for r in prow})==56
          assert len(nrow)>=325
          PY

      - name: Install, hydrate, and build pinned simulator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . numpy
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-v35br
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"

      - name: Download and verify frozen G7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -o "$RUNNER_TEMP/g7.zip"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$G7_ARTIFACT_ID/zip"
          mkdir -p "$RUNNER_TEMP/g7"
          unzip -q "$RUNNER_TEMP/g7.zip" -d "$RUNNER_TEMP/g7"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          elite="$(find "$RUNNER_TEMP/g7" -name elite-replay.npz -print -quit)"
          test -n "$parent" && test -n "$elite"
          test "$(sha256sum "$parent" | awk '{print $1}')" = "$G7_WEIGHT_SHA256"

      - name: Train recovered expanded Candidate
        run: |
          set -euo pipefail
          out=evidence/sts1/v35br-candidate
          mkdir -p "$out"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          elite="$(find "$RUNNER_TEMP/g7" -name elite-replay.npz -print -quit)"
          python -u scripts/sts1/sts1_build_rescue_adapter_v35.py             --armg-root .cache/sts1-v35br             --base-weight "$parent" --elite-replay "$elite"             --new-win-replay evidence/sts1/v35b-train/combined-teachers.jsonl             --negative-replay evidence/sts1/v35b-train/combined-negatives.jsonl             --preservation-replay evidence/sts1/v35b-train/preservation.jsonl             --init-adapter-sidecar evidence/sts1/v34-source/candidate.pt.adapter.pt             --output "$out/candidate.pt" --report "$out/train-report.json"             --hidden-dim 48 --epochs 6 --lr 0.00003             --elite-train-max 8192 --retention-eval-max 2048             --teacher-margin 0.05 --teacher-coef 4.0             --negative-margin 0.02 --negative-coef 4.0             --distill-coef 18.0 --zero-residual-coef 1.0             --preservation-coef 24.0 --preservation-margin 0.03             --min-preservation-margin 0.01 --weight-decay 0.00001             --min-fully-learned-seeds 12             --min-parent-agreement 0.995 --max-parent-kl 0.002             --max-kl-increase 0.001             --max-winner-drop 0.01 --gate-ratio 0.80 --threads 4
          test -s "$out/candidate.pt" && test -s "$out/candidate.pt.adapter.pt"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("evidence/sts1/v35br-candidate/train-report.json").read_text())
          print("V35BR_SELECTED",{
              "epoch":r["selected_epoch"],
              "fully_learned":r["after"]["new_win"]["fully_learned_seeds"],
              "negative_rejected":r["after"]["negative"]["rejected_top1_rate"],
              "kl":r["after"]["retention"]["parent_kl"],
              "allowed_kl":r["retention_policy"]["allowed_parent_kl"],
              "preservation":r["after"]["preservation"]["top1"],
          })
          PY

      - name: Freeze independent evaluation Seeds
        run: |
          set -euo pipefail
          out=evidence/sts1/v35br-candidate
          head -30 evidence/sts1/v35b-screen/phaseb_gate50.txt > "$out/gate30.txt"
          cp evidence/sts1/v35b-screen/phaseb_gate50.txt "$out/gate50.txt"
          cp evidence/sts1/v35b-screen/phaseb_fresh100.txt "$out/fresh100.txt"
          cp evidence/sts1/v35b-screen/phaseb_fresh500.txt "$out/fresh500.txt"
          cp control/sts1-v22-parent-only-seeds-2.txt "$out/regression2.txt"

      - name: Regression2 diagnostic
        run: |
          set -euo pipefail
          out=evidence/sts1/v35br-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v35br --parent-weight "$parent"             --candidate-weight "$out/candidate.pt" --seed-file "$out/regression2.txt"             --output "$out/regression2.json" --mcts-sims 2000 --workers 2             --min-win-delta 0 --max-pvalue 1.0 --label v35br-regression2

      - name: Gate30 unseen Net-Win precheck
        id: g30
        run: |
          set -euo pipefail
          out=evidence/sts1/v35br-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v35br --parent-weight "$parent"             --candidate-weight "$out/candidate.pt" --seed-file "$out/gate30.txt"             --output "$out/gate30.json" --mcts-sims 2000 --workers 4             --min-win-delta 1 --max-pvalue 1.0 --label v35br-gate30
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v35br-candidate/gate30.json"))
          net=x["candidate_only_wins"]-x["parent_only_wins"]
          passed=net>0 and x["candidate_wins"]>x["parent_wins"]
          for k,v in {"passed":str(passed).lower(),"net":net,"parent":x["parent_wins"],"candidate":x["candidate_wins"],"candidate_only":x["candidate_only_wins"],"parent_only":x["parent_only_wins"]}.items(): print(f"{k}={v}")
          PY

      - name: Gate50 unseen Net-Win Gate
        id: g50
        if: steps.g30.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v35br-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v35br --parent-weight "$parent"             --candidate-weight "$out/candidate.pt" --seed-file "$out/gate50.txt"             --output "$out/gate50.json" --mcts-sims 2000 --workers 4             --min-win-delta 1 --max-pvalue 1.0 --label v35br-gate50
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v35br-candidate/gate50.json"))
          net=x["candidate_only_wins"]-x["parent_only_wins"]
          passed=net>0 and x["candidate_wins"]>x["parent_wins"]
          for k,v in {"passed":str(passed).lower(),"net":net,"parent":x["parent_wins"],"candidate":x["candidate_wins"],"candidate_only":x["candidate_only_wins"],"parent_only":x["parent_only_wins"]}.items(): print(f"{k}={v}")
          PY

      - name: Fresh100 formal Net-Win Gate
        id: f100
        if: steps.g50.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v35br-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v35br --parent-weight "$parent"             --candidate-weight "$out/candidate.pt" --seed-file "$out/fresh100.txt"             --output "$out/fresh100.json" --mcts-sims 2000 --workers 4             --min-win-delta 1 --max-pvalue 0.10 --label v35br-fresh100
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v35br-candidate/fresh100.json"))
          net=x["candidate_only_wins"]-x["parent_only_wins"]
          passed=net>0 and x["candidate_wins"]>x["parent_wins"] and x["paired_sign_pvalue_one_sided"]<=0.10
          for k,v in {"passed":str(passed).lower(),"net":net,"parent":x["parent_wins"],"candidate":x["candidate_wins"],"candidate_only":x["candidate_only_wins"],"parent_only":x["parent_only_wins"],"pvalue":x["paired_sign_pvalue_one_sided"]}.items(): print(f"{k}={v}")
          PY

      - name: Fresh500 formal Net-Win Gate
        id: f500
        if: steps.f100.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v35br-candidate
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v35br --parent-weight "$parent"             --candidate-weight "$out/candidate.pt" --seed-file "$out/fresh500.txt"             --output "$out/fresh500.json" --mcts-sims 2000 --workers 4             --min-win-delta 1 --max-pvalue 0.10 --label v35br-fresh500
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v35br-candidate/fresh500.json"))
          net=x["candidate_only_wins"]-x["parent_only_wins"]
          passed=net>0 and x["candidate_wins"]>x["parent_wins"] and x["paired_sign_pvalue_one_sided"]<=0.10
          for k,v in {"passed":str(passed).lower(),"net":net,"parent":x["parent_wins"],"candidate":x["candidate_wins"],"candidate_only":x["candidate_only_wins"],"parent_only":x["parent_only_wins"],"pvalue":x["paired_sign_pvalue_one_sided"]}.items(): print(f"{k}={v}")
          PY

      - name: Write recovery summary
        if: always()
        env:
          G30: ${{ steps.g30.outputs.passed }}
          G30_PARENT: ${{ steps.g30.outputs.parent }}
          G30_CAND: ${{ steps.g30.outputs.candidate }}
          G30_CONLY: ${{ steps.g30.outputs.candidate_only }}
          G30_PONLY: ${{ steps.g30.outputs.parent_only }}
          G30_NET: ${{ steps.g30.outputs.net }}
          G50: ${{ steps.g50.outputs.passed }}
          G50_PARENT: ${{ steps.g50.outputs.parent }}
          G50_CAND: ${{ steps.g50.outputs.candidate }}
          G50_CONLY: ${{ steps.g50.outputs.candidate_only }}
          G50_PONLY: ${{ steps.g50.outputs.parent_only }}
          G50_NET: ${{ steps.g50.outputs.net }}
          F100: ${{ steps.f100.outputs.passed }}
          F100_PARENT: ${{ steps.f100.outputs.parent }}
          F100_CAND: ${{ steps.f100.outputs.candidate }}
          F100_CONLY: ${{ steps.f100.outputs.candidate_only }}
          F100_PONLY: ${{ steps.f100.outputs.parent_only }}
          F100_NET: ${{ steps.f100.outputs.net }}
          F100_P: ${{ steps.f100.outputs.pvalue }}
          F500: ${{ steps.f500.outputs.passed }}
          F500_PARENT: ${{ steps.f500.outputs.parent }}
          F500_CAND: ${{ steps.f500.outputs.candidate }}
          F500_CONLY: ${{ steps.f500.outputs.candidate_only }}
          F500_PONLY: ${{ steps.f500.outputs.parent_only }}
          F500_NET: ${{ steps.f500.outputs.net }}
          F500_P: ${{ steps.f500.outputs.pvalue }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path("evidence/sts1/v35br-candidate"); out.mkdir(parents=True,exist_ok=True)
          def row(prefix,p=False):
              d={"pass":os.environ.get(prefix)=="true","parent":os.environ.get(prefix+"_PARENT"),"candidate":os.environ.get(prefix+"_CAND"),"candidate_only":os.environ.get(prefix+"_CONLY"),"parent_only":os.environ.get(prefix+"_PONLY"),"net_new_wins":os.environ.get(prefix+"_NET")}
              if p:d["pvalue"]=os.environ.get(prefix+"_P")
              return d
          tr={}
          if (out/"train-report.json").exists(): tr=json.loads((out/"train-report.json").read_text())
          s={"schema_version":"sts1-v35b-train-recovery","source_run":37393165126,"parent":"G7","training":tr,
             "gate30":row("G30"),"gate50":row("G50"),"fresh100":row("F100",True),"fresh500":row("F500",True)}
          s["readiness"]="READY_FOR_REAL_GAME_GATE" if s["fresh500"]["pass"] else "HOLD_PARENT"
          (out/"summary.json").write_text(json.dumps(s,indent=2,sort_keys=True)+"\n")
          print("V35BR_FINAL",json.dumps(s,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sts1-v35br-candidate-${{ github.run_id }}
          path: evidence/sts1/v35br-candidate/
          if-no-files-found: warn
          retention-days: 90

      - name: Report recovery result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/body.txt"
          import json
          from pathlib import Path
          print("@ericpeng0604-coder")
          print()
          print("## STS1 v3.5 Phase-B Train Recovery")
          p=Path("evidence/sts1/v35br-candidate/summary.json")
          if not p.exists():
              print("- Recovery failed before Candidate summary. G7 remains Champion.")
          else:
              x=json.loads(p.read_text())
              tr=x.get("training") or {}
              if tr:
                  print(f"- Selected epoch: {tr.get('selected_epoch')}")
                  print(f"- Allowed parent KL: {(tr.get('retention_policy') or {}).get('allowed_parent_kl')}")
              for name in ["gate30","gate50","fresh100","fresh500"]:
                  r=x[name]
                  print(f"- {name}: G7 {r.get('parent')} / Candidate {r.get('candidate')} / Candidate-only={r.get('candidate_only')} / Parent-only={r.get('parent_only')} / Net={r.get('net_new_wins')} / PASS={r.get('pass')}")
              print(f"- Readiness: {x.get('readiness')}")
          print("- G7 remains Champion unless Fresh500 and later real-game validation pass.")
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/15/comments" -f body="$(cat "$RUNNER_TEMP/body.txt")"
