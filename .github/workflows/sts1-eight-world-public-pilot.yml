name: STS1 Eight World Public Pilot
on:
  push:
    branches: [codex/sts1-eight-world-public-pilot]
    paths:
      - 'experiments/sts1-pilot8/**'
      - '.github/workflows/sts1-eight-world-public-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sts1-eight-world-public-pilot-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONPATH: ${{ github.workspace }}/experiments/sts1-pilot8/native:${{ github.workspace }}/src:${{ github.workspace }}/experiments/sts1-pilot8
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/sts1-pilot8/requirements.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -r experiments/sts1-pilot8/requirements.txt
      - name: Read already-public G7 source artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11079234863'
          run-id: '36674639174'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original-g7
      - run: python experiments/sts1-pilot8/setup_runtime.py g7 --downloads original-g7
      - name: Compile pinned public simulator and audited bindings
        run: python experiments/sts1-pilot8/setup_runtime.py build --destination "$RUNNER_TEMP/sts1-native"
      - run: python experiments/sts1-pilot8/run.py preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot8-preflight
          path: experiments/sts1-pilot8/data/preflight.json
          if-no-files-found: warn
  label:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/sts1-pilot8/requirements.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -r experiments/sts1-pilot8/requirements.txt
      - name: Read already-public G7 source artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11079234863'
          run-id: '36674639174'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original-g7
      - run: python experiments/sts1-pilot8/setup_runtime.py g7 --downloads original-g7
      - name: Compile pinned public simulator and audited bindings
        run: python experiments/sts1-pilot8/setup_runtime.py build --destination "$RUNNER_TEMP/sts1-native"
      - run: python experiments/sts1-pilot8/run.py shard --index ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot8-shard-${{ matrix.shard }}
          path: |
            experiments/sts1-pilot8/data/labels/
            experiments/sts1-pilot8/data/shard-summary.json
            experiments/sts1-pilot8/data/label-progress.jsonl
          if-no-files-found: warn
          retention-days: 30
  train-and-evaluate:
    needs: label
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/sts1-pilot8/requirements.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -r experiments/sts1-pilot8/requirements.txt
      - name: Read already-public G7 source artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11079234863'
          run-id: '36674639174'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original-g7
      - run: python experiments/sts1-pilot8/setup_runtime.py g7 --downloads original-g7
      - name: Compile pinned public simulator and audited bindings
        run: python experiments/sts1-pilot8/setup_runtime.py build --destination "$RUNNER_TEMP/sts1-native"
      - uses: actions/download-artifact@v4
        with:
          pattern: pilot8-shard-*
          path: downloaded
      - run: python experiments/sts1-pilot8/run.py aggregate --downloads downloaded
      - run: python experiments/sts1-pilot8/train.py
      - name: Evaluate only a calibrated frozen candidate
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,sys
          root=pathlib.Path('experiments/sts1-pilot8')
          report=json.loads((root/'data/training-report.json').read_text())
          if report['gate'] is None:
              print('HOLD_G7: no calibrated advantage; no identity-policy evaluation.')
          else:
              subprocess.run([sys.executable,str(root/'evaluate.py'),'--pairs','300'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot8-training-evaluation
          path: |
            experiments/sts1-pilot8/data/training-report.json
            experiments/sts1-pilot8/data/candidate.pt
            experiments/sts1-pilot8/data/aggregate-verification.json
            experiments/sts1-pilot8/data/full-run/
          if-no-files-found: warn
          retention-days: 30
