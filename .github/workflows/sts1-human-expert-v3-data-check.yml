name: STS1 Human Expert v3 Data Check

on:
  push:
    branches:
      - gpt/sts1-human-expert-loop-v3-20260929
    paths:
      - '.github/workflows/sts1-human-expert-v3-data-check.yml'
      - 'src/roguelike_ai/sts1_phase3/human_expert.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Fetch pinned expert corpus
        run: |
          git clone --filter=blob:none https://github.com/MaT1g3R/Slay-the-Spire-data.git "$RUNNER_TEMP/expert-data"
          git -C "$RUNNER_TEMP/expert-data" checkout 097aaf3564c2247835162d267cbc7c55d2c9039e
      - name: Measure v3 holdout gain
        run: |
          python - <<'PY'
          from pathlib import Path
          from roguelike_ai.sts1_phase3.human_expert import build_card_prior
          import os, json

          root=Path(os.environ["RUNNER_TEMP"])/"expert-data"
          out=Path(os.environ["RUNNER_TEMP"])/"human-expert-v3-prior.json"
          report=build_card_prior(root,out,min_ascension=15,alpha=2.0)
          summary={
              "accepted_runs": report["accepted_runs"],
              "card_choice_examples": report["card_choice_examples"],
              "baseline_holdout_top1": report["baseline_holdout_top1"],
              "holdout_top1": report["holdout_top1"],
              "holdout_gain": report["holdout_top1"]-report["baseline_holdout_top1"],
              "matchup_mix": report["matchup_mix"],
              "context_mix": report["context_mix"],
              "context_pair_examples": report["context_pair_examples"],
              "observed_context_directions": report["observed_context_directions"],
          }
          print("HUMAN_EXPERT_V3_DATA_CHECK", json.dumps(summary, sort_keys=True))
          assert report["holdout_top1"] >= report["baseline_holdout_top1"]
          assert report["context_pair_examples"] > 0
          assert report["observed_context_directions"] > 0
          PY
