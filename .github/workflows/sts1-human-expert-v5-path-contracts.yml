name: STS1 Human Expert v5 Path Contracts

on:
  push:
    branches:
      - gpt/sts1-human-expert-loop-v5-20260929
    paths:
      - '.github/workflows/sts1-human-expert-v5-path-contracts.yml'
      - 'src/roguelike_ai/sts1_phase3/human_path_prior.py'
      - 'src/roguelike_ai/sts1_phase3/human_expert.py'
      - 'tests/test_sts1_human_path_prior.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPERT_DATA_REPO: 'https://github.com/MaT1g3R/Slay-the-Spire-data.git'
  EXPERT_DATA_SHA: '097aaf3564c2247835162d267cbc7c55d2c9039e'

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' numpy torch==2.11.0
      - name: Compile
        run: |
          python -m py_compile             src/roguelike_ai/sts1_phase3/human_path_prior.py             src/roguelike_ai/sts1_phase3/human_expert.py
      - name: Unit contracts
        run: |
          pytest -q tests/test_sts1_human_path_prior.py tests/test_sts1_human_expert.py
      - name: Build real path prior
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/expert-data"
          git clone --filter=blob:none "$EXPERT_DATA_REPO" "$data"
          git -C "$data" checkout "$EXPERT_DATA_SHA"
          python - "$data" <<'PY'
          import json, sys
          from pathlib import Path
          from roguelike_ai.sts1_phase3.human_path_prior import build_path_prior

          root=Path(sys.argv[1])
          out=Path("evidence/sts1/human-path-v1/prior.json")
          r=build_path_prior(root,out,min_ascension=15,alpha=3.0)
          assert r["accepted_runs"] > 0
          assert r["example_count"] >= 4000
          assert r["ignored_nodes"] >= 0
          assert len(r["context_log_probs"]) > 0
          print("HUMAN_PATH_PRIOR_STATS", json.dumps({
              "accepted_runs":r["accepted_runs"],
              "example_count":r["example_count"],
              "ignored_nodes":r["ignored_nodes"],
              "contexts":len(r["context_log_probs"]),
          }, sort_keys=True))
          PY
