name: STS1 Label Failure Diagnosis
on:
  push:
    branches: [codex/sts1-eight-world-public-pilot]
    paths:
      - 'experiments/sts1-label-diagnosis/**'
      - '.github/workflows/sts1-label-diagnosis.yml'
permissions:
  contents: read
  actions: read
env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONPATH: ${{ github.workspace }}/experiments/sts1-pilot8/native:${{ github.workspace }}/src:${{ github.workspace }}/experiments/sts1-pilot8
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/sts1-pilot8/requirements.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -r experiments/sts1-pilot8/requirements.txt
      - name: Read already-public G7 source artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11079234863'
          run-id: '36674639174'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original-g7
      - run: python experiments/sts1-pilot8/setup_runtime.py g7 --downloads original-g7
      - name: Compile pinned public simulator and audited bindings
        run: python experiments/sts1-pilot8/setup_runtime.py build --destination "$RUNNER_TEMP/sts1-native"
      - uses: actions/download-artifact@v4
        with:
          name: next-train-prepared
          run-id: '38344535817'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: experiments/sts1-label-diagnosis/prepared
      - uses: actions/download-artifact@v4
        with:
          pattern: next-train-label-[12]
          run-id: '38344535817'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: experiments/sts1-label-diagnosis/failed
      - run: python experiments/sts1-label-diagnosis/diagnose.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: label-failure-diagnosis
          path: experiments/sts1-label-diagnosis/diagnosis.json
          retention-days: 30
