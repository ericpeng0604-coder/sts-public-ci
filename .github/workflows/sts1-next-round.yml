name: STS1 Next Round Diagnostics and Data Pilot
on:
  push:
    branches: [codex/sts1-eight-world-public-pilot]
    paths:
      - 'experiments/sts1-next-round/**'
      - '.github/workflows/sts1-next-round.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sts1-next-round-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONPATH: ${{ github.workspace }}/experiments/sts1-pilot8/native:${{ github.workspace }}/src:${{ github.workspace }}/experiments/sts1-pilot8
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/sts1-pilot8/requirements.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -r experiments/sts1-pilot8/requirements.txt
      - run: python experiments/sts1-next-round/verify.py
      - name: Read six complete original label shards
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11756167217,11755893461,11755829369,11755783831,11755368969,11755248678'
          run-id: '38266942068'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded
      - name: Read recovery shards and the actual public candidate
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11786207559,11785829557,11785623617'
          run-id: '38338256285'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded
      - run: python experiments/sts1-next-round/diagnose.py --downloads downloaded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-round-diagnosis
          path: experiments/sts1-next-round/data/
          retention-days: 30
  shard:
    needs: diagnose
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/sts1-pilot8/requirements.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -r experiments/sts1-pilot8/requirements.txt
      - name: Read already-public G7 source artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11079234863'
          run-id: '36674639174'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original-g7
      - run: python experiments/sts1-pilot8/setup_runtime.py g7 --downloads original-g7
      - name: Compile pinned public simulator and audited bindings
        run: python experiments/sts1-pilot8/setup_runtime.py build --destination "$RUNNER_TEMP/sts1-native"
      - run: python experiments/sts1-next-round/verify.py
      - uses: actions/download-artifact@v4
        with:
          name: next-round-diagnosis
          path: diagnosis
      - run: python experiments/sts1-next-round/collect.py --shard ${{ matrix.shard }}
      - run: python experiments/sts1-next-round/refine.py --shard ${{ matrix.shard }} --downloads diagnosis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-round-shard-${{ matrix.shard }}
          path: experiments/sts1-next-round/data/
          retention-days: 30
  finalize:
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: next-round-*
          path: downloaded
      - run: python experiments/sts1-next-round/verify.py
      - run: python experiments/sts1-next-round/finalize.py --downloads downloaded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-round-state-lists-and-cost
          path: experiments/sts1-next-round/data/
          retention-days: 30
