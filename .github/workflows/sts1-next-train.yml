name: STS1 Fresh Cohort Noncombat Training and Validation
on:
  push:
    branches: [codex/sts1-eight-world-public-pilot]
    paths:
      - 'experiments/sts1-next-train/**'
      - '.github/workflows/sts1-next-train.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sts1-next-train-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONPATH: ${{ github.workspace }}/experiments/sts1-pilot8/native:${{ github.workspace }}/src:${{ github.workspace }}/experiments/sts1-pilot8
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/sts1-pilot8/requirements.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -r experiments/sts1-pilot8/requirements.txt
      - name: Read already-public G7 source artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11079234863'
          run-id: '36674639174'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original-g7
      - run: python experiments/sts1-pilot8/setup_runtime.py g7 --downloads original-g7
      - run: python experiments/sts1-next-train/verify.py
      - run: python -m unittest discover -s experiments/sts1-next-train -p test_features.py
      - name: Read completed diagnostic and independent state artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: next-round-*
          run-id: '38342627848'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded
      - run: python experiments/sts1-next-train/prepare.py --downloads downloaded
      - uses: actions/upload-artifact@v4
        with:
          name: next-train-prepared
          path: experiments/sts1-next-train/data/
          retention-days: 30
  label:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/sts1-pilot8/requirements.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -r experiments/sts1-pilot8/requirements.txt
      - name: Read already-public G7 source artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11079234863'
          run-id: '36674639174'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original-g7
      - run: python experiments/sts1-pilot8/setup_runtime.py g7 --downloads original-g7
      - name: Compile pinned public simulator and audited bindings
        run: python experiments/sts1-pilot8/setup_runtime.py build --destination "$RUNNER_TEMP/sts1-native"
      - run: python experiments/sts1-next-train/verify.py
      - uses: actions/download-artifact@v4
        with:
          name: next-train-prepared
          path: experiments/sts1-next-train/data
      - run: python experiments/sts1-next-train/label.py --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-train-label-${{ matrix.shard }}
          path: |
            experiments/sts1-next-train/data/labels/
            experiments/sts1-next-train/data/shard-summary.json
          retention-days: 30
  train:
    needs: label
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/sts1-pilot8/requirements.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -r experiments/sts1-pilot8/requirements.txt
      - name: Read already-public G7 source artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11079234863'
          run-id: '36674639174'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original-g7
      - run: python experiments/sts1-pilot8/setup_runtime.py g7 --downloads original-g7
      - run: python experiments/sts1-next-train/verify.py
      - uses: actions/download-artifact@v4
        with:
          name: next-train-prepared
          path: experiments/sts1-next-train/data
      - uses: actions/download-artifact@v4
        with:
          pattern: next-train-label-*
          path: downloaded
      - run: python experiments/sts1-next-train/train.py --downloads downloaded
      - id: gate
        run: |
          python - <<'PY'
          import json,os,pathlib
          report=json.loads(pathlib.Path('experiments/sts1-next-train/data/training-report.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('eligible='+('true' if report['selected'] is not None else 'false')+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-train-models
          path: |
            experiments/sts1-next-train/data/*.pt
            experiments/sts1-next-train/data/training-report.json
            experiments/sts1-next-train/data/model-freeze.json
          retention-days: 30
  evaluate:
    needs: train
    if: needs.train.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/sts1-pilot8/requirements.txt
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu -r experiments/sts1-pilot8/requirements.txt
      - name: Read already-public G7 source artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11079234863'
          run-id: '36674639174'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original-g7
      - run: python experiments/sts1-pilot8/setup_runtime.py g7 --downloads original-g7
      - name: Compile pinned public simulator and audited bindings
        run: python experiments/sts1-pilot8/setup_runtime.py build --destination "$RUNNER_TEMP/sts1-native"
      - run: python experiments/sts1-next-train/verify.py
      - uses: actions/download-artifact@v4
        with:
          name: next-train-models
          path: experiments/sts1-next-train/data
      - run: python experiments/sts1-next-train/evaluate.py shard --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-train-eval-${{ matrix.shard }}
          path: experiments/sts1-next-train/data/evaluation-*.json
          retention-days: 30
  finalize:
    needs: [train, evaluate]
    if: always() && needs.train.result == 'success' && (needs.evaluate.result == 'success' || needs.evaluate.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: next-train-models
          path: downloaded/models
      - uses: actions/download-artifact@v4
        if: needs.evaluate.result == 'success'
        with:
          pattern: next-train-eval-*
          path: downloaded/evaluation
      - run: python experiments/sts1-next-train/verify.py
      - run: python experiments/sts1-next-train/evaluate.py finalize --downloads downloaded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-train-final-report
          path: experiments/sts1-next-train/data/final-report.json
          retention-days: 30
