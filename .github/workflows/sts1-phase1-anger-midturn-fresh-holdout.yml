name: STS1 Phase 1 Anger Midturn Fresh Holdout

on:
  push:
    branches:
      - gpt/sts1-phase1-anger-midturn
    paths:
      - '.github/workflows/sts1-phase1-anger-midturn-fresh-holdout.yml'
      - 'tests/data/sts1_phase1_anger_midturn_fresh_holdout_seeds_64.txt'
      - 'scripts/sts1/generate_phase1_anger_midturn_fresh_holdout.py'
      - 'scripts/sts1/run_phase1_anger_midturn_fresh_quality.py'
      - 'src/roguelike_ai/sts1_teacher/anger_midturn_policy_v1.py'
      - 'src/roguelike_ai/sts1_teacher/anger_reconstruction.py'
      - 'src/roguelike_ai/sts1_teacher/reconstruction_state.py'
      - 'src/roguelike_ai/sts1_teacher/native_rollout.py'
      - 'scripts/sts1/apply_phase1_public_draw_midturn_aux_overlay.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anger-midturn-fresh-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Freeze contract and syntax
        run: |
          python -m py_compile \
            src/roguelike_ai/sts1_teacher/anger_midturn_policy_v1.py \
            src/roguelike_ai/sts1_teacher/anger_reconstruction.py \
            scripts/sts1/generate_phase1_anger_midturn_fresh_holdout.py \
            scripts/sts1/run_phase1_anger_midturn_fresh_quality.py \
            scripts/sts1/apply_phase1_public_draw_midturn_aux_overlay.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('tests/data/sts1_phase1_anger_midturn_fresh_holdout_seeds_64.txt')
          seeds = [int(x.strip()) for x in p.read_text().splitlines() if x.strip() and not x.lstrip().startswith('#')]
          assert len(seeds) == 64 and len(set(seeds)) == 64
          assert seeds == list(range(480001, 480065))
          print('ANGER_MIDTURN_FRESH_SOURCE_SEED_FREEZE = PASS')
          print('SOURCE_SEED_FILE_SHA256=' + hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          git diff --check HEAD^

      - name: Hydrate exact upstream sources
        run: python scripts/sts1/hydrate_jialeiv_baseline_v0.py

      - name: Apply diagnostic oracle binding
        run: python scripts/sts1/apply_phase1_oracle_judge_overlay.py

      - name: Apply read-only public-state overlay
        run: python scripts/sts1/apply_phase1_public_state_overlay.py

      - name: Apply public BattleContext reconstruction overlay
        run: python scripts/sts1/apply_phase1_public_reconstruction_overlay.py

      - name: Apply audited turn-aware history overlay
        run: python scripts/sts1/apply_phase1_public_history_guard_overlay.py

      - name: Apply established starter midturn counters
        run: python scripts/sts1/apply_phase1_public_midturn_counter_overlay.py

      - name: Apply CommunicationMod card aliases
        run: python scripts/sts1/apply_phase1_public_communicationmod_card_alias_overlay.py

      - name: Apply audited rich-card auxiliary path
        run: python scripts/sts1/apply_phase1_public_draw_midturn_aux_overlay.py

      - name: Build native Python binding
        run: python scripts/sts1/build_probe.py

      - name: Generate blind reachable Anger suite twice
        run: |
          python scripts/sts1/generate_phase1_anger_midturn_fresh_holdout.py --output evidence/anger-midturn-freeze-a.json
          python scripts/sts1/generate_phase1_anger_midturn_fresh_holdout.py --output evidence/anger-midturn-freeze-b.json
          cmp evidence/anger-midturn-freeze-a.json evidence/anger-midturn-freeze-b.json
          cp evidence/anger-midturn-freeze-a.json evidence/anger-midturn-suite.json

      - name: Run predeclared two-repeat Anger quality gate
        run: >-
          python scripts/sts1/run_phase1_anger_midturn_fresh_quality.py
          --suite evidence/anger-midturn-suite.json
          --output-dir evidence/sts1/phase1_anger_midturn_fresh_quality

      - name: Show quality summary
        if: always()
        run: |
          test -f evidence/sts1/phase1_anger_midturn_fresh_quality/summary.json && cat evidence/sts1/phase1_anger_midturn_fresh_quality/summary.json || true
          test -f evidence/anger-midturn-suite.json && python - <<'PY'
          from pathlib import Path
          import json
          p = Path('evidence/anger-midturn-suite.json')
          if p.exists():
              s = json.loads(p.read_text())
              print('SUITE_DIGEST=' + s['suite_digest'])
              print('CASE_COUNT=' + str(s['case_count']))
              print('REJECTED_COUNTS=' + str(s['rejected_counts']))
          PY

      - name: Upload fresh holdout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sts1-phase1-anger-midturn-fresh-quality-evidence
          path: |
            evidence/anger-midturn-suite.json
            evidence/sts1/phase1_anger_midturn_fresh_quality/
          if-no-files-found: warn
          retention-days: 90
