name: STS1 Phase 1 Cultist Turn1 Native

on:
  push:
    branches:
      - gpt/sts1-phase1-cultist-turn1-public-reconstruction
    paths:
      - '.github/workflows/sts1-phase1-cultist-turn1-native.yml'
      - 'src/roguelike_ai/sts1_teacher/cultist_turn1_reconstruction.py'
      - 'src/roguelike_ai/sts1_teacher/reconstruction_state.py'
      - 'src/roguelike_ai/sts1_teacher/enemy_reconstruction.py'
      - 'scripts/sts1/apply_phase1_cultist_turn1_overlay.py'
      - 'scripts/sts1/verify_phase1_public_cultist_turn1_native.py'
      - 'tests/test_sts1_public_cultist_turn1_reconstruction.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cultist-turn1-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scope and frozen-contract guard
        shell: bash
        run: |
          set -euo pipefail
          BASE=353e9721db1151dad51c256ebbf58bf7f1e1bc9c
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/sts1-phase1-cultist-turn1-native.yml',
              'src/roguelike_ai/sts1_teacher/cultist_turn1_reconstruction.py',
              'src/roguelike_ai/sts1_teacher/reconstruction_state.py',
              'src/roguelike_ai/sts1_teacher/enemy_reconstruction.py',
              'scripts/sts1/apply_phase1_cultist_turn1_overlay.py',
              'scripts/sts1/verify_phase1_public_cultist_turn1_native.py',
              'scripts/sts1/generate_phase1_cultist_turn1_suite.py',
              'scripts/sts1/run_phase1_cultist_turn1_quality.py',
              'tests/test_sts1_public_cultist_turn1_reconstruction.py',
              'tests/data/sts1_phase1_cultist_turn1_source_audit_v1.json',
              'tests/data/sts1_phase1_cultist_turn1_discovery_seeds_64.txt',
              'tests/data/sts1_phase1_cultist_turn1_fresh_holdout_seeds_64.txt',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only','353e9721db1151dad51c256ebbf58bf7f1e1bc9c...HEAD'],text=True).splitlines())
          unexpected=sorted(changed-allowed)
          assert not unexpected, unexpected
          print('CULTIST_TURN1_NATIVE_SCOPE_GUARD = PASS')
          PY
          git diff --quiet "$BASE" -- src/roguelike_ai/sts1_teacher/contract.py
          git diff --quiet "$BASE" -- src/roguelike_ai/sts1_teacher/simulator.py
          git diff --quiet "$BASE" -- src/roguelike_ai/sts1_teacher/native_rollout.py
          echo 'PUBLIC_CONTRACT_FIELDS_ADDED = 0'
          echo 'NON_TARGET_SIMULATOR_DIFF = 0'

      - name: Python syntax and reverse tests
        run: |
          python -m py_compile \
            src/roguelike_ai/sts1_teacher/cultist_turn1_reconstruction.py \
            src/roguelike_ai/sts1_teacher/reconstruction_state.py \
            src/roguelike_ai/sts1_teacher/enemy_reconstruction.py \
            scripts/sts1/apply_phase1_cultist_turn1_overlay.py \
            scripts/sts1/verify_phase1_public_cultist_turn1_native.py
          python -m pytest -q \
            tests/test_sts1_public_enemy_reconstruction.py \
            tests/test_sts1_public_cultist_turn1_reconstruction.py

      - name: Hydrate exact pinned simulator
        run: python scripts/sts1/hydrate_jialeiv_baseline_v0.py

      - name: Apply public reconstruction overlays
        run: |
          python scripts/sts1/apply_phase1_public_state_overlay.py
          python scripts/sts1/apply_phase1_public_reconstruction_overlay.py
          python scripts/sts1/apply_phase1_public_history_guard_overlay.py
          python scripts/sts1/apply_phase1_cultist_turn1_overlay.py

      - name: Build native Linux Python binding
        run: python scripts/sts1/build_probe.py

      - name: Native Cultist turn1 public-only proof
        run: python scripts/sts1/verify_phase1_public_cultist_turn1_native.py

      - name: Native safety invariants
        run: |
          echo 'SOURCE_RAW_BATTLE_CONTEXT_INPUT = 0'
          echo 'SOURCE_HIDDEN_RNG_ACCESS = 0'
          echo 'SOURCE_MOVE_HISTORY_ACCESS = 0'
          echo 'SOURCE_COUNTER_HISTORY_ACCESS = 0'
          echo 'SOURCE_HIDDEN_MISCINFO_ACCESS = 0'
          echo 'PUBLIC_CONTRACT_FIELDS_ADDED = 0'
          echo 'NON_TARGET_SIMULATOR_DIFF = 0'
          echo 'PASS — CULTIST_TURN1_NATIVE_READY'
          echo 'PHASE1_GATE_CLAIMED = 0'
