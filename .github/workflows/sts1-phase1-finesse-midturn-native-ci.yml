name: STS1 Phase 1 Finesse Midturn Native CI

on:
  push:
    branches:
      - gpt/sts1-phase1-finesse-draw-reconstruction-v2
      - gpt/sts1-phase1-anger-pommel-v2-integration
      - gpt/sts1-phase1-public-reconstruction
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install focused test dependency
        run: python -m pip install 'pytest>=8,<9'
      - name: Syntax gate
        run: >-
          python -m py_compile
          src/roguelike_ai/sts1_teacher/card_reconstruction.py
          src/roguelike_ai/sts1_teacher/finesse_reconstruction.py
          src/roguelike_ai/sts1_teacher/composition_reconstruction.py
          src/roguelike_ai/sts1_teacher/anger_pommel_composition_policy_v2.py
          src/roguelike_ai/sts1_teacher/reconstruction_state.py
          scripts/sts1/apply_phase1_public_finesse_midturn_overlay.py
          scripts/sts1/verify_phase1_public_finesse_midturn_native.py
          scripts/sts1/verify_phase1_public_anger_pommel_composition_native.py
          scripts/sts1/generate_phase1_anger_pommel_composition_v2_holdout.py
          scripts/sts1/run_phase1_anger_pommel_composition_v2_holdout_quality.py
          tests/test_sts1_finesse_midturn_reconstruction.py
          tests/test_sts1_anger_pommel_composition_reconstruction.py
      - name: Finesse plus established rich-slice regressions
        run: >-
          python -m pytest -q
          tests/test_sts1_anger_midturn_reconstruction.py
          tests/test_sts1_anger_pommel_composition_reconstruction.py
          tests/test_sts1_pommel_midturn_reconstruction.py
          tests/test_sts1_shrug_midturn_reconstruction.py
          tests/test_sts1_shrug_upgraded_midturn_reconstruction.py
          tests/test_sts1_finesse_midturn_reconstruction.py
          tests/test_sts1_public_card_reconstruction.py
          tests/test_sts1_public_native_v1_admission.py
          tests/test_sts1_reconstruction_state.py
      - name: Frozen public contract remains unchanged
        shell: bash
        run: |
          git diff --name-only 5a4dded2fb8ee7a07a737dab81a95d9bdcbd6d94...HEAD > "$RUNNER_TEMP/changed.txt"
          ! grep -Fx 'src/roguelike_ai/sts1_teacher/contract.py' "$RUNNER_TEMP/changed.txt"
          ! grep -Fx 'docs/sts1/STS1_PUBLIC_STATE_CONTRACT_V1.md' "$RUNNER_TEMP/changed.txt"
          echo 'FROZEN_PUBLIC_CONTRACT_UNCHANGED = PASS'
      - name: Diff whitespace gate
        run: git diff --check 5a4dded2fb8ee7a07a737dab81a95d9bdcbd6d94...HEAD

  native-proof:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Hydrate exact upstream sources
        run: python scripts/sts1/hydrate_jialeiv_baseline_v0.py
      - name: Snapshot pre-overlay non-target diff
        run: git -C external/sts_lightspeed/source diff -- . ':(exclude)bindings/slaythespire.cpp' > "$RUNNER_TEMP/nonbinding-before.diff"
      - name: Apply public overlays
        run: |
          python scripts/sts1/apply_phase1_public_state_overlay.py
          python scripts/sts1/apply_phase1_public_reconstruction_overlay.py
          python scripts/sts1/apply_phase1_public_history_guard_overlay.py
          python scripts/sts1/apply_phase1_public_midturn_counter_overlay.py
          python scripts/sts1/apply_phase1_public_communicationmod_card_alias_overlay.py
          python scripts/sts1/apply_phase1_public_draw_midturn_aux_overlay.py
          python scripts/sts1/apply_phase1_public_finesse_midturn_overlay.py
      - name: Build native Python binding
        run: python scripts/sts1/build_probe.py
      - name: Re-run opening proof
        run: python scripts/sts1/verify_phase1_public_reconstruction_native.py
      - name: Re-run Pommel proof
        run: python scripts/sts1/verify_phase1_public_pommel_midturn_native.py
      - name: Re-run normal Shrug proof
        run: python scripts/sts1/verify_phase1_public_shrug_midturn_native.py
      - name: Re-run upgraded Shrug proof
        run: python scripts/sts1/verify_phase1_public_shrug_upgraded_midturn_native.py
      - name: Re-run Anger proof
        run: python scripts/sts1/verify_phase1_public_anger_midturn_native.py
      - name: Run Anger plus Pommel composition proof
        run: python scripts/sts1/verify_phase1_public_anger_pommel_composition_native.py
      - name: Run Finesse proof
        run: python scripts/sts1/verify_phase1_public_finesse_midturn_native.py
      - name: Prove overlay scope
        shell: bash
        run: |
          git -C external/sts_lightspeed/source diff -- . ':(exclude)bindings/slaythespire.cpp' > "$RUNNER_TEMP/nonbinding-after.diff"
          cmp "$RUNNER_TEMP/nonbinding-before.diff" "$RUNNER_TEMP/nonbinding-after.diff"
          git -C external/sts_lightspeed/source diff --check
          git -C external/sts_lightspeed/source diff -- bindings/slaythespire.cpp | grep -F 'phase1_public_anger_midturn_aux_v1'
          git -C external/sts_lightspeed/source diff -- bindings/slaythespire.cpp | grep -F 'phase1_public_anger_pommel_composition_v1'
          git -C external/sts_lightspeed/source diff -- bindings/slaythespire.cpp | grep -F 'phase1_public_finesse_midturn_aux_v2'
          echo 'NON_TARGET_SIMULATOR_DIFF = 0'

  anger-pommel-v2-integration-regression-replay:
    needs: native-proof
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Freeze integration replay identity
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/data/sts1_phase1_anger_pommel_composition_v2_holdout_seeds_256.txt')
          seeds = [int(x.strip()) for x in p.read_text().splitlines() if x.strip() and not x.lstrip().startswith('#')]
          assert seeds == list(range(520001, 520257))
          print('ANGER_POMMEL_V2_INTEGRATION_REGRESSION_REPLAY = FROZEN')
          print('SOURCE_SEED_COUNT=256')
          print('FRESH_HOLDOUT_CLAIMED=0')
          PY
      - run: python scripts/sts1/hydrate_jialeiv_baseline_v0.py
      - run: python scripts/sts1/apply_phase1_oracle_judge_overlay.py
      - run: python scripts/sts1/apply_phase1_public_state_overlay.py
      - run: python scripts/sts1/apply_phase1_public_reconstruction_overlay.py
      - run: python scripts/sts1/apply_phase1_public_history_guard_overlay.py
      - run: python scripts/sts1/apply_phase1_public_midturn_counter_overlay.py
      - run: python scripts/sts1/apply_phase1_public_communicationmod_card_alias_overlay.py
      - run: python scripts/sts1/apply_phase1_public_draw_midturn_aux_overlay.py
      - run: python scripts/sts1/apply_phase1_public_finesse_midturn_overlay.py
      - run: python scripts/sts1/build_probe.py
      - name: Generate frozen 520xxx integration replay twice
        run: |
          python scripts/sts1/generate_phase1_anger_pommel_composition_v2_holdout.py --output evidence/anger-pommel-v2-integration-replay-a.json
          python scripts/sts1/generate_phase1_anger_pommel_composition_v2_holdout.py --output evidence/anger-pommel-v2-integration-replay-b.json
          cmp evidence/anger-pommel-v2-integration-replay-a.json evidence/anger-pommel-v2-integration-replay-b.json
          cp evidence/anger-pommel-v2-integration-replay-a.json evidence/anger-pommel-v2-integration-replay-suite.json
      - name: Replay unchanged predeclared V2 quality gate
        run: >-
          python scripts/sts1/run_phase1_anger_pommel_composition_v2_holdout_quality.py
          --suite evidence/anger-pommel-v2-integration-replay-suite.json
          --output-dir evidence/sts1/phase1_anger_pommel_composition_v2_integration_replay
      - name: Show integration replay summary
        if: always()
        run: |
          test -f evidence/sts1/phase1_anger_pommel_composition_v2_integration_replay/summary.json && cat evidence/sts1/phase1_anger_pommel_composition_v2_integration_replay/summary.json || true
          echo 'INTEGRATION_REPLAY_ONLY=1'
          echo 'FRESH_HOLDOUT_CLAIMED=0'

  jaw-worm-quality:
    needs: native-proof
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/sts1/hydrate_jialeiv_baseline_v0.py
      - run: python scripts/sts1/apply_phase1_oracle_judge_overlay.py
      - run: python scripts/sts1/apply_phase1_public_state_overlay.py
      - run: python scripts/sts1/apply_phase1_public_reconstruction_overlay.py
      - run: python scripts/sts1/apply_phase1_public_history_guard_overlay.py
      - run: python scripts/sts1/build_probe.py
      - name: Generate frozen suite twice
        run: |
          python scripts/sts1/generate_phase1_public_search_v1_suite.py --output evidence/freeze-a.json
          python scripts/sts1/generate_phase1_public_search_v1_suite.py --output evidence/freeze-b.json
          cmp evidence/freeze-a.json evidence/freeze-b.json
          cp evidence/freeze-a.json evidence/suite.json
      - name: Run two-repeat quality benchmark
        run: python scripts/sts1/run_phase1_public_search_v1_quality.py --suite evidence/suite.json --output-dir evidence/sts1/phase1_public_search_v1_quality

  cultist-quality:
    needs: native-proof
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/sts1/hydrate_jialeiv_baseline_v0.py
      - run: python scripts/sts1/apply_phase1_oracle_judge_overlay.py
      - run: python scripts/sts1/apply_phase1_public_state_overlay.py
      - run: python scripts/sts1/apply_phase1_public_reconstruction_overlay.py
      - run: python scripts/sts1/apply_phase1_public_history_guard_overlay.py
      - run: python scripts/sts1/build_probe.py
      - name: Generate frozen Cultist suite twice
        run: |
          python scripts/sts1/generate_phase1_public_search_v1_cultist_suite.py --output evidence/cultist-freeze-a.json
          python scripts/sts1/generate_phase1_public_search_v1_cultist_suite.py --output evidence/cultist-freeze-b.json
          cmp evidence/cultist-freeze-a.json evidence/cultist-freeze-b.json
          cp evidence/cultist-freeze-a.json evidence/cultist-suite.json
      - name: Run two-repeat Cultist quality benchmark
        run: python scripts/sts1/run_phase1_public_search_v1_cultist_quality.py --suite evidence/cultist-suite.json --output-dir evidence/sts1/phase1_public_search_v1_cultist_quality

  gremlin-nob-quality:
    needs: native-proof
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/sts1/hydrate_jialeiv_baseline_v0.py
      - run: python scripts/sts1/apply_phase1_oracle_judge_overlay.py
      - run: python scripts/sts1/apply_phase1_public_state_overlay.py
      - run: python scripts/sts1/apply_phase1_public_reconstruction_overlay.py
      - run: python scripts/sts1/apply_phase1_public_history_guard_overlay.py
      - run: python scripts/sts1/build_probe.py
      - name: Generate frozen Gremlin Nob suite twice
        run: |
          python scripts/sts1/generate_phase1_public_search_v1_gremlin_nob_suite.py --output evidence/nob-freeze-a.json
          python scripts/sts1/generate_phase1_public_search_v1_gremlin_nob_suite.py --output evidence/nob-freeze-b.json
          cmp evidence/nob-freeze-a.json evidence/nob-freeze-b.json
          cp evidence/nob-freeze-a.json evidence/nob-suite.json
      - name: Run two-repeat Gremlin Nob quality benchmark
        run: python scripts/sts1/run_phase1_public_search_v1_gremlin_nob_quality.py --suite evidence/nob-suite.json --output-dir evidence/sts1/phase1_public_search_v1_gremlin_nob_quality
