          --suite evidence/nob-suite.json
          --output-dir evidence/sts1/phase1_public_search_v1_gremlin_nob_quality
      - name: Show Gremlin Nob quality summary
        if: always()
        run: |
          test -f evidence/sts1/phase1_public_search_v1_gremlin_nob_quality/summary.json && cat evidence/sts1/phase1_public_search_v1_gremlin_nob_quality/summary.json || true
