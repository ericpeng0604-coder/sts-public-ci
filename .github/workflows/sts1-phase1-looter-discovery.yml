name: STS1 Phase 1 Looter Discovery

on:
  push:
    branches:
      - gpt/sts1-phase1-looter-turn0-native
    paths:
      - '.github/workflows/sts1-phase1-looter-discovery.yml'
      - 'src/roguelike_ai/sts1_teacher/native_rollout.py'
      - 'src/roguelike_ai/sts1_teacher/enemy_reconstruction.py'
      - 'scripts/sts1/generate_phase1_looter_suite.py'
      - 'scripts/sts1/run_phase1_looter_quality.py'
      - 'scripts/sts1/apply_phase1_public_history_guard_overlay.py'
      - 'tests/data/sts1_phase1_looter_discovery_seeds_64.txt'
      - 'tests/data/sts1_phase1_looter_fresh_holdout_seeds_64.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  looter-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Freeze scope and disjoint evidence identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < tests/data/sts1_phase1_looter_discovery_seeds_64.txt)" -eq 64
          test "$(wc -l < tests/data/sts1_phase1_looter_fresh_holdout_seeds_64.txt)" -eq 64
          test "$(sort -n tests/data/sts1_phase1_looter_discovery_seeds_64.txt | uniq | wc -l)" -eq 64
          test "$(sort -n tests/data/sts1_phase1_looter_fresh_holdout_seeds_64.txt | uniq | wc -l)" -eq 64
          test "$(comm -12 <(sort -n tests/data/sts1_phase1_looter_discovery_seeds_64.txt) <(sort -n tests/data/sts1_phase1_looter_fresh_holdout_seeds_64.txt) | wc -l)" -eq 0
          echo "DISCOVERY_SEED_SHA256=$(sha256sum tests/data/sts1_phase1_looter_discovery_seeds_64.txt | awk '{print $1}')"
          echo "FRESH_HOLDOUT_SEED_SHA256=$(sha256sum tests/data/sts1_phase1_looter_fresh_holdout_seeds_64.txt | awk '{print $1}')"
          echo 'DISCOVERY_HOLDOUT_DISJOINT = PASS'
          echo 'FRESH_HOLDOUT_QUALITY_OBSERVED = 0'
          echo 'PUBLIC_CONTRACT_FIELDS_ADDED = 0'

      - name: Syntax gate
        run: >-
          python -m py_compile
          src/roguelike_ai/sts1_teacher/native_rollout.py
          scripts/sts1/generate_phase1_looter_suite.py
          scripts/sts1/run_phase1_looter_quality.py

      - name: Hydrate exact upstream sources
        run: python scripts/sts1/hydrate_jialeiv_baseline_v0.py

      - name: Apply diagnostic oracle binding
        run: python scripts/sts1/apply_phase1_oracle_judge_overlay.py

      - name: Apply public reconstruction overlays
        run: |
          python scripts/sts1/apply_phase1_public_state_overlay.py
          python scripts/sts1/apply_phase1_public_reconstruction_overlay.py
          python scripts/sts1/apply_phase1_public_history_guard_overlay.py

      - name: Build native Python binding
        run: python scripts/sts1/build_probe.py

      - name: Reprove Looter Native Ready semantics
        run: python scripts/sts1/verify_phase1_public_looter_native.py

      - name: Generate frozen discovery suite twice
        run: |
          python scripts/sts1/generate_phase1_looter_suite.py --suite-kind discovery --output "$RUNNER_TEMP/looter-discovery-a.json"
          python scripts/sts1/generate_phase1_looter_suite.py --suite-kind discovery --output "$RUNNER_TEMP/looter-discovery-b.json"
          cmp "$RUNNER_TEMP/looter-discovery-a.json" "$RUNNER_TEMP/looter-discovery-b.json"
          cp "$RUNNER_TEMP/looter-discovery-a.json" "$RUNNER_TEMP/looter-discovery.json"
          echo 'LOOTER_DISCOVERY_SUITE_DETERMINISTIC = PASS'

      - name: Run raw public Search discovery quality
        run: >-
          python scripts/sts1/run_phase1_looter_quality.py
          --suite-kind discovery
          --suite "$RUNNER_TEMP/looter-discovery.json"
          --output-dir "$RUNNER_TEMP/looter-discovery-evidence"

      - name: Discovery evidence gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'looter-discovery-evidence' / 'summary.json'
          s = json.loads(p.read_text())
          assert s['case_count'] == 24
          assert s['deterministic'] is True and s['full_repeats'] == 2
          assert s['search_unresolved'] == 0
          assert s['illegal_actions'] == 0
          assert s['leakage'] == 0
          assert s['quality_verdict'] in {'PASS', 'FAIL'}
          print('SEARCH', s['agreement_counts']['search'])
          print('SIMPLE', s['agreement_counts']['simple'])
          print('RANDOM', s['agreement_counts']['random'])
          print('QUALITY_VERDICT', s['quality_verdict'])
          print('SUITE_DIGEST', s['suite_digest'])
          print('ROWS_DIGEST', s['rows_digest'])
          print('DISCOVERY_EXECUTION_INTEGRITY = PASS')
          print('FRESH_HOLDOUT_QUALITY_OBSERVED = 0')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sts1-phase1-looter-discovery-evidence
          path: ${{ runner.temp }}/looter-discovery-evidence
          if-no-files-found: error
