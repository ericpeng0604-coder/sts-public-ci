name: STS1 Phase 1 Looter Turn0 Native

on:
  push:
    branches:
      - gpt/sts1-phase1-looter-turn0-native
      - gpt/sts1-phase1-public-reconstruction
    paths:
      - '.github/workflows/sts1-phase1-looter-turn0-native.yml'
      - 'src/roguelike_ai/sts1_teacher/enemy_reconstruction.py'
      - 'tests/test_sts1_public_enemy_reconstruction.py'
      - 'scripts/sts1/apply_phase1_public_history_guard_overlay.py'
      - 'scripts/sts1/verify_phase1_public_looter_native.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  looter-turn0-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install 'pytest>=8,<9'

      - name: Frozen contract and exact scope guard
        run: |
          git diff --exit-code 47033d35846a8cddfdfc5470f998ae5c2395406c -- src/roguelike_ai/sts1_teacher/contract.py
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/sts1-phase1-looter-turn0-native.yml',
              '.github/workflows/sts1-phase1-looter-discovery.yml',
              '.github/workflows/sts1-phase1-looter-fresh-holdout.yml',
              '.github/workflows/sts1-phase1-looter-v2-discovery.yml',
              '.github/workflows/sts1-phase1-looter-v2-fresh-holdout.yml',
              '.github/workflows/sts1-phase1-looter-formal-integration.yml',
              'src/roguelike_ai/sts1_teacher/enemy_reconstruction.py',
              'src/roguelike_ai/sts1_teacher/player_reconstruction.py',
              'src/roguelike_ai/sts1_teacher/native_rollout.py',
              'tests/test_sts1_public_enemy_reconstruction.py',
              'tests/test_sts1_public_native_v1_admission.py',
              'scripts/sts1/apply_phase1_public_history_guard_overlay.py',
              'scripts/sts1/verify_phase1_public_looter_native.py',
              'scripts/sts1/generate_phase1_looter_suite.py',
              'scripts/sts1/run_phase1_looter_quality.py',
              'scripts/sts1/generate_phase1_looter_v2_suite.py',
              'scripts/sts1/run_phase1_looter_v2_quality.py',
              'scripts/sts1/verify_phase1_looter_gold_tiebreak_v2.py',
              'tests/data/sts1_phase1_looter_candidate_freeze_v1.json',
              'tests/data/sts1_phase1_looter_candidate_freeze_v2.json',
              'tests/data/sts1_phase1_looter_discovery_seeds_64.txt',
              'tests/data/sts1_phase1_looter_fresh_holdout_seeds_64.txt',
              'tests/data/sts1_phase1_looter_v2_discovery_seeds_64.txt',
              'tests/data/sts1_phase1_looter_v2_fresh_holdout_seeds_64.txt',
    '.github/workflows/sts1-phase1-looter-turn1-discovery.yml',
    '.github/workflows/sts1-phase1-looter-turn1-fresh-holdout.yml',
    'scripts/sts1/generate_phase1_looter_turn1_suite.py',
    'scripts/sts1/run_phase1_looter_turn1_quality.py',
    'tests/data/sts1_phase1_looter_turn1_candidate_freeze_v1.json',
    'tests/data/sts1_phase1_looter_turn1_discovery_seeds_64.txt',
    'tests/data/sts1_phase1_looter_turn1_fresh_holdout_seeds_64.txt',
          }
          changed = set(subprocess.check_output([
              'git', 'diff', '--name-only',
              '47033d35846a8cddfdfc5470f998ae5c2395406c...HEAD'
          ], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          assert not unexpected, f'unexpected_changed_paths:{unexpected}'
          print('PUBLIC_CONTRACT_FIELDS_ADDED = 0')
          print('TRACKED_SCOPE_GUARD = PASS')
          print('CUMULATIVE_LOOTER_FORMAL_EVIDENCE_ALLOWED = PASS')
          PY

      - name: Public reconstruction regression tests
        run: >-
          python -m pytest -q
          tests/test_sts1_public_reconstruction.py
          tests/test_sts1_public_run_state.py
          tests/test_sts1_public_redeterminization.py
          tests/test_sts1_public_card_reconstruction.py
          tests/test_sts1_public_enemy_reconstruction.py
          tests/test_sts1_public_native_v1_admission.py
          tests/test_sts1_reconstruction_state.py
          tests/test_sts1_public_reconstruction_smoke.py

      - name: Syntax gate
        run: >-
          python -m py_compile
          src/roguelike_ai/sts1_teacher/enemy_reconstruction.py
          scripts/sts1/apply_phase1_public_history_guard_overlay.py
          scripts/sts1/verify_phase1_public_looter_native.py

      - name: Diff whitespace gate
        run: git diff --check 47033d35846a8cddfdfc5470f998ae5c2395406c...HEAD

      - name: Hydrate exact upstream sources
        run: python scripts/sts1/hydrate_jialeiv_baseline_v0.py

      - name: Snapshot non-target simulator diff
        run: >-
          git -C external/sts_lightspeed/source diff -- .
          ':(exclude)bindings/slaythespire.cpp'
          > "$RUNNER_TEMP/nonbinding-before.diff"

      - name: Apply read-only public-state overlay
        run: python scripts/sts1/apply_phase1_public_state_overlay.py

      - name: Apply public BattleContext reconstruction overlay
        run: python scripts/sts1/apply_phase1_public_reconstruction_overlay.py

      - name: Apply audited opening-enemy overlay
        run: python scripts/sts1/apply_phase1_public_history_guard_overlay.py

      - name: Build native Python binding
        run: python scripts/sts1/build_probe.py

      - name: Existing Jaw Worm native reconstruction regression
        run: python scripts/sts1/verify_phase1_public_reconstruction_native.py

      - name: Existing Gremlin Nob native regression
        run: python scripts/sts1/verify_phase1_public_gremlin_nob_native.py

      - name: Existing Blue Slaver native regression
        run: python scripts/sts1/verify_phase1_public_blue_slaver_native.py

      - name: Existing Red Slaver native regression
        run: python scripts/sts1/verify_phase1_public_red_slaver_native.py

      - name: Looter turn0 native proof
        run: python scripts/sts1/verify_phase1_public_looter_native.py

      - name: Existing paired PublicStateSearch regression
        run: python scripts/sts1/verify_phase1_public_search_native.py

      - name: Prove only binding overlay changed upstream simulator
        run: |
          git -C external/sts_lightspeed/source diff -- . ':(exclude)bindings/slaythespire.cpp' > "$RUNNER_TEMP/nonbinding-after.diff"
          cmp "$RUNNER_TEMP/nonbinding-before.diff" "$RUNNER_TEMP/nonbinding-after.diff"
          git -C external/sts_lightspeed/source diff --check
          git -C external/sts_lightspeed/source diff -- bindings/slaythespire.cpp | grep -F 'phase1_public_looter_opening_v1'
          echo 'NON_TARGET_SIMULATOR_DIFF = 0'
          echo 'SOURCE_HIDDEN_RNG_ACCESS = 0'
          echo 'SOURCE_RAW_BATTLE_CONTEXT_INPUT = 0'
          echo 'SOURCE_MOVE_HISTORY_ACCESS = 0'
          echo 'SOURCE_COUNTER_HISTORY_ACCESS = 0'
          echo 'SOURCE_HIDDEN_MISCINFO_ACCESS = 0'
          echo 'PHASE1_GATE_CLAIMED = 0'
          echo 'LOOTER_TURN0_NATIVE_READY = PASS'
