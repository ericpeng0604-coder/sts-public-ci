name: STS1 Phase 1 Looter Turn1 Discovery

on:
  push:
    branches:
      - gpt/sts1-phase1-looter-turn1-quality-v1
    paths:
      - '.github/workflows/sts1-phase1-looter-turn1-discovery.yml'
      - 'scripts/sts1/generate_phase1_looter_turn1_suite.py'
      - 'scripts/sts1/run_phase1_looter_turn1_quality.py'
      - 'tests/data/sts1_phase1_looter_turn1_discovery_seeds_64.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  looter-turn1-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Freeze turn1 scope and blind 630xxx identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/sts1-phase1-looter-turn1-discovery.yml',
              'scripts/sts1/generate_phase1_looter_turn1_suite.py',
              'scripts/sts1/run_phase1_looter_turn1_quality.py',
              'tests/data/sts1_phase1_looter_turn1_discovery_seeds_64.txt',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only','8141ee42dee7506a05115adc8ee179ab4d68ebf9...HEAD'],text=True).splitlines())
          unexpected=sorted(changed-allowed)
          assert not unexpected, unexpected
          print('DISCOVERY_SCOPE_GUARD = PASS')
          PY
          test "$(wc -l < tests/data/sts1_phase1_looter_turn1_discovery_seeds_64.txt)" -eq 64
          test "$(sort -n tests/data/sts1_phase1_looter_turn1_discovery_seeds_64.txt | uniq | wc -l)" -eq 64
          test "$(head -1 tests/data/sts1_phase1_looter_turn1_discovery_seeds_64.txt)" = '630001'
          test "$(tail -1 tests/data/sts1_phase1_looter_turn1_discovery_seeds_64.txt)" = '630064'
          test "$(sha256sum tests/data/sts1_phase1_looter_turn1_discovery_seeds_64.txt | awk '{print $1}')" = '997e6328e301a0d75111743063fe52df210b1f4d8c52e73c30bfbc60f77be795'
          test ! -e tests/data/sts1_phase1_looter_turn1_fresh_holdout_seeds_64.txt
          for other in \
            tests/data/sts1_phase1_looter_discovery_seeds_64.txt \
            tests/data/sts1_phase1_looter_fresh_holdout_seeds_64.txt \
            tests/data/sts1_phase1_looter_v2_discovery_seeds_64.txt \
            tests/data/sts1_phase1_looter_v2_fresh_holdout_seeds_64.txt; do
            test "$(comm -12 <(sort -n tests/data/sts1_phase1_looter_turn1_discovery_seeds_64.txt) <(sort -n "$other") | wc -l)" -eq 0
          done
          git diff --quiet 8141ee42dee7506a05115adc8ee179ab4d68ebf9 -- src/roguelike_ai/sts1_teacher/contract.py
          git diff --quiet 8141ee42dee7506a05115adc8ee179ab4d68ebf9 -- src/roguelike_ai/sts1_teacher/simulator.py
          git diff --quiet 8141ee42dee7506a05115adc8ee179ab4d68ebf9 -- src/roguelike_ai/sts1_teacher/native_rollout.py
          echo 'CANDIDATE_ID = looter-turn1-positive-gold-public-search-gold-tiebreak-v1'
          echo 'CANDIDATE_POLICY = REUSE_FROZEN_TURN0_V2_GOLD_TIEBREAK'
          echo 'DISCOVERY_SEED_SHA256 = 997e6328e301a0d75111743063fe52df210b1f4d8c52e73c30bfbc60f77be795'
          echo '640XXX_RANGE_PRECOMMITTED = 640001..640064'
          echo '640XXX_FRESH_HOLDOUT_OPENED = 0'
          echo 'OLD_LOOTER_EVIDENCE_USED_AS_NEW = 0'
          echo 'PUBLIC_CONTRACT_FIELDS_ADDED = 0'
          echo 'NON_TARGET_SIMULATOR_DIFF = 0'

      - name: Syntax gate
        run: >-
          python -m py_compile
          scripts/sts1/generate_phase1_looter_turn1_suite.py
          scripts/sts1/run_phase1_looter_turn1_quality.py

      - name: Reprove bounded gold tie-break
        run: python scripts/sts1/verify_phase1_looter_gold_tiebreak_v2.py

      - name: Hydrate exact upstream sources
        run: python scripts/sts1/hydrate_jialeiv_baseline_v0.py

      - name: Apply diagnostic oracle binding
        run: python scripts/sts1/apply_phase1_oracle_judge_overlay.py

      - name: Apply public reconstruction overlays
        run: |
          python scripts/sts1/apply_phase1_public_state_overlay.py
          python scripts/sts1/apply_phase1_public_reconstruction_overlay.py
          python scripts/sts1/apply_phase1_public_history_guard_overlay.py

      - name: Build native Python binding
        run: python scripts/sts1/build_probe.py

      - name: Reverify Looter turn1 Native boundary
        run: python scripts/sts1/verify_phase1_public_looter_native.py

      - name: Generate blind 630xxx discovery suite twice
        run: |
          python scripts/sts1/generate_phase1_looter_turn1_suite.py --suite-kind discovery --output "$RUNNER_TEMP/looter-turn1-discovery-a.json"
          python scripts/sts1/generate_phase1_looter_turn1_suite.py --suite-kind discovery --output "$RUNNER_TEMP/looter-turn1-discovery-b.json"
          cmp "$RUNNER_TEMP/looter-turn1-discovery-a.json" "$RUNNER_TEMP/looter-turn1-discovery-b.json"
          cp "$RUNNER_TEMP/looter-turn1-discovery-a.json" "$RUNNER_TEMP/looter-turn1-discovery.json"
          echo 'LOOTER_TURN1_DISCOVERY_SUITE_DETERMINISTIC = PASS'

      - name: Run candidate on 630xxx discovery
        run: >-
          python scripts/sts1/run_phase1_looter_turn1_quality.py
          --suite-kind discovery
          --suite "$RUNNER_TEMP/looter-turn1-discovery.json"
          --output-dir "$RUNNER_TEMP/looter-turn1-discovery-evidence"

      - name: Discovery evidence integrity
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'looter-turn1-discovery-evidence'/'summary.json').read_text())
          assert s['candidate_id']=='looter-turn1-positive-gold-public-search-gold-tiebreak-v1'
          assert s['case_count']==24
          assert s['deterministic'] is True and s['full_repeats']==2
          assert s['search_unresolved']==0
          assert s['illegal_actions']==0
          assert s['leakage']==0
          assert s['gold_tiebreak']['can_overturn_nonzero_combat_mean_gap'] is False
          print('SEARCH',s['agreement_counts']['search'])
          print('SIMPLE',s['agreement_counts']['simple'])
          print('RANDOM',s['agreement_counts']['random'])
          print('QUALITY_VERDICT',s['quality_verdict'])
          print('QUALITY_REASONS',s['quality_reasons'])
          print('SUITE_DIGEST',s['suite_digest'])
          print('ROWS_DIGEST',s['rows_digest'])
          print('SOURCE_SEED_FILE_SHA256',s['source_seed_file_sha256'])
          print('DISCOVERY_EXECUTION_INTEGRITY = PASS')
          print('640XXX_FRESH_HOLDOUT_OPENED = 0')
          print('PUBLIC_CONTRACT_FIELDS_ADDED = 0')
          print('NON_TARGET_SIMULATOR_DIFF = 0')
          print('PHASE1_GATE_CLAIMED = 0')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sts1-phase1-looter-turn1-discovery-evidence
          path: ${{ runner.temp }}/looter-turn1-discovery-evidence
          if-no-files-found: warn

      - name: Strict Discovery quality gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'looter-turn1-discovery-evidence'/'summary.json').read_text())
          assert s['quality_verdict']=='PASS', s
          assert s['agreement_counts']['search'] > s['agreement_counts']['simple'], s
          assert s['agreement_counts']['search'] > s['agreement_counts']['random'], s
          print('PASS — LOOTER_TURN1_POSITIVE_GOLD_DISCOVERY')
          PY
