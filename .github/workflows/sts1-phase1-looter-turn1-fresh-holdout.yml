name: STS1 Phase 1 Looter Turn1 Fresh Holdout

on:
  push:
    branches:
      - gpt/sts1-phase1-looter-turn1-quality-v1
    paths:
      - '.github/workflows/sts1-phase1-looter-turn1-fresh-holdout.yml'
      - 'tests/data/sts1_phase1_looter_turn1_fresh_holdout_seeds_64.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  looter-turn1-fresh-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen candidate before first 640xxx open
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          expected_last_commit={
              '.github/workflows/sts1-phase1-looter-turn1-fresh-holdout.yml',
              'tests/data/sts1_phase1_looter_turn1_fresh_holdout_seeds_64.txt',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD^...HEAD'],text=True).splitlines())
          assert changed==expected_last_commit, changed
          allowed={
              '.github/workflows/sts1-phase1-looter-turn1-discovery.yml',
              'scripts/sts1/generate_phase1_looter_turn1_suite.py',
              'scripts/sts1/run_phase1_looter_turn1_quality.py',
              'tests/data/sts1_phase1_looter_turn1_discovery_seeds_64.txt',
              'tests/data/sts1_phase1_looter_turn1_candidate_freeze_v1.json',
              '.github/workflows/sts1-phase1-looter-turn1-fresh-holdout.yml',
              'tests/data/sts1_phase1_looter_turn1_fresh_holdout_seeds_64.txt',
          }
          cumulative=set(subprocess.check_output(['git','diff','--name-only','8141ee42dee7506a05115adc8ee179ab4d68ebf9...HEAD'],text=True).splitlines())
          assert not (cumulative-allowed), sorted(cumulative-allowed)
          f=json.loads(Path('tests/data/sts1_phase1_looter_turn1_candidate_freeze_v1.json').read_text())
          assert f['candidate_id']=='looter-turn1-positive-gold-public-search-gold-tiebreak-v1'
          assert f['frozen_before_fresh_holdout_quality'] is True
          assert f['fresh_holdout_quality_observed_at_freeze'] is False
          assert f['fresh_holdout_seed_range_precommitted']=='640001..640064'
          assert f['fresh_holdout_seed_file_created_at_freeze'] is False
          assert f['discovery_evidence']['quality_verdict']=='PASS'
          assert f['discovery_evidence']['search'] > f['discovery_evidence']['simple']
          assert f['discovery_evidence']['search'] > f['discovery_evidence']['random']
          assert f['discovery_evidence']['search_unresolved']==0
          assert f['discovery_evidence']['illegal_actions']==0
          assert f['discovery_evidence']['leakage']==0
          assert f['old_590xxx_used_as_new_evidence'] is False
          assert f['old_600xxx_used_as_new_evidence'] is False
          assert f['old_610xxx_used_as_new_evidence'] is False
          assert f['old_620xxx_used_as_new_evidence'] is False
          assert f['old_evidence_used_for_tuning'] is False
          assert f['public_contract_fields_added']==0
          assert f['non_target_simulator_diff']==0
          assert f['phase1_gate_claimed'] is False
          def blob(path):
              return subprocess.check_output(['git','hash-object',path],text=True).strip()
          assert blob('scripts/sts1/run_phase1_looter_turn1_quality.py')==f['quality_runner_blob_sha']
          assert blob('scripts/sts1/generate_phase1_looter_turn1_suite.py')==f['suite_generator_blob_sha']
          assert blob('src/roguelike_ai/sts1_teacher/native_rollout.py')==f['native_rollout_blob_sha']
          print('TURN1_FROZEN_CANDIDATE_UNCHANGED = PASS')
          print('640XXX_FRESH_HOLDOUT_FIRST_OPEN = PASS')
          PY
          test "$(wc -l < tests/data/sts1_phase1_looter_turn1_fresh_holdout_seeds_64.txt)" -eq 64
          test "$(sort -n tests/data/sts1_phase1_looter_turn1_fresh_holdout_seeds_64.txt | uniq | wc -l)" -eq 64
          test "$(head -1 tests/data/sts1_phase1_looter_turn1_fresh_holdout_seeds_64.txt)" = '640001'
          test "$(tail -1 tests/data/sts1_phase1_looter_turn1_fresh_holdout_seeds_64.txt)" = '640064'
          test "$(sha256sum tests/data/sts1_phase1_looter_turn1_fresh_holdout_seeds_64.txt | awk '{print $1}')" = '37f4470b5e8a45eb1143366f8d0e8d94636a9ea47aaf24c61e7ea6e2cb1e18e6'
          for other in \
            tests/data/sts1_phase1_looter_discovery_seeds_64.txt \
            tests/data/sts1_phase1_looter_fresh_holdout_seeds_64.txt \
            tests/data/sts1_phase1_looter_v2_discovery_seeds_64.txt \
            tests/data/sts1_phase1_looter_v2_fresh_holdout_seeds_64.txt \
            tests/data/sts1_phase1_looter_turn1_discovery_seeds_64.txt; do
            test "$(comm -12 <(sort -n tests/data/sts1_phase1_looter_turn1_fresh_holdout_seeds_64.txt) <(sort -n "$other") | wc -l)" -eq 0
          done
          git diff --quiet 8141ee42dee7506a05115adc8ee179ab4d68ebf9 -- src/roguelike_ai/sts1_teacher/contract.py
          git diff --quiet 8141ee42dee7506a05115adc8ee179ab4d68ebf9 -- src/roguelike_ai/sts1_teacher/simulator.py
          git diff --quiet 8141ee42dee7506a05115adc8ee179ab4d68ebf9 -- src/roguelike_ai/sts1_teacher/native_rollout.py
          git diff --quiet 8141ee42dee7506a05115adc8ee179ab4d68ebf9 -- src/roguelike_ai/sts1_teacher/enemy_reconstruction.py
          git diff --quiet 8141ee42dee7506a05115adc8ee179ab4d68ebf9 -- src/roguelike_ai/sts1_teacher/player_reconstruction.py
          git diff --quiet 8141ee42dee7506a05115adc8ee179ab4d68ebf9 -- scripts/sts1/apply_phase1_public_history_guard_overlay.py
          echo 'CANDIDATE_ID = looter-turn1-positive-gold-public-search-gold-tiebreak-v1'
          echo 'FRESH_HOLDOUT_SEED_SHA256 = 37f4470b5e8a45eb1143366f8d0e8d94636a9ea47aaf24c61e7ea6e2cb1e18e6'
          echo 'PUBLIC_CONTRACT_FIELDS_ADDED = 0'
          echo 'NON_TARGET_SIMULATOR_DIFF = 0'

      - name: Syntax gate
        run: >-
          python -m py_compile
          scripts/sts1/generate_phase1_looter_turn1_suite.py
          scripts/sts1/run_phase1_looter_turn1_quality.py

      - name: Reprove frozen gold tie-break
        run: python scripts/sts1/verify_phase1_looter_gold_tiebreak_v2.py

      - name: Hydrate exact upstream sources
        run: python scripts/sts1/hydrate_jialeiv_baseline_v0.py

      - name: Apply diagnostic oracle binding
        run: python scripts/sts1/apply_phase1_oracle_judge_overlay.py

      - name: Apply public reconstruction overlays
        run: |
          python scripts/sts1/apply_phase1_public_state_overlay.py
          python scripts/sts1/apply_phase1_public_reconstruction_overlay.py
          python scripts/sts1/apply_phase1_public_history_guard_overlay.py

      - name: Build native Python binding
        run: python scripts/sts1/build_probe.py

      - name: Reverify Looter turn1 Native boundary
        run: python scripts/sts1/verify_phase1_public_looter_native.py

      - name: Generate frozen 640xxx fresh holdout twice
        run: |
          python scripts/sts1/generate_phase1_looter_turn1_suite.py --suite-kind holdout --output "$RUNNER_TEMP/looter-turn1-holdout-a.json"
          python scripts/sts1/generate_phase1_looter_turn1_suite.py --suite-kind holdout --output "$RUNNER_TEMP/looter-turn1-holdout-b.json"
          cmp "$RUNNER_TEMP/looter-turn1-holdout-a.json" "$RUNNER_TEMP/looter-turn1-holdout-b.json"
          cp "$RUNNER_TEMP/looter-turn1-holdout-a.json" "$RUNNER_TEMP/looter-turn1-holdout.json"
          echo 'LOOTER_TURN1_FRESH_HOLDOUT_SUITE_DETERMINISTIC = PASS'

      - name: Run exact frozen candidate on 640xxx fresh holdout
        run: >-
          python scripts/sts1/run_phase1_looter_turn1_quality.py
          --suite-kind holdout
          --suite "$RUNNER_TEMP/looter-turn1-holdout.json"
          --output-dir "$RUNNER_TEMP/looter-turn1-holdout-evidence"

      - name: Fresh holdout evidence integrity
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'looter-turn1-holdout-evidence'/'summary.json').read_text())
          assert s['candidate_id']=='looter-turn1-positive-gold-public-search-gold-tiebreak-v1'
          assert s['case_count']==24
          assert s['deterministic'] is True and s['full_repeats']==2
          assert s['search_unresolved']==0
          assert s['illegal_actions']==0
          assert s['leakage']==0
          assert s['gold_tiebreak']['can_overturn_nonzero_combat_mean_gap'] is False
          print('SEARCH',s['agreement_counts']['search'])
          print('SIMPLE',s['agreement_counts']['simple'])
          print('RANDOM',s['agreement_counts']['random'])
          print('QUALITY_VERDICT',s['quality_verdict'])
          print('QUALITY_REASONS',s['quality_reasons'])
          print('SUITE_DIGEST',s['suite_digest'])
          print('ROWS_DIGEST',s['rows_digest'])
          print('SOURCE_SEED_FILE_SHA256',s['source_seed_file_sha256'])
          print('FRESH_HOLDOUT_EXECUTION_INTEGRITY = PASS')
          print('PUBLIC_CONTRACT_FIELDS_ADDED = 0')
          print('NON_TARGET_SIMULATOR_DIFF = 0')
          print('PHASE1_GATE_CLAIMED = 0')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sts1-phase1-looter-turn1-fresh-holdout-evidence
          path: ${{ runner.temp }}/looter-turn1-holdout-evidence
          if-no-files-found: warn

      - name: Strict Fresh Holdout quality gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads((Path(os.environ['RUNNER_TEMP'])/'looter-turn1-holdout-evidence'/'summary.json').read_text())
          assert s['quality_verdict']=='PASS', s
          assert s['agreement_counts']['search'] > s['agreement_counts']['simple'], s
          assert s['agreement_counts']['search'] > s['agreement_counts']['random'], s
          print('PASS — LOOTER_TURN1_POSITIVE_GOLD_FRESH_HOLDOUT')
          PY
