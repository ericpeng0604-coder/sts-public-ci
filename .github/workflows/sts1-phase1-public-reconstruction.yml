name: STS1 Phase 1 Public Reconstruction Gate

on:
  push:
    branches:
      - gpt/sts1-phase1-public-reconstruction
    paths:
      - '.github/workflows/sts1-phase1-public-reconstruction.yml'
      - 'src/roguelike_ai/sts1_teacher/reconstruction.py'
      - 'tests/test_sts1_public_reconstruction.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruction-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install 'pytest>=8,<9'

      - name: Public reconstruction tests
        run: python -m pytest -q tests/test_sts1_public_reconstruction.py

      - name: Syntax gate
        run: python -m py_compile src/roguelike_ai/sts1_teacher/reconstruction.py

      - name: Diff whitespace gate
        run: git diff --check origin/main...HEAD
