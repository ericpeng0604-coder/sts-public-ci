name: STS1 Phase 1 Public Reconstruction Gate

on:
  push:
    branches:
      - gpt/sts1-phase1-public-reconstruction
    paths:
      - '.github/workflows/sts1-phase1-public-reconstruction.yml'
      - 'src/roguelike_ai/sts1_teacher/**'
      - 'tests/test_sts1_public_*.py'
      - 'tests/test_sts1_reconstruction_state.py'
      - 'tests/data/sts1_phase1_public_search_v1_source_seeds_64.txt'
      - 'tests/data/sts1_phase1_public_search_v1_cultist_source_seeds_64.txt'
      - 'scripts/sts1/apply_phase1_public_state_overlay.py'
      - 'scripts/sts1/apply_phase1_public_reconstruction_overlay.py'
      - 'scripts/sts1/apply_phase1_public_history_guard_overlay.py'
      - 'scripts/sts1/verify_phase1_public_reconstruction_native.py'
      - 'scripts/sts1/verify_phase1_public_search_native.py'
      - 'scripts/sts1/generate_phase1_public_search_v1_suite.py'
      - 'scripts/sts1/run_phase1_public_search_v1_quality.py'
      - 'scripts/sts1/generate_phase1_public_search_v1_cultist_suite.py'
      - 'scripts/sts1/run_phase1_public_search_v1_cultist_quality.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruction-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install 'pytest>=8,<9'

      - name: Public reconstruction tests
        run: >-
          python -m pytest -q
          tests/test_sts1_public_reconstruction.py
          tests/test_sts1_public_run_state.py
          tests/test_sts1_public_redeterminization.py
          tests/test_sts1_public_card_reconstruction.py
          tests/test_sts1_public_enemy_reconstruction.py
          tests/test_sts1_public_native_v1_admission.py
          tests/test_sts1_reconstruction_state.py
          tests/test_sts1_public_reconstruction_smoke.py

      - name: Syntax gate
        run: >-
          python -m py_compile
          src/roguelike_ai/sts1_teacher/reconstruction.py
          src/roguelike_ai/sts1_teacher/public_run_state.py
          src/roguelike_ai/sts1_teacher/redeterminization.py
          src/roguelike_ai/sts1_teacher/card_reconstruction.py
          src/roguelike_ai/sts1_teacher/enemy_reconstruction.py
          src/roguelike_ai/sts1_teacher/player_reconstruction.py
          src/roguelike_ai/sts1_teacher/run_reconstruction.py
          src/roguelike_ai/sts1_teacher/reconstruction_state.py
          src/roguelike_ai/sts1_teacher/native_rollout.py
          scripts/sts1/apply_phase1_public_state_overlay.py
          scripts/sts1/apply_phase1_public_reconstruction_overlay.py
          scripts/sts1/apply_phase1_public_history_guard_overlay.py
          scripts/sts1/verify_phase1_public_reconstruction_native.py
          scripts/sts1/verify_phase1_public_search_native.py
          scripts/sts1/generate_phase1_public_search_v1_suite.py
          scripts/sts1/run_phase1_public_search_v1_quality.py
          scripts/sts1/generate_phase1_public_search_v1_cultist_suite.py
          scripts/sts1/run_phase1_public_search_v1_cultist_quality.py

      - name: Source seed freeze contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          for name, label in [
              ('tests/data/sts1_phase1_public_search_v1_source_seeds_64.txt', 'JAW_WORM'),
              ('tests/data/sts1_phase1_public_search_v1_cultist_source_seeds_64.txt', 'CULTIST'),
          ]:
              p = Path(name)
              seeds = [int(x.strip()) for x in p.read_text().splitlines() if x.strip() and not x.lstrip().startswith('#')]
              assert len(seeds) == 64 and len(set(seeds)) == 64
              print(f'PUBLIC_SEARCH_V1_{label}_SOURCE_SEEDS = PASS')
              print(f'{label}_SOURCE_SEED_FILE_SHA256=' + hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: Diff whitespace gate
        run: git diff --check origin/main...HEAD

  public-native-reconstruction:
    needs: reconstruction-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hydrate exact upstream sources
        run: python scripts/sts1/hydrate_jialeiv_baseline_v0.py

      - name: Snapshot pre-overlay non-target diff
        run: >-
          git -C external/sts_lightspeed/source diff -- .
          ':(exclude)bindings/slaythespire.cpp'
          > "$RUNNER_TEMP/nonbinding-before.diff"

      - name: Apply read-only public-state overlay
        run: python scripts/sts1/apply_phase1_public_state_overlay.py

      - name: Apply public BattleContext reconstruction overlay
        run: python scripts/sts1/apply_phase1_public_reconstruction_overlay.py

      - name: Apply turn-aware monster history guard
        run: python scripts/sts1/apply_phase1_public_history_guard_overlay.py

      - name: Build native Python binding
        run: python scripts/sts1/build_probe.py

      - name: Verify visible potion belt
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'external/sts_lightspeed/source/build-probe')
          import slaythespire as sts
          gc = sts.GameContext(sts.CharacterClass.IRONCLAD, 1, 0)
          belt = list(gc.potions)
          assert len(belt) == 3
          assert all(item['id'] == 'EMPTY_POTION_SLOT' and item['empty'] is True for item in belt)
          print('PUBLIC_POTION_BELT = PASS')
          PY

      - name: Native reconstruction roundtrip and executable action proof
        run: python scripts/sts1/verify_phase1_public_reconstruction_native.py

      - name: Native PublicStateSearch paired-rollout proof
        run: python scripts/sts1/verify_phase1_public_search_native.py

      - name: Prove overlays changed no non-target simulator file
        run: |
          git -C external/sts_lightspeed/source diff -- . ':(exclude)bindings/slaythespire.cpp' > "$RUNNER_TEMP/nonbinding-after.diff"
          cmp "$RUNNER_TEMP/nonbinding-before.diff" "$RUNNER_TEMP/nonbinding-after.diff"
          git -C external/sts_lightspeed/source diff --check
          git -C external/sts_lightspeed/source diff -- bindings/slaythespire.cpp | grep -F 'phase1_public_potion_belt_v1'
          git -C external/sts_lightspeed/source diff -- bindings/slaythespire.cpp | grep -F 'phase1_public_reconstruction_v1'
          git -C external/sts_lightspeed/source diff -- bindings/slaythespire.cpp | grep -F 'phase1_public_history_turn_guard_v1'

  public-search-v1-quality:
    needs: public-native-reconstruction
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hydrate exact upstream sources
        run: python scripts/sts1/hydrate_jialeiv_baseline_v0.py

      - name: Apply diagnostic oracle binding
        run: python scripts/sts1/apply_phase1_oracle_judge_overlay.py

      - name: Apply read-only public-state overlay
        run: python scripts/sts1/apply_phase1_public_state_overlay.py

      - name: Apply public BattleContext reconstruction overlay
        run: python scripts/sts1/apply_phase1_public_reconstruction_overlay.py

      - name: Apply zero-based monster history guard
        run: python scripts/sts1/apply_phase1_public_history_guard_overlay.py

      - name: Build native Python binding
        run: python scripts/sts1/build_probe.py

      - name: Generate frozen suite twice
        run: |
          python scripts/sts1/generate_phase1_public_search_v1_suite.py --output evidence/freeze-a.json
          python scripts/sts1/generate_phase1_public_search_v1_suite.py --output evidence/freeze-b.json
          cmp evidence/freeze-a.json evidence/freeze-b.json
          cp evidence/freeze-a.json evidence/suite.json

      - name: Run two-repeat quality benchmark
        run: >-
          python scripts/sts1/run_phase1_public_search_v1_quality.py
          --suite evidence/suite.json
          --output-dir evidence/sts1/phase1_public_search_v1_quality

      - name: Show quality summary
        if: always()
        run: |
          test -f evidence/sts1/phase1_public_search_v1_quality/summary.json && cat evidence/sts1/phase1_public_search_v1_quality/summary.json || true

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sts1-phase1-public-search-v1-quality-evidence
          path: evidence/sts1/phase1_public_search_v1_quality/
          if-no-files-found: warn
          retention-days: 90

  public-search-v1-cultist-quality:
    needs: public-native-reconstruction
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hydrate exact upstream sources
        run: python scripts/sts1/hydrate_jialeiv_baseline_v0.py

      - name: Apply diagnostic oracle binding
        run: python scripts/sts1/apply_phase1_oracle_judge_overlay.py

      - name: Apply read-only public-state overlay
        run: python scripts/sts1/apply_phase1_public_state_overlay.py

      - name: Apply public BattleContext reconstruction overlay
        run: python scripts/sts1/apply_phase1_public_reconstruction_overlay.py

      - name: Apply zero-based monster history guard
        run: python scripts/sts1/apply_phase1_public_history_guard_overlay.py

      - name: Build native Python binding
        run: python scripts/sts1/build_probe.py

      - name: Generate frozen Cultist suite twice
        run: |
          python scripts/sts1/generate_phase1_public_search_v1_cultist_suite.py --output evidence/cultist-freeze-a.json
          python scripts/sts1/generate_phase1_public_search_v1_cultist_suite.py --output evidence/cultist-freeze-b.json
          cmp evidence/cultist-freeze-a.json evidence/cultist-freeze-b.json
          cp evidence/cultist-freeze-a.json evidence/cultist-suite.json

      - name: Run two-repeat Cultist quality benchmark
        run: >-
          python scripts/sts1/run_phase1_public_search_v1_cultist_quality.py
          --suite evidence/cultist-suite.json
          --output-dir evidence/sts1/phase1_public_search_v1_cultist_quality

      - name: Show Cultist quality summary
        if: always()
        run: |
          test -f evidence/sts1/phase1_public_search_v1_cultist_quality/summary.json && cat evidence/sts1/phase1_public_search_v1_cultist_quality/summary.json || true

      - name: Upload Cultist quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sts1-phase1-public-search-v1-cultist-quality-evidence
          path: evidence/sts1/phase1_public_search_v1_cultist_quality/
          if-no-files-found: warn
          retention-days: 90
