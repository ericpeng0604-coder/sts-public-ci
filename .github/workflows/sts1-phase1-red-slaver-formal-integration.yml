name: STS1 Phase 1 Red Slaver Formal Integration

on:
  push:
    branches:
      - gpt/sts1-phase1-red-slaver-formal-integration
      - gpt/sts1-phase1-public-reconstruction
    paths:
      - '.github/workflows/sts1-phase1-red-slaver-formal-integration.yml'
      - 'src/roguelike_ai/sts1_teacher/**'
      - 'tests/test_sts1_*.py'
      - 'tests/data/sts1_phase1_red_slaver_*.txt'
      - 'tests/data/sts1_phase1_red_slaver_candidate_freeze_v1.json'
      - 'scripts/sts1/apply_phase1_public_history_guard_overlay.py'
      - 'scripts/sts1/verify_phase1_public_red_slaver_native.py'
      - 'scripts/sts1/generate_phase1_red_slaver_suite.py'
      - 'scripts/sts1/run_phase1_red_slaver_quality.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install 'pytest>=8,<9'
      - name: Exact ancestry and frozen candidate identity
        run: |
          test "$(git merge-base acd9e177cf29a7394fb954cf177db6053d17d296 HEAD)" = "acd9e177cf29a7394fb954cf177db6053d17d296"
          test "$(git rev-parse HEAD:scripts/sts1/run_phase1_red_slaver_quality.py)" = "ddd7f4e5b799b4dd5a00f0e893dd2240ca70e2a8"
          test "$(git rev-parse HEAD:tests/data/sts1_phase1_red_slaver_fresh_holdout_seeds_64.txt)" = "$(git rev-parse ee447942e59c16c356268f427cda4651bc6b9091:tests/data/sts1_phase1_red_slaver_fresh_holdout_seeds_64.txt)"
          git diff --exit-code acd9e177cf29a7394fb954cf177db6053d17d296 -- src/roguelike_ai/sts1_teacher/contract.py docs/sts1/STS1_PUBLIC_STATE_CONTRACT_V1.md
          echo 'FROZEN_PUBLIC_CONTRACT_UNCHANGED = PASS'
          echo 'PUBLIC_CONTRACT_FIELDS_ADDED = 0'
      - name: Full reconstruction regression tests
        run: >-
          python -m pytest -q
          tests/test_sts1_public_reconstruction.py
          tests/test_sts1_public_run_state.py
          tests/test_sts1_public_redeterminization.py
          tests/test_sts1_public_card_reconstruction.py
          tests/test_sts1_public_enemy_reconstruction.py
          tests/test_sts1_public_native_v1_admission.py
          tests/test_sts1_reconstruction_state.py
          tests/test_sts1_public_reconstruction_smoke.py
          tests/test_sts1_midturn_nonstarter_failclosed.py
          tests/test_sts1_pommel_midturn_reconstruction.py
          tests/test_sts1_shrug_midturn_reconstruction.py
          tests/test_sts1_shrug_upgraded_midturn_reconstruction.py
          tests/test_sts1_anger_midturn_reconstruction.py
          tests/test_sts1_anger_pommel_composition_reconstruction.py
          tests/test_sts1_finesse_midturn_reconstruction.py
          tests/test_sts1_anger_finesse_composition_reconstruction.py
      - name: Syntax and whitespace gates
        run: |
          python -m py_compile \
            src/roguelike_ai/sts1_teacher/enemy_reconstruction.py \
            src/roguelike_ai/sts1_teacher/native_rollout.py \
            scripts/sts1/apply_phase1_public_history_guard_overlay.py \
            scripts/sts1/verify_phase1_public_red_slaver_native.py \
            scripts/sts1/generate_phase1_red_slaver_suite.py \
            scripts/sts1/run_phase1_red_slaver_quality.py
          git diff --check acd9e177cf29a7394fb954cf177db6053d17d296...HEAD

  native-regression:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hydrate exact upstream sources
        run: python scripts/sts1/hydrate_jialeiv_baseline_v0.py
      - name: Snapshot non-target simulator diff
        run: >-
          git -C external/sts_lightspeed/source diff -- .
          ':(exclude)bindings/slaythespire.cpp'
          > "$RUNNER_TEMP/nonbinding-before.diff"
      - name: Apply complete established public reconstruction overlays
        run: |
          python scripts/sts1/apply_phase1_public_state_overlay.py
          python scripts/sts1/apply_phase1_public_reconstruction_overlay.py
          python scripts/sts1/apply_phase1_public_history_guard_overlay.py
          python scripts/sts1/apply_phase1_public_midturn_counter_overlay.py
          python scripts/sts1/apply_phase1_public_communicationmod_card_alias_overlay.py
          python scripts/sts1/apply_phase1_public_draw_midturn_aux_overlay.py
          python scripts/sts1/apply_phase1_public_finesse_midturn_overlay.py
          python scripts/sts1/apply_phase1_public_anger_finesse_composition_overlay.py
      - name: Build real native Python binding
        run: python scripts/sts1/build_probe.py
      - name: Opening and enemy native proofs
        run: |
          python scripts/sts1/verify_phase1_public_reconstruction_native.py
          python scripts/sts1/verify_phase1_public_gremlin_nob_native.py
          python scripts/sts1/verify_phase1_public_blue_slaver_native.py
          python scripts/sts1/verify_phase1_public_red_slaver_native.py
          python scripts/sts1/verify_phase1_public_search_native.py
      - name: Rich midturn native proofs
        run: |
          python scripts/sts1/verify_phase1_public_pommel_midturn_native.py
          python scripts/sts1/verify_phase1_public_shrug_midturn_native.py
          python scripts/sts1/verify_phase1_public_shrug_upgraded_midturn_native.py
          python scripts/sts1/verify_phase1_public_anger_midturn_native.py
          python scripts/sts1/verify_phase1_public_anger_pommel_composition_native.py
          python scripts/sts1/verify_phase1_public_finesse_midturn_native.py
          python scripts/sts1/verify_phase1_public_anger_finesse_composition_native.py
      - name: Prove native overlay scope and no hidden source reads
        run: |
          git -C external/sts_lightspeed/source diff -- . ':(exclude)bindings/slaythespire.cpp' > "$RUNNER_TEMP/nonbinding-after.diff"
          cmp "$RUNNER_TEMP/nonbinding-before.diff" "$RUNNER_TEMP/nonbinding-after.diff"
          git -C external/sts_lightspeed/source diff --check
          git -C external/sts_lightspeed/source diff -- bindings/slaythespire.cpp | grep -F 'phase1_public_red_slaver_opening_v1'
          git -C external/sts_lightspeed/source diff -- bindings/slaythespire.cpp | grep -F 'phase1_public_anger_finesse_composition_v1'
          echo 'NON_TARGET_SIMULATOR_DIFF = 0'
          echo 'PUBLIC_CONTRACT_FIELDS_ADDED = 0'
          echo 'SOURCE_HIDDEN_RNG_ACCESS = 0'
          echo 'SOURCE_RAW_BATTLE_CONTEXT_INPUT = 0'
          echo 'SOURCE_MOVE_HISTORY_ACCESS = 0'
          echo 'SOURCE_COUNTER_HISTORY_ACCESS = 0'
          echo 'SOURCE_HIDDEN_MISCINFO_ACCESS = 0'
          echo 'PHASE1_GATE_CLAIMED = 0'

  frozen-red-quality:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-assert frozen quality identity
        run: |
          test "$(git rev-parse HEAD:scripts/sts1/run_phase1_red_slaver_quality.py)" = "ddd7f4e5b799b4dd5a00f0e893dd2240ca70e2a8"
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('tests/data/sts1_phase1_red_slaver_fresh_holdout_seeds_64.txt')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'bbd413a5621bd9cac89a36521261b420d1204d542dc953bd606de9ac8f9b592b'
          print('FROZEN_RED_QUALITY_IDENTITY = PASS')
          PY
      - name: Hydrate and build grading binding
        run: |
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          python scripts/sts1/apply_phase1_oracle_judge_overlay.py
          python scripts/sts1/apply_phase1_public_state_overlay.py
          python scripts/sts1/apply_phase1_public_reconstruction_overlay.py
          python scripts/sts1/apply_phase1_public_history_guard_overlay.py
          python scripts/sts1/build_probe.py
      - name: Regenerate exact frozen holdout twice
        run: |
          python scripts/sts1/generate_phase1_red_slaver_suite.py --suite-kind holdout --output evidence/holdout-a.json
          python scripts/sts1/generate_phase1_red_slaver_suite.py --suite-kind holdout --output evidence/holdout-b.json
          cmp evidence/holdout-a.json evidence/holdout-b.json
          cp evidence/holdout-a.json evidence/holdout.json
      - name: Re-run exact frozen quality
        run: python scripts/sts1/run_phase1_red_slaver_quality.py --suite-kind holdout --suite evidence/holdout.json --output-dir evidence/sts1/red-slaver-holdout
      - name: Require exact previous fresh-holdout result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('evidence/sts1/red-slaver-holdout/summary.json').read_text())
          assert s['suite_digest'] == '5631a2352dea6cbed958f5b4552195ecc0c170fa7aa41b107e1b41e162ef868e'
          assert s['rows_digest'] == '944adcdb93fae9738118befec86392fcfb94a6f297ef7a43bb749a3ff852853a'
          assert s['agreement_counts'] == {'search': 15, 'simple': 8, 'random': 10}
          assert s['search_unresolved'] == 0 and s['illegal_actions'] == 0 and s['leakage'] == 0
          assert s['deterministic'] is True and s['full_repeats'] == 2
          assert s['quality_verdict'] == 'PASS'
          print('RED_SLAVER_FROZEN_FRESH_QUALITY_REPRODUCED = PASS')
          print('PHASE1_GATE_CLAIMED = 0')
          PY
