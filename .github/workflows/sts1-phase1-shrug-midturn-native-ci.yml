name: STS1 Phase 1 Shrug Midturn Native CI

on:
  push:
    branches:
      - gpt/sts1-phase1-shrug-midturn-native-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install 'pytest>=8,<9'

      - name: Syntax gate
        run: >-
          python -m py_compile
          src/roguelike_ai/sts1_teacher/card_reconstruction.py
          src/roguelike_ai/sts1_teacher/player_reconstruction.py
          src/roguelike_ai/sts1_teacher/reconstruction_state.py
          src/roguelike_ai/sts1_teacher/native_rollout.py
          scripts/sts1/apply_phase1_public_draw_midturn_aux_overlay.py
          scripts/sts1/verify_phase1_public_pommel_midturn_native.py
          scripts/sts1/verify_phase1_public_shrug_midturn_native.py
          tests/test_sts1_pommel_midturn_reconstruction.py
          tests/test_sts1_shrug_midturn_reconstruction.py

      - name: Focused draw-midturn tests
        run: >-
          python -m pytest -q
          tests/test_sts1_pommel_midturn_reconstruction.py
          tests/test_sts1_shrug_midturn_reconstruction.py
          tests/test_sts1_public_card_reconstruction.py
          tests/test_sts1_public_native_v1_admission.py
          tests/test_sts1_reconstruction_state.py

      - name: Frozen public contract remains unchanged
        shell: bash
        run: |
          git diff --name-only 861aad6f1ca53a36480a9bb4ace5d6c11f17f9ad...HEAD > "$RUNNER_TEMP/changed.txt"
          ! grep -Fx 'src/roguelike_ai/sts1_teacher/contract.py' "$RUNNER_TEMP/changed.txt"
          ! grep -Fx 'docs/sts1/STS1_PUBLIC_STATE_CONTRACT_V1.md' "$RUNNER_TEMP/changed.txt"
          echo 'FROZEN_PUBLIC_CONTRACT_UNCHANGED = PASS'

      - name: Diff whitespace gate
        run: git diff --check 861aad6f1ca53a36480a9bb4ace5d6c11f17f9ad...HEAD

  native-draw-proof:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hydrate exact upstream sources
        run: python scripts/sts1/hydrate_jialeiv_baseline_v0.py

      - name: Snapshot pre-overlay non-target diff
        run: >-
          git -C external/sts_lightspeed/source diff -- .
          ':(exclude)bindings/slaythespire.cpp'
          > "$RUNNER_TEMP/nonbinding-before.diff"

      - name: Apply read-only public-state overlay
        run: python scripts/sts1/apply_phase1_public_state_overlay.py

      - name: Apply public BattleContext reconstruction overlay
        run: python scripts/sts1/apply_phase1_public_reconstruction_overlay.py

      - name: Apply audited turn-aware history overlay
        run: python scripts/sts1/apply_phase1_public_history_guard_overlay.py

      - name: Apply established starter midturn counters
        run: python scripts/sts1/apply_phase1_public_midturn_counter_overlay.py

      - name: Apply CommunicationMod starter id aliases
        run: python scripts/sts1/apply_phase1_public_communicationmod_card_alias_overlay.py

      - name: Apply audited draw-midturn auxiliary path
        run: python scripts/sts1/apply_phase1_public_draw_midturn_aux_overlay.py

      - name: Build native Python binding
        run: python scripts/sts1/build_probe.py

      - name: Re-run established opening native proof
        run: python scripts/sts1/verify_phase1_public_reconstruction_native.py

      - name: Re-run Pommel draw-midturn native proof
        run: python scripts/sts1/verify_phase1_public_pommel_midturn_native.py

      - name: Run Shrug draw-midturn native proof
        run: python scripts/sts1/verify_phase1_public_shrug_midturn_native.py

      - name: Prove overlays changed no non-target simulator file
        shell: bash
        run: |
          git -C external/sts_lightspeed/source diff -- . ':(exclude)bindings/slaythespire.cpp' > "$RUNNER_TEMP/nonbinding-after.diff"
          cmp "$RUNNER_TEMP/nonbinding-before.diff" "$RUNNER_TEMP/nonbinding-after.diff"
          git -C external/sts_lightspeed/source diff --check
          git -C external/sts_lightspeed/source diff -- bindings/slaythespire.cpp | grep -F 'phase1_public_pommel_midturn_aux_v1'
          git -C external/sts_lightspeed/source diff -- bindings/slaythespire.cpp | grep -F 'phase1_public_shrug_midturn_aux_v1'
          git -C external/sts_lightspeed/source diff -- bindings/slaythespire.cpp | grep -F 'phase1_public_draw_midturn_aux_v2'
          echo 'NON_TARGET_SIMULATOR_DIFF = 0'
