name: STS1 PPO v2.0 Boss Build Contracts

on:
  push:
    branches:
      - gpt/sts1-ppo-v20-boss-build-rescue-20260930
  workflow_dispatch:

permissions:
  contents: read

env:
  SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - name: Install test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' numpy torch==2.11.0
      - name: Compile Boss diagnostic path
        run: |
          python -m py_compile             src/roguelike_ai/sts1_phase3/simulator.py             scripts/sts1/sts1_ppo_v20_boss_search_diagnostic.py
      - name: Unit contracts
        run: |
          pytest -q             tests/test_sts1_ppo_v20_boss_build.py             tests/test_sts1_ppo_v18_win_conversion.py
      - name: Verify isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("scripts/sts1/sts1_ppo_v20_boss_search_diagnostic.py").read_text()
          sim=Path("src/roguelike_ai/sts1_phase3/simulator.py").read_text()
          assert '"base_2k": None' in p
          assert '"boss_10k": 10_000' in p
          assert '"boss_50k": 50_000' in p
          assert "build_limited_after_boss_50k" in p
          assert "combat_mcts_boss_sims" in sim
          assert "combat_mcts_boss_floors" in sim
          print("PASS_PPO_V20_BOSS_BUILD_CONTRACTS")
          PY

  simulator-smoke:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - name: Install and hydrate
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . numpy
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-armg-v20-smoke
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
      - name: Boss-10k simulator smoke
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"scripts/sts1")
          import sts1_armg_ppo_v13_auto_gate as rt
          from roguelike_ai.sts1_phase3.simulator import ArmGNoncombatPolicy, _load_sts, run_simulator_game
          seeds=rt._read_seeds(Path("control/sts1-v15-dev-seeds-50.txt"))
          sts=_load_sts(Path("external/sts_lightspeed/source/build-probe"))
          policy=ArmGNoncombatPolicy(
              root=Path(".cache/sts1-armg-v20-smoke"),
              weight_path=Path("external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt"),
          )
          result=run_simulator_game(
              student=None,
              sts=sts,
              seed=seeds[0],
              evidence_path=Path("evidence/sts1/v20-smoke.ndjson"),
              armg_policy=policy,
              combat_mcts_sims=2000,
              combat_mcts_boss_sims=10000,
              combat_mcts_boss_floors=(16,33,50),
              heldout_seeds=seeds,
          )
          assert result["result"]=="PASS_SIMULATOR_COMPLETE_RUN", result
          assert all(int(result.get(k,0) or 0)==0 for k in (
              "illegal_action_count","crash_count","timeout_count","remote_error_count"
          )), result
          print("PASS_PPO_V20_BOSS_10K_SMOKE", result["outcome"], result["final_floor"])
          PY
