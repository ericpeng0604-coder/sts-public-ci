name: STS1 PPO v2.0 Build Trace Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - gpt/sts1-ppo-v20-boss-build-rescue-20260930
    paths:
      - control/sts1-v20-build-trace-recovery.trigger

permissions:
  contents: read
  actions: read
  issues: write

env:
  SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'
  G7_STATE_ARTIFACT_ID: '11079234863'
  G7_WEIGHT_SHA256: '8313c99d9b0ab0c0d206fdd2f744fed11f4104d440dcb465cf7c78a517f9ccd0'

concurrency:
  group: sts1-ppo-v20-build-trace-recovery
  cancel-in-progress: true

jobs:
  build-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and hydrate
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . numpy
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-v20-build-recovery
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"

      - name: Download frozen G7 parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o "$RUNNER_TEMP/g7.zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$G7_STATE_ARTIFACT_ID/zip"
          mkdir -p "$RUNNER_TEMP/g7"
          unzip -q "$RUNNER_TEMP/g7.zip" -d "$RUNNER_TEMP/g7"
          weight="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          test -n "$weight"
          actual="$(sha256sum "$weight" | awk '{print $1}')"
          test "$actual" = "$G7_WEIGHT_SHA256"
          cp "$weight" "$RUNNER_TEMP/g7-parent.pt"
          echo "PPO_V20_BUILD_RECOVERY_G7_PASS $actual"

      - name: Trace earlier Build decisions
        run: |
          set -euo pipefail
          python scripts/sts1/sts1_ppo_v20_build_trajectory_diagnostic.py \
            --module-dir external/sts_lightspeed/source/build-probe \
            --armg-root .cache/sts1-v20-build-recovery \
            --weight "$RUNNER_TEMP/g7-parent.pt" \
            --seeds-file control/sts1-v15-dev-seeds-50.txt \
            --boss-summary control/sts1-v20-boss-diagnostic-summary-36677610709.json \
            --output evidence/sts1/v20-build-recovery/summary.json \
            --teacher-output evidence/sts1/v20-build-recovery/candidate-teacher.jsonl \
            --max-seeds 10 \
            --max-states 20 \
            --max-alternatives 2
          cat evidence/sts1/v20-build-recovery/summary.json

      - uses: actions/upload-artifact@v4
        with:
          name: sts1-v20-build-trace-recovery-${{ github.run_id }}
          path: evidence/sts1/v20-build-recovery/
          if-no-files-found: error
          retention-days: 90

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/body.txt"
          import json
          s=json.load(open("evidence/sts1/v20-build-recovery/summary.json",encoding="utf-8"))
          print("@ericpeng0604-coder")
          print()
          print("## PPO v2.0 Build Trace Recovery")
          print()
          print(f"- Boss-50k 仍未救回：**{s['input_build_limited']}**")
          print(f"- 深入診斷 Seeds：**{s['diagnosed_seeds']}**")
          print(f"- 找到更早單一步 Build Rescue：**{s['early_build_rescues']}**")
          print(f"- 找不到單一步 Rescue：**{s['no_single_rescue']}**")
          print(f"- 無法重現原近 Boss 敗局：**{s['not_reproduced']}**")
          print("- 這是診斷資料，不直接替換正式 Champion。")
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/15/comments" \
            -f body="$(cat "$RUNNER_TEMP/body.txt")"
