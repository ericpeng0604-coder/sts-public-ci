name: STS1 Public MCTS Teacher Challenge

on:
  workflow_dispatch:
  push:
    branches:
      - gpt/sts1-self-improve-loop-20260925
    paths:
      - 'control/sts1-mcts-teacher-challenge.request'

permissions:
  contents: read
  actions: read

jobs:
  rebuild-v0-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      student_v0_gzip_b64: ${{ steps.pack.outputs.student_v0_gzip_b64 }}
      student_v0_payload_sha256: ${{ steps.pack.outputs.student_v0_payload_sha256 }}
    env:
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Normalize frozen source bytes
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD
          $sha = (Get-FileHash src/roguelike_ai/sts1_training/student_v0.py -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne "06e206b7f04e6e7b77ad1fc8c35ba1bcdca1c978596fbb176933323e3940aed3") {
            throw "Student v0 source SHA drift after LF normalization: $sha"
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install exact rebuild dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Rebuild exact frozen Student v0
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "sts1-v0"
          New-Item -ItemType Directory -Force $root | Out-Null
          python scripts/sts1/sts1_phase3_rebuild_student_v0.py --phase2-root . --output (Join-Path $root "student-v0.json")

      - name: Verify and pack v0
        id: pack
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "sts1-v0\student-v0.json"
          $env:MODEL_PATH = $path
          @'
          import json, os
          from pathlib import Path
          path = Path(os.environ["MODEL_PATH"])
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["student_model_sha256"] == "e15604b95247615a6d424f834e8b8a1e9fd680af4fe9e22a6754372027e89513"
          assert payload["feature_count"] == 3028
          assert len(payload["weights"]) == 3028
          print("PASS_EXACT_V0", payload["student_model_sha256"])
          '@ | python -

          $bytes = [System.IO.File]::ReadAllBytes($path)
          $sha = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
          $ms = New-Object System.IO.MemoryStream
          $gz = New-Object System.IO.Compression.GZipStream($ms, [System.IO.Compression.CompressionMode]::Compress)
          $gz.Write($bytes, 0, $bytes.Length)
          $gz.Close()
          $b64 = [Convert]::ToBase64String($ms.ToArray())
          "student_v0_payload_sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "student_v0_gzip_b64=$b64" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Delete Windows scratch
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "sts1-v0"
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }

  mcts-challenge:
    needs: rebuild-v0-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'
      STUDENT_V0_GZIP_B64: ${{ needs.rebuild-v0-windows.outputs.student_v0_gzip_b64 }}
      EXPECTED_V0_PAYLOAD_SHA256: ${{ needs.rebuild-v0-windows.outputs.student_v0_payload_sha256 }}
      MCTS_SIMS: '2000'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install numpy torch==2.11.0

      - name: Decode exact v0
        run: |
          mkdir -p "$RUNNER_TEMP/sts1-mcts-challenge"
          python - <<'PY'
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          raw = gzip.decompress(base64.b64decode(os.environ["STUDENT_V0_GZIP_B64"]))
          actual = hashlib.sha256(raw).hexdigest()
          assert actual == os.environ["EXPECTED_V0_PAYLOAD_SHA256"]
          payload = json.loads(raw.decode("utf-8"))
          assert payload["student_model_sha256"] == "e15604b95247615a6d424f834e8b8a1e9fd680af4fe9e22a6754372027e89513"
          path = Path(os.environ["RUNNER_TEMP"]) / "sts1-mcts-challenge" / "student-v0.json"
          path.write_bytes(raw)
          print("PASS_V0_DECODE", actual)
          PY

      - name: Hydrate and build pinned simulator plus ArmG
        run: |
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=".cache/sts1-armg"
          rm -rf "$root"
          mkdir -p "$root/sim/sts_lightspeed"
          ln -s "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -s "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -s "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
          ln -s "$PWD/external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt" "$root/armG_model_G128x128_15k.pt"

      - name: Run paired fixed-50 Champion vs ArmG plus MCTS 2000
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from roguelike_ai.sts1_phase3.frozen_student import FrozenStudentV0
          from roguelike_ai.sts1_phase3.simulator import ArmGNoncombatPolicy, _load_sts, run_simulator_game

          root = Path(os.environ["RUNNER_TEMP"]) / "sts1-mcts-challenge"
          champion = FrozenStudentV0.from_path(root / "student-v0.json")
          eval_path = Path("external/sts-rl-agent/source/eval/eval_seeds_50.txt")
          seeds = tuple(
              int(line.strip())
              for line in eval_path.read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          )
          assert len(seeds) == 50 and len(set(seeds)) == 50

          sts = _load_sts(Path("external/sts_lightspeed/source/build-probe"))
          armg = ArmGNoncombatPolicy(
              root=Path(".cache/sts1-armg"),
              weight_path=Path(".cache/sts1-armg/armG_model_G128x128_15k.pt"),
          )

          out = Path("evidence/sts1/mcts-challenge")
          out.mkdir(parents=True, exist_ok=True)

          results = {}
          for label in ("champion", "mcts2000"):
              runs = []
              for index, seed in enumerate(seeds, start=1):
                  kwargs = {}
                  if label == "mcts2000":
                      kwargs["combat_mcts_sims"] = int(os.environ["MCTS_SIMS"])
                  summary = run_simulator_game(
                      student=champion,
                      sts=sts,
                      seed=seed,
                      armg_policy=armg,
                      heldout_seeds=seeds,
                      collect_ppo=False,
                      **kwargs,
                  )
                  runs.append(summary)
                  victories = sum(r.get("outcome") == "victory" for r in runs)
                  mean_floor = sum(float(r.get("final_floor", 0)) for r in runs) / len(runs)
                  print(
                      f"PROGRESS {label} {index}/50 "
                      f"victories={victories} mean_final_floor={mean_floor:.3f}"
                  )

              aggregate = {
                  "schema_version": "sts1-mcts-teacher-challenge-eval-v1",
                  "policy": label,
                  "mcts_sims": int(os.environ["MCTS_SIMS"]) if label == "mcts2000" else 0,
                  "seeds": len(runs),
                  "runs": runs,
              }
              results[label] = aggregate
              (out / f"{label}-50.json").write_text(
                  json.dumps(aggregate, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
              fast = dict(aggregate)
              fast["seeds"] = 30
              fast["runs"] = runs[:30]
              (out / f"{label}-30.json").write_text(
                  json.dumps(fast, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          summary = {}
          for label, aggregate in results.items():
              runs = aggregate["runs"]
              summary[label] = {
                  "victories_30": sum(r.get("outcome") == "victory" for r in runs[:30]),
                  "victories_50": sum(r.get("outcome") == "victory" for r in runs),
                  "mean_final_floor_30": sum(float(r.get("final_floor", 0)) for r in runs[:30]) / 30,
                  "mean_final_floor_50": sum(float(r.get("final_floor", 0)) for r in runs) / 50,
                  "illegal_action_count": sum(int(r.get("illegal_action_count", 0)) for r in runs),
                  "crash_count": sum(int(r.get("crash_count", 0)) for r in runs),
                  "timeout_count": sum(int(r.get("timeout_count", 0)) for r in runs),
              }
          (out / "summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("CHALLENGE_SUMMARY", json.dumps(summary, sort_keys=True))
          PY

      - name: Apply Champion Gates to MCTS reference policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from roguelike_ai.sts1_phase3.champion_gate import (
              FAST_GATE_POLICY,
              FORMAL_GATE_POLICY,
              evaluate_fixed_seed_gate,
          )

          root = Path("evidence/sts1/mcts-challenge")
          def load(name):
              return json.loads((root / name).read_text(encoding="utf-8"))

          gate30 = evaluate_fixed_seed_gate(
              load("champion-30.json"),
              load("mcts2000-30.json"),
              policy=FAST_GATE_POLICY,
          )
          if gate30["status"] == "PASS":
              gate50 = evaluate_fixed_seed_gate(
                  load("champion-50.json"),
                  load("mcts2000-50.json"),
                  policy=FORMAL_GATE_POLICY,
              )
          else:
              gate50 = {
                  "schema_version": "sts1-champion-gate-v1",
                  "gate": "fixed-seed-50",
                  "status": "SKIPPED",
                  "reasons": ["fast_30_seed_gate_did_not_pass"],
              }

          final = {
              "schema_version": "sts1-mcts-teacher-challenge-result-v1",
              "candidate_policy": "armg_plus_mcts_2000",
              "champion_replaced": False,
              "promotion": "REFERENCE_ONLY_NOT_A_MODEL_ARTIFACT",
              "gate_30": gate30,
              "gate_50": gate50,
          }
          (root / "gate-30.json").write_text(
              json.dumps(gate30, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (root / "gate-50.json").write_text(
              json.dumps(gate50, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (root / "challenge-result.json").write_text(
              json.dumps(final, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("CHALLENGE_RESULT", json.dumps(final, sort_keys=True))
          PY

      - name: Upload challenge reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sts1-mcts-teacher-challenge-reports
          path: |
            evidence/sts1/mcts-challenge/champion-30.json
            evidence/sts1/mcts-challenge/mcts2000-30.json
            evidence/sts1/mcts-challenge/champion-50.json
            evidence/sts1/mcts-challenge/mcts2000-50.json
            evidence/sts1/mcts-challenge/summary.json
            evidence/sts1/mcts-challenge/gate-30.json
            evidence/sts1/mcts-challenge/gate-50.json
            evidence/sts1/mcts-challenge/challenge-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Delete transient files
        if: always()
        run: rm -rf "$RUNNER_TEMP/sts1-mcts-challenge"
