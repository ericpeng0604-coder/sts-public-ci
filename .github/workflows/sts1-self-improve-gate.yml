name: STS1 Public Self-Improve Gate

on:
  push:
    branches:
      - gpt/sts1-self-improve-loop-20260925
    paths:
      - '.github/workflows/sts1-self-improve-gate.yml'
      - 'src/roguelike_ai/sts1_phase3/**'
      - 'scripts/sts1/sts1_champion_gate.py'
      - 'tests/test_sts1_champion_gate.py'
      - 'tests/test_sts1_self_improve_loop.py'
      - 'tests/test_sts1_ppo_rollout.py'
      - 'tests/test_sts1_student_v1_ppo.py'
      - 'tests/test_sts1_teacher_distill.py'
      - 'tests/test_sts1_simulator_teacher_mode.py'
      - 'tests/test_sts1_simulator_ppo_mode.py'
      - 'fixtures/sts1/armg_map_eval_seeds_50.txt'
      - 'patches/sts1/armg_gamecontext_clone.patch'
      - 'tests/test_sts1_armg_map_evolve.py'
      - 'scripts/sts1/sts1_armg_map_round_v1.py'
      - 'tests/test_sts1_hybrid_mcts_vote.py'
      - 'tests/test_sts1_hybrid_model.py'
      - 'tests/test_sts1_reference_policy.py'
      - 'tests/test_sts1_base_policy.py'
      - 'tests/test_sts1_self_improve_v2.py'
      - 'scripts/sts1/sts1_self_improve_loop_v2.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/sts1-self-improve-gate.yml'
      - 'src/roguelike_ai/sts1_phase3/**'
      - 'scripts/sts1/sts1_champion_gate.py'
      - 'tests/test_sts1_champion_gate.py'
      - 'tests/test_sts1_self_improve_loop.py'
      - 'tests/test_sts1_ppo_rollout.py'
      - 'tests/test_sts1_student_v1_ppo.py'
      - 'tests/test_sts1_simulator_ppo_mode.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  champion-gate-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install numpy torch==2.11.0
      - name: Compile offline simulator
        run: |
          python -m py_compile src/roguelike_ai/sts1_phase3/simulator.py
          python -m py_compile scripts/sts1/sts1_armg_map_round_v1.py
      - name: Test self-improvement contracts
        run: >-
          pytest -q
          tests/test_sts1_champion_gate.py
          tests/test_sts1_self_improve_loop.py
          tests/test_sts1_ppo_rollout.py
          tests/test_sts1_student_v1_ppo.py
          tests/test_sts1_teacher_distill.py
          tests/test_sts1_simulator_teacher_mode.py
          tests/test_sts1_simulator_ppo_mode.py
          tests/test_sts1_hybrid_mcts_vote.py
          tests/test_sts1_hybrid_model.py
          tests/test_sts1_reference_policy.py
          tests/test_sts1_base_policy.py
          tests/test_sts1_self_improve_v2.py
