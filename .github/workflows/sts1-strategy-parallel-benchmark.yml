name: STS1 Strategy Parallel CPU Benchmark

on:
  push:
    branches:
      - gpt/sts1-strategy-parallel-cpu-v4-20260928
    paths:
      - '.github/workflows/sts1-strategy-parallel-benchmark.yml'
      - 'scripts/sts1/sts1_parallel_teacher_benchmark.py'
      - 'scripts/sts1/sts1_armg_strategy_loop.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and hydrate pinned Strategy runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . numpy torch==2.11.0
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          git -C external/sts_lightspeed/source apply --check "$PWD/patches/sts1/armg_gamecontext_clone.patch"
          git -C external/sts_lightspeed/source apply "$PWD/patches/sts1/armg_gamecontext_clone.patch"
          python scripts/sts1/build_probe.py
          root=".cache/sts1-armg-strategy"
          rm -rf "$root"
          mkdir -p "$root/sim/sts_lightspeed"
          ln -s "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -s "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -s "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
          ln -s "$PWD/external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt" "$root/armG_model_G128x128_15k.pt"

      - name: Benchmark 1-4 Teacher workers on identical states
        run: |
          set -euo pipefail
          mkdir -p evidence/sts1/parallel-benchmark
          python scripts/sts1/sts1_parallel_teacher_benchmark.py \
            --module-dir external/sts_lightspeed/source/build-probe \
            --armg-root .cache/sts1-armg-strategy \
            --weight .cache/sts1-armg-strategy/armG_model_G128x128_15k.pt \
            --mcts-sims 2000 \
            --label-budget 4 \
            --output evidence/sts1/parallel-benchmark/report.json

      - name: Verify benchmark result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/sts1/parallel-benchmark/report.json")
          d=json.loads(p.read_text())
          assert d["result"] == "PASS_PARALLEL_TEACHER_BENCHMARK"
          assert d["parity"] == "PASS"
          assert [r["workers"] for r in d["runs"]] == [1,2,3,4]
          assert all(r["fallback_reason"] is None for r in d["runs"][1:])
          print(json.dumps(d, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sts1-strategy-parallel-benchmark
          path: evidence/sts1/parallel-benchmark/report.json
          if-no-files-found: error
          retention-days: 30
