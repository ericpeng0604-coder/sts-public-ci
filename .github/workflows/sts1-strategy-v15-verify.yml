name: STS1 Strategy Gate v1.5 Verify

on:
  push:
    branches:
      - gpt/sts1-armg-strategy-loop-20260928
    paths:
      - 'scripts/sts1/sts1_armg_strategy_gate_v15.py'
      - 'tests/test_sts1_armg_strategy_gate_v15.py'
      - '.github/workflows/sts1-strategy-v15-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' torch==2.11.0
      - name: Syntax check
        run: python -m py_compile scripts/sts1/sts1_armg_strategy_gate_v15.py
      - name: Strategy gate contract tests
        run: python -m pytest -q tests/test_sts1_armg_strategy_gate_v15.py
