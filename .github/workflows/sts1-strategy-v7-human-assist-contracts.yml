name: STS1 Strategy v7 Human Assist Contracts

on:
  push:
    branches:
      - gpt/sts1-strategy-v7-human-assist-20260930
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPERT_DATA_REPO: 'https://github.com/MaT1g3R/Slay-the-Spire-data.git'
  EXPERT_DATA_SHA: '097aaf3564c2247835162d267cbc7c55d2c9039e'

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' numpy torch==2.11.0
      - name: Compile
        run: |
          python -m py_compile             src/roguelike_ai/sts1_phase3/human_path_prior.py             scripts/sts1/sts1_armg_strategy_loop.py
      - name: Unit contracts
        run: |
          pytest -q             tests/test_sts1_strategy_parallel_cpu_v4.py             tests/test_sts1_strategy_data_efficiency_v2.py             tests/test_sts1_strategy_elite_mining_v3.py
      - name: Build pinned Human path prior
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/expert-data"
          git clone --filter=blob:none "$EXPERT_DATA_REPO" "$data"
          git -C "$data" checkout "$EXPERT_DATA_SHA"
          python - "$data" <<'PY'
          from pathlib import Path
          import json,sys
          from roguelike_ai.sts1_phase3.human_path_prior import build_path_prior
          out=Path("evidence/sts1/strategy-v7-human/path-prior.json")
          p=build_path_prior(Path(sys.argv[1]),out,min_ascension=15,alpha=3.0)
          assert p["accepted_runs"]==101
          assert p["example_count"]==4503
          assert p["ignored_nodes"]==0
          print("PASS_STRATEGY_V7_HUMAN_PRIOR",json.dumps({
              "accepted_runs":p["accepted_runs"],
              "examples":p["example_count"],
              "contexts":len(p["context_log_probs"]),
          },sort_keys=True))
          PY
