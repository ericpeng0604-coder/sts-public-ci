name: STS1 Teacher A0 50% Goal

on:
  workflow_dispatch:
  push:
    branches:
      - gpt/sts1-teacher-a0-50-20260926
    paths:
      - 'control/sts1-teacher-a0-50.request'

permissions:
  contents: read
  issues: write

concurrency:
  group: sts1-teacher-a0-50
  cancel-in-progress: false

jobs:
  fixed-50-exam:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
      SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Load Teacher request
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          vals = {}
          for raw in Path("control/sts1-teacher-a0-50.request").read_text().splitlines():
              raw = raw.strip()
              if raw and not raw.startswith("#"):
                  k,v = raw.split("=",1); vals[k.strip()] = v.strip()
          defaults = {
              "mode":"single", "mcts_sims":"2000", "late_mcts_sims":"8000",
              "late_floor":"34", "exploration":"", "consensus_budgets":"1000,2000,4000"
          }
          defaults.update(vals)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              for k,v in {
                  "TEACHER_MODE":defaults["mode"], "MCTS_SIMS":defaults["mcts_sims"],
                  "LATE_MCTS_SIMS":defaults["late_mcts_sims"], "LATE_FLOOR":defaults["late_floor"],
                  "MCTS_EXPLORATION":defaults["exploration"],
                  "CONSENSUS_BUDGETS":defaults["consensus_budgets"],
              }.items(): f.write(f"{k}={v}\n")
          print("TEACHER_REQUEST", defaults)
          PY

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install numpy torch==2.11.0

      - name: Hydrate pinned simulator and ArmG
        run: |
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=".cache/sts1-armg"
          rm -rf "$root"
          mkdir -p "$root/sim/sts_lightspeed"
          ln -s "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -s "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -s "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
          ln -s "$PWD/external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt" "$root/armG_model_G128x128_15k.pt"

      - name: Restore latest ArmG map state
        run: |
          set -euo pipefail
          dst="$RUNNER_TEMP/sts1-armg-map-state"; mkdir -p "$dst"
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=sts1-armg-map-v1-state&per_page=100" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/armg.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
            unzip -q "$RUNNER_TEMP/armg.zip" -d "$dst"
          fi

      - name: Run fixed 50-seed Teacher exam
        run: |
          args=(
            --module-dir external/sts_lightspeed/source/build-probe
            --armg-root .cache/sts1-armg
            --armg-weight .cache/sts1-armg/armG_model_G128x128_15k.pt
            --seed-file external/sts-rl-agent/source/eval/eval_seeds_50.txt
            --output evidence/sts1/teacher-a0-50/report.json
            --mode "$TEACHER_MODE"
            --mcts-sims "$MCTS_SIMS"
            --late-mcts-sims "$LATE_MCTS_SIMS"
            --late-floor "$LATE_FLOOR"
            --consensus-budgets "$CONSENSUS_BUDGETS"
          )
          if [ -f "$RUNNER_TEMP/sts1-armg-map-state/current-map.pt" ]; then
            args+=(--armg-map-weight "$RUNNER_TEMP/sts1-armg-map-state/current-map.pt")
          fi
          if [ -n "$MCTS_EXPLORATION" ]; then args+=(--exploration "$MCTS_EXPLORATION"); fi
          python scripts/sts1/sts1_teacher_a0_50_eval.py "${args[@]}"

      - name: Upload Teacher report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sts1-teacher-a0-50-report-${{ github.run_id }}
          path: evidence/sts1/teacher-a0-50/report.json
          if-no-files-found: warn
          retention-days: 90

      - name: Report result
        if: success()
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/comment.md"
          import json, os
          r=json.load(open("evidence/sts1/teacher-a0-50/report.json"))
          print("@ericpeng0604-coder\n")
          print("## Teacher A0 50% Goal — fixed 50 baseline")
          print(f"- Teacher：pure MCTS + ArmG")
          print(f"- 設定：{r['mode']} / MCTS {r.get('mcts_sims')}")
          print(f"- 勝場：**{r['victories']}/50** ({r['win_rate']:.1%})")
          print(f"- 平均最終樓層：{r['mean_final_floor']:.2f}")
          print(f"- Safety：{r['safety']}")
          print(f"- 目標：25/50（50%）")
          print(f"- 達標：**{'YES' if r['goal_reached_on_fixed_exam'] else 'NO'}**")
          print(f"- Run：{os.environ['RUN_URL']}")
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/15/comments" -f body="$(cat "$RUNNER_TEMP/comment.md")"
