name: STS1 Teacher Winner Mining

on:
  push:
    branches: [gpt/sts1-teacher-a0-50-20260926]
    paths: ['control/sts1-teacher-winner-mining.request']
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: sts1-teacher-winner-mining
  cancel-in-progress: false

jobs:
  mine:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
      SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Read request
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          d={}
          for x in Path("control/sts1-teacher-winner-mining.request").read_text().splitlines():
            x=x.strip()
            if x and not x.startswith("#"):
              k,v=x.split("=",1); d[k]=v
          with open(os.environ["GITHUB_ENV"],"a") as f:
            f.write("SEED_COUNT="+d.get("seed_count","100")+"\n")
            f.write("RNG_SEED="+d.get("rng_seed","20261001")+"\n")
            f.write("MCTS_SIMS="+d.get("mcts_sims","2000")+"\n")
          PY
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install numpy torch==2.11.0
      - name: Hydrate
        run: |
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=".cache/sts1-armg"; rm -rf "$root"; mkdir -p "$root/sim/sts_lightspeed"
          ln -s "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -s "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -s "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"
          ln -s "$PWD/external/sts-rl-agent/source/weights/armG_model_G128x128_15k.pt" "$root/armG_model_G128x128_15k.pt"
      - name: Restore ArmG map
        run: |
          dst="$RUNNER_TEMP/armg"; mkdir -p "$dst"
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=sts1-armg-map-v1-state&per_page=100" --jq '.artifacts|map(select(.expired==false))|sort_by(.created_at)|reverse|.[0].id//empty')"
          if [ -n "$id" ]; then curl --fail -L -H "Authorization: Bearer $GH_TOKEN" -o "$RUNNER_TEMP/a.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip"; unzip -q "$RUNNER_TEMP/a.zip" -d "$dst"; fi
      - name: Mine fresh seeds
        run: |
          args=(--module-dir external/sts_lightspeed/source/build-probe --armg-root .cache/sts1-armg --armg-weight .cache/sts1-armg/armG_model_G128x128_15k.pt --formal-seed-file external/sts-rl-agent/source/eval/eval_seeds_50.txt --output-dir evidence/sts1/teacher-winner-mining --seed-count "$SEED_COUNT" --rng-seed "$RNG_SEED" --mcts-sims "$MCTS_SIMS" --shard-index "${{ matrix.shard }}" --shard-count 8)
          if [ -f "$RUNNER_TEMP/armg/current-map.pt" ]; then args+=(--armg-map-weight "$RUNNER_TEMP/armg/current-map.pt"); fi
          python scripts/sts1/sts1_teacher_winner_mining.py "${args[@]}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sts1-teacher-winner-mining-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: evidence/sts1/teacher-winner-mining/
          if-no-files-found: warn
          retention-days: 90
      - name: Report shard
        if: success()
        run: |
          python - <<'PY' > "$RUNNER_TEMP/c.md"
          import json
          r=json.load(open("evidence/sts1/teacher-winner-mining/winner-mining-summary.json"))
          print("@ericpeng0604-coder\n\n## Teacher Winner Mining shard ${{ matrix.shard }}")
          print(f"- Attempted seeds：{r.get('attempted_seed_count', r['seed_count'])}")
          print(f"- Completed seeds：{r.get('completed_seed_count', r['seed_count'])}")
          print(f"- Blocked seeds：{r.get('blocked_seed_count', 0)} {r.get('blocked_seeds', [])}")
          print(f"- Wins：**{r['victories']}** ({r['win_rate']:.1%} of completed)")
          print(f"- Near wins (floor >=45)：{r['near_wins']}")
          print(f"- Mean floor：{r['mean_final_floor']:.2f}")
          print(f"- Winning seeds：{r['winning_seeds']}")
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/15/comments" -f body="$(cat "$RUNNER_TEMP/c.md")"

  merge:
    needs: mine
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/sts1-teacher-a0-50-20260926
      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          pattern: sts1-teacher-winner-mining-${{ github.run_id }}-shard-*
          path: merged-shards
      - name: Merge evidence and summaries
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          root=Path("merged-shards"); out=Path("merged-evidence"); out.mkdir()
          reports=[]; seen=set()
          for p in sorted(root.glob("*/winner-mining-summary.json")):
            r=json.load(open(p)); reports.append(r)
            selected=[x["evidence"] for x in r.get("winners",[])] + [x["evidence"] for x in r.get("near_wins_detail",[])]
            for name in selected:
              ev=p.parent/name
              if not ev.is_file(): raise SystemExit("missing selected evidence: "+str(ev))
              if ev.name in seen: raise SystemExit("duplicate seed evidence: "+ev.name)
              seen.add(ev.name); shutil.copy2(ev,out/ev.name)
          if len(reports)!=8: raise SystemExit(f"expected 8 shard reports, got {len(reports)}")
          n=sum(r.get("completed_seed_count",r["seed_count"]) for r in reports)
          attempted=sum(r.get("attempted_seed_count",r["seed_count"]) for r in reports)
          blocked=sum(r.get("blocked_seed_count",0) for r in reports)
          if n <= 0: raise SystemExit("no completed seeds across shards")
          wins=sum(r["victories"] for r in reports); near=sum(r["near_wins"] for r in reports)
          floors=sum(r["mean_final_floor"]*r.get("completed_seed_count",r["seed_count"]) for r in reports)/n
          winning=sum((r["winning_seeds"] for r in reports),[])
          blocked_seeds=sum((r.get("blocked_seeds",[]) for r in reports),[])
          merged={"schema_version":"sts1-teacher-winner-mining-merged-v2","seed_count":n,"completed_seed_count":n,"attempted_seed_count":attempted,"blocked_seed_count":blocked,"blocked_seeds":blocked_seeds,"mcts_sims":reports[0]["mcts_sims"],"victories":wins,"win_rate":wins/n,"win_rate_all_attempted":wins/attempted,"near_wins":near,"mean_final_floor":floors,"winning_seeds":winning,"selected_evidence_count":len(seen),"shards":reports}
          (out/"winner-mining-summary.json").write_text(json.dumps(merged,indent=2,sort_keys=True)+"\n")
          print(json.dumps(merged,indent=2))
          PY
      - name: Upload merged evidence
        uses: actions/upload-artifact@v4
        with:
          name: sts1-teacher-winner-mining-${{ github.run_id }}-merged
          path: merged-evidence/
          retention-days: 90
      - name: Continue next loop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("control/sts1-teacher-winner-mining.request")
          d={}
          for line in p.read_text().splitlines():
            if "=" in line:
              k,v=line.split("=",1); d[k]=v
          attempt=int(d.get("attempt","0"))+1
          rng=int(d.get("rng_seed","20261001"))+1
          p.write_text(f"attempt={attempt}\nseed_count={d.get('seed_count','100')}\nrng_seed={rng}\nmcts_sims=2000\nreason=auto_continue_after_parallel_merge\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control/sts1-teacher-winner-mining.request
          git commit -m "control(sts1): auto-continue winner mining loop"
          git push origin HEAD:gpt/sts1-teacher-a0-50-20260926
          gh workflow run sts1-teacher-winner-mining.yml --ref gpt/sts1-teacher-a0-50-20260926
