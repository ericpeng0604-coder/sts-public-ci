name: STS1 v3.11 Audit-First Choice-Relative Rescue

on:
  push:
    branches:
      - gpt/sts1-build-rescue-v22-antiforget-20260930
    paths:
      - control/sts1-v311-selective-residual.trigger
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  SOURCE_RUN_ID: '37393165126'
  SCREEN_ARTIFACT: 'sts1-v35b-screen-37393165126'
  DATASET_ARTIFACT: 'sts1-v35b-dataset-37393165126'
  V34_RUN_ID: '37318408007'
  V34_CANDIDATE_ARTIFACT: 'sts1-v34-candidate-37318408007'
  V34_MINING_ARTIFACT: 'v34-mine-recovered-37318408007'
  V34_TRACE_RUN_ID: '36962596407'
  V34_TRACE_ARTIFACT: 'sts1-v34-regression-trace-36962596407'
  V322_RUN_ID: '36823568672'
  V322_ARTIFACT: 'sts1-v322-active-repair-36823568672'
  V38_RUN_ID: '37621983723'
  V38_ARTIFACT: 'sts1-v38-activation-probe-37621983723'
  V310_RUN_ID: '37631768678'
  V310_ARTIFACT: 'sts1-v310-clustered-rescue-37631768678'
  G7_ARTIFACT_ID: '11079234863'
  G7_WEIGHT_SHA256: '8313c99d9b0ab0c0d206fdd2f744fed11f4104d440dcb465cf7c78a517f9ccd0'
  SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'

concurrency:
  group: sts1-v311-clustered-rescue
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate code and cluster tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/sts1/sts1_build_rescue_clusters_v39.py scripts/sts1/sts1_build_rescue_adapter_v35.py scripts/sts1/sts1_build_rescue_teacher_audit_v311.py src/roguelike_ai/sts1_phase3/residual_scoring.py src/roguelike_ai/sts1_phase3/simulator.py
          python -m pip install pytest
          pytest -q tests/test_sts1_rescue_clusters_v39.py tests/test_sts1_residual_scoring_v311.py tests/test_sts1_v311_workflow_scope.py
          grep -Fq 'int(neg.numel()) == 0' src/roguelike_ai/sts1_phase3/simulator.py

      - name: Fetch only train300 and priority80 seed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            | python -c "import json,sys; x=json.load(sys.stdin); a=[a for a in x['artifacts'] if a['name']=='$SCREEN_ARTIFACT']; assert len(a)==1; print(a[0]['id'])")"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -o "$RUNNER_TEMP/sts1-v35b-screen.zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
          mkdir -p evidence/sts1/v311/screen
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive=Path(__import__('os').environ['RUNNER_TEMP'])/'sts1-v35b-screen.zip'
          out=Path('evidence/sts1/v311/screen')
          with ZipFile(archive) as z:
              names=z.namelist()
              for wanted in ('train300.txt','priority80.txt'):
                  matches=[n for n in names if n==wanted or n.endswith('/'+wanted)]
                  if len(matches)!=1: raise SystemExit(f'{wanted}: expected one archive member, found {len(matches)}')
                  (out/wanted).write_bytes(z.read(matches[0]))
          print('V311_SCREEN_EXTRACT_PASS train300.txt priority80.txt; other archive members not extracted/read')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.DATASET_ARTIFACT }}
          path: evidence/sts1/v311/data
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.V34_CANDIDATE_ARTIFACT }}
          path: evidence/sts1/v311/v34
          github-token: ${{ github.token }}
          run-id: ${{ env.V34_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.V34_MINING_ARTIFACT }}
          path: evidence/sts1/v311/mining
          github-token: ${{ github.token }}
          run-id: ${{ env.V34_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.V322_ARTIFACT }}
          path: evidence/sts1/v311/v322
          github-token: ${{ github.token }}
          run-id: ${{ env.V322_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.V34_TRACE_ARTIFACT }}
          path: evidence/sts1/v311/v34-trace
          github-token: ${{ github.token }}
          run-id: ${{ env.V34_TRACE_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.V38_ARTIFACT }}
          path: evidence/sts1/v311/v38
          github-token: ${{ github.token }}
          run-id: ${{ env.V38_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.V310_ARTIFACT }}
          path: evidence/sts1/v311/v310-reference
          github-token: ${{ github.token }}
          run-id: ${{ env.V310_RUN_ID }}

      - name: Validate frozen training pools and create v311 Probe10 and Dev30 ledger
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/sts1/v311')
          screen=root/'screen'
          for p in ['train300.txt','priority80.txt']:
              candidates=list(screen.rglob(p))
              if not candidates: raise SystemExit(f'missing frozen seed file: {p}')
          for p in ['v36-dev30.txt','v37-dev50.txt','probe30.txt']:
              candidates=list((root/'v38').rglob(p))
              if not candidates: raise SystemExit(f'missing prior dev/probe seed file: {p}')
          def read(name):
              return [int(x) for x in next(screen.rglob(name)).read_text().split()]
          def read_v38(name):
              return [int(x) for x in next((root/'v38').rglob(name)).read_text().split()]
          train=read('train300.txt'); mined=read('priority80.txt')
          old36=read_v38('v36-dev30.txt'); old37=read_v38('v37-dev50.txt'); old38=read_v38('probe30.txt')
          assert len(train)==300 and len(set(train))==300
          assert len(mined)==80 and len(set(mined))==80 and set(mined)<=set(train)
          untouched=[s for s in train if s not in set(mined)]
          assert len(untouched)==220
          prior=set(old36)|set(old37)|set(old38)
          assert len(old36)==30 and len(old37)==50 and len(old38)==30
          assert not (set(old36)&set(old37) or set(old36)&set(old38) or set(old37)&set(old38))
          assert prior<=set(untouched)
          remaining=[s for s in untouched if s not in prior]
          assert len(remaining)==110, len(remaining)
          v39_dev=remaining[:30]
          v310_dev=remaining[30:60]
          cancelled_v311_unseen=remaining[60:90]
          probe=remaining[60:70]
          dev=remaining[70:100]
          assert len(set(v39_dev))==30 and len(set(v310_dev))==30 and len(set(cancelled_v311_unseen))==30
          assert len(set(probe))==10 and len(set(dev))==30 and not (set(probe)&set(dev))
          assert not (set(v39_dev)&set(v310_dev) or set(v39_dev)&set(cancelled_v311_unseen) or set(v310_dev)&set(cancelled_v311_unseen))
          assert not (set(probe)&(set(mined)|prior|set(v39_dev)|set(v310_dev)))
          assert not (set(dev)&(set(mined)|prior|set(v39_dev)|set(v310_dev)|set(probe)))
          out=root/'candidate'; out.mkdir(parents=True,exist_ok=True)
          (out/'probe10-seeds.txt').write_text('\n'.join(map(str,probe))+'\n')
          (out/'dev30-seeds.txt').write_text('\n'.join(map(str,dev))+'\n')
          ledger={'schema_version':'sts1-v311-dev-seed-ledger','source':'train300 minus priority80, v36 dev30, v37 dev50, v38 probe30, v39 dev30, v310 dev30; canceled v311 run 37634845580 did no games',
                  'train300_count':len(train),'priority80_count':len(mined),'prior_dev_probe_count':len(prior),
                  'remaining_untouched_count':len(remaining),'v39_dev30':v39_dev,'v310_dev30':v310_dev,
                  'previous_canceled_unseen30_not_simulated':cancelled_v311_unseen,'probe10':probe,'dev30':dev,
                  'formal_seed_sources_read':False,'formal_seed_files_opened':False}
          (out/'seed-ledger.json').write_text(json.dumps(ledger,indent=2,sort_keys=True)+'\n')
          print('V311_DEV_LEDGER_PASS',json.dumps({k:v for k,v in ledger.items() if not isinstance(v,list)},sort_keys=True))
          PY
          for f in evidence/sts1/v311/data/summary.json evidence/sts1/v311/data/new-win-teachers.jsonl evidence/sts1/v311/data/negative-examples.jsonl evidence/sts1/v311/v34/candidate.pt.adapter.pt evidence/sts1/v311/v34/combined-teachers.jsonl evidence/sts1/v311/v34-trace/regression2-anchors.jsonl; do if ! test -s "$f"; then echo "MISSING_RECOVERY_FILE=$f"; find evidence/sts1/v311 -maxdepth 4 -type f -print | sort; exit 1; fi; done
          test -f evidence/sts1/v311/v322/preservation-active.jsonl || { echo MISSING_RECOVERY_FILE=evidence/sts1/v311/v322/preservation-active.jsonl; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('evidence/sts1/v311/data/summary.json').read_text())
          assert s['teacher_seeds']==29 and s['teacher_examples']==32
          assert s['negative_examples']>=317 and s['negative_validation_errors']==0 and s['training_eval_overlap']==0
          print('V311_SOURCE_DATA_PASS',{'teachers':s['teacher_examples'],'seeds':s['teacher_seeds'],'negatives':s['negative_examples']})
          PY

      - name: Merge verified Positive, Negative, and Preservation pools
        run: |
          set -euo pipefail
          mkdir -p evidence/sts1/v311/train
          python scripts/sts1/sts1_build_rescue_v35_recover_negatives.py --results-dir evidence/sts1/v311/mining --positive-teachers evidence/sts1/v311/v34/combined-teachers.jsonl --output evidence/sts1/v311/train/old-negatives.jsonl --max-per-seed 8
          python - <<'PY'
          import json
          from pathlib import Path
          def load(p): return [json.loads(x) for x in Path(p).read_text().splitlines() if x.strip()]
          def state(r): return json.dumps({'kind':r['kind'],'obs':r['obs'],'descs':r['descs']},sort_keys=True,separators=(',',':'))
          oldp=load('evidence/sts1/v311/v34/combined-teachers.jsonl'); newp=load('evidence/sts1/v311/data/new-win-teachers.jsonl')
          pos={(state(r),int(r['teacher_best_index'])):r for r in oldp+newp}; prow=list(pos.values()); pst={state(r) for r in prow}
          oldn=load('evidence/sts1/v311/train/old-negatives.jsonl'); newn=load('evidence/sts1/v311/data/negative-examples.jsonl')
          neg={(state(r),int(r['current_armg_index']),int(r['rejected_index'])):r for r in oldn+newn if state(r) not in pst}; nrow=list(neg.values())
          pres=[]
          for p in ['evidence/sts1/v311/v322/preservation-active.jsonl','evidence/sts1/v311/v34-trace/regression2-anchors.jsonl']: pres.extend(load(p))
          anchors={(state(r),int(r['parent_selected_index'])):r for r in pres}
          assert anchors, 'no verified preservation anchors in merged input'
          out=Path('evidence/sts1/v311/train')
          for name,rows in [('positive.jsonl',prow),('negative.jsonl',nrow),('preservation.jsonl',list(anchors.values()))]:
              (out/name).write_text(''.join(json.dumps(r,sort_keys=True)+'\n' for r in rows))
          assert len(prow)==62 and len({int(r['seed']) for r in prow})==56
          assert len(nrow)>=325
          print('V311_POOL_MERGE_PASS',{'positive':len(prow),'positive_seeds':len({int(r['seed']) for r in prow}),'negative':len(nrow),'preservation':len(anchors)})
          PY
          python scripts/sts1/sts1_build_rescue_clusters_v39.py --input evidence/sts1/v311/train/positive.jsonl --output evidence/sts1/v311/train/clustered-positive.jsonl --report evidence/sts1/v311/train/cluster-report.json

      - name: Install and build pinned simulator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . numpy
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu
          pytest -q tests/test_sts1_residual_scoring_torch_v311.py
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-v311
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"

      - name: Download and verify frozen G7 and replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -o "$RUNNER_TEMP/g7.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$G7_ARTIFACT_ID/zip"
          mkdir -p "$RUNNER_TEMP/g7"; unzip -q "$RUNNER_TEMP/g7.zip" -d "$RUNNER_TEMP/g7"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"; elite="$(find "$RUNNER_TEMP/g7" -name elite-replay.npz -print -quit)"
          test -n "$parent" && test -n "$elite" && test "$(sha256sum "$parent" | awk '{print $1}')" = "$G7_WEIGHT_SHA256"

      - name: Audit all verified Teacher targets against v3.10 and retention guards
        run: |
          set -euo pipefail
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"; elite="$(find "$RUNNER_TEMP/g7" -name elite-replay.npz -print -quit)"
          old_adapter=evidence/sts1/v311/v310-reference/candidate/candidate.pt.adapter.pt
          test -s "$old_adapter"
          python scripts/sts1/sts1_build_rescue_teacher_audit_v311.py \
            --armg-root .cache/sts1-v311 --base-weight "$parent" --adapter-sidecar "$old_adapter" \
            --elite-replay "$elite" --teacher-replay evidence/sts1/v311/train/positive.jsonl \
            --preservation-replay evidence/sts1/v311/train/preservation.jsonl \
            --candidate-run-id 37631768678 --margin 0.75 --output-dir evidence/sts1/v311/teacher-audit

      - name: Train selective clustered Candidate with retention gates
        run: |
          set -euo pipefail
          out=evidence/sts1/v311/candidate; mkdir -p "$out"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"; elite="$(find "$RUNNER_TEMP/g7" -name elite-replay.npz -print -quit)"
          python -u scripts/sts1/sts1_build_rescue_adapter_v35.py --armg-root .cache/sts1-v311 --base-weight "$parent" --elite-replay "$elite" \
            --new-win-replay evidence/sts1/v311/train/clustered-positive.jsonl --negative-replay evidence/sts1/v311/train/negative.jsonl \
            --preservation-replay evidence/sts1/v311/train/preservation.jsonl --init-adapter-sidecar evidence/sts1/v311/v34/candidate.pt.adapter.pt \
            --output "$out/candidate.pt" --report "$out/train-report.json" --hidden-dim 48 --epochs 6 --lr 0.00003 \
            --elite-train-max 8192 --retention-eval-max 2048 --teacher-margin 0.05 --teacher-parent-margin 0 --teacher-contrastive-margin 0.75 --residual-init-scale 1.2 --teacher-coef 4.0 \
            --clustered-teacher-weighting --negative-margin 0.02 --negative-coef 4.0 --distill-coef 18.0 --zero-residual-coef 1.0 \
            --preservation-coef 24.0 --preservation-margin 0.03 --min-preservation-margin 0.01 --weight-decay 0.00001 \
            --min-fully-learned-seeds 12 --min-parent-agreement 0.995 --max-parent-kl 0.002 --max-kl-increase 0.001 \
            --max-winner-drop 0.01 --gate-ratio 0.80 --threads 4
          test -s "$out/candidate.pt" && test -s "$out/candidate.pt.adapter.pt"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/sts1/v311/candidate/train-report.json'); r=json.loads(p.read_text())
          print('V311_TRAIN_PASS',json.dumps({'selected_epoch':r['selected_epoch'],'fully_learned':r['after']['new_win']['fully_learned_seeds'],'parent_kl':r['after']['retention']['parent_kl'],'allowed_kl':r['retention_policy']['allowed_parent_kl'],'preservation':r['after']['preservation']['top1'],'negative_rejection':r['after']['negative']['rejected_top1_rate'],'cluster_weighting':r['clustered_teacher_weighting'],'teacher_parent_margin':r['teacher_parent_margin'],'teacher_contrastive_margin':r['teacher_contrastive_margin']},sort_keys=True))
          PY

      - name: Run activation-only Probe10 on untouched seeds
        id: probe
        run: |
          set -euo pipefail
          out=evidence/sts1/v311/candidate; parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_activation_probe_v38.py \
            --module-dir external/sts_lightspeed/source/build-probe --armg-root .cache/sts1-v311 \
            --parent-weight "$parent" --candidate-weight "$out/candidate.pt" \
            --seed-file "$out/probe10-seeds.txt" --output-dir evidence/sts1/v311/activation-probe \
            --mcts-sims 2000 --workers 4
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open('evidence/sts1/v311/activation-probe/summary.json'))
          safe=bool(x.get('all_games_complete_and_safe'))
          changed=int(x.get('top1_changed',0))
          print(f"safe={str(safe).lower()}")
          print(f"changed={str(changed>0).lower()}")
          print(f"changed_count={changed}")
          print('V311_PROBE_DECISION',json.dumps({'safe':safe,'top1_changed':changed,'conditional_dev30':safe and changed>0},sort_keys=True))
          PY

      - name: Conditional paired MCTS-2000 Dev30
        id: dev
        if: steps.probe.outputs.safe == 'true' && steps.probe.outputs.changed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v311/candidate; parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py --module-dir external/sts_lightspeed/source/build-probe --armg-root .cache/sts1-v311 \
            --parent-weight "$parent" --candidate-weight "$out/candidate.pt" --seed-file "$out/dev30-seeds.txt" \
            --output "$out/dev30.json" --mcts-sims 2000 --workers 4 --min-win-delta 0 --max-pvalue 1.0 --label v311-dev30-diagnostic
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open('evidence/sts1/v311/candidate/dev30.json'))
          net=int(x['candidate_only_wins'])-int(x['parent_only_wins'])
          print(f"net={net}")
          print(f"parent={x['parent_wins']}")
          print(f"candidate={x['candidate_wins']}")
          print(f"candidate_only={x['candidate_only_wins']}")
          print(f"parent_only={x['parent_only_wins']}")
          print(f"pvalue={x.get('paired_sign_pvalue_one_sided','NOT_VERIFIED')}")
          PY

      - name: Write summary and Issue #15 report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_CHANGED: ${{ steps.probe.outputs.changed_count }}
          DEV_NET: ${{ steps.dev.outputs.net }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path('evidence/sts1/v311/candidate'); out.mkdir(parents=True,exist_ok=True)
          def read(path):
              p=Path(path)
              return json.loads(p.read_text()) if p.exists() else None
          tr=read(out/'train-report.json')
          s={'schema_version':'sts1-v311-audit-first','training':tr,
             'clusters':read('evidence/sts1/v311/train/cluster-report.json'),
             'teacher_audit':read('evidence/sts1/v311/teacher-audit/summary.json'),
             'activation_probe10':read('evidence/sts1/v311/activation-probe/summary.json'),
             'dev30':read(out/'dev30.json'),
             'scope_issue':17,'formal_evaluations':'NOT_RUN','readiness':'HOLD_PARENT'}
          (out/'summary.json').write_text(json.dumps(s,indent=2,sort_keys=True)+'\n')
          print('V311_FINAL',json.dumps({'readiness':s['readiness'],'teacher_audit':s['teacher_audit'],'activation_probe10':s['activation_probe10'],'dev30':s['dev30'],'formal_evaluations':s['formal_evaluations']},sort_keys=True))
          PY
          python - <<'PY' > "$RUNNER_TEMP/body.txt"
          import json
          from pathlib import Path
          p=Path('evidence/sts1/v311/candidate/summary.json'); x=json.loads(p.read_text())
          tr=x.get('training') or {}; aft=tr.get('after') or {}; ret=aft.get('retention') or {}; cl=x.get('clusters') or {}
          ta=x.get('teacher_audit') or {}; tc=ta.get('counts') or {}; pr=x.get('activation_probe10') or {}; dev=x.get('dev30') or {}
          print('@ericpeng0604-coder\n')
          print('## STS1 v3.11 Audit-First Choice-Relative Residual\n')
          print('Data:\n- Positive Teacher: 62 decisions\n- Positive Seeds: 56\n- Negative: 325+\n- Preservation: verified v3.2.2 anchors and v3.4 regression anchors\n')
          print(f"Teacher audit (v3.10 reference): parent-top Teacher {tc.get('parent_top_teacher','NOT_VERIFIED')}; gate allowed {tc.get('gate_allowed','NOT_VERIFIED')}; target change if allowed {tc.get('teacher_target_would_change_if_allowed','NOT_VERIFIED')}; preservation conflicts {tc.get('preservation_guard_conflicts','NOT_VERIFIED')}; high-confidence overlaps/conflicts {tc.get('high_confidence_guard_overlaps','NOT_VERIFIED')}/{tc.get('high_confidence_guard_conflicts','NOT_VERIFIED')}\n")
          print(f"Training:\n- selected epoch: {tr.get('selected_epoch','NOT_VERIFIED')}\n- fully learned: {(aft.get('new_win') or {}).get('fully_learned_seeds','NOT_VERIFIED')}\n- KL: {ret.get('parent_kl','NOT_VERIFIED')}\n- allowed KL: {(tr.get('retention_policy') or {}).get('allowed_parent_kl','NOT_VERIFIED')}\n- preservation: {(aft.get('preservation') or {}).get('top1','NOT_VERIFIED')}\n- negative rejection: {(aft.get('negative') or {}).get('rejected_top1_rate','NOT_VERIFIED')}\n- clustered patterns: {cl.get('repeated_multi_seed_clusters','NOT_VERIFIED')} repeated / {cl.get('clusters','NOT_VERIFIED')} total\n- parent margin objective: {tr.get('teacher_parent_margin','NOT_VERIFIED')}\n- choice-relative margin: {tr.get('teacher_contrastive_margin','NOT_VERIFIED')}\n")
          print('Activation (Probe10):')
          for k in ['total_noncombat_decisions','multi_choice_decisions','gate_checks','gate_allowed','adapter_applied','top1_changed','gate_allow_rate','top1_change_rate_given_allow','top1_change_rate_total']:
              print(f"- {k}: {pr.get(k,'NOT_RUN')}")
          print(f"- by kind: {json.dumps(pr.get('by_kind','NOT_RUN'),sort_keys=True)}\n")
          print(f"Evaluation:\n- Dev30: NOT_RUN" if not dev else f"Evaluation:\n- Dev30: G7 {dev.get('parent_wins')} / Candidate {dev.get('candidate_wins')}; C-only {dev.get('candidate_only_wins')}; P-only {dev.get('parent_only_wins')}; Net {dev.get('candidate_only_wins',0)-dev.get('parent_only_wins',0)}; p {dev.get('paired_sign_pvalue_one_sided','NOT_VERIFIED')}")
          print('- Gate30: NOT_RUN\n- Gate50: NOT_RUN\n- Fresh100: NOT_RUN\n- Fresh500: NOT_RUN\n')
          print('Final:\n- HOLD_PARENT')
          PY
          gh api repos/$GITHUB_REPOSITORY/issues/15/comments -f body="$(cat "$RUNNER_TEMP/body.txt")"

