name: STS1 v3.5 Phase-B Formal Recheck

on:
  push:
    branches:
      - gpt/sts1-build-rescue-v22-antiforget-20260930
    paths:
      - control/sts1-v35br-formal-recheck.trigger
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

env:
  CANDIDATE_RUN_ID: '37431578974'
  CANDIDATE_ARTIFACT: 'sts1-v35br-candidate-37431578974'
  SCREEN_RUN_ID: '37393165126'
  SCREEN_ARTIFACT: 'sts1-v35b-screen-37393165126'
  G7_ARTIFACT_ID: '11079234863'
  G7_WEIGHT_SHA256: '8313c99d9b0ab0c0d206fdd2f744fed11f4104d440dcb465cf7c78a517f9ccd0'
  SIM_HEAD: '7476a81954020087da31d41d16fddf475746ec2d'

concurrency:
  group: sts1-v35br-formal-recheck
  cancel-in-progress: true

jobs:
  recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate formal recheck contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/sts1/sts1_build_rescue_gate_v21.py src/roguelike_ai/sts1_phase3/simulator.py
          python - <<'PY'
          from pathlib import Path
          sim=Path("src/roguelike_ai/sts1_phase3/simulator.py").read_text()
          if "sts1-armg-residual-adapter-v2" not in sim or "int(neg.numel()) == 0" not in sim:
              raise SystemExit("v3.5 confidence-gate runtime contract missing")
          print("V35BR_FORMAL_CONTRACT_PASS")
          PY

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          path: evidence/sts1/v35br-candidate
          github-token: ${{ github.token }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SCREEN_ARTIFACT }}
          path: evidence/sts1/v35b-screen
          github-token: ${{ github.token }}
          run-id: ${{ env.SCREEN_RUN_ID }}

      - name: Validate frozen Candidate and unseen sets
        run: |
          set -euo pipefail
          test -s evidence/sts1/v35br-candidate/candidate.pt
          test -s evidence/sts1/v35br-candidate/candidate.pt.adapter.pt
          test -s evidence/sts1/v35br-candidate/train-report.json
          test "$(wc -l < evidence/sts1/v35b-screen/phaseb_gate50.txt)" -eq 50
          test "$(wc -l < evidence/sts1/v35b-screen/phaseb_fresh100.txt)" -eq 100
          test "$(wc -l < evidence/sts1/v35b-screen/phaseb_fresh500.txt)" -eq 500
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("evidence/sts1/v35br-candidate/train-report.json").read_text())
          assert r["selected_epoch"]==1, r["selected_epoch"]
          assert r["after"]["preservation"]["top1"]==1.0
          assert r["after"]["retention"]["parent_kl"] <= r["retention_policy"]["allowed_parent_kl"]
          print("V35BR_FROZEN_CANDIDATE_PASS",{
              "selected_epoch":r["selected_epoch"],
              "fully_learned":r["after"]["new_win"]["fully_learned_seeds"],
              "parent_kl":r["after"]["retention"]["parent_kl"],
              "allowed_kl":r["retention_policy"]["allowed_parent_kl"],
          })
          PY

      - name: Install, hydrate, and build pinned simulator
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . numpy
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu
          python scripts/sts1/hydrate_jialeiv_baseline_v0.py
          test "$(git -C external/sts_lightspeed/source rev-parse HEAD)" = "$SIM_HEAD"
          python scripts/sts1/build_probe.py
          root=.cache/sts1-v35brf
          mkdir -p "$root/sim/sts_lightspeed"
          ln -sf "$PWD/external/sts_lightspeed/source/build-probe" "$root/sim/sts_lightspeed/build312"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armG_train.py" "$root/armG_train.py"
          ln -sf "$PWD/external/sts-rl-agent/source/agent/armS_card_vocab.json" "$root/armS_card_vocab.json"

      - name: Download and verify frozen G7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -o "$RUNNER_TEMP/g7.zip"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$G7_ARTIFACT_ID/zip"
          mkdir -p "$RUNNER_TEMP/g7"
          unzip -q "$RUNNER_TEMP/g7.zip" -d "$RUNNER_TEMP/g7"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          test -n "$parent"
          test "$(sha256sum "$parent" | awk '{print $1}')" = "$G7_WEIGHT_SHA256"

      - name: Gate50 unseen Net-Win Gate
        id: g50
        run: |
          set -euo pipefail
          out=evidence/sts1/v35br-formal
          mkdir -p "$out"
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v35brf --parent-weight "$parent"             --candidate-weight evidence/sts1/v35br-candidate/candidate.pt             --seed-file evidence/sts1/v35b-screen/phaseb_gate50.txt             --output "$out/gate50.json" --mcts-sims 2000 --workers 4             --min-win-delta 1 --max-pvalue 1.0 --label v35br-formal-gate50
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v35br-formal/gate50.json"))
          net=x["candidate_only_wins"]-x["parent_only_wins"]
          passed=net>0 and x["candidate_wins"]>x["parent_wins"]
          for k,v in {"passed":str(passed).lower(),"net":net,"parent":x["parent_wins"],"candidate":x["candidate_wins"],"candidate_only":x["candidate_only_wins"],"parent_only":x["parent_only_wins"]}.items(): print(f"{k}={v}")
          PY

      - name: Fresh100 formal Net-Win Gate
        id: f100
        if: steps.g50.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v35br-formal
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v35brf --parent-weight "$parent"             --candidate-weight evidence/sts1/v35br-candidate/candidate.pt             --seed-file evidence/sts1/v35b-screen/phaseb_fresh100.txt             --output "$out/fresh100.json" --mcts-sims 2000 --workers 4             --min-win-delta 1 --max-pvalue 0.10 --label v35br-formal-fresh100
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v35br-formal/fresh100.json"))
          net=x["candidate_only_wins"]-x["parent_only_wins"]
          passed=net>0 and x["candidate_wins"]>x["parent_wins"] and x["paired_sign_pvalue_one_sided"]<=0.10
          for k,v in {"passed":str(passed).lower(),"net":net,"parent":x["parent_wins"],"candidate":x["candidate_wins"],"candidate_only":x["candidate_only_wins"],"parent_only":x["parent_only_wins"],"pvalue":x["paired_sign_pvalue_one_sided"]}.items(): print(f"{k}={v}")
          PY

      - name: Fresh500 formal Net-Win Gate
        id: f500
        if: steps.f100.outputs.passed == 'true'
        run: |
          set -euo pipefail
          out=evidence/sts1/v35br-formal
          parent="$(find "$RUNNER_TEMP/g7" -name offline-champion.pt -print -quit)"
          python scripts/sts1/sts1_build_rescue_gate_v21.py             --module-dir external/sts_lightspeed/source/build-probe             --armg-root .cache/sts1-v35brf --parent-weight "$parent"             --candidate-weight evidence/sts1/v35br-candidate/candidate.pt             --seed-file evidence/sts1/v35b-screen/phaseb_fresh500.txt             --output "$out/fresh500.json" --mcts-sims 2000 --workers 4             --min-win-delta 1 --max-pvalue 0.10 --label v35br-formal-fresh500
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open("evidence/sts1/v35br-formal/fresh500.json"))
          net=x["candidate_only_wins"]-x["parent_only_wins"]
          passed=net>0 and x["candidate_wins"]>x["parent_wins"] and x["paired_sign_pvalue_one_sided"]<=0.10
          for k,v in {"passed":str(passed).lower(),"net":net,"parent":x["parent_wins"],"candidate":x["candidate_wins"],"candidate_only":x["candidate_only_wins"],"parent_only":x["parent_only_wins"],"pvalue":x["paired_sign_pvalue_one_sided"]}.items(): print(f"{k}={v}")
          PY

      - name: Write formal summary
        if: always()
        env:
          G50: ${{ steps.g50.outputs.passed }}
          G50_PARENT: ${{ steps.g50.outputs.parent }}
          G50_CAND: ${{ steps.g50.outputs.candidate }}
          G50_CONLY: ${{ steps.g50.outputs.candidate_only }}
          G50_PONLY: ${{ steps.g50.outputs.parent_only }}
          G50_NET: ${{ steps.g50.outputs.net }}
          F100: ${{ steps.f100.outputs.passed }}
          F100_PARENT: ${{ steps.f100.outputs.parent }}
          F100_CAND: ${{ steps.f100.outputs.candidate }}
          F100_CONLY: ${{ steps.f100.outputs.candidate_only }}
          F100_PONLY: ${{ steps.f100.outputs.parent_only }}
          F100_NET: ${{ steps.f100.outputs.net }}
          F100_P: ${{ steps.f100.outputs.pvalue }}
          F500: ${{ steps.f500.outputs.passed }}
          F500_PARENT: ${{ steps.f500.outputs.parent }}
          F500_CAND: ${{ steps.f500.outputs.candidate }}
          F500_CONLY: ${{ steps.f500.outputs.candidate_only }}
          F500_PONLY: ${{ steps.f500.outputs.parent_only }}
          F500_NET: ${{ steps.f500.outputs.net }}
          F500_P: ${{ steps.f500.outputs.pvalue }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path("evidence/sts1/v35br-formal")
          def row(prefix,p=False):
              d={"pass":os.environ.get(prefix)=="true","parent":os.environ.get(prefix+"_PARENT"),"candidate":os.environ.get(prefix+"_CAND"),"candidate_only":os.environ.get(prefix+"_CONLY"),"parent_only":os.environ.get(prefix+"_PONLY"),"net_new_wins":os.environ.get(prefix+"_NET")}
              if p:d["pvalue"]=os.environ.get(prefix+"_P")
              return d
          s={"schema_version":"sts1-v35br-formal-recheck","source_candidate_run":37431578974,"parent":"G7","gate50":row("G50"),"fresh100":row("F100",True),"fresh500":row("F500",True)}
          s["readiness"]="READY_FOR_REAL_GAME_GATE" if s["fresh500"]["pass"] else "HOLD_PARENT"
          (out/"summary.json").write_text(json.dumps(s,indent=2,sort_keys=True)+"\n")
          print("V35BR_FORMAL_FINAL",json.dumps(s,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sts1-v35br-formal-${{ github.run_id }}
          path: evidence/sts1/v35br-formal/
          if-no-files-found: warn
          retention-days: 90

      - name: Report formal result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/body.txt"
          import json
          from pathlib import Path
          print("@ericpeng0604-coder")
          print()
          print("## STS1 v3.5 Phase-B Formal Recheck")
          p=Path("evidence/sts1/v35br-formal/summary.json")
          if not p.exists():
              print("- Formal recheck failed before summary. G7 remains Champion.")
          else:
              x=json.loads(p.read_text())
              for name in ["gate50","fresh100","fresh500"]:
                  r=x[name]
                  print(f"- {name}: G7 {r.get('parent')} / Candidate {r.get('candidate')} / Candidate-only={r.get('candidate_only')} / Parent-only={r.get('parent_only')} / Net={r.get('net_new_wins')} / PASS={r.get('pass')}")
              print(f"- Readiness: {x.get('readiness')}")
          PY
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/15/comments" -f body="$(cat "$RUNNER_TEMP/body.txt")"
